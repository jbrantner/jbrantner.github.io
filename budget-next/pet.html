<style>
/* v288 (Jordan 2026-10-14 14:14): the simple pet. One phone column: Ember at its level, then hunger / level / coins, then food.
   No room, no other stats. Coral reef hologram look; the monster uses the exact colors from Jordan's Pip Monster Maker. */
:root{
  color-scheme:dark;
  --reef:#0f4b5c; --glass:rgba(4,30,40,.5);
  --coral:#ff8a80; --coral-l:#ffaba4; --slate:#2f6c7e; --gold:#ffd27a; --ink:#ffe3df; --muted:#d9a39d; --off:rgba(0,0,0,.25);
  --pix:"Pixelify Sans","Courier New",monospace; --num:"Silkscreen","Courier New",monospace;
}
html,body{background:var(--reef);margin:0}
body{font-family:var(--pix);color:var(--ink);padding-block:16px 40px;
  padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.col{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{position:relative;border:2px dotted var(--coral);border-radius:5px;background:var(--glass);
  box-shadow:0 0 14px rgba(255,138,128,.2);padding:12px 14px}
.card::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.12) 0 2px,transparent 2px 5px)}
.num{font-family:var(--num)}
.top{display:flex;align-items:baseline;gap:8px;margin:0 2px 6px}
.name{font-size:22px;font-weight:700;color:var(--coral-l);text-shadow:0 0 10px rgba(255,138,128,.45)}
.lvl{margin-left:auto;font-size:15px;color:var(--gold)}
#mon{display:block;width:100%;height:auto;max-width:100%}
.stage{padding:10px}
.bubble{position:absolute;top:48px;left:50%;transform:translateX(-50%);background:var(--reef);border:2px dotted var(--coral-l);
  color:var(--coral-l);font-size:15px;padding:4px 12px;border-radius:4px;white-space:nowrap;z-index:2;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:10px;min-height:30px}
.row b{font-weight:600;font-size:16px;color:var(--coral-l);width:72px;flex:none}
.pips{display:flex;gap:5px;flex:1}
.pips i{width:22px;height:22px;border-radius:2px;background:var(--off);box-shadow:inset 0 0 0 1px rgba(255,138,128,.3)}
.pips i.on{background:var(--coral);box-shadow:0 0 8px rgba(255,138,128,.7)}
.pips.xp{gap:3px}.pips.xp i{flex:1;width:auto;height:14px}
.pips.xp i.on{background:var(--gold);box-shadow:0 0 8px rgba(255,210,122,.6)}
.val{font-size:13px;color:var(--muted);flex:none}
.coin{display:inline-block;width:12px;height:12px;background:var(--gold);box-shadow:0 0 6px rgba(255,210,122,.7);margin-right:6px;vertical-align:-1px}
#coins{font-size:20px;color:var(--gold)}
.hint{margin:2px 0 6px;font-size:13px;line-height:1.4;color:var(--muted)}
.stats .hint:last-child{margin-bottom:0}
h2{margin:0 0 8px;font-size:17px;color:var(--coral-l)}
.foods{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.food{font:inherit;color:var(--ink);background:transparent;border:2px solid var(--coral);border-radius:5px;padding:9px 8px;cursor:pointer;
  display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;min-height:64px}
.food .fn{font-size:16px;color:var(--coral-l)}
.food .fp{font-family:var(--num);font-size:12px;color:var(--gold)}
.food .fg{display:flex;gap:3px}.food .fg i{width:9px;height:9px;background:var(--coral);border-radius:1px}
.food:disabled{opacity:.42;cursor:default}
.food:not(:disabled):active{background:rgba(255,138,128,.15)}
.food.free{border-color:var(--gold)}
.food:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#msg{min-height:18px;margin:8px 0 0;color:var(--coral-l)}
.demo{border-color:#8e8ee6}.demo h2{color:#8e8ee6;font-size:15px}
.demo .g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.demo button{font:inherit;font-size:14px;color:var(--ink);background:transparent;border:2px solid #8e8ee6;border-radius:5px;padding:8px 4px;cursor:pointer}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="col" role="main">
  <h1 class="sr">Your pet</h1>
  <section class="card stage">
    <div class="top"><span class="name" id="nm">Ember</span><span class="lvl num" id="lv">LV 1</span></div>
    <canvas id="mon" role="img" aria-label="Your monster"></canvas>
    <div class="bubble" id="bub" hidden></div>
  </section>
  <section class="card stats">
    <div class="row"><b>Hunger</b><span class="pips" id="hun" role="img"></span></div>
    <div class="row"><b>Level</b><span class="pips xp" id="xpb"></span><span class="val num" id="xpt"></span></div>
    <p class="hint" id="lvhint"></p>
    <div class="row"><b>Coins</b><span><i class="coin"></i><span class="num" id="coins">0</span></span></div>
    <p class="hint">Coins come from the money you have left at the end of each day. A day with nothing spent pays 10.</p>
  </section>
  <section class="card">
    <h2>Food</h2>
    <div class="foods" id="foods"></div>
    <p class="hint" id="msg"></p>
  </section>
  <section class="card demo" id="demo" hidden>
    <h2>Preview controls (not on your phone's app)</h2>
    <div class="g"><button type="button" id="dCoin">+10 coins</button><button type="button" id="dXp">+50 XP</button>
      <button type="button" id="dHun">Get hungry</button><button type="button" id="dReset">Start over</button></div>
  </section>
</div>

const NOGLOW='sdle';let flicker=!matchMedia('(prefers-reduced-motion: reduce)').matches;

function pip(g,x,y,cell,col,glow){const s=Math.round(cell*.78),o=(cell-s)/2;g.shadowBlur=glow?cell*.45:0;g.shadowColor=col;g.fillStyle=col;g.fillRect(x*cell+o,y*cell+o,s,s);g.shadowBlur=0}
const hsh=(a,b)=>{let h=Math.imul(a^0x9e3779b9,0x85ebca6b)^Math.imul(b+0x632be5ab,0xc2b2ae35);h^=h>>>13;h=Math.imul(h,0x27d4eb2d);return((h^h>>>15)>>>0)/4294967296};
function bounds(st){let x0=st.w,x1=-1,y0=st.h,y1=-1;st.g.forEach((r,y)=>r.forEach((k,x)=>{if(k!='.'){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}}));return x1<0?null:{x0,x1,y0,y1}}
const EYE=k=>k==='s'||k==='d',FLAME='crh';
function drawMon(g,st,ox,baseY,cell,t,seed,anim,boost=0){const b=bounds(st);if(!b)return;const h=b.y1-b.y0+1,on=anim&&flicker,G=st.g;
  const f=Math.floor(t/90),ts=f*90,top=baseY-h;
  let eyeTop=-1;for(let y=b.y0;y<=b.y1&&eyeTop<0;y++)if(G[y].some(EYE))eyeTop=y;
  const swayTop=eyeTop>=0?eyeTop:b.y0+Math.floor(h/2),span=Math.max(1,swayTop-b.y0);
  const L=3400+seed*610,cyc=Math.floor((t+seed*977)/L),ph=(t+seed*977)%L,closed=on&&(ph<150||(hsh(cyc,seed)>.55&&ph>300&&ph<430));
  // the body burns like the hair: the same upward-travelling row ripple, gentler, fading to still at the base;
  // the eye rows stay still so the face holds steady (Jordan 14:10)
  // eye rows: rows with slate/dark eye pips, plus rows below that keep an eye hole open (empty pips under an eye, like Flare's)
  const eyeCols=new Set();let eyeBot=eyeTop;
  if(eyeTop>=0){G[eyeTop].forEach((k,x)=>{if(EYE(k))eyeCols.add(x)});
    const hole=(r,x)=>r[x]==='.'&&r.slice(0,x).some(k=>k!=='.')&&r.slice(x+1).some(k=>k!=='.');
    while(eyeBot+1<=b.y1){const r=G[eyeBot+1];if(r.some(EYE)||[...eyeCols].some(x=>hole(r,x))){r.forEach((k,x)=>{if(EYE(k))eyeCols.add(x)});eyeBot++}else break}}
  const still=b.y1-3; // the bottom 4 rows never sway (Jordan 14:11)
  const amp=y=>y>=still?0:y<swayTop?.8+1.25*(swayTop-y)/span:.8;
  const wave=y=>Math.round(Math.sin(ts/240+y*.6+seed)*amp(y));
  const shift=y=>!on||(eyeTop>=0&&y>=eyeTop&&y<=eyeBot)?0:wave(y); // eye rows hold still
  const P=(x,y)=>[ox+x-b.x0+shift(y),top+y-b.y0];
  const tips=[];
  for(let y=b.y0;y<=b.y1;y++)for(let x=b.x0;x<=b.x1;x++){let k=G[y][x];if(k=='.')continue;
    if(y<swayTop&&FLAME.includes(k)&&(y===0||G[y-1][x]==='.')&&(y===b.y0||!G.slice(b.y0,y).some(r=>r[x]!=='.')))tips.push([x,y]);
    if(closed&&EYE(k))k=EYE(G[y+1]?.[x])?'c':'s'; // lid closes: the eye becomes a slate line at its bottom row
    else if(on&&FLAME.includes(k)){const heat=Math.sin(y*.85+f*.75+Math.sin(x*1.7+seed)*1.3)+(hsh(x+y*64,f>>1)-.5)*.5;
      if(heat>1.2-boost)k=boost>.5&&heat>1.6-boost?'p':'h';else if(heat<-1.3&&k==='c')k='r'}
    else if(on&&k==='y'){const pu=Math.sin(t/380+seed);if(pu>.7&&hsh(x*7+y,f>>2)>.75)k='p';else if(pu<-.6)k='o'}
    else if(on&&k==='p'){if(Math.sin(t/380+seed+1)<-.5)k='y'}
    else if(on&&k==='m'){if(Math.sin(t/650+x*1.9)>.3)k='o'}
    const[px,py]=P(x,y);pip(g,px,py,cell,PAL[k],!NOGLOW.includes(k))}
  if(!on)return;
  tips.forEach(([x,y],i)=>{const r=hsh(x*31+i,(f>>1)+seed*101);if(r>.7&&y<b.y0+span*.5){const[px,py]=P(x,y);pip(g,px,py-1,cell,r>.85?PAL.y:PAL.h,true)}});
  if(!tips.length)return;
  const SP=boost>.3?110:260,STEP=120,now=Math.floor(t/SP);
  for(let s=now-12;s<=now;s++){const r=hsh(s,seed+77);if(r<.3)continue;const life=4+Math.floor(hsh(s,seed+5)*5),age=Math.floor((t-s*SP)/STEP);if(age<0||age>=life)continue;
    const[tx,ty]=tips[Math.floor(hsh(s,seed+9)*tips.length)],[px,py]=P(tx,ty),dx=Math.round(Math.sin(age*.9+r*12)*.9);
    const col=age<1?PAL.p:age<2?PAL.y:age<life-1?PAL.o:PAL.m;
    const sz=cell*(age<life-1?.62:.42),o=(cell-sz)/2;g.shadowBlur=cell*.5;g.shadowColor=col;g.fillStyle=col;g.fillRect((px+dx)*cell+o,(py-2-age)*cell+o,sz,sz);g.shadowBlur=0}}

// Hunger is the only need here, so the pet is never "asleep" for meals (the engine's night pause still slows hunger).
const RULES=Object.assign({},E.RULES,{bedtime:0,wake:0});
const DEMO=!/jbrantner\.github\.io$/.test(location.hostname)||location.hash==='#demo';
let S,boostUntil=0,bubT=0,queue=[];
const save=()=>E.save(S);
const level=()=>E.levelOf(S.xp);
const stageIx=()=>{const L=level().level;let i=0;STAGES.forEach((s,k)=>{if(L>=s.lv)i=k});return i};
function say(t){queue.push(t);if(!bubT)nextBubble()}
function nextBubble(){const t=queue.shift();if(t==null){$('bub').hidden=true;bubT=0;return}$('bub').textContent=t;$('bub').hidden=false;bubT=setTimeout(nextBubble,2600)}
const fmtDay=d=>{const x=new Date(d+'T12:00');return x.toLocaleDateString(undefined,{weekday:'long'})};
function handle(evs){let coins=0;evs.forEach(e=>{if(e.type==='coins')coins+=e.coins;
    else if(e.type==='level')say('LV '+e.level+'!');
    else if(e.type==='grow'){const st=STAGES[stageIx()];say(st.name+' evolved!');boostUntil=performance.now()+2500}});
  if(coins)say('+'+coins+' coins from leftover money')}
function open(){const r=E.open(Date.now());S=r.state;
  if(!S.hatched){S.hatched=S.born;S.last=Date.now();save()} // no egg in the simple pet: it starts as Ember
  handle(r.events.filter(e=>['coins','level','grow'].includes(e.type)));render()}
function render(){const L=level(),st=STAGES[stageIx()],next=STAGES.find(s=>s.lv>L.level);
  $('nm').textContent=st.name;$('lv').textContent='LV '+L.level;
  $('hun').innerHTML=Array.from({length:E.RULES.max},(_,i)=>`<i class="${i<S.hunger?'on':''}"></i>`).join('');$('hun').setAttribute('aria-label',S.hunger+' of '+E.RULES.max);   // v311: not only color
  const n=10,on=Math.floor(L.into/L.need*n);$('xpb').innerHTML=Array.from({length:n},(_,i)=>`<i class="${i<on?'on':''}"></i>`).join('');
  $('xpt').textContent=L.into+'/'+L.need+' XP';
  $('lvhint').textContent='Do things in Upkeep to level up.'+(next?` Evolves into ${next.name} at LV ${next.lv}.`:'');
  $('coins').textContent=S.coins;
  const free=E.freeMealsLeft(S,Date.now(),RULES)>0,full=S.hunger>=E.RULES.max;
  const foods=E.SHOP.filter(f=>f.hunger>0&&L.level>=(f.level||1));
  const gain=n=>`<span class="fg">${'<i></i>'.repeat(n)}</span>`;
  $('foods').innerHTML=`<button type="button" class="food free" data-id="free" ${!free||full?'disabled':''}><span class="fn">Daily meal</span><span class="fp">${free?'FREE TODAY':'TOMORROW'}</span>${gain(E.FREE_MEAL.hunger)}</button>`+
    foods.map(f=>`<button type="button" class="food" data-id="${f.id}" ${full||S.coins<f.price?'disabled':''}><span class="fn">${f.name}</span><span class="fp">${f.price} COINS</span>${gain(f.hunger)}</button>`).join('');
  $('foods').querySelectorAll('.food').forEach(b=>b.onclick=()=>eat(b.dataset.id));
  if(full)$('msg').textContent=st.name+' is full.';else if(S.hunger===0)$('msg').textContent=st.name+' is hungry.';else if(!$('msg').dataset.keep)$('msg').textContent='';
}
function eat(id){const now=Date.now();E.tick(S,now);   // v311: catch up first, as open() does
  const r=id==='free'?E.feed(S,'free',now,RULES):E.buyAndFeed(S,id,now,RULES);
  if(!r.ok){save();render();$('msg').textContent=r.reason==='coins'?'Not enough coins yet.':r.reason==='full'?'Already full.':'Can’t eat that right now.';return}
  save();boostUntil=performance.now()+1400;say(['Yum!','Crackle!','Toasty!'][Math.floor(Math.random()*3)]);render()}
// the monster: the pip screen fits the current stage with room for swaying flames and sparks
const cv=$('mon'),g=cv.getContext('2d');
function frame(t){const st=STAGES[S?stageIx():0],GW=Math.max(20,st.w+10),GH=st.h+8,cell=Math.max(4,Math.min(22,Math.floor((cv.clientWidth||360)/GW))),dpr=Math.min(2,devicePixelRatio||1);
  if(cv.width!==GW*cell*dpr||cv.height!==GH*cell*dpr){cv.width=GW*cell*dpr;cv.height=GH*cell*dpr;cv.style.width=GW*cell+'px';cv.style.margin='0 auto'}
  g.setTransform(dpr,0,0,dpr,0,0);g.clearRect(0,0,GW*cell,GH*cell);
  const b=bounds(st),boost=Math.max(0,Math.min(1,(boostUntil-t)/900));
  if(b){const cx=GW*cell/2,cy=(GH-2-(b.y1-b.y0+1)/2)*cell,rad=(b.y1-b.y0+8)*cell*.75,al=.13+.05*Math.sin(t/170)+.03*Math.sin(t/53)+boost*.12;
    const gr=g.createRadialGradient(cx,cy,0,cx,cy,rad);gr.addColorStop(0,`rgba(239,144,132,${al})`);gr.addColorStop(1,'rgba(239,144,132,0)');g.fillStyle=gr;g.fillRect(0,0,GW*cell,GH*cell);
    drawMon(g,st,Math.floor((GW-(b.x1-b.x0+1))/2),GH-1,cell,t,stageIx(),true,boost*.6)}
  raf=flicker&&!away?requestAnimationFrame(frame):0}
// v311: the budget tells this page when the Pet tab is hidden or shown (tabShown). Hidden, the pet isn't drawn and nothing
// is checked; shown again, it catches up and is drawn at once. While it shows, a check each minute keeps hunger and the
// free meal up to date (H16).
let raf=0,minT=0,away=false;try{away=!!frameElement&&!frameElement.getClientRects().length}catch(e){}
window.tabShown=on=>{if(on===!away)return;away=!on;clearInterval(minT);cancelAnimationFrame(raf);raf=minT=0;if(away)return;open();minT=setInterval(open,60000);raf=requestAnimationFrame(frame)};
open();if(!away){raf=requestAnimationFrame(frame);minT=setInterval(open,60000)}if(!flicker)setTimeout(()=>frame(0),50);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)open()});
addEventListener('resize',()=>{if(!flicker)frame(0)});
if(DEMO){$('demo').hidden=false;
  $('dCoin').onclick=()=>{S.coins+=10;save();say('+10 coins from leftover money');render()};
  $('dXp').onclick=()=>{const before=level().level,bi=stageIx();S.xp+=50;save();const L=level().level;if(L>before)say('LV '+L+'!');if(stageIx()>bi){say(STAGES[stageIx()].name+' evolved!');boostUntil=performance.now()+2500}render()};
  $('dHun').onclick=()=>{S.hunger=Math.max(0,S.hunger-1);save();render()};
  $('dReset').onclick=()=>{try{localStorage.removeItem(E.KEY)}catch(e){}open()};}
</script>
</body>
