<script>
// ---------- the box ----------
// a paper box, 60 mm a side. Each of its 6 sides is a sheet with corners on it.
// look straight at a side to add corners to it; pull them from a neighbouring view to shape the paper.
const H=30, RANGE=60, SNAP=5;
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul3=(a,k)=>a.map(x=>x*k), dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
// panels: outward normal n, in-plane axes u,v (u x v = n), so each side's outline runs counter-clockwise seen from outside
const PANELS=[
  {name:'Front',n:[0,0,1],u:[1,0,0],v:[0,1,0]}, {name:'Back',n:[0,0,-1],u:[-1,0,0],v:[0,1,0]},
  {name:'Right',n:[1,0,0],u:[0,0,-1],v:[0,1,0]}, {name:'Left',n:[-1,0,0],u:[0,0,1],v:[0,1,0]},
  {name:'Top',n:[0,1,0],u:[1,0,0],v:[0,0,-1]}, {name:'Bottom',n:[0,-1,0],u:[1,0,0],v:[0,0,1]}];
const CORNERS=[]; for(const x of [-H,H]) for(const y of [-H,H]) for(const z of [-H,H]) CORNERS.push([x,y,z]);
const EDGES=[]; for(let a=0;a<8;a++) for(let b=a+1;b<8;b++){ const d=CORNERS[a].filter((v,k)=>v!==CORNERS[b][k]).length; if(d===1) EDGES.push([a,b]); }
const cornerAt=p=>CORNERS.findIndex(c=>c.every((v,k)=>Math.abs(v-p[k])<1e-6));
// each view: screen right (a), screen up (b), toward-you (depth)
const VIEWS={
  Front:{a:[1,0,0],b:[0,1,0],d:[0,0,1]}, Back:{a:[-1,0,0],b:[0,1,0],d:[0,0,-1]},
  Left:{a:[0,0,1],b:[0,1,0],d:[-1,0,0]}, Right:{a:[0,0,-1],b:[0,1,0],d:[1,0,0]},
  Top:{a:[1,0,0],b:[0,0,-1],d:[0,1,0]}, Bottom:{a:[1,0,0],b:[0,0,1],d:[0,-1,0]}};
const VNAMES=['Front','Back','Left','Right','Top','Bottom'];

// points: {id, p:[x,y,z], on:{t:'c',c}|{t:'e',e}|{t:'f',f}, tw: twin id when Mirror made it}
let S, nextId;
function newBox(){ S={mirror:true,pts:[],marks:1}; nextId=1; CORNERS.forEach((c,i)=>S.pts.push({id:nextId++,p:c.slice(),on:{t:'c',c:i}})); pairBox(); }
// box corners and edge corners on the left pair up with their twins on the right, so Mirror moves them together
function pairBox(){ for(const q of S.pts){ if(q.tw||q.on.t!=='c') continue; const m=CORNERS[q.on.c]; const t=S.pts.find(r=>r.on.t==='c'&&!r.tw&&r!==q&&CORNERS[r.on.c][0]===-m[0]&&CORNERS[r.on.c][1]===m[1]&&CORNERS[r.on.c][2]===m[2]); if(t&&Math.abs(t.p[0]+q.p[0])<0.5&&Math.abs(t.p[1]-q.p[1])<0.5&&Math.abs(t.p[2]-q.p[2])<0.5){q.tw=t.id;t.tw=q.id;} } }
function sample(){ newBox(); for(const y of [-10,10]){ const a=mk([10,y,H],{t:'f',f:0}), b=mk([-10,y,H],{t:'f',f:0}); a.tw=b.id; b.tw=a.id; } }
function mk(p,on){ const q={id:nextId++,p,on}; S.pts.push(q); return q; }
sample();
try{ const s=localStorage.getItem('corner-sketch-box-v1'); if(s){ const o=JSON.parse(s); if(o&&Array.isArray(o.pts)&&[0,1,2,3,4,5,6,7].every(c=>o.pts.filter(q=>q.on&&q.on.t==='c'&&q.on.c===c).length===1)&&o.pts.every(q=>q.p&&q.p.length===3&&q.p.every(isFinite))){ S=o; nextId=Math.max(...S.pts.map(q=>q.id))+1; if(!S.pts.some(q=>q.on.t==='c'&&q.tw)) pairBox(); if(!S.marks){ S.pts.forEach(q=>{ if(q.on.t!=='c') q.m=true; }); S.marks=1; } (S.folds||[]).forEach(f=>f.forEach(id=>{ const q=S.pts.find(x=>x.id===id); if(q&&q.on.t!=='c') q.m=true; })); } } }catch(e){}

let view='Front', selId=null; let VW={a:[1,0,0],b:[0,1,0],d:[0,0,1]}; const undoS=[];
const $=id=>document.getElementById(id);
const byId=id=>S.pts.find(q=>q.id===id);
// (fresh0: corners from this id on were made by what you're doing right now; folds0: so were the folds from this one on)
// (foldsAt0: the folds there were then, so the ends of any this gesture takes away count as worked on too)
let fresh0=Infinity, folds0=Infinity, foldsAt0=null;
function push(){ undoS.push(JSON.stringify({S,nextId})); if(undoS.length>80) undoS.shift(); fresh0=nextId; folds0=(S.folds||[]).length; foldsAt0=(S.folds||[]).map(f=>f.slice()); }
// an undo step that changed nothing (a drag that ended where it started, Delete with nothing to take away) is dropped, so Undo always does something
const sameModel=(a,b)=>{ const k=o=>JSON.stringify(o,(key,v)=>key==='sticky'?undefined:v); return k(a)===k(b); };
// a drag that ends where it started changes nothing: the paper goes back exactly as it was (bends it re-chose on the way included)
function backToStart(){ if(!undoS.length) return false; const o=JSON.parse(undoS[undoS.length-1]); if(!sameModel(o.S,S)) return false; abandon(); return true; }
function dropEmpty(){ while(undoS.length&&sameModel(JSON.parse(undoS[undoS.length-1]).S,S)) undoS.pop(); }
function undo(){ dropEmpty(); if(!undoS.length){ ui(); return; } const o=JSON.parse(undoS.pop()); S=o.S; nextId=o.nextId; selId=null; selFold=null; selFace=null; lockAll(); changed(); toast('Undo'); }
// a gesture that can't finish puts everything back the way it was (and takes back its undo step)
function abandon(msg){ const o=JSON.parse(undoS.pop()); S=o.S; nextId=o.nextId; lockAll(); if(msg) toast(msg); changed(); }

// every corner has a spot on the flat, unfolded box (its "rest" spot, q.r) and a spot in 3D (q.p).
// The rest spot never changes when you pull, so the paper's layout stays steady.
// a spot on box edge e (kept m of the way in from its ends: 3 mm for spots you place, a hair for exact crossings)
function onEdge(e,p,m=0.05){ const [a,b]=EDGES[e].map(i=>CORNERS[i]); const d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]]; const t=Math.max(m,Math.min(1-m,dot3([p[0]-a[0],p[1]-a[1],p[2]-a[2]],d)/dot3(d,d))); return add3(a,mul3(d,t)).map(v=>Math.round(v*100)/100); }
// a spot on side f (kept m mm inside its edges: 1 for spots you place, a hair for exact crossings)
function onSide(f,p,m=1){ const P=PANELS[f], cl=v=>Math.max(-H+m,Math.min(H-m,v)); return add3(add3(mul3(P.n,H),mul3(P.u,cl(dot3(p,P.u)))),mul3(P.v,cl(dot3(p,P.v)))).map(v=>Math.round(v*100)/100); }
function restOf(q){ if(q.on.t==='c') return CORNERS[q.on.c]; if(!q.r) q.r=q.on.t==='e'?onEdge(q.on.e,q.p):onSide(q.on.f,q.p); return q.r; }
function home(q,f){ const P=PANELS[f], r=restOf(q); return {x:dot3(r,P.u),y:dot3(r,P.v)}; }
const edgeOnPanel=(e,f)=>EDGES[e].every(i=>Math.abs(dot3(CORNERS[i],PANELS[f].n)-H)<1e-6);
const cornerOnPanel=(c,f)=>Math.abs(dot3(CORNERS[c],PANELS[f].n)-H)<1e-6;

<script>
const orient=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
// (the key strings are made once and kept: building the same strings over and over made big models slow to drag)
const EKC=new Map(); const ek=(a,b)=>{ if(!(a<b)){ const t=a; a=b; b=t; } const n=a*1048576+b; let s=EKC.get(n); if(s===undefined){ if(EKC.size>300000) EKC.clear(); s=a+','+b; EKC.set(n,s); } return s; };
function cross(p,q,r,s){ const d1=orient(p,q,r),d2=orient(p,q,s),d3=orient(r,s,p),d4=orient(r,s,q); return ((d1>1e-9&&d2<-1e-9)||(d1<-1e-9&&d2>1e-9))&&((d3>1e-9&&d4<-1e-9)||(d3<-1e-9&&d4>1e-9)); }
function inPoly(x,y,P){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j]; if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x) c=!c;} return c; }
function emap(T){ const m=new Map(); T.forEach((t,ti)=>{ for(let k=0;k<3;k++){ const key=ek(t[k],t[(k+1)%3]); (m.get(key)||m.set(key,[]).get(key)).push(ti);} }); return m; }
function flipEdge(T,P,u,v,t1,t2){
  let A=T[t1],B=T[t2]; const has=(t,a,b)=>{for(let k=0;k<3;k++) if(t[k]===a&&t[(k+1)%3]===b) return true; return false;};
  if(!has(A,u,v)){ [A,B]=[B,A]; [t1,t2]=[t2,t1]; } if(!has(A,u,v)||!has(B,v,u)) return false;
  const c=A.find(x=>x!==u&&x!==v), d=B.find(x=>x!==u&&x!==v);
  if(orient(P[u],P[d],P[c])<=1e-9||orient(P[v],P[c],P[d])<=1e-9) return false;
  T[t1]=[u,d,c]; T[t2]=[v,c,d]; return true;
}
// ear clipping for a small counter-clockwise polygon (corners in a straight line are fine; they're just never an ear)
function earClip(poly,P){ const out=[], V=poly.slice(); let guard=0;
  while(V.length>3&&guard++<400){ let cut=false;
    for(let i=0;i<V.length&&!cut;i++){ const p=V[(i+V.length-1)%V.length], v=V[i], n=V[(i+1)%V.length]; if(orient(P[p],P[v],P[n])<=1e-9) continue;
      if(V.some(w=>w!==p&&w!==v&&w!==n&&orient(P[p],P[v],P[w])>=-1e-9&&orient(P[v],P[n],P[w])>=-1e-9&&orient(P[n],P[p],P[w])>=-1e-9)) continue;
      out.push([p,v,n]); V.splice(i,1); cut=true; }
    if(!cut) return null; }
  if(V.length===3){ if(orient(P[V[0]],P[V[1]],P[V[2]])<=1e-9) return null; out.push(V.slice()); }
  return out; }
// put the side a-b into the triangles: take out every triangle it crosses and fill the hole on each side of it
function cavity(T,P,a,b,C){ const A=P[a], B=P[b], L=Math.hypot(B.x-A.x,B.y-A.y)||1;
  for(let k=0;k<P.length;k++){ if(k===a||k===b) continue; const t=((P[k].x-A.x)*(B.x-A.x)+(P[k].y-A.y)*(B.y-A.y))/(L*L); if(t>1e-6&&t<1-1e-6&&Math.abs(orient(A,B,P[k]))/L<1e-6) return null; }
  const hit=new Set(); T.forEach((t,i)=>{ for(let j=0;j<3;j++){ const u=t[j], v=t[(j+1)%3]; if(u===a||u===b||v===a||v===b) continue; if(cross(A,B,P[u],P[v])){ if(C.has(ek(u,v))) hit.add(-1); hit.add(i); } } });
  if(!hit.size||hit.has(-1)) return null;
  const dir=new Set(); for(const i of hit){ const t=T[i]; for(let j=0;j<3;j++) dir.add(t[j]+','+t[(j+1)%3]); }
  const nxt=new Map(); for(const k of dir){ const [u,v]=k.split(',').map(Number); if(!dir.has(v+','+u)){ if(nxt.has(u)) return null; nxt.set(u,v); } }

  const c2=[b]; g=0; while(v!==a&&g++<200){ v=nxt.get(v); if(v===undefined) return null; c2.push(v); }

  { const rim=new Set([...c1,...c2]); for(const i of hit) if(T[i].some(x=>!rim.has(x))) return null; } // (a corner inside the hole would be lost)
  const e1=earClip(c1,P), e2=earClip(c2,P); if(!e1||!e2) return null;
  return T.filter((t,i)=>!hit.has(i)).concat(e1,e2); }
function triangulate(G,FL){
  const {V,n}=G, P=V; if(n<3) return {T:[],bad:[]};
  let T=THREE.ShapeUtils.triangulateShape(V.slice(0,n).map(p=>new THREE.Vector2(p.x,p.y)),[]).map(t=>orient(P[t[0]],P[t[1]],P[t[2]])<0?[t[0],t[2],t[1]]:t.slice());

  // inside corners
  const used=new Set(); FL.forEach(f=>{used.add(f[0]);used.add(f[1]);});
  for(let j=n;j<V.length;j++){
    const p=P[j]; let done=false;
    for(let ti=0;ti<T.length&&!done;ti++){ const [a,b,c]=T[ti]; const o1=orient(P[a],P[b],p),o2=orient(P[b],P[c],p),o3=orient(P[c],P[a],p);
      if(o1<-1e-6||o2<-1e-6||o3<-1e-6) continue;
      // a corner a hair from a side (rounding) counts as on it, so no sliver of paper is left between
      const ds=[[o1,a,b],[o2,b,c],[o3,c,a]].map(([o,u,v])=>Math.abs(o)/(Math.hypot(P[v].x-P[u].x,P[v].y-P[u].y)||1)), zs=ds.map((d,k)=>Math.abs([o1,o2,o3][k])<1e-6||d<0.02);
      if([a,b,c].some(k=>Math.hypot(P[k].x-p.x,P[k].y-p.y)<0.02)){ done=true; bad.push(j); break; } // sits on a corner
      if(zs[0]+zs[1]+zs[2]>1){ const m=ds.indexOf(Math.min(...ds)); zs.fill(false); zs[m]=true; } // in a sliver: on the nearer side
      if(!zs[0]&&!zs[1]&&!zs[2]){ T.splice(ti,1,[a,b,j],[b,c,j],[c,a,j]); done=true; break; }
      const e=zs[0]?[a,b]:zs[1]?[b,c]:[c,a]; const M=emap(T); const ts=M.get(ek(e[0],e[1]))||[];
      const nt=[]; for(const t of ts){ const tt=T[t]; const w=tt.find(x=>x!==e[0]&&x!==e[1]); const k=tt.indexOf(w); const u=tt[(k+1)%3], v=tt[(k+2)%3]; nt.push([w,u,j],[w,j,v]); }
      T=T.filter((t,i)=>!ts.includes(i)).concat(nt); done=true; }
    if(!done) bad.push(j); }

  for(const [a,b] of FL){ let ok=emap(T).has(ek(a,b));

    // (flipping whichever crossing edge comes first could just flip the same two edges back and forth for ever)
