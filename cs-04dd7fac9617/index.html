<script>
// ---------- the box ----------
// a paper box, 60 mm a side. Each of its 6 sides is a sheet with corners on it.
// look straight at a side to add corners to it; pull them from a neighbouring view to shape the paper.
const H=30, RANGE=60, SNAP=5;
const add3=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]], mul3=(a,k)=>a.map(x=>x*k), dot3=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
// panels: outward normal n, in-plane axes u,v (u x v = n), so each side's outline runs counter-clockwise seen from outside
const PANELS=[
  {name:'Front',n:[0,0,1],u:[1,0,0],v:[0,1,0]}, {name:'Back',n:[0,0,-1],u:[-1,0,0],v:[0,1,0]},
  {name:'Right',n:[1,0,0],u:[0,0,-1],v:[0,1,0]}, {name:'Left',n:[-1,0,0],u:[0,0,1],v:[0,1,0]},
  {name:'Top',n:[0,1,0],u:[1,0,0],v:[0,0,-1]}, {name:'Bottom',n:[0,-1,0],u:[1,0,0],v:[0,0,1]}];
const CORNERS=[]; for(const x of [-H,H]) for(const y of [-H,H]) for(const z of [-H,H]) CORNERS.push([x,y,z]);
const EDGES=[]; for(let a=0;a<8;a++) for(let b=a+1;b<8;b++){ const d=CORNERS[a].filter((v,k)=>v!==CORNERS[b][k]).length; if(d===1) EDGES.push([a,b]); }
const cornerAt=p=>CORNERS.findIndex(c=>c.every((v,k)=>Math.abs(v-p[k])<1e-6));
// each view: screen right (a), screen up (b), toward-you (depth)
const VIEWS={
  Front:{a:[1,0,0],b:[0,1,0],d:[0,0,1]}, Back:{a:[-1,0,0],b:[0,1,0],d:[0,0,-1]},
  Left:{a:[0,0,1],b:[0,1,0],d:[-1,0,0]}, Right:{a:[0,0,-1],b:[0,1,0],d:[1,0,0]},
  Top:{a:[1,0,0],b:[0,0,-1],d:[0,1,0]}, Bottom:{a:[1,0,0],b:[0,0,1],d:[0,-1,0]}};
const VNAMES=['Front','Back','Left','Right','Top','Bottom'];

// points: {id, p:[x,y,z], on:{t:'c',c}|{t:'e',e}|{t:'f',f}, tw: twin id when Mirror made it}
let S, nextId;
function newBox(){ S={mirror:true,pts:[],marks:1}; nextId=1; CORNERS.forEach((c,i)=>S.pts.push({id:nextId++,p:c.slice(),on:{t:'c',c:i}})); pairBox(); }
// box corners and edge corners on the left pair up with their twins on the right, so Mirror moves them together
function pairBox(){ for(const q of S.pts){ if(q.tw||q.on.t!=='c') continue; const m=CORNERS[q.on.c]; const t=S.pts.find(r=>r.on.t==='c'&&!r.tw&&r!==q&&CORNERS[r.on.c][0]===-m[0]&&CORNERS[r.on.c][1]===m[1]&&CORNERS[r.on.c][2]===m[2]); if(t&&Math.abs(t.p[0]+q.p[0])<0.5&&Math.abs(t.p[1]-q.p[1])<0.5&&Math.abs(t.p[2]-q.p[2])<0.5){q.tw=t.id;t.tw=q.id;} } }
function sample(){ newBox(); for(const y of [-10,10]){ const a=mk([10,y,H],{t:'f',f:0}), b=mk([-10,y,H],{t:'f',f:0}); a.tw=b.id; b.tw=a.id; } }
function mk(p,on){ const q={id:nextId++,p,on}; S.pts.push(q); return q; }
sample();
try{ const s=localStorage.getItem('corner-sketch-box-v1'); if(s){ const o=JSON.parse(s); if(o&&Array.isArray(o.pts)&&[0,1,2,3,4,5,6,7].every(c=>o.pts.filter(q=>q.on&&q.on.t==='c'&&q.on.c===c).length===1)&&o.pts.every(q=>q.p&&q.p.length===3&&q.p.every(isFinite))){ S=o; nextId=Math.max(...S.pts.map(q=>q.id))+1; if(!S.pts.some(q=>q.on.t==='c'&&q.tw)) pairBox(); if(!S.marks){ S.pts.forEach(q=>{ if(q.on.t!=='c') q.m=true; }); S.marks=1; } } } }catch(e){}
function save(){ try{localStorage.setItem('corner-sketch-box-v1',JSON.stringify(S));}catch(e){} }
let view='Front', selId=null; let VW={a:[1,0,0],b:[0,1,0],d:[0,0,1]}; const undoS=[];
const $=id=>document.getElementById(id);
const byId=id=>S.pts.find(q=>q.id===id);
function push(){ undoS.push(JSON.stringify({S,nextId})); if(undoS.length>80) undoS.shift(); }
function undo(){ if(!undoS.length) return; const o=JSON.parse(undoS.pop()); S=o.S; nextId=o.nextId; selId=null; selFold=null; selFace=null; changed(); toast('Undo'); }

// every corner has a spot on the flat, unfolded box (its "rest" spot, q.r) and a spot in 3D (q.p).
// The rest spot never changes when you pull, so the paper's layout stays steady.
function onEdge(e,p){ const [a,b]=EDGES[e].map(i=>CORNERS[i]); const d=[b[0]-a[0],b[1]-a[1],b[2]-a[2]]; const t=Math.max(0.05,Math.min(0.95,dot3([p[0]-a[0],p[1]-a[1],p[2]-a[2]],d)/dot3(d,d))); return add3(a,mul3(d,t)).map(v=>Math.round(v*100)/100); }
function onSide(f,p){ const P=PANELS[f], cl=v=>Math.max(-H+1,Math.min(H-1,v)); return add3(add3(mul3(P.n,H),mul3(P.u,cl(dot3(p,P.u)))),mul3(P.v,cl(dot3(p,P.v)))).map(v=>Math.round(v*100)/100); }
function restOf(q){ if(q.on.t==='c') return CORNERS[q.on.c]; if(!q.r) q.r=q.on.t==='e'?onEdge(q.on.e,q.p):onSide(q.on.f,q.p); return q.r; }
function home(q,f){ const P=PANELS[f], r=restOf(q); return {x:dot3(r,P.u),y:dot3(r,P.v)}; }
const edgeOnPanel=(e,f)=>EDGES[e].every(i=>Math.abs(dot3(CORNERS[i],PANELS[f].n)-H)<1e-6);
const cornerOnPanel=(c,f)=>Math.abs(dot3(CORNERS[c],PANELS[f].n)-H)<1e-6;

<script>
const orient=(a,b,c)=>(b.x-a.x)*(c.y-a.y)-(b.y-a.y)*(c.x-a.x);
const ek=(a,b)=>a<b?a+','+b:b+','+a;
function cross(p,q,r,s){ const d1=orient(p,q,r),d2=orient(p,q,s),d3=orient(r,s,p),d4=orient(r,s,q); return ((d1>1e-9&&d2<-1e-9)||(d1<-1e-9&&d2>1e-9))&&((d3>1e-9&&d4<-1e-9)||(d3<-1e-9&&d4>1e-9)); }
function inPoly(x,y,P){ let c=false; for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j]; if((a.y>y)!==(b.y>y)&&x<(b.x-a.x)*(y-a.y)/(b.y-a.y)+a.x) c=!c;} return c; }
function emap(T){ const m=new Map(); T.forEach((t,ti)=>{ for(let k=0;k<3;k++){ const key=ek(t[k],t[(k+1)%3]); (m.get(key)||m.set(key,[]).get(key)).push(ti);} }); return m; }
function flipEdge(T,P,u,v,t1,t2){
  let A=T[t1],B=T[t2]; const has=(t,a,b)=>{for(let k=0;k<3;k++) if(t[k]===a&&t[(k+1)%3]===b) return true; return false;};
  if(!has(A,u,v)){ [A,B]=[B,A]; [t1,t2]=[t2,t1]; } if(!has(A,u,v)||!has(B,v,u)) return false;
  const c=A.find(x=>x!==u&&x!==v), d=B.find(x=>x!==u&&x!==v);
  if(orient(P[u],P[d],P[c])<=1e-9||orient(P[v],P[c],P[d])<=1e-9) return false;
  T[t1]=[u,d,c]; T[t2]=[v,c,d]; return true;
}
function triangulate(G,FL){
  const {V,n}=G, P=V; if(n<3) return {T:[],bad:[]};
  let T=THREE.ShapeUtils.triangulateShape(V.slice(0,n).map(p=>new THREE.Vector2(p.x,p.y)),[]).map(t=>orient(P[t[0]],P[t[1]],P[t[2]])<0?[t[0],t[2],t[1]]:t.slice());
  const bad=[];
  // inside corners
  const used=new Set(); FL.forEach(f=>{used.add(f[0]);used.add(f[1]);});
  for(let j=n;j<V.length;j++){
    const p=P[j]; let done=false;
    for(let ti=0;ti<T.length&&!done;ti++){ const [a,b,c]=T[ti]; const o1=orient(P[a],P[b],p),o2=orient(P[b],P[c],p),o3=orient(P[c],P[a],p);
      if(o1<-1e-6||o2<-1e-6||o3<-1e-6) continue;
      const zs=[o1,o2,o3].map(o=>Math.abs(o)<1e-6);
      if(zs[0]+zs[1]+zs[2]>1){ done=true; bad.push(j); break; } // sits on a corner
      if(!zs[0]&&!zs[1]&&!zs[2]){ T.splice(ti,1,[a,b,j],[b,c,j],[c,a,j]); done=true; break; }
      const e=zs[0]?[a,b]:zs[1]?[b,c]:[c,a]; const M=emap(T); const ts=M.get(ek(e[0],e[1]))||[];
      const nt=[]; for(const t of ts){ const tt=T[t]; const w=tt.find(x=>x!==e[0]&&x!==e[1]); const k=tt.indexOf(w); const u=tt[(k+1)%3], v=tt[(k+2)%3]; nt.push([w,u,j],[w,j,v]); }
      T=T.filter((t,i)=>!ts.includes(i)).concat(nt); done=true; }
    if(!done) bad.push(j); }
  // folds: flip crossing edges until the fold is an edge
  const C=new Set(); for(let i=0;i<n;i++) C.add(ek(i,(i+1)%n));
  for(const [a,b] of FL){ let ok=false;
    for(let it=0;it<300;it++){ const M=emap(T); if(M.has(ek(a,b))){ok=true;break;}
      let flipped=false;
      for(const [key,ts] of M){ if(ts.length!==2||C.has(key)) continue; const [u,v]=key.split(',').map(Number); if(u===a||u===b||v===a||v===b) continue;
        if(cross(P[a],P[b],P[u],P[v])&&flipEdge(T,P,u,v,ts[0],ts[1])){flipped=true;break;} }
      if(!flipped) break; }
    if(ok) C.add(ek(a,b)); else bad.push('f'+a+','+b); }
  // tidy the rest into well-shaped triangles (folds and edges stay put)
  const inCirc=(a,b,c,d)=>{ const ax=a.x-d.x,ay=a.y-d.y,bx=b.x-d.x,by=b.y-d.y,cx=c.x-d.x,cy=c.y-d.y; return (ax*ax+ay*ay)*(bx*cy-cx*by)-(bx*bx+by*by)*(ax*cy-cx*ay)+(cx*cx+cy*cy)*(ax*by-bx*ay)>1e-6; };
  for(let it=0;it<400;it++){ const M=emap(T); let fl=false;
    for(const [key,ts] of M){ if(ts.length!==2||C.has(key)) continue; const [u,v]=key.split(',').map(Number); const t=T[ts[0]], s=T[ts[1]]; const c=t.find(x=>x!==u&&x!==v), d=s.find(x=>x!==u&&x!==v);
      if(inCirc(P[t[0]],P[t[1]],P[t[2]],P[d])&&flipEdge(T,P,u,v,ts[0],ts[1])){fl=true;break;} }
    if(!fl) break; }
  return {T,bad,C};
}

<script>
// ---------- build the paper: triangulate each side around its corners, then place them where they've been pulled ----------
let GEO=null;
// a corner you add does nothing to the paper until a fold connects it (box corners always count)
let ACT=new Set();
// solve again until the remembered bends agree with the paper, so the same model always gives the same shape (after reload too)
function solve(){ for(let i=0;i<4;i++){ const before=JSON.stringify(S.sticky||[]); solve1(); if(JSON.stringify(S.sticky)===before) break; } return GEO; }
function solve1(){
  // a new corner is just a mark on the paper; it starts shaping the paper once you pull it (or fold to it)
  ACT=new Set(S.pts.filter(q=>q.on.t==='c'||q.m).map(q=>q.id)); for(const [a,b] of S.folds||[]){ ACT.add(a); ACT.add(b); }
  if(S.mirror) for(const id of [...ACT]){ const q=byId(id), t=q&&q.tw&&byId(q.tw); if(t) ACT.add(t.id); }
  symm(false);
  const T=[], triPanel=[], lay=[], regions=[], sticky=[], faces=[];
  PANELS.forEach((P,f)=>{
    // outline: the side's 4 box corners counter-clockwise, with edge corners slotted in along each edge
    const cs=[[-H,-H],[H,-H],[H,H],[-H,H]].map(([a,b])=>cornerAt(add3(add3(mul3(P.n,H),mul3(P.u,a)),mul3(P.v,b))));
    const ring=[];
    for(let k=0;k<4;k++){ const c0=cs[k], c1=cs[(k+1)%4]; ring.push(S.pts.find(q=>q.on.t==='c'&&q.on.c===c0));
      const e=EDGES.findIndex(([a,b])=>(a===c0&&b===c1)||(a===c1&&b===c0)); const A=CORNERS[c0];
      const mids=S.pts.filter(q=>q.on.t==='e'&&q.on.e===e&&ACT.has(q.id)).map(q=>{const h=home(q,f); const H3=add3(add3(mul3(P.n,H),mul3(P.u,h.x)),mul3(P.v,h.y)); return {q,t:Math.hypot(H3[0]-A[0],H3[1]-A[1],H3[2]-A[2])};}).sort((x,y)=>x.t-y.t);
      for(const m of mids) ring.push(m.q); }
    const inner=S.pts.filter(q=>q.on.t==='f'&&q.on.f===f&&ACT.has(q.id));
    const list=[...ring,...inner]; const V=list.map(q=>home(q,f));
    const ix=new Map(list.map((q,i)=>[q.id,i]));
    // a fold that now has a corner sitting on it becomes two folds, one each side of that corner
    const split=pairs=>{ const out=[]; for(const [a,b] of pairs){ const A=V[a],B=V[b], L=Math.hypot(B.x-A.x,B.y-A.y)||1; const on=[];
        V.forEach((p,k)=>{ if(k===a||k===b) return; const t=((p.x-A.x)*(B.x-A.x)+(p.y-A.y)*(B.y-A.y))/(L*L); if(t<=1e-3||t>=1-1e-3) return; if(Math.abs(orient(A,B,p))/L<0.05) on.push([t,k]); });
        const ch=[a,...on.sort((x,y)=>x[0]-y[0]).map(x=>x[1]),b]; for(let i=0;i+1<ch.length;i++) out.push([ch[i],ch[i+1]]); } return out; };
    const pick=L=>(L||[]).filter(([a,b])=>ix.has(a)&&ix.has(b)).map(([a,b])=>[ix.get(a),ix.get(b)]);
    const FL=split(pick(S.folds)), userK=new Set(FL.map(([a,b])=>ek(a,b)));
    // bends the paper already chose stay put, so adding or moving one corner doesn't reshuffle the whole side
    const mi=S.mirror&&Math.abs(P.n[0])<0.5?list.map(q=>{ if(Math.abs(restOf(q)[0])<0.01) return ix.get(q.id); const t=q.tw&&byId(q.tw); return t&&ix.has(t.id)?ix.get(t.id):-1; }):null;
    let SL=split(pick(S.sticky)).filter(([a,b])=>!userK.has(ek(a,b)));
    // with Mirror on, a remembered bend with no twin on the other half is forgotten, so a lopsided fold can't stick around
    if(mi){ const K=new Set([...SL.map(([a,b])=>ek(a,b)),...userK]); SL=SL.filter(([a,b])=>{ const A=mi[a],B=mi[b]; return A<0||B<0||K.has(ek(A,B)); }); }
    const tr=triangulate({V,n:ring.length},[...FL,...SL]);
    const X=list.map(q=>q.p);

    const stK=new Set(SL.map(([a,b])=>ek(a,b))); // with Mirror on, a side that spans the middle prefers folds that have a matching fold on the other half, so it stays symmetric
    smooth3(tr.T,V,X,new Set([...tr.C].filter(k=>!stK.has(k))),stK,mi);
    { const M=emap(tr.T); for(const [k,ts] of M){ if(ts.length!==2||userK.has(k)) continue; const [u,v]=k.split(',').map(Number); const n=ring.length; if(u<n&&v<n&&(v===(u+1)%n||u===(v+1)%n)) continue;
        const n1=nrm3(...tr.T[ts[0]].map(i=>X[i])), n2=nrm3(...tr.T[ts[1]].map(i=>X[i])); if(n1&&n2&&dot3(n1,n2)<0.9995) sticky.push([list[u].id,list[v].id]); } }

    const mir=(q,t)=>Math.abs(t.p[0]+q.p[0])<0.5&&Math.abs(t.p[1]-q.p[1])<0.5&&Math.abs(t.p[2]-q.p[2])<0.5;
    for(const q of S.pts){ if(!q.tw) continue; const t=byId(q.tw); if(!t||!mir(q,t)){ delete q.tw; if(t&&t.tw===q.id) delete t.tw; } }
    // pair up corners that already mirror each other
    for(const q of S.pts){ if(q.tw||Math.abs(q.p[0])<0.5) continue; const t=S.pts.find(r=>r!==q&&!r.tw&&(r.on.t==='c')===(q.on.t==='c')&&Math.abs(r.p[0]+q.p[0])<0.5&&Math.abs(r.p[1]-q.p[1])<0.5&&Math.abs(r.p[2]-q.p[2])<0.5); if(t){q.tw=t.id;t.tw=q.id;} } }
  toast(S.mirror?'Mirror on: left and right move together':'Mirror off'); changed(); };
$('bDel').onclick=()=>{ if(selFold){ deleteFold(); return; } const q=selId&&byId(selId); if(!q) return;
  if(q.on.t==='c'){ push(); q.p=CORNERS[q.on.c].slice(); const t=twinOf(q); if(t) t.p=CORNERS[t.on.c].slice(); pop(); changed(); toast('Box corner back in place'); return; } push(); const t=twinOf(q);
  // a corner in the middle of a fold line goes, but the fold stays: the two folds through it join into one
  const through=id=>{ const F=S.folds||[], at=F.filter(f=>f.includes(id)); if(at.length!==2) return; const [a,b]=at.map(f=>f[0]===id?f[1]:f[0]);
    S.folds=F.filter(f=>!f.includes(id)); const A=byId(a), B=byId(b); if(a!==b&&A&&B&&sharedPanel(A,B)>=0&&!S.folds.some(f=>f.includes(a)&&f.includes(b))) S.folds.push([a,b]); };
  through(q.id); if(t&&t.on.t!=='c') through(t.id);
  S.pts=S.pts.filter(r=>r!==q&&(r!==t||r.on.t==='c')); selId=null; pop(); changed(); };
$('bClear').onclick=()=>{ push(); newBox(); selId=null; changed(); toast('Fresh box. Undo brings yours back.'); };
document.addEventListener('keydown',e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='z'){e.preventDefault();undo();} if((e.key==='Delete'||e.key==='Backspace')&&!$('bDel').disabled) $('bDel').click(); });
