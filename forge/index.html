<style>
/* Phone-first 3D pip editor for the budget app's pet: stage tabs on top, the model view, then tools, colors and sharing.
   Single dark reef look (the app's), so it reads the same as the Pet tab. */
:root{color-scheme:dark;--bg:#285162;--card:#173441;--coral:#e29487;--coral-l:#f3aea6;--dim:#916f6b;--muted:#d1a59e;--gold:#fadda9;--slate:#3f6a7c;
  --pix:"Pixelify Sans","Courier New",monospace;--num:"Silkscreen","Courier New",monospace}
html,body{background:var(--bg)}
body{font-family:var(--pix);color:var(--coral-l);margin:0;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.top{display:flex;align-items:center;gap:8px}
h1{margin:0;font-size:20px;text-shadow:0 0 12px rgba(226,148,135,.45);flex:1;min-width:0}
input[type=text]{font:inherit;color:var(--coral-l);background:var(--card);border:2px dotted var(--coral);border-radius:5px;padding:6px 8px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{font:inherit;background:var(--card);color:var(--muted);border:2px solid transparent;border-radius:5px;padding:5px 2px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;min-width:0}
.tab b{font-size:15px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab span{font-family:var(--num);font-size:10px;color:var(--dim)}
.tab.on{border-color:var(--coral);color:var(--coral-l);box-shadow:0 0 10px rgba(226,148,135,.35)}.tab.on span{color:var(--gold)}
.view{position:relative;height:min(58vh,520px);border:2px dotted var(--coral);border-radius:5px;overflow:hidden;background:radial-gradient(ellipse at 50% 60%,#1f4a5a 0%,#173441 70%)}
.view canvas{display:block;width:100%;height:100%;touch-action:none}
.view:not(.px)::after{display:none}
.view::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(0,0,0,.13) 0 2px,transparent 2px 5px)}
.ov{position:absolute;display:flex;gap:6px;z-index:2}
.ov.tl{top:8px;left:8px;right:8px;flex-wrap:wrap}#turnbar{top:auto;bottom:56px;right:8px}.ov.tr{top:8px;right:8px}
.hint{position:absolute;left:8px;right:8px;bottom:8px;text-align:center;font-size:13px;color:var(--muted);pointer-events:none;z-index:2;text-shadow:0 1px 2px #000}
.btn{font:inherit;font-size:15px;color:var(--coral-l);background:rgba(23,52,65,.85);border:2px solid var(--coral);border-radius:5px;padding:6px 10px;cursor:pointer;min-height:38px}
.btn.on,.btn.solid{background:var(--coral);color:var(--card)}
.btn.sm{padding:4px 8px;font-family:var(--num);font-size:12px;min-height:34px}
.btn:disabled{opacity:.4}
.btn:focus-visible,.tab:focus-visible,.sw:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.card{position:relative;border:2px dotted var(--coral);border-radius:5px;background:var(--card);padding:10px;display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;flex:1;gap:0}
.seg .btn{flex:1;border-radius:0;margin-left:-2px}.seg .btn:first-child{border-radius:5px 0 0 5px;margin-left:0}.seg .btn:last-child{border-radius:0 5px 5px 0}
.pal{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.sw{height:40px;border-radius:4px;border:2px solid transparent;background:#0f2832;display:grid;place-items:center;cursor:pointer;padding:0}
.sw i{display:block;width:24px;height:24px;border-radius:2px}
.sw.on{border-color:var(--gold);box-shadow:0 0 10px rgba(250,221,169,.4)}
label{font-size:13px;color:var(--muted)}
#sname{flex:1;width:0;min-width:80px}#slv{width:56px}
.hintp{margin:0;font-size:13px;color:var(--muted);line-height:1.4}
h2{margin:0;font-size:16px;color:var(--coral)}
textarea{width:100%;box-sizing:border-box;min-height:90px;font-family:"Courier New",monospace;font-size:11px;color:var(--coral-l);background:var(--bg);border:2px dotted var(--dim);border-radius:5px;padding:8px;resize:vertical}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--gold)}
#msg{min-height:16px}
.sec{display:flex;flex-direction:column;gap:8px}
.sel{font:inherit;color:var(--coral-l);background:var(--bg);border:2px dotted var(--coral);border-radius:5px;padding:5px 6px;max-width:150px}
.chip{font:inherit;font-size:14px;color:var(--coral-l);background:var(--bg);border:2px solid var(--dim);border-radius:999px;padding:5px 11px;cursor:pointer}
.chip.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 8px rgba(250,221,169,.35)}.chip i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px}
.ck{display:flex;gap:5px;align-items:center;font-size:14px;color:var(--coral-l)}.ck input{width:18px;height:18px;accent-color:var(--coral)}
.sl{display:grid;grid-template-columns:52px 1fr 40px;gap:8px;align-items:center;font-size:14px}.sl input{width:100%;accent-color:var(--coral)}.sl b{font-family:var(--num);font-size:11px;color:var(--gold);text-align:right;font-weight:400}
.keys{position:relative;height:12px;margin:-4px 0 0}.keys i{position:absolute;top:2px;width:8px;height:8px;margin-left:-4px;background:var(--gold);transform:rotate(45deg)}.keys i.mine{background:var(--coral-l)}
.dope{display:flex;flex-direction:column;gap:3px;position:relative;user-select:none;-webkit-user-select:none}
.dr{display:grid;grid-template-columns:86px 1fr;gap:6px;align-items:center;min-height:30px}
.dn{font:inherit;font-size:13px;color:var(--coral-l);background:var(--bg);border:2px solid transparent;border-radius:5px;padding:4px 6px;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.dr.on .dn{border-color:var(--gold);color:var(--gold)}.dn i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.dt{position:relative;height:26px;background:var(--bg);border-radius:4px;touch-action:none;cursor:pointer;background-image:repeating-linear-gradient(90deg,rgba(209,165,158,.14) 0 1px,transparent 1px calc(100%/8))}
.dr.on .dt{box-shadow:inset 0 0 0 1px var(--gold)}
.dt i{position:absolute;top:8px;width:10px;height:10px;margin-left:-5px;background:var(--gold);transform:rotate(45deg);pointer-events:none}
.dt.fire{background:repeating-linear-gradient(90deg,rgba(244,182,140,.55) 0 6px,rgba(226,148,135,.35) 6px 12px)}.dt.fire.off{background:var(--bg);opacity:.5}
.ph{position:absolute;top:0;bottom:0;width:2px;background:var(--coral-l);pointer-events:none;box-shadow:0 0 6px var(--coral)}
/* full-screen canvas: top bar and panels float over it, nothing scrolls but the open panel */
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{padding:0}
.wrap{max-width:none;display:block}
#topbar{position:fixed;top:0;left:0;right:0;z-index:10;display:flex;flex-direction:column;gap:6px;padding:calc(env(safe-area-inset-top,0px) + 8px) max(10px,env(safe-area-inset-right,0px)) 10px max(10px,env(safe-area-inset-left,0px));background:linear-gradient(rgba(23,52,65,.92) 70%,rgba(23,52,65,0));pointer-events:none}
#topbar>*{pointer-events:auto}
#topbar h1{font-size:16px}
.tab{padding:3px 2px}.tab b{font-size:14px}
.view{position:fixed;inset:0;height:auto;border:0;border-radius:0;z-index:1}
.ov.tl{top:calc(env(safe-area-inset-top,0px) + 104px);left:10px;right:10px}
.hint{top:calc(env(safe-area-inset-top,0px) + 146px);bottom:auto}
#turnbar{top:46%;bottom:auto;right:8px;flex-direction:column}
#sheet{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:9;max-height:44vh;overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:0 max(10px,env(safe-area-inset-right,0px)) 8px max(10px,env(safe-area-inset-left,0px))}
#sheet .card{background:rgba(23,52,65,.95)}
#dock{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:7px max(10px,env(safe-area-inset-right,0px)) calc(7px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));background:#173441;border-top:2px dotted var(--coral)}
.dk{font:inherit;font-size:15px;color:var(--coral-l);background:transparent;border:2px solid var(--dim);border-radius:5px;min-height:40px;cursor:pointer;padding:0}
.dk.on{background:var(--coral);color:var(--card);border-color:var(--coral)}
.confirm{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);z-index:30;background:var(--card);border:2px solid var(--coral);border-radius:6px;padding:14px;width:min(360px,88vw);box-shadow:0 10px 30px rgba(0,0,0,.5)}
/* compact panels (Jordan 18:22: menus filled the screen) */
.ov.tl{top:calc(env(safe-area-inset-top,0px) + 58px)!important;flex-wrap:nowrap}
.hint{top:calc(env(safe-area-inset-top,0px) + 96px)!important;font-size:11px}
#sheet{max-height:34vh}
#sheet .card{padding:7px 8px;gap:7px}
#sheet .btn{min-height:32px;padding:3px 8px;font-size:13px}
#sheet input[type=text],#sheet .sel{min-height:30px;font-size:13px;padding:2px 6px}
#sheet .hintp{font-size:12px}
#sheet h2{font-size:14px;margin:0}
#poseEd{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5px 8px}#poseMode{grid-column:1/3;display:flex}#poseMode .btn{flex:1}#poseReset{grid-column:3}
#poseEd .sl{grid-template-columns:34px 1fr 30px;gap:4px;font-size:12px}
.dt{height:20px}.dn{font-size:12px;padding:1px 5px}
#dock{padding-top:5px;gap:5px}.dk{min-height:34px;font-size:14px}
#sheet{bottom:calc(46px + env(safe-area-inset-bottom,0px))}
#sheet .pal{gap:4px;grid-template-columns:repeat(auto-fill,minmax(30px,1fr))}#sheet .sw{height:32px}
.nud{display:grid;grid-template-columns:12px 30px 1fr 30px;gap:4px;align-items:center;font-size:12px}.nud .btn{min-height:30px!important;padding:0!important;font-size:18px!important;touch-action:manipulation}.nud b{font-family:var(--num);font-size:11px;color:var(--gold);text-align:center;font-weight:400;cursor:pointer}
#c{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}.sw.flash{animation:swf .5s}@keyframes swf{0%{transform:scale(1.35)}100%{transform:scale(1)}}@media (prefers-reduced-motion:reduce){.sw.flash{animation:none}}
[hidden]{display:none!important}
</style>

    <div class="ov tl"><button class="btn sm" id="undo" type="button" style="order:9;margin-left:auto">Undo</button><button class="btn sm" id="anim" type="button">Fire</button><button class="btn sm" id="spin" type="button" hidden>Spin</button><button class="btn sm" id="gaps" type="button" hidden>Gaps</button><button class="btn sm" id="flat" type="button" hidden>Flat</button><button class="btn sm" id="pixel" type="button" hidden>Pixel</button><button class="btn sm" id="chunky" type="button" hidden>Chunky</button><button class="btn sm" id="soft" type="button" hidden>Soft</button><button class="btn sm" id="sprite" type="button" hidden>Sprite</button><button class="btn sm" id="art" type="button">Pixel art</button><button class="btn sm" id="showPose" type="button" hidden>Pose</button><button class="btn sm" id="artd" type="button" hidden hidden>Detail</button><button class="btn sm" id="front" type="button">Front</button></div>

    <div class="row"><button class="btn sm" id="unkey" type="button">Delete key</button><button class="btn sm" id="copyKey" type="button">Copy pose</button><button class="btn sm" id="pasteKey" type="button">Paste pose</button></div>

  <section class="card" id="rigCard" data-panel="rig" hidden>

      <div class="row"><button class="btn" data-tool="assign" type="button">Assign pips</button><button class="btn" data-tool="pivot" type="button">Place pivot</button><button class="btn" id="pdel" type="button">Delete part</button></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);
// Colors from the Pip Monster Maker (sampled from the app's home screen). Letters match the 2D maker's codes.
const PAL={c:'#e29487',r:'#ef9084',h:'#f3aea6',p:'#f8d4ce',o:'#f4b68c',y:'#fadda9',m:'#916f6b',s:'#3f6a7c',l:'#58798a',e:'#2f5564',d:'#173441',n:'#7c3b41'};
const NAMES={c:'Coral',r:'Bright coral',h:'Light coral',p:'Pale pink',o:'Flame orange',y:'Gold',m:'Dim coral',s:'Slate',l:'Light slate',e:'Empty pip teal',d:'Dark',n:'Line art'};
const NOGLOW='sdlen',FLAME='crh',EYE=k=>k==='s'||k==='d';
const EMBER2D={"name":"Ember","stages":[{"name":"Ember","lv":"1","rows":["....cc..","...cc...",".cccc...",".ccccc..","ccccccc.","ccsccscc","ccdccdcc","ccdccdcc","cccccccc",".cccccc."]},{"name":"Flare","lv":"3","rows":["......c...",".......c..",".c...ccc..","....cccc..","..cccccc..",".cccccccc.","cccccccccc","ccssccsscc","cc..cc..cc","cc..cc..cc","cc..cc..cc","cccccccccc",".cccccccc."]},{"name":"Blaze","lv":"5","rows":["..............","..............","..............","........c.....",".......cc.....","......ccrc....","...c.cccccc...","..cccccccccc..","..cccccccccc..",".cccccccccccc.",".ccssccccsscc.",".ccddccccddcc.",".ccddccccddcc.",".cccccccccccc.",".ccccyccycccc.","..ccccyycccc..","...cccccccc...","..lmlllllmll.."]},{"name":"Inferno","lv":"8","rows":["..........c.......","...........c......","...........cc.....","............c.....","...........cc.....","........ccccc.....",".......cccccc.....","....c.cccccc..c...","...ccccccccc.cc...","...cccccppccccc...","...cccccccccccc...","...cccccppccccc...","..cccccppppccccc..","..cccccppppccccc..","..ccccccppcccccc..","..ccssccccccsscc..",".cccddccccccddccc.",".cccddccccccddccc.",".cccccccccccccccc.","..cccccyyyycccccc.","..ccccyyyyyycccc..","..cccyyyyyyyyccc..","...cyyyyyyyyyyc...","....cyyyyyyyyc....","...llmlllllmlll...","....l........l...."]}]};

/* ---------- 2D drawing to 3D: a puffy pillow. Each pip gets depth from how far it sits from the outline,
   face colors (eyes, heart, chest) go on the front only, the rest of the body is coral, logs keep their color all through. ---------- */
function from2D(st){const rows=st.rows,H=rows.length,W=Math.max(...rows.map(r=>r.length)),g=rows.map(r=>r.padEnd(W,'.').split(''));
  const inside=(r,c)=>r>=0&&c>=0&&r<H&&c<W&&g[r][c]!=='.';
  // holes enclosed in a row (like Flare's empty eyes) count as dark sockets
  const hole=(r,c)=>g[r][c]==='.'&&g[r].slice(0,c).some(k=>k!=='.')&&g[r].slice(c+1).some(k=>k!=='.')&&rows.slice(0,r).some(x=>(x[c]||'.')!=='.')&&rows.slice(r+1).some(x=>(x[c]||'.')!=='.');
  const holes=new Set();for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(hole(r,c))holes.add(r+','+c);
  const solid=(r,c)=>inside(r,c)||holes.has(r+','+c);
  // 4-neighbour distance to the outside
  const D=g.map(()=>Array(W).fill(0));let changed=true;for(let r=0;r<H;r++)for(let c=0;c<W;c++)D[r][c]=solid(r,c)?99:0;
  while(changed){changed=false;for(let r=0;r<H;r++)for(let c=0;c<W;c++)if(D[r][c]){const n=Math.min(r>0?D[r-1][c]:0,r<H-1?D[r+1][c]:0,c>0?D[r][c-1]:0,c<W-1?D[r][c+1]:0)+1;if(n<D[r][c]){D[r][c]=n;changed=true}}}
  const cap=Math.max(1,Math.round(Math.max(W,H)/7)),vox={};
  for(let r=0;r<H;r++)for(let c=0;c<W;c++){if(!solid(r,c))continue;const k0=holes.has(r+','+c)?'d':g[r][c],x=c,y=H-1-r;
    const log=k0==='l'||k0==='m',half=Math.min(D[r][c]-1,cap);
    for(let z=-half;z<=half;z++){let k=k0;
      if(!log&&z<half&&k0!=='d')k='c';               // only the front layer shows face colors
      if(k0==='d'&&z<half)k=z===half-1?'d':'c';       // eye sockets: dark one layer deep, body behind
      if(holes.has(r+','+c)&&z===half)continue;       // the socket's front is open
      vox[x+','+y+','+z]=k}}
  return{name:st.name,lv:String(st.lv),mx:(W-1)/2,vox}}
const emberLine=()=>({name:EMBER2D.name,stages:EMBER2D.stages.map(from2D)});
