<style>
/* Render Deck's look: calm dark panels, 1px lines, colour only as small accents */
:root{
  --bg:#111217; --panel:#1b1d23; --panel2:#24262e; --line:#30333c;
  --text:#e8eaee; --soft:#a3aab6; --dim:#7d8592;
  --accent:#ff5ca8; --accent-ink:#1b0b14; --cyan:#33c2c9;
  --model:#b892ff; --samp:#ffb35c; --pic:#ffd75e; --vid:#6fc0ff; --aud:#5cffb0; --fl:#ff6fae;
  --bad:#f2777f; --good:#5cffb0;
  --display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:110px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:30px}
input[type=checkbox]{width:auto}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
header h1{font:700 22px/1 var(--display);margin:0;flex:1;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--accent)}
.pcdots{display:flex;gap:6px}
.pcdots span{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--soft);padding:7px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.busy{background:var(--samp);box-shadow:0 0 8px var(--samp)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--soft);flex:none}
.block{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 12px;overflow:hidden}
.block>h3{display:flex;align-items:center;gap:10px;margin:0;padding:13px 14px;font:700 15px/1.2 var(--display);letter-spacing:.3px;cursor:pointer;user-select:none}
.block>h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--soft));flex:none}
.block>h3 .sum{flex:1;min-width:0;font:600 13px/1.3 var(--body);color:var(--soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.block>h3::after{content:"▾";color:var(--dim);font:14px var(--body);transition:transform .15s}
.block.shut>h3::after{transform:rotate(-90deg)}
.block.shut>.body{display:none}
.body{padding:0 14px 14px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loras{display:grid;gap:10px;min-width:0;grid-template-columns:minmax(0,1fr)}.lr{min-width:0;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.lr .lt{display:flex;gap:8px;align-items:center}.lr .lt select{flex:1;min-width:0;width:auto}.lr .lt b{font-size:13px;min-width:36px;text-align:right}
.lr .x{padding:6px 10px}
.row>label{font-size:13.5px;font-weight:700;color:var(--soft)}
.lab{font-size:13px;font-weight:800;color:var(--soft);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.lab b{color:var(--text)}
.note{font-size:13px;color:var(--dim);line-height:1.4;overflow-wrap:anywhere}
.note.warn{color:var(--samp)}
.note.bad{color:var(--bad)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:800;color:var(--soft)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:disabled{opacity:.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:800;color:var(--soft)}
.chip.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;user-select:none}
.sw .t{font-weight:800}
.sw .d{font-size:12.5px;color:var(--dim)}
.tog{flex:none;width:46px;height:28px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--soft);transition:transform .15s,background .15s}
.on>.tog,.tog.on{background:color-mix(in srgb,var(--accent) 40%,var(--panel2));border-color:var(--accent)}
.on>.tog::after,.tog.on::after{transform:translateX(18px);background:#fff}
.mini{flex:none;width:36px;height:22px}
.mini::after{width:14px;height:14px}
.on>.mini::after,.mini.on::after{transform:translateX(14px)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.castGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.castTile{display:flex;flex-direction:column;gap:3px;padding:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;color:inherit;font:inherit;text-align:left;cursor:pointer}
.castTile img,.castTile>span{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:grid;place-items:center;background:var(--bg);color:var(--dim);font-size:12px}
.castTile b{padding:0 8px;font:700 13px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castTile small{padding:0 8px;color:var(--soft);font-size:11px}
.chips.names{margin:0 0 6px;gap:6px}.chips.names .chip{padding:5px 10px;font-size:12px}
.seg.outs{flex-wrap:wrap;margin:2px 0 10px}
.block>h3 .hthumb{width:30px;height:30px;border-radius:8px;object-fit:cover;object-position:top;flex:none}
.slot{position:relative;aspect-ratio:1;border-radius:12px;border:1px dashed var(--line);background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--dim);font-size:13px;font-weight:700;text-align:center}
.slot.has{border-style:solid}
.slot.off img,.slot.off video,.slot.off .wave{opacity:.25;filter:grayscale(1)}
.slot img,.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .tag{position:absolute;left:5px;top:5px;padding:2px 7px;border-radius:99px;background:#111217e6;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--text);max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:8px;background:#111217e6;border:1px solid var(--line);font-size:13px;color:var(--soft)}
.slot .st{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;justify-content:space-between;align-items:center}
.slot .st .tog{background:#111217e6}
.slot .opt{padding:3px 7px;border-radius:99px;background:#111217e6;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--soft)}
.slot .opt.on{border-color:var(--cyan);color:var(--cyan)}
.slot .wave{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;background:repeating-linear-gradient(90deg,#1b1d23 0 3px,#16171c 3px 6px)}
.slot .nm{position:absolute;left:6px;right:6px;top:32px;font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.add{cursor:pointer}
.sub{font-size:12.5px;font-weight:800;color:var(--soft);letter-spacing:.3px;text-transform:uppercase;margin:4px 0 -4px}
.pieces{display:flex;gap:4px}
.pieces i{flex:var(--w);height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font:800 11.5px/24px var(--body);font-style:normal;text-align:center;color:var(--soft);white-space:nowrap;overflow:hidden;min-width:0}
.ptext{display:grid;gap:8px}
.ptext textarea{min-height:76px;font-size:14.5px}
.ptext .ph{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--soft)}
.ptext .ph button{font-size:12px;color:var(--cyan);font-weight:800}
.tagbar{display:flex;gap:6px;flex-wrap:wrap}
.tagbar button{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:800;color:var(--soft)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.step button{width:40px;height:38px;font-size:18px;color:var(--soft)}
.step b{min-width:28px;text-align:center}
.go{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.go .in{max-width:608px;margin:0 auto;display:flex;gap:10px;align-items:center}
#goBtn{flex:1;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 18px/1 var(--display);letter-spacing:.4px;box-shadow:0 6px 22px -8px var(--accent)}
#goBtn:disabled{background:var(--panel2);color:var(--dim);box-shadow:none}
#goWhy{font-size:12.5px;color:var(--samp);text-align:center;max-width:608px;margin:0 auto 6px;display:block}
.take{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 12px;overflow:hidden}
.take video{display:block;width:100%;background:#000;max-height:70vh}
.take .pv{position:relative}
.take .pv .big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:44px;color:#fff;text-shadow:0 2px 12px #000a}
.take .pv.on .big{display:none}
.take .pv .snd{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:#111217cc;font-size:18px;display:grid;place-items:center}
.take .ph{position:relative;background:repeating-conic-gradient(#1a1c22 0 25%,#16171c 0 50%) 0 0/16px 16px;display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:14px}
.take .ph img{width:100%;display:block}
.take .meta{padding:10px 12px;display:grid;gap:8px}
.take .tl{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px}
.take .tl span{color:var(--soft);font-weight:700;font-size:12.5px;text-align:right}
.take .pr{font-size:13px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;font-weight:800;color:var(--text)}
.btn.warn{color:var(--bad)}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
h2{font:700 16px/1 var(--display);margin:22px 0 10px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h2 span{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet .card h3{margin:0;font:700 17px/1.2 var(--display);display:flex;justify-content:space-between;align-items:center}
.pcrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pcrow .nm{font-weight:800;display:flex;gap:8px;align-items:center}
.pcrow .why{grid-column:1/-1;font-size:12.5px;color:var(--dim)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;max-width:90vw;box-shadow:0 10px 30px #0008}
.shapeStage{height:220px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;border-radius:12px;background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.025) 8px 16px)}
#shapeBox{border:1.5px solid var(--cyan);border-radius:4px;background:color-mix(in srgb,var(--cyan) 10%,transparent);display:flex;align-items:center;justify-content:center;transition:width .15s,height .15s}
#shapeLab{font-size:12px;opacity:.85;white-space:nowrap}
.live{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
/* H3 Film */
body{padding-bottom:calc(120px + env(safe-area-inset-bottom))}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--dim);font-weight:700;margin:-4px 0 12px;flex-wrap:wrap}

<script>
'use strict';

async function sendTakes(x, k, parent, n, fixText, fix){

  if(cut.pc && !fix){ const why = canRun(cut.pc, lookOf(film, cut), {chain:(cut.plan || []).length > 1}); if(why){ toast(pcName(cut.pc) + ' ' + why + '. This cut stays on ' + pcName(cut.pc) + ': change its look in the cut.', 7000); return 0; } }
  for(let j = 0; j < n; j++){ const c = newCand(film, scene, cut, k, parent, fixText, fix); cut.cands.push(c);
    try{ await sendCand(cut, c); sent++; }catch(e){ c.state = 'failed'; c.err = 'not sent: ' + e.message; toast('Not sent: ' + e.message, 6000); break; } }

// ✂ redo a stretch [a, b] of a finished cut (frames): MiniMax renders a window on the 17k+5 grid that starts on frame a
// (or ctx frames before it) and ends on frame b (or ctx frames after); those outside frames are pinned, so the new middle
// leaves and lands exactly where the cut does. Only the frames strictly between a and b are replaced.
function fixPlan(F, a, b, ctx){
  a = Math.max(0, Math.min(F - 2, Math.round(a))); b = Math.max(a + 2, Math.min(F - 1, Math.round(b)));
  let s0 = Math.max(0, a - ctx), e0 = Math.min(F - 1, b + ctx), L = gridUp(e0 - s0 + 1);
  if(L > F) L = gridDn(F);
  if(s0 + L - 1 > F - 1) s0 = Math.max(0, F - L);
  const e = s0 + L - 1; if(b > e) b = e; if(a < s0) a = s0;
  const pins = [], every = 2;
  for(let s = s0; s <= a; s++) if(s===a || (a - s) % every===0) pins.push([s - s0, s]);
  for(let s = b; s <= (ctx ? e : b); s++) if(s===b || s===e || (s - b) % every===0) pins.push([s - s0, s]); // without context, the frames after b are free (they're cut off)
  return {a, b, s0, L, F, pins};
}

let tickT = 0; const tickSoon = ms => { clearTimeout(tickT); tickT = setTimeout(tick, ms || 0); };
async function histOf(url, pid){ try{ return (await getJ(url + '/history/' + pid))[pid] || null; }catch(e){ return undefined; } }
const outFile = (h, node) => { const o = ((h && h.outputs) || {})[node] || {}, f = (o.images || o.videos || o.gifs || [])[0]; return f ? {filename:f.filename, subfolder:f.subfolder || '', type:'output'} : null; };
async function tick(){
  clearTimeout(tickT); let changed = false;
  try{
    for(const x of allCuts()){ const {cut} = x;
      for(const c of cut.cands){ if(c.state!=='queued' && c.state!=='running') continue; const p = pcOf(c.pc); if(!p.online) continue;
        const h = await histOf(c.pc, c.pid); if(h===undefined) continue;
        if(h && h.status && h.status.completed){ const f = outFile(h, c.save); if(f){ c.file = f; c.state = 'done'; c.t1 = Date.now(); } else { c.state = 'failed'; c.err = 'nothing came back'; } changed = true; }
        else if(h && h.status && h.status.status_str==='error'){ const e = (h.status.messages || []).find(m => m[0]==='execution_error'); c.state = 'failed'; c.err = e ? e[1].exception_message : 'ComfyUI hit an error'; changed = true; }
        else if(!h){ const q = p.queue || {}, inQ = [...(q.queue_running || []), ...(q.queue_pending || [])], at = inQ.findIndex(y => y[1]===c.pid);
          if(at >= 0){ const st = (q.queue_running || []).some(y => y[1]===c.pid) ? 'running' : 'queued'; if(st!==c.state){ c.state = st; changed = true; } }
          else if(Date.now() - (c.tq || 0) > 20000){ const f = await probe(c); if(f){ c.file = f; c.state = 'done'; } else { c.state = 'failed'; c.err = 'It left ' + pcName(c.pc) + "'s queue (ComfyUI restarted or it was cancelled)"; } changed = true; } }
      }
      if(cut.joinPid && pcOf(cut.pc).online){ const h = await histOf(cut.pc, cut.joinPid);
        if(h && h.status && h.status.completed){ const f = outFile(h, cut.joinSave); if(f){ cut.final = {pc:cut.pc, file:f}; toast('✓ ' + (cut.name || 'A cut') + ' is finished'); } else cut.joinErr = 'joining gave nothing back'; cut.joinPid = null; changed = true; }
        else if(h && h.status && h.status.status_str==='error'){ cut.joinErr = ((h.status.messages || []).find(m => m[0]==='execution_error') || [0, {}])[1].exception_message || 'joining failed'; cut.joinPid = null; changed = true; }
        else if(h===null && Date.now() - (cut.tj || 0) > 60000){ const q = pcOf(cut.pc).queue || {}; if(![...(q.queue_running || []), ...(q.queue_pending || [])].some(y => y[1]===cut.joinPid)){ cut.joinPid = null; changed = true; } } }

      if(cut.plan && cut.pick.length===cut.plan.length && cut.pick.every(Boolean) && !cut.final && !cut.joinPid && !cut.joinErr && pcOf(cut.pc).online){ await finishCut(x); changed = true; }
    }

  try{ if(await tickGens()) changed = true; }catch(e){ console.warn(e); }
  if(changed){ save(); drawAll(); } else drawLive();
  tickT = setTimeout(tick, allCuts().some(x => x.cut.cands.some(c => c.state==='queued' || c.state==='running') || x.cut.joinPid) || S.films.some(f => f.chars.some(c => (c.gens || []).some(g => g.state==='queued' || g.state==='running'))) ? 4000 : 15000);
}

function qwenKitF(){

    const v = ver(unet), enc = v > 1 && oi.TextEncodeQwenImageEditPlus ? 'TextEncodeQwenImageEditPlus' : 'TextEncodeQwenImageEdit';
    const clip = combo(oi, 'CLIPLoader', 'clip_name').find(n => /qwen.?2\.5.?vl/i.test(bn(n))), vae = combo(oi, 'VAELoader', 'vae_name').find(n => /qwen.?image.?vae/i.test(bn(n)));

}
function zitKitF(){

const whoText = c => String(c.desc || '').split(/(?<=[.!?])\s+|\n+/).filter(t => t.trim() && !/\{\d+\}|<Picture\s*\d+>/i.test(t)).join(' ').trim().replace(/[.\s]*$/, ''); // her words, minus sentences about her own pictures
// free = how many of the 8 steps run with no prompt at all (Z-Image Turbo gives near-identical faces from any seed;
// a step or two of pure noise first lets each try start from its own layout and face, then her words take over)
function zitGraph(k, text, W, H, batch, prefix, free){
  const g = {}; let n = 0; const add = (cls, inputs) => { const id = String(++n); g[id] = {class_type:cls, inputs:fill(k.oi, cls, inputs), _meta:{title:cls}}; return id; };

function qwenGraph(k, img, text, W, H, prefix, keepFrame){
  const g = {}; let n = 0; const add = (cls, inputs) => { const id = String(++n); g[id] = {class_type:cls, inputs:fill(k.oi, cls, inputs), _meta:{title:cls}}; return id; };
  let model = [add('UNETLoader', {unet_name:k.unet, weight_dtype:'default'}), 0];
  if(k.fast) model = [add('LoraLoaderModelOnly', {model, lora_name:k.fast, strength_model:1}), 0];
  model = [add('ModelSamplingAuraFlow', {model, shift:3}), 0]; if(k.oi.CFGNorm) model = [add('CFGNorm', {model, strength:1}), 0];
  const cl = [add('CLIPLoader', {clip_name:k.clip, type:'qwen_image', device:'default'}), 0], va = [add('VAELoader', {vae_name:k.vae}), 0], plus = k.enc==='TextEncodeQwenImageEditPlus';

  const lat = plus && !keepFrame && k.oi.EmptySD3LatentImage ? [add('EmptySD3LatentImage', {width:W, height:H, batch_size:1}), 0] : [add('VAEEncode', {pixels:pic, vae:va}), 0];

  return {g, save:add('SaveImage', {images:[add('VAEDecode', {samples:[ks, 0], vae:va}), 0], filename_prefix:prefix})};
}

  // Render's helper keeps its own line of jobs on disk and hands them to ComfyUI one at a time, so a ComfyUI crash and restart
  // (Render 2026-11-02 19:12, Qwen mid-job: 7 waiting pictures gone with ComfyUI's in-memory queue) costs nothing: it sends again.
  // Older helpers, or a PC the helper doesn't list: straight into ComfyUI's queue as before.

    if(r.status===404){ pcOf(url).farm = false; r = null; } } // the helper went back to an older one: straight into ComfyUI
  if(r){ const a = await r.json().catch(() => ({})); if(!r.ok || a.error) throw new Error(a.error || pcName(url) + "'s helper said " + r.status);
    xs.forEach(x => { x.farm = 1; x.state = 'queued'; x.tq = Date.now(); c.gens.push(x); }); save();
  } else for(let i = 0; i < jobs.length; i++){ const x = xs[i]; c.gens.push(x); x.pid = await queueGraph(url, jobs[i].G); x.state = 'queued'; x.tq = Date.now(); save(); }

const normU = u => String(u || '').replace(/\/+$/, '');
async function farmGet(url, since){ return getJ(url + '/renderdeck/farm?since=' + Math.max(0, Math.floor(since || 0)), null, 10000); }
// does this PC's helper run the job line, with this PC in it and switched on there?
async function farmOk(url){ const p = pcOf(url); if(p.farmAt && Date.now() - p.farmAt < 120000) return p.farm;
  try{ const j = await farmGet(url, Date.now() / 1000); const me = (j.pcs || []).find(x => normU(x.url)===normU(url)); p.farm = !!(j.farm && me && !me.off && !me.video); }catch(e){ p.farm = false; }
  p.farmAt = Date.now(); return p.farm; }
async function tickGens(){ let changed = false; const FV = {};
  for(const film of S.films) for(const c of film.chars) for(const x of c.gens || []){ if(x.state!=='queued' && x.state!=='running') continue; if(!pcOf(x.pc).online) continue;
    if(x.farm){ // in the helper's line: waiting, sent to ComfyUI, or finished (its own record, which outlives ComfyUI restarts)
      if(!(x.pc in FV)){ const since = Math.min(...S.films.flatMap(f => f.chars.flatMap(h => (h.gens || []).filter(g => g.farm && g.pc===x.pc && (g.state==='queued' || g.state==='running')).map(g => g.tq || g.t)))) / 1000 - 300;
        try{ FV[x.pc] = await farmGet(x.pc, since); }catch(e){ FV[x.pc] = null; } }
      const v = FV[x.pc]; if(!v) continue;
      const j = (v.jobs || []).find(y => y.key===x.id), d = (v.done || []).slice().reverse().find(y => y.key===x.id);
      if(j){ const st = j.state==='running' ? 'running' : 'queued'; if(j.id && j.id!==x.pid){ x.pid = j.id; changed = true; } if(st!==x.state){ x.state = st; changed = true; } }
      else if(d){ if(d.state==='done'){ x.files = (d.images || []).map(f => ({filename:f.filename, subfolder:f.subfolder || '', type:'output'})); x.state = x.files.length ? 'done' : 'failed'; if(!x.files.length) x.err = 'nothing came back'; }
        else { x.state = 'failed'; x.err = d.error || 'failed'; } changed = true; }
      else if(Date.now() - (x.tq || 0) > 60000){ x.state = 'failed'; x.err = pcName(x.pc) + "'s helper has no record of it (it was cancelled there)"; changed = true; }
      continue; }
    const h = await histOf(x.pc, x.pid); if(h===undefined) continue;
    if(h && h.status && h.status.completed){ const o = ((h.outputs || {})[x.save] || {}).images || []; x.files = o.map(f => ({filename:f.filename, subfolder:f.subfolder || '', type:'output'})); x.state = x.files.length ? 'done' : 'failed'; if(!x.files.length) x.err = 'nothing came back'; changed = true; }
    else if(h && h.status && h.status.status_str==='error'){ const e = (h.status.messages || []).find(m => m[0]==='execution_error'); x.state = 'failed'; x.err = e ? e[1].exception_message : 'ComfyUI hit an error'; changed = true; }
    else if(h===null){ const q = pcOf(x.pc).queue || {}, inQ = [...(q.queue_running || []), ...(q.queue_pending || [])];
      if(!inQ.some(y => y[1]===x.pid) && Date.now() - (x.tq || 0) > 30000){ x.state = 'failed'; x.err = 'It left ' + pcName(x.pc) + "'s queue"; changed = true; } }
  }
  return changed;
}

async function takeGen(c, gid, fi, top){
  const x = (c.gens || []).find(g => g.id===gid), f = x && x.files[fi]; if(!f) return;
  const b = await (await fetch(viewUrl(x.pc, f))).blob(), id = await addMedia(new File([b], f.filename, {type:b.type || 'image/png'}), 'img');
  const r = {id, note:x.kind==='set' ? ANGLES[x.order][2] : ''};

// ---------- ✂ Cutting Room: everything waiting for a pick, across every film ----------
function reviewItems(){
  const items = [];
  for(const x of allCuts()){ const {cut} = x; if(!cut.plan) continue;
    const k = cut.pick.length;
    if(k < cut.plan.length){ const parent = k ? cut.pick[k - 1] : null;
      const cs = cut.cands.filter(c => c.kind==='part' && c.part===k && (c.parent || null)===parent && !c.tossed);
      items.push(Object.assign({type:'part', k, cs}, x)); }
    const groups = [...new Set(cut.cands.filter(c => c.kind==='fix' && !(cut.fixDone || {})[c.group]).map(c => c.group))];
    groups.forEach(gid => items.push(Object.assign({type:'fix', gid, cs:cut.cands.filter(c => c.group===gid && !c.tossed)}, x)));
  }
  items.forEach(it => { it.ready = it.cs.filter(c => c.state==='done').length; it.busy = it.cs.filter(c => c.state==='queued' || c.state==='running').length; });
  return items.sort((a, b) => (b.ready > 0) - (a.ready > 0) || (a.film.name + a.scene.name).localeCompare(b.film.name + b.scene.name));
}

  if(d.s && film){ const sc = film.scenes.find(s => s.id===d.s); sc[d.k] = el.value; save(); return; }

    save(); if(d.cut==='seconds') draw(); else drawGo(); return; }
  if(d.part != null && x){ const p = x.cut.parts[+d.part]; p.text = el.value; p.own = true; save(); drawGo(); return; }
