<style>
/* Render Deck's look: calm dark panels, 1px lines, colour only as small accents */
:root{
  --bg:#111217; --panel:#1b1d23; --panel2:#24262e; --line:#30333c;
  --text:#e8eaee; --soft:#a3aab6; --dim:#7d8592;
  --accent:#ff5ca8; --accent-ink:#1b0b14; --cyan:#33c2c9;
  --model:#b892ff; --samp:#ffb35c; --pic:#ffd75e; --vid:#6fc0ff; --aud:#5cffb0; --fl:#ff6fae;
  --bad:#f2777f; --good:#5cffb0;
  --display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:110px}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),linear-gradient(135deg,var(--soft) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat;padding-right:32px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent);height:30px}
input[type=checkbox]{width:auto}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
header h1{font:700 22px/1 var(--display);margin:0;flex:1;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--accent)}
.pcdots{display:flex;gap:6px}
.pcdots span{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--soft);padding:7px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.busy{background:var(--samp);box-shadow:0 0 8px var(--samp)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--soft);flex:none}
.block{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 12px;overflow:hidden}
.block>h3{display:flex;align-items:center;gap:10px;margin:0;padding:13px 14px;font:700 15px/1.2 var(--display);letter-spacing:.3px;cursor:pointer;user-select:none}
.block>h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--soft));flex:none}
.block>h3 .sum{flex:1;min-width:0;font:600 13px/1.3 var(--body);color:var(--soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.block>h3::after{content:"▾";color:var(--dim);font:14px var(--body);transition:transform .15s}
.block.shut>h3::after{transform:rotate(-90deg)}
.block.shut>.body{display:none}
.body{padding:0 14px 14px;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.loras{display:grid;gap:10px;min-width:0;grid-template-columns:minmax(0,1fr)}.lr{min-width:0;grid-template-columns:minmax(0,1fr);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:8px}
.lr .lt{display:flex;gap:8px;align-items:center}.lr .lt select{flex:1;min-width:0;width:auto}.lr .lt b{font-size:13px;min-width:36px;text-align:right}
.lr .x{padding:6px 10px}
.row>label{font-size:13.5px;font-weight:700;color:var(--soft)}
.lab{font-size:13px;font-weight:800;color:var(--soft);margin-bottom:6px;display:flex;justify-content:space-between;gap:8px}
.lab b{color:var(--text)}
.note{font-size:13px;color:var(--dim);line-height:1.4;overflow-wrap:anywhere}
.note.warn{color:var(--samp)}
.note.bad{color:var(--bad)}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-size:14px;font-weight:800;color:var(--soft)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.seg button:disabled{opacity:.35}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:800;color:var(--soft)}
.chip.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;user-select:none}
.sw .t{font-weight:800}
.sw .d{font-size:12.5px;color:var(--dim)}
.tog{flex:none;width:46px;height:28px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);position:relative;transition:background .15s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--soft);transition:transform .15s,background .15s}
.on>.tog,.tog.on{background:color-mix(in srgb,var(--accent) 40%,var(--panel2));border-color:var(--accent)}
.on>.tog::after,.tog.on::after{transform:translateX(18px);background:#fff}
.mini{flex:none;width:36px;height:22px}
.mini::after{width:14px;height:14px}
.on>.mini::after,.mini.on::after{transform:translateX(14px)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.castGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0 0 12px}
.castTile{display:flex;flex-direction:column;gap:3px;padding:0 0 8px;border:1px solid var(--line);border-radius:12px;background:var(--panel);overflow:hidden;color:inherit;font:inherit;text-align:left;cursor:pointer}
.castTile img,.castTile>span{width:100%;aspect-ratio:3/4;object-fit:cover;object-position:top;display:grid;place-items:center;background:var(--bg);color:var(--dim);font-size:12px}
.castTile b{padding:0 8px;font:700 13px/1.2 var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.castTile small{padding:0 8px;color:var(--soft);font-size:11px}
.chips.names{margin:0 0 6px;gap:6px}.chips.names .chip{padding:5px 10px;font-size:12px}
.seg.outs{flex-wrap:wrap;margin:2px 0 10px}
.block>h3 .hthumb{width:30px;height:30px;border-radius:8px;object-fit:cover;object-position:top;flex:none}
.slot{position:relative;aspect-ratio:1;border-radius:12px;border:1px dashed var(--line);background:var(--bg);overflow:hidden;display:grid;place-items:center;color:var(--dim);font-size:13px;font-weight:700;text-align:center}
.slot.has{border-style:solid}
.slot.off img,.slot.off video,.slot.off .wave{opacity:.25;filter:grayscale(1)}
.slot img,.slot video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.slot .tag{position:absolute;left:5px;top:5px;padding:2px 7px;border-radius:99px;background:#111217e6;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--text);max-width:calc(100% - 44px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot .x{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:8px;background:#111217e6;border:1px solid var(--line);font-size:13px;color:var(--soft)}
.slot .st{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;justify-content:space-between;align-items:center}
.slot .st .tog{background:#111217e6}
.slot .opt{padding:3px 7px;border-radius:99px;background:#111217e6;border:1px solid var(--line);font-size:11px;font-weight:800;color:var(--soft)}
.slot .opt.on{border-color:var(--cyan);color:var(--cyan)}
.slot .wave{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;background:repeating-linear-gradient(90deg,#1b1d23 0 3px,#16171c 3px 6px)}
.slot .nm{position:absolute;left:6px;right:6px;top:32px;font-size:11px;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slot.add{cursor:pointer}
.sub{font-size:12.5px;font-weight:800;color:var(--soft);letter-spacing:.3px;text-transform:uppercase;margin:4px 0 -4px}
.pieces{display:flex;gap:4px}
.pieces i{flex:var(--w);height:26px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font:800 11.5px/24px var(--body);font-style:normal;text-align:center;color:var(--soft);white-space:nowrap;overflow:hidden;min-width:0}
.ptext{display:grid;gap:8px}
.ptext textarea{min-height:76px;font-size:14.5px}
.ptext .ph{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:800;color:var(--soft)}
.ptext .ph button{font-size:12px;color:var(--cyan);font-weight:800}
.tagbar{display:flex;gap:6px;flex-wrap:wrap}
.tagbar button{padding:5px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-size:12.5px;font-weight:800;color:var(--soft)}
.step{display:flex;align-items:center;border:1px solid var(--line);border-radius:11px;background:var(--bg)}
.step button{width:40px;height:38px;font-size:18px;color:var(--soft)}
.step b{min-width:28px;text-align:center}
.go{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.go .in{max-width:608px;margin:0 auto;display:flex;gap:10px;align-items:center}
#goBtn{flex:1;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 18px/1 var(--display);letter-spacing:.4px;box-shadow:0 6px 22px -8px var(--accent)}
#goBtn:disabled{background:var(--panel2);color:var(--dim);box-shadow:none}
#goWhy{font-size:12.5px;color:var(--samp);text-align:center;max-width:608px;margin:0 auto 6px;display:block}
.take{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 12px;overflow:hidden}
.take video{display:block;width:100%;background:#000;max-height:70vh}
.take .pv{position:relative}
.take .pv .big{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;font-size:44px;color:#fff;text-shadow:0 2px 12px #000a}
.take .pv.on .big{display:none}
.take .pv .snd{position:absolute;right:10px;bottom:10px;width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:#111217cc;font-size:18px;display:grid;place-items:center}
.take .ph{position:relative;background:repeating-conic-gradient(#1a1c22 0 25%,#16171c 0 50%) 0 0/16px 16px;display:grid;place-items:center;color:var(--dim);font-weight:700;font-size:14px}
.take .ph img{width:100%;display:block}
.take .meta{padding:10px 12px;display:grid;gap:8px}
.take .tl{display:flex;justify-content:space-between;gap:10px;font-weight:800;font-size:14px}
.take .tl span{color:var(--soft);font-weight:700;font-size:12.5px;text-align:right}
.take .pr{font-size:13px;color:var(--soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bar{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{padding:8px 11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:13.5px;font-weight:800;color:var(--text)}
.btn.warn{color:var(--bad)}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.empty{padding:22px;text-align:center;color:var(--dim);border:1px dashed var(--line);border-radius:var(--r);font-size:14px}
h2{font:700 16px/1 var(--display);margin:22px 0 10px;letter-spacing:.3px;display:flex;align-items:center;gap:8px}
h2 span{flex:1}
.sheet{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet .card h3{margin:0;font:700 17px/1.2 var(--display);display:flex;justify-content:space-between;align-items:center}
.pcrow{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pcrow .nm{font-weight:800;display:flex;gap:8px;align-items:center}
.pcrow .why{grid-column:1/-1;font-size:12.5px;color:var(--dim)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;max-width:90vw;box-shadow:0 10px 30px #0008}
.shapeStage{height:220px;display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;border-radius:12px;background:repeating-linear-gradient(45deg,transparent 0 8px,rgba(255,255,255,.025) 8px 16px)}
#shapeBox{border:1.5px solid var(--cyan);border-radius:4px;background:color-mix(in srgb,var(--cyan) 10%,transparent);display:flex;align-items:center;justify-content:center;transition:width .15s,height .15s}
#shapeLab{font-size:12px;opacity:.85;white-space:nowrap}
.live{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}

<div class="wrap">

</div>

<script>
'use strict';
// ============================================================================================================
// H3 Film (Jordan 2026-11-03): H3 Deck renders, H3 Film reviews and assembles. ✂ Review shows everything H3 Deck is
// making or has made (both apps live on this site, so H3 Deck's takes are read straight from its storage, never written).
// A film is a timeline of clips on several tracks: the upper track wins where clips overlap. A clip is a span of an H3 Deck
// take (in/out seconds) placed at a time; tap it to trim, split, swap for another version of the take, or ✏️ edit it in
// H3 Deck. The old cast / scenes / cuts app is at film/old.html (its data is untouched).
// ============================================================================================================
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const FPS = 24, KEY = 'h3edit', DECK = 'h3deck'; // (the old app's 'h3film' is left alone)
const DEFAULT_PCS = [{name:'Render', url:'https://jordo-desktop.tailadee9a.ts.net', on:true}, {name:'Main', url:'https://jordo-main.tailadee9a.ts.net', on:true}];
function toast(t, ms){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3200); }
const fmt = s => { s = Math.max(0, s || 0); const m = Math.floor(s / 60), r = s - m * 60; return m ? m + ':' + (r < 10 ? '0' : '') + r.toFixed(1) : r.toFixed(1) + ' s'; };

let S = load();
function load(){
  let s = {}; try{ s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){}
  s.films = s.films || []; s.seen = s.seen || {}; s.rev = s.rev || {}; s.nav = s.nav || {v:'home'};
  s.films.forEach(f => { if(!f.tracks) f.tracks = [{id:uid('tr'), clips:[]}, {id:uid('tr'), clips:[]}]; if(f.pps == null) f.pps = 24; });
  return s;
}
let saveT = 0; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("The phone's storage is full"); } }, 150); };
// H3 Deck's state, read only (it may be open in another tab and owns it)
let DK = null, DKraw = '';
function local(){ let raw = ''; try{ raw = localStorage.getItem(DECK) || ''; }catch(e){} if(raw!==DKraw || !DK){ DKraw = raw; try{ DK = JSON.parse(raw || '{}') || {}; }catch(e){ DK = {}; } DK.takes = DK.takes || []; } return DK; }
// H3 Deck also keeps a copy of its takes on each PC (ComfyUI user files): on iPhone, home-screen apps don't share storage,
// so the newest of this phone's copy and the PCs' copies is the one shown
let RM = null; // newest copy read from a PC: {t, pcs, takes}
const REMOTE_FILE = '/userdata/' + 'h3deck_takes.json';
async function pullDeck(){ let best = RM;
  for(const p of pcs()){ if(!pcOf(p.url).online) continue; try{ const j = await getJ(p.url + REMOTE_FILE, 8000); if(j && Array.isArray(j.takes) && (!best || (j.t || 0) > (best.t || 0))) best = j; }catch(e){} }
  const ch = best && best!==RM && (!RM || best.t!==RM.t); RM = best; return !!ch; }
function deck(){ const l = local(); return RM && (RM.t || 0) > (l.tsav || 0) ? RM : l; }
const takes = () => deck().takes;
// Films keeps its own copy of every take on a timeline (Jordan 2026-11-06: H3 Deck's Clear finished took a timeline clip's take
// away, and a clip is only a pointer to its take), so a clip never loses its video again
const takeOf = id => takes().find(t => t.id===id) || (S.keep || {})[id];
function keepTakes(){ S.keep = S.keep || {}; let ch = false; const used = new Set();
  S.films.forEach(f => f.tracks.forEach(tr => tr.clips.forEach(c => used.add(c.take))));
  used.forEach(id => { const t = takes().find(x => x.id===id); if(!t) return; const k = S.keep[id], fl = fileOf(t);
    if(!k || (fl && !fileOf(k)) || k.state!==t.state){ S.keep[id] = JSON.parse(JSON.stringify(t)); ch = true; } });
  Object.keys(S.keep).forEach(id => { if(!used.has(id)){ delete S.keep[id]; ch = true; } });
  if(ch) save(); return used; }
// a clip whose take is gone from H3 Deck (cleared before Films kept copies): find its video on the PCs again. The take's folder
// is H3Deck/h3_<UTC minute it was sent>_<last 4 of its id>, and its id starts with the time it was made, so the file can be
// looked for by name (and in each PC's recent history, which also gives back its words)
const LOST = {};
async function findLost(id){ const on = pcs().filter(p => pcOf(p.url).online); if(!on.length || LOST[id] === 1 || Date.now() - (LOST[id] || 0) < 60000) return; LOST[id] = 1; const tail = id.slice(-4), ms = parseInt(id.slice(1, -4), 36);
  let hit = null;
  for(const p of on){ if(hit) break; let h = null; try{ h = await getJ(p.url + '/history?max_items=2000', 20000); }catch(e){ continue; }
    for(const k of Object.keys(h || {})){ const o = h[k].outputs || {}; for(const n of Object.keys(o)){ (o[n].images || o[n].videos || o[n].gifs || []).forEach(x => {
      if(!/\.mp4$/i.test(x.filename) || !/H3Deck\/h3_\d+_/.test(x.subfolder || '') || !(x.subfolder || '').endsWith('_' + tail)) return;
      const whole = !/^piece_/.test(x.filename), at = (h[k].status && h[k].status.messages || []).map(m => m[1] && m[1].timestamp || 0).pop() || 0;
      if(!hit || (whole && !hit.whole) || (whole===hit.whole && at > hit.at)){ let words = '';
        Object.values(h[k].prompt && h[k].prompt[2] || {}).forEach(nd => { const v = nd && nd.inputs && (nd.inputs.prompt || nd.inputs.text); if(typeof v==='string' && v.length > words.length) words = v; });
        hit = {pc:p.url, file:{filename:x.filename, subfolder:x.subfolder || '', type:'output'}, whole, at, words}; } }); } } }
  if(!hit && ms > 1.6e12){ const pres = [];
    for(const p of on){ try{ const j = await getJ(p.url + '/renderdeck/images?limit=1', 15000); if(j.shared && j.pc) pres.push(j.pc + '/'); }catch(e){} }
    if(!pres.length) pres.push('');
    const names = [0, 60000, -60000].map(d => 'h3_' + new Date(ms + d).toISOString().slice(0, 16).replace(/[-:T]/g, '') + '_' + tail);
    outer: for(const p of on) for(const pre of pres) for(const nm of names) for(const fn of [nm + '_00001_.mp4', nm + '_00002_.mp4', 'piece_01_00001_.mp4']){
      const f = {filename:fn, subfolder:pre + 'H3Deck/' + nm, type:'output'}; try{ if((await fetch(viewUrl(p.url, f), {method:'HEAD'})).ok){ hit = {pc:p.url, file:f, words:''}; break outer; } }catch(e){} } }
  if(!hit){ LOST[id] = Date.now(); return; } // look again in a minute
  let d = 0; S.films.forEach(f => f.tracks.forEach(tr => tr.clips.forEach(c => { if(c.take===id) d = Math.max(d, c.dur || c.out || 0); })));
  S.keep = S.keep || {}; S.keep[id] = {id, pc:hit.pc, final:hit.file, state:'done', recovered:true, prompt:(hit.words || '').replace(/^This continues straight on[^.]*\.\s*/, ''), pieces:[{deliv:Math.round(d * FPS), start:0, prompt:hit.words || ''}], t:ms};
  save(); toast('Found a lost clip\'s video on ' + pcName(hit.pc) + ' again', 4000); draw(); }
const pcs = () => (window.FILM_PCS || (deck().pcs && deck().pcs.length ? deck().pcs : DEFAULT_PCS));
const pcName = url => (pcs().find(p => p.url===url) || {}).name || 'PC';
const viewUrl = (url, f) => url + '/view?' + new URLSearchParams({filename:f.filename, subfolder:f.subfolder || '', type:f.type || 'output'});
// a take's finished length: a ↻ redo is the whole spliced take; a carried-on take starts with the video it carried on
const ownCarry = t => !!(t && t.cont && t.carry && t.carry.own); // ➕ from Films: its video is only the new part (its own clip)
const secsOf = t => t.redo && t.redo.Fout ? t.redo.Fout / FPS : (t.pieces || []).reduce((a, p) => a + (p.deliv || 0), 0) / FPS + (t.cont && !ownCarry(t) ? +t.contSecs || 0 : 0);
// the finished file of a take: H3 Deck's own record, or what this app found on the PC while H3 Deck was closed
function fileOf(t){ if(!t) return null; const sn = S.seen[t.id] || {};
  if(t.final) return t.final; if(sn.final) return sn.final;
  const ps = t.pieces || []; if(ps.length===1 && ps[0].file) return ps[0].file; return null; }
const doneOf = t => !!fileOf(t) && t.state!=='working' || !!(S.seen[t.id] || {}).final;
const workingOf = t => t.state==='working' && !(S.seen[t.id] || {}).final && !(S.seen[t.id] || {}).gone;
const parentOf = t => t.from ? t.from.id : t.redo ? t.redo.src : null; // 🎲 takes from a piece, and ↻ redos, are versions of their take
const rootOf = t => { let r = t, n = 0; while(r && parentOf(r) && n++ < 20){ const p = takeOf(parentOf(r)); if(!p) break; r = p; } return r; };
const versionsOf = t => { if(t.carry && t.carry.key) return takes().filter(x => x.carry && x.carry.key===t.carry.key); // ➕ the takes made from one Carry on
  if(t.toFilm && t.toFilm.key) return takes().filter(x => x.toFilm && x.toFilm.key===t.toFilm.key); // the takes of one Render from the Films tab
  const r = rootOf(t); return takes().filter(x => rootOf(x)===r); };
const takeLabel = t => t ? (t.redo ? '↻ ' : t.carry ? '➕ ' : t.from ? '🎲 ' : '') + (t.prompt || '').split('\n')[0].slice(0, 60) : 'missing take';

// ---------- the PCs: dots, and following H3 Deck's renders while H3 Deck is closed ----------
const PC = {}; const pcOf = url => PC[url] = PC[url] || {online:false, queue:null};
async function getJ(url, ms){ const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 8000); try{ const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error(r.status + ''); return await r.json(); } finally{ clearTimeout(t); } }
async function ping(url){ const p = pcOf(url); try{ p.queue = await getJ(url + '/queue', 6000); p.online = true; }catch(e){ p.online = false; } }
function drawDots(){ $('#pcDots').innerHTML = pcs().map(p => { const q = pcOf(p.url).queue || {}, busy = (q.queue_running || []).length + (q.queue_pending || []).length; return `<span><i class="dot ${pcOf(p.url).online ? (busy ? 'busy' : 'on') : ''}"></i>${esc((p.name || '?')[0])}</span>`; }).join(''); }
// a take still "working" in H3 Deck's record: look at its pieces on the PC (finished ones are kept in this app's record)
async function follow(){
  let changed = false;
  for(const t of takes().filter(workingOf)){ const p = pcOf(t.pc); if(!p.online) continue;
    const sn = S.seen[t.id] = S.seen[t.id] || {}, ps = t.pieces || [], last = ps[ps.length - 1]; if(!last || !last.pid) continue;
    let h = null; try{ h = (await getJ(t.pc + '/history/' + last.pid))[last.pid]; }catch(e){ continue; }
    if(h && h.status && h.status.completed){ const outs = Object.values(h.outputs || {}).flatMap(o => o.images || o.videos || o.gifs || []);
      const joined = outs.find(f => !/^piece_/.test(f.filename)), mine = outs.find(f => /^piece_/.test(f.filename));
      const f = joined || (ps.length===1 ? mine : null);
      if(f){ sn.final = {filename:f.filename, subfolder:f.subfolder || '', type:'output'}; changed = true; }
      else if(!sn.join){ sn.join = true; changed = true; } } // pieces done, joined when H3 Deck opens
    else if(h && h.status && h.status.status_str==='error'){ sn.gone = 'failed'; changed = true; }
    const q = p.queue || {}, all = [...(q.queue_running || []), ...(q.queue_pending || [])];
    const run = ps.findIndex(x => (q.queue_running || []).some(y => y[1]===x.pid)), wait = ps.filter(x => (q.queue_pending || []).some(y => y[1]===x.pid)).length;
    const st = run >= 0 ? 'piece ' + (run + 1) + ' of ' + ps.length + ' rendering' : wait ? 'waiting in line' : sn.join ? 'done: open H3 Deck to join the pieces' : '';
    if(st!==sn.st){ sn.st = st; changed = true; }
  }
  if(changed){ save(); }
  return changed;
}
let tickT = 0;
async function tick(){ clearTimeout(tickT);
  try{ await Promise.all(pcs().filter(p => p.on!==false).map(p => ping(p.url))); drawDots(); const pulled = await pullDeck(); if(await follow() || pulled || N().v!=='film') drawSoft(); }catch(e){ console.warn(e); }
  tickT = setTimeout(tick, takes().some(workingOf) ? 6000 : 20000); }

// ---------- screens ----------
const N = () => S.nav;
const go = nav => { stopPlay(); S.nav = nav; save(); draw(); window.scrollTo(0, 0); };
const filmOf = id => S.films.find(f => f.id===id);
function draw(){
  placeNew(); keepTakes(); S.films.forEach(f => f.tracks.forEach(tr => tr.clips.forEach(c => { if(!takeOf(c.take)) findLost(c.take); else if(!fileOf(takeOf(c.take)) && !takes().find(x => x.id===c.take)) findLost(c.take); }))); drawDots(); const r = reviewList(); if(EMBED){ try{ window.parent.H3Badge(r.length); }catch(e){} } $('#roomBadge').innerHTML = r.length ? `<span class="badge">${r.length}</span>` : '';
  const v = N().v, f = v==='film' && filmOf(N().film);
  $('#view').innerHTML = f ? filmView(f) : v==='review' ? reviewView() : homeView();
  if(f){ wireFilm(f); if(f.exp && f.exp.state==='working') expPoll(f); }
}
// redraw what can change by itself without disturbing a playing video or a drag
function drawSoft(){ if(N().v==='film'){ drawDots(); return; } const pl = $$('#view video').some(v => !v.paused); if(pl) return; draw(); }
const crumb = parts => `<div class="crumb">${parts.map(([t, nav]) => nav ? `<button data-nav='${esc(JSON.stringify(nav))}'>${esc(t)}</button>` : `<span>${esc(t)}</span>`).join('<span>›</span>')}</div>`;
function filmSecs(f){ return Math.max(0, ...f.tracks.flatMap(tr => tr.clips.map(c => c.at + (c.out - c.in)))); }
function homeView(){
  return `<h2><span>Films</span><button class="btn pri" data-act="newFilm">＋ New film</button></h2>
  <div class="list">${S.films.map(f => { const n = f.tracks.reduce((a, t) => a + t.clips.length, 0);
    return `<div class="item" data-nav='${esc(JSON.stringify({v:'film', film:f.id}))}'><div class="t">🎬 ${esc(f.name)}<small>${n} clip${n===1 ? '' : 's'} · ${fmt(filmSecs(f))}</small></div><span class="go2">›</span></div>`; }).join('')
    || '<div class="empty">No films yet. Render clips in 🎛 H3 Deck, look at them in ✂ Review, then put them together here.</div>'}</div>
  <div class="note" style="margin-top:14px">The earlier H3 Film (cast, scenes and cuts) is still at <a href="old.html" style="color:var(--cyan)">old.html</a>.</div>`;
}

// ---------- ✂ Review: what H3 Deck is making and has made ----------
function reviewList(){ return takes().filter(t => !S.rev[t.id] && (workingOf(t) || doneOf(t))); }
function takeCard(t, film, kept){
  const f = fileOf(t), sn = S.seen[t.id] || {}, w = workingOf(t), ar = (t.w || 16) + '/' + (t.h || 9);
  const from = t.from ? (() => { const o = takeOf(t.from.id); return `🎲 piece ${t.from.at + 1} again, after piece${t.from.at > 1 ? 's 1–' + t.from.at : ' 1'}${o ? '' : ' (its first take is gone)'}`; })() : '';
  return `<div class="rv" style="--ar:${ar}" data-take="${t.id}">${f ? `<video controls muted playsinline preload="metadata" src="${esc(viewUrl(t.pc, f))}#t=0.05"></video>` : `<div class="ph">${w ? esc(sn.st || 'rendering on ' + pcName(t.pc)) : t.state==='failed' ? 'Not made' : 'Not joined yet: open it in H3 Deck'}</div>`}
    <div class="m"><b>${fmt(secsOf(t))} · ${esc(pcName(t.pc))}${(t.pieces || []).length > 1 ? ' · ' + t.pieces.length + ' pieces' : ''}</b>${from ? `<div class="note">${from}</div>` : ''}<div class="pr">${esc(t.prompt || '')}</div>
    <div class="btns">${f ? `<button class="btn pri" data-act="toFilm" data-t="${t.id}">＋ ${film ? 'Add to ' + esc(film.name) : 'Add to a film'}</button>${kept ? '' : `<button class="btn" data-act="keep" data-t="${t.id}">✓ Keep</button>`}<button class="btn" data-act="next" data-t="${t.id}">➕ Next part options</button>` : ''}${kept ? `<button class="btn" data-act="unkeep" data-t="${t.id}">↩ Unkeep</button>` : `<button class="btn" data-act="skip" data-t="${t.id}">✕ ${w ? 'Hide' : 'Not this one'}</button>`}<button class="btn" data-act="deck" data-t="${t.id}">✏️ Edit</button></div></div></div>`;
}
function reviewView(){
  const l = reviewList(), w = l.filter(workingOf), d = l.filter(t => !workingOf(t)), film = filmOf(S.lastFilm);
  const kept = takes().filter(t => S.rev[t.id]==='keep' && fileOf(t)); // where ✓ Keep goes: here, and the top of ＋ Clip
  return crumb([['Films', {v:'home'}], ['✂ Review']]) + `<div class="note" style="margin-bottom:12px">Everything 🎛 H3 Deck has made and you haven't looked at yet, newest first, and what it's still rendering. ✓ Keep puts it with the clips you can add to a film.</div>` +
    (d.length ? `<h2><span>To look at</span></h2>` + d.map(t => takeCard(t, film)).join('') : '<div class="empty">Nothing new to look at.</div>') +
