<!doctype html>
<html><head><meta charset="utf-8"><title>Reel (hidden, on Render)</title></head><body>
<script>
// 🌙🎞 Reel, hidden on Render (Jordan 2026-11-28: "This has been queued for a long while but only seemed to start when I opened my phone.
// Can we make sure it runs even when my phone is off?"). The Render Deck helper opens H3 Deck hidden (/renderdeck/h3app/?worker=1) when the
// phone has been away a while with work left; when Reel's copy is the newer one, that page comes here. This page starts from the phone's
// last copy (h3reel_run.json: Reel's reels, its engine's takes, H3 Deck's Library), loads Reel itself from GitHub Pages and runs it with
// H3 Deck from this computer as its engine, so ✨ passes get sent, 🎭 face passes follow, 🎬 / 🧵 runs go on. When the phone is back, it
// saves its copy and stops; the phone takes that copy over.
(async () => {
  const wid = (location.search.match(/[?&]wid=([\w-]+)/) || [])[1] || '', base = location.pathname.replace(/reelw\/[^/]*$/, '');
  try{ const x = new XMLHttpRequest(); x.open('GET', location.origin + '/userdata/h3reel_run.json?t=' + Date.now(), false); x.send();
    if(x.status===200){ const j = JSON.parse(x.responseText); localStorage.clear();
      for(const [k, v] of Object.entries(j.ls || {})) if(typeof v==='string') try{ localStorage.setItem(k, v); }catch(e){} } }catch(e){}
  window.REEL_WORKER = wid || 'w';
  window.REEL_ENGINE = location.origin + base + '?engine=1&t=' + Math.floor(Date.now() / 60000);
  let html = '';
  for(let i = 0; i < 5 && !html; i++){ try{ const r = await fetch('https://jbrantner.github.io/reel-5b1e7c94d2a0/index.html?t=' + Date.now(), {cache:'no-store'}); if(r.ok) html = await r.text(); }catch(e){}
    if(!html) await new Promise(z => setTimeout(z, 5000)); }
  if(!html){ document.body.textContent = "Couldn't load Reel"; return; }
  document.open(); document.write(html); document.close();
})();
</script>
</body></html>
