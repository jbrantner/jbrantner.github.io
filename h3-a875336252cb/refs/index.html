<style>
/* Render Deck's look: calm dark panels, 1px lines, colour only as small accents */
:root{
  --bg:#111217; --panel:#1b1d23; --panel2:#24262e; --line:#30333c;
  --text:#e8eaee; --soft:#a3aab6; --dim:#7d8592;
  --accent:#ff5ca8; --accent-ink:#1b0b14; --cyan:#33c2c9;
  --model:#b892ff; --samp:#ffb35c; --pic:#ffd75e; --vid:#6fc0ff; --aud:#5cffb0; --fl:#ff6fae;
  --bad:#f2777f; --good:#5cffb0;
  --display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(110px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input,select{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus{outline:none;border-color:var(--cyan)}
button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:14px 0 12px}
header h1{font:700 22px/1 var(--display);margin:0;flex:1;letter-spacing:.3px;white-space:nowrap}
header h1 span{color:var(--accent)}
.pcdots{display:flex;gap:6px}
.pcdots span{display:flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--soft);padding:7px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--bad);flex:none}
.dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}
.dot.busy{background:var(--samp);box-shadow:0 0 8px var(--samp)}
.icon{width:40px;height:40px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:18px;color:var(--soft);flex:none;text-decoration:none}
.block{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:0 0 12px;overflow:hidden}
.block>h3{display:flex;align-items:center;gap:10px;margin:0;padding:13px 14px;font:700 15px/1.2 var(--display);letter-spacing:.3px;cursor:pointer;user-select:none}
.block>h3::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--c,var(--soft));flex:none}
.block>h3 .sum{flex:1;min-width:0;font:600 13px/1.3 var(--body);color:var(--soft);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0}
.block>h3::after{content:"▾";color:var(--dim);font:14px var(--body);transition:transform .15s}
.block.shut>h3::after{transform:rotate(-90deg)}
.block.shut>.body{display:none}
.body{padding:0 14px 14px;display:grid;gap:12px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--dim);line-height:1.4}
.note.warn{color:var(--samp)}
.note.bad{color:var(--bad)}
.note b{color:var(--soft)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 11px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-size:13px;font-weight:800;color:var(--soft)}
.chip.on{border-color:var(--accent);color:var(--text);background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.btn{padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:800;color:var(--text)}
.btn.warn{color:var(--bad)}
.btn.pri{border-color:var(--accent);color:var(--accent)}
.btn.big{flex:1;padding:12px 10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid3 .btn{padding:12px 6px;display:grid;gap:3px;justify-items:center;text-align:center}
.grid3 .btn i{font-style:normal;font-size:20px}
.grid3 .btn small{font-size:11.5px;color:var(--dim);font-weight:700}
.pick{display:grid;place-items:center;gap:6px;padding:34px 16px;border:1px dashed var(--line);border-radius:var(--r);background:var(--bg);color:var(--soft);font-weight:800;text-align:center;width:100%}
.pick i{font-style:normal;font-size:34px}
.pick small{font-weight:600;color:var(--dim);font-size:13px}
.player{position:relative;background:#000;border-radius:12px;overflow:hidden;display:grid;place-items:center}
.player video{display:block;width:100%;max-height:52vh;object-fit:contain;background:#000}
.tc{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums}
.tc b{color:var(--text);font-size:15px}
.scrub{position:relative;height:54px;border-radius:10px;overflow:hidden;background:var(--bg);border:1px solid var(--line);touch-action:none;cursor:pointer}
.scrub .strip{position:absolute;inset:0;display:flex;pointer-events:none}
.scrub,.scrub *{user-select:none;-webkit-user-select:none;-webkit-user-drag:none}
.scrub .sel,.scrub .head{pointer-events:none}
.scrub .strip img{flex:1;min-width:0;height:100%;object-fit:cover;opacity:.55}
.scrub .sel{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 22%,transparent);border-left:2px solid var(--accent);border-right:2px solid var(--accent)}
.scrub .head{position:absolute;top:-2px;bottom:-2px;width:2px;margin-left:-1px;background:#fff;box-shadow:0 0 6px #000}
.scrub .head::after{content:"";position:absolute;left:-5px;top:0;width:12px;height:8px;border-radius:0 0 4px 4px;background:#fff}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ctl button{padding:10px 0;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;font-weight:800;color:var(--text)}
.ctl button small{display:block;font-size:10.5px;color:var(--dim);font-weight:700}
.inout{display:grid;grid-template-columns:1fr 1fr auto;gap:6px}
.tray{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.item{position:relative;aspect-ratio:1;border-radius:12px;border:1px solid var(--line);background:var(--bg);overflow:hidden;cursor:pointer}
.item img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.item .wave{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;background:repeating-linear-gradient(90deg,#1b1d23 0 3px,#16171c 3px 6px)}
.item .tag{position:absolute;left:5px;top:5px;padding:2px 7px;border-radius:99px;background:#111217e6;border:1px solid var(--line);font-size:11px;font-weight:800;max-width:calc(100% - 10px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .nm{position:absolute;left:5px;right:5px;bottom:5px;font-size:11px;font-weight:700;color:var(--soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:#111217cc;border-radius:6px;padding:2px 5px}
.item .ck{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;border:2px solid #fffa;background:#111217aa;display:grid;place-items:center;font-size:14px;font-weight:900;color:transparent}
.item.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.item.on .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item.busy{display:grid;place-items:center;color:var(--dim);font-size:12px;font-weight:800;text-align:center;padding:8px;cursor:default}
.sub{font-size:12.5px;font-weight:800;color:var(--soft);letter-spacing:.3px;text-transform:uppercase;margin:2px 0 -4px;display:flex;justify-content:space-between}
.sub span{text-transform:none;letter-spacing:0;color:var(--dim)}
.bar{height:5px;border-radius:9px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.go{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.go .in{max-width:608px;margin:0 auto;display:flex;gap:10px;align-items:center}
#goBtn{flex:1;padding:15px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font:700 18px/1 var(--display);letter-spacing:.4px;box-shadow:0 6px 22px -8px var(--accent)}
#goBtn:disabled{background:var(--panel2);color:var(--dim);box-shadow:none;opacity:1}
#goWhy{font-size:12.5px;color:var(--samp);text-align:center;max-width:608px;margin:0 auto 6px;display:block}
.sheet{position:fixed;inset:0;z-index:40;background:#000a;display:flex;align-items:flex-end;justify-content:center}
.sheet .card{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom));display:grid;gap:12px}
.sheet .card h3{margin:0;font:700 17px/1.2 var(--display);display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet .card img,.sheet .card video{width:100%;border-radius:10px;background:#000;max-height:60vh;object-fit:contain}
.sheet .card audio{width:100%}
.pcrow{display:grid;gap:6px;padding:10px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.pcrow .nm{font-weight:800;display:flex;gap:8px;align-items:center}
.pcrow .why{font-size:12.5px;color:var(--dim)}
.code{font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#0b0c10;border:1px solid var(--line);border-radius:8px;padding:8px;word-break:break-all;color:var(--soft);user-select:all}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:700;max-width:90vw;box-shadow:0 10px 30px #0008}
</style>
</head><body>
<div class="wrap">
  <header>
    <a class="icon" href="../" id="backBtn" aria-label="Back to H3 Deck">←</a>
    <h1><span>Ref</span> Deck</h1>
    <div class="pcdots" id="pcDots"></div>
    <button class="icon" id="setBtn" aria-label="Settings">⚙</button>
  </header>

  <section class="block" id="bVideo" style="--c:var(--vid)">
    <h3>Video <span class="sum" id="vidSum"></span></h3>
    <div class="body">
      <button class="pick" id="pickBtn"><i>🎬</i>Pick a video<small>From your phone or files. Nothing is uploaded until you ask for a voice split.</small></button>
      <div id="vidBody" hidden style="display:grid;gap:10px">
        <div class="player"><video id="vid" playsinline preload="auto"></video></div>
        <div class="tc"><span><b id="tNow">0:00.00</b> · frame <span id="fNow">0</span></span><span id="tInfo"></span></div>
        <div class="scrub" id="scrub"><div class="strip" id="strip"></div><div class="sel" id="selBox"></div><div class="head" id="head"></div></div>
        <div class="ctl">
          <button data-step="-1s">−1 s<small>back</small></button>
          <button data-step="-1f">◀︎<small>frame</small></button>
          <button data-step="play" id="playBtn">▶︎<small>play</small></button>
          <button data-step="+1f">▶︎<small>frame</small></button>
          <button data-step="+1s">+1 s<small>on</small></button>
        </div>
        <div class="inout">
          <button class="btn" id="inBtn">⟦ Start here</button>
          <button class="btn" id="outBtn">End here ⟧</button>
          <button class="btn" id="allBtn" aria-label="Use the whole video">Whole</button>
        </div>
        <div class="note" id="selNote"></div>
        <div class="row"><button class="btn" id="changeBtn">Change video</button><span class="note" id="srcNote"></span></div>
      </div>
    </div>
  </section>

  <section class="block" id="bCut" style="--c:var(--pic)">
    <h3>Cut it up <span class="sum" id="cutSum"></span></h3>
    <div class="body">
      <div class="sub">Frames <span>full-size PNG</span></div>
      <div class="row">
        <button class="btn big" id="grabBtn">📸 This frame</button>
        <button class="btn big" id="grab9Btn">📸 <span id="grabN">9</span> across the clip</button>
      </div>
      <div class="sub">Clip <span id="clipLen"></span></div>
      <div class="grid3">
        <button class="btn" id="cutAV"><i>🎬</i>Video + sound<small>.mp4</small></button>
        <button class="btn" id="cutV"><i>🎞</i>Video only<small>no sound</small></button>
        <button class="btn" id="cutA"><i>🔊</i>Sound only<small>.wav</small></button>
      </div>
      <div class="sub">Voice and background <span id="sepWhere"></span></div>
      <div class="chips" id="sepChips"></div>
      <button class="btn pri" id="sepBtn" style="padding:12px">🎤 Split voice from background</button>
      <div class="bar" id="sepBar" hidden><i></i></div>
      <div class="note" id="sepNote"></div>
    </div>
  </section>

  <section class="block" id="bTray" style="--c:var(--accent)">
    <h3>Tray <span class="sum" id="traySum"></span></h3>
    <div class="body">
      <div class="note" id="h3Room"></div>
      <div class="tray" id="tray"></div>
      <div class="row" id="trayBtns" hidden>
        <button class="btn" id="saveSel">⬇ Save picked</button>
        <button class="btn" id="pickNone">Unpick all</button>
        <button class="btn warn" id="clearTray">Clear tray</button>
      </div>
    </div>
  </section>
</div>

<div class="go"><span id="goWhy" hidden></span><div class="in"><button id="goBtn" disabled>➕ Send to H3 Deck</button></div></div>
<input type="file" id="filePick" accept="video/*" hidden>

<script>
// ============================================================================================================
// Ref Deck: pick a video, scrub it frame by frame, grab full-size PNG frames, cut a clip (video + sound, video only,
// sound only as WAV) and split its sound into voice and background on Render or Main (ComfyUI over Tailscale). Picked
// pieces go straight into H3 Deck's reference slots: this page lives inside H3 Deck's folder, so it shares H3 Deck's
// storage (also as a home-screen app); pieces are written to H3 Deck's media store plus an inbox list that H3 Deck
// takes in when it next opens.
// Cutting runs on the phone with Mediabunny (no re-encode when the cut can be copied; otherwise the video is re-encoded
// so the clip starts on the exact frame). The voice split runs on a PC, with whichever separator it has:
//   Mel-Band RoFormer (kijai's ComfyUI-MelBandRoFormer: vocals / instruments) - the best for songs and speech
//   TIGER-DnR (MW Audio Tools' Music Separation, already on Render: dialog / effects / music)
// ============================================================================================================
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const KEY = 'refdeck', H3KEY = 'h3deck', INBOX = 'h3deck-inbox', MAXREF = {img:9, vid:3, aud:3};
const DEFAULT_PCS = [{name:'Render', url:'https://jordo-desktop.tailadee9a.ts.net', on:true}, {name:'Main', url:'https://jordo-main.tailadee9a.ts.net', on:true}];
const MEL_URL = 'https://huggingface.co/Kijai/MelBandRoFormer_comfy/resolve/main/MelBandRoformer_fp16.safetensors';
const TIGER_PS = '$d="$env:LOCALAPPDATA\\Comfy-Desktop\\ComfyUI-Installs\\ComfyUI\\ComfyUI\\models\\TTS\\TIGER-DnR"; mkdir -Force $d; iwr -useb https://huggingface.co/JusperLee/TIGER-DnR/resolve/main/config.json -OutFile "$d\\config.json"; iwr -useb https://huggingface.co/JusperLee/TIGER-DnR/resolve/main/model.safetensors -OutFile "$d\\model.safetensors"';
const SEP_MAX = 180; // seconds of sound sent for a split

// ---------- settings (the PC list comes from H3 Deck when it has one) ----------
let S = (() => { let s = {}; try{ s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){}
  s.items = s.items || []; s.method = s.method || 'auto'; s.where = s.where || 'auto'; s.grabN = s.grabN || 9; s.open = s.open || {}; return s; })();
function pcs(){ if(window.RD_PCS) return window.RD_PCS; try{ const h = JSON.parse(localStorage.getItem(H3KEY) || '{}'); if(h.pcs && h.pcs.length) return h.pcs; }catch(e){} return DEFAULT_PCS; }
let saveT = 0;
function save(){ clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }, 120); }
function toast(t, ms){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3200); }
const fmt = t => { t = Math.max(0, t || 0); const m = Math.floor(t / 60), s = t - m * 60; return m + ':' + (s < 10 ? '0' : '') + s.toFixed(2); };
const fmtS = t => (Math.round(t * 10) / 10) + ' s';

// ---------- IndexedDB: our own tray (refdeck) and H3 Deck's media store (h3deck) ----------
function idb(name, store){ let db = null;
  const open = () => db || (db = new Promise((ok, no) => { try{ const r = indexedDB.open(name, 1); r.onupgradeneeded = () => { if(!r.result.objectStoreNames.contains(store)) r.result.createObjectStore(store); }; r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }catch(e){ no(e); } }));
  const tx = async (mode, fn) => { const d = await open(); return new Promise((ok, no) => { const t = d.transaction(store, mode), st = t.objectStore(store), r = fn(st); t.oncomplete = () => ok(r && r.result); t.onerror = () => no(t.error); }); };
  return {put:(k, v) => tx('readwrite', s => s.put(v, k)), get:k => tx('readonly', s => s.get(k)), del:k => tx('readwrite', s => s.delete(k))};
}
const RDB = idb('refdeck', 'blobs'), HDB = idb('h3deck', 'media');
const BLOBS = {}, URLS = {};
async function blobOf(id){ if(BLOBS[id]) return BLOBS[id]; try{ const b = await RDB.get(id); if(b) BLOBS[id] = b; return b || null; }catch(e){ return null; } }
async function urlOf(id){ if(URLS[id]) return URLS[id]; const b = await blobOf(id); return b ? (URLS[id] = URL.createObjectURL(b)) : ''; }

// ---------- Mediabunny (loaded the first time it's needed) ----------
let mbP = null; const MB = () => mbP || (mbP = import('./mediabunny-1.61.4.min.mjs'));

// ---------- the source video ----------
const V = $('#vid');
const SRC = {file:null, url:'', dur:0, fps:30, w:0, h:0, audio:null, a:0, b:0, name:''};
async function openVideo(file, keepSel){
  if(SRC.url) URL.revokeObjectURL(SRC.url);
  Object.assign(SRC, {file, name:file.name || 'video', url:URL.createObjectURL(file), audio:null, fps:30});
  V.src = SRC.url + '#t=0.001';
  await new Promise(ok => { const d = () => { V.removeEventListener('loadedmetadata', d); ok(); }; V.addEventListener('loadedmetadata', d); V.onerror = () => ok(); setTimeout(ok, 15000); });
  SRC.dur = isFinite(V.duration) ? V.duration : 0; SRC.w = V.videoWidth; SRC.h = V.videoHeight;
  try{ const M = await MB(), inp = new M.Input({source:new M.BlobSource(file), formats:M.ALL_FORMATS});
    const vt = await inp.getPrimaryVideoTrack(), at = await inp.getPrimaryAudioTrack();
    if(vt){ const st = await vt.computePacketStats(120); if(st && st.averagePacketRate > 1) SRC.fps = st.averagePacketRate; SRC.codec = vt.codec; }
    SRC.audio = !!at; if(!SRC.dur) SRC.dur = await inp.computeDuration();
  }catch(e){ SRC.audio = null; }
  SRC.fps = snapFps(SRC.fps);
  const k = keepSel && S.sel && S.sel.name===SRC.name && S.sel.size===file.size;
  SRC.a = k ? S.sel.a : 0; SRC.b = k ? Math.min(S.sel.b, SRC.dur) : SRC.dur;
  saveSel(); drawVideo(); drawStrip(); drawCut();
}
function snapFps(f){ let best = 0; for(const c of [23.976, 24, 25, 29.97, 30, 48, 50, 59.94, 60, 120]) if(Math.abs(f - c) < c * 0.006 && (!best || Math.abs(f - c) < Math.abs(f - best))) best = c; return best || Math.round(f * 100) / 100; }
const frameOf = t => Math.floor(t * SRC.fps + 1e-3);
function saveSel(){ S.sel = {name:SRC.name, size:SRC.file ? SRC.file.size : 0, a:SRC.a, b:SRC.b}; save(); }
async function keepSource(file){ try{ await RDB.put('source', file); }catch(e){} }
function seek(t){ t = Math.max(0, Math.min(SRC.dur - 0.5 / SRC.fps, t)); return new Promise(ok => { if(Math.abs(V.currentTime - t) < 1e-4){ ok(); return; }
  const d = () => { V.removeEventListener('seeked', d); ok(); }; V.addEventListener('seeked', d); V.currentTime = t; setTimeout(ok, 4000); }); }

}

// ---------- cutting a clip (on the phone) ----------
const whole = () => SRC.a <= 0.001 && SRC.b >= SRC.dur - 0.001;
async function convert(kind, exact){ // kind: av | v | a  -> Blob
  const M = await MB(), input = new M.Input({source:new M.BlobSource(SRC.file), formats:M.ALL_FORMATS});
  const webm = /webm|matroska/i.test(await input.getMimeType());
  const target = new M.BufferTarget(), output = new M.Output({format:kind==='a' ? new M.Mp4OutputFormat() : webm ? new M.WebMOutputFormat() : new M.Mp4OutputFormat(), target});
  const opts = {input, output, showWarnings:false, video:kind==='a' ? {discard:true} : {bitrate:M.QUALITY_VERY_HIGH}, audio:kind==='v' ? {discard:true} : {}};
  if(!whole()) opts.trim = {start:SRC.a, end:SRC.b};
  if(exact && !whole()) opts.copy = {boundaryTolerance:0};
  const conv = await M.Conversion.init(opts);
  if(kind!=='a' && conv.discardedTracks.some(d => d.track.type==='video')) throw new Error('no-video');
  if(kind==='a' && !conv.utilizedTracks.some(t => t.type==='audio')) throw new Error('This video has no sound');
  if(!conv.isValid) throw new Error("This video can't be cut on the phone");
  conv.onProgress = p => setBusy(p);
  await conv.execute();
  return {blob:new Blob([target.buffer], {type:output.format.mimeType}), ext:output.format.fileExtension.replace('.', ''), webm};
}
async function cut(kind){
  if(!SRC.file || busy) return; const L = SRC.b - SRC.a, label = kind==='av' ? 'Video + sound' : kind==='v' ? 'Video only' : 'Sound';
  if(kind!=='v' && SRC.audio===false){ toast('This video has no sound'); return; }
  startBusy(label);
  try{
    let r, note = '';
    if(kind==='a'){ r = await convert('a', false); const w = await toWav(r.blob); r = {blob:w, ext:'wav'}; }
    else{ try{ r = await convert(kind, true); }catch(e){ if(e.message!=='no-video' && !/encod|codec|config/i.test(e.message)) throw e;
        r = await convert(kind, false); note = 'starts on the nearest keyframe'; } }
    const thumb = kind==='a' ? '' : await thumbAt(SRC.a + 0.5 / SRC.fps);
    const it = await addItem({kind:kind==='a' ? 'aud' : 'vid', blob:r.blob, ext:r.ext, thumb, w:SRC.w, h:SRC.h, dur:L, sound:kind==='av', label:(kind==='a' ? '🔊 ' : kind==='av' ? '🎬 ' : '🎞 ') + label, sub:fmt(SRC.a) + '–' + fmt(SRC.b)});
    toast(label + ' added to the tray' + (note ? ' (' + note + ')' : ''));
    return it;
  }catch(e){ toast(e.message || String(e), 5000); }
  finally{ endBusy(); }
}
async function thumbAt(t){ const back = V.currentTime; try{ await seek(t); const c = document.createElement('canvas'), s = 220 / Math.max(V.videoWidth, V.videoHeight); c.width = Math.round(V.videoWidth * s); c.height = Math.round(V.videoHeight * s); c.getContext('2d').drawImage(V, 0, 0, c.width, c.height); await seek(back); return c.toDataURL('image/jpeg', 0.75); }catch(e){ return ''; } }
// any sound file the browser can read -> 16-bit WAV at 44.1 kHz (what TIGER expects, and fine everywhere else)
async function toWav(blob){
  const buf = await blob.arrayBuffer(), ctx = new OfflineAudioContext(2, 44100, 44100);
  const ab = await new Promise((ok, no) => { const p = ctx.decodeAudioData(buf, ok, no); if(p && p.then) p.then(ok, no); });
  return wavOf(ab);
}
function wavOf(ab){
  const ch = Math.min(2, ab.numberOfChannels), n = ab.length, sr = ab.sampleRate, out = new DataView(new ArrayBuffer(44 + n * ch * 2));
  const w = (o, s) => { for(let i = 0; i < s.length; i++) out.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); out.setUint32(4, 36 + n * ch * 2, true); w(8, 'WAVE'); w(12, 'fmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, ch, true);
  out.setUint32(24, sr, true); out.setUint32(28, sr * ch * 2, true); out.setUint16(32, ch * 2, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * ch * 2, true);
  const d = []; for(let c = 0; c < ch; c++) d.push(ab.getChannelData(c));
  let o = 44; for(let i = 0; i < n; i++) for(let c = 0; c < ch; c++){ const v = Math.max(-1, Math.min(1, d[c][i])); out.setInt16(o, v < 0 ? v * 0x8000 : v * 0x7fff, true); o += 2; }
  return new Blob([out.buffer], {type:'audio/wav'});
}
let busy = '';
function startBusy(t){ busy = t; $$('#bCut .btn').forEach(b => b.disabled = true); $('#sepBar').hidden = false; setBusy(0); $('#sepNote').textContent = t + '…'; }

const PC = {}; // url -> {online, mel:{node, models}, tiger, helper, checked}
const pcOf = url => PC[url] = PC[url] || {online:false};
async function getJ(url, ms){ const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 6000); try{ const r = await fetch(url, {signal:c.signal}); if(!r.ok) throw new Error(r.status); return await r.json(); }finally{ clearTimeout(t); } }
async function ping(p){
  const q = pcOf(p.url);
  try{ await getJ(p.url + '/system_stats', 4500); q.online = true; }catch(e){ q.online = false; return; }
  if(q.checked && Date.now() - q.checked < 60000) return;
  try{
    const one = async n => { try{ const j = await getJ(p.url + '/object_info/' + n, 8000); return j[n] || null; }catch(e){ return null; } };
    const [ml, ms, mu, mg, la, sa] = await Promise.all(['MelBandRoFormerModelLoader', 'MelBandRoFormerSampler', 'MusicSeparation', 'MergeAudioMW', 'LoadAudio', 'SaveAudio'].map(one));
    const list = ml && ml.input && ml.input.required && ml.input.required.model_name ? ml.input.required.model_name[0] : [];
    q.mel = {node:!!(ml && ms), models:(Array.isArray(list) ? list : []).filter(n => /mel.?band|roformer/i.test(n))};
    q.tiger = {node:!!mu, merge:!!mg}; q.io = !!(la && sa);
    try{ await getJ(p.url + '/renderdeck/jobs', 5000); q.helper = true; }catch(e){ q.helper = false; }
    q.checked = Date.now();
  }catch(e){}
}
async function pingAll(){ await Promise.all(pcs().filter(p => p.on!==false).map(ping)); drawDots(); drawCut(); }
function drawDots(){ $('#pcDots').innerHTML = pcs().filter(p => p.on!==false).map(p => { const q = pcOf(p.url); return `<span><i class="dot ${q.online ? (q.running ? 'busy' : 'on') : ''}"></i>${esc(p.name[0])}</span>`; }).join(''); }
function methodsOf(url){ const q = pcOf(url), m = []; if(!q.online || !q.io) return m;
  if(q.mel && q.mel.node && q.mel.models.length) m.push('mel'); if(q.tiger && q.tiger.node) m.push('tiger'); return m; }
function sepPlan(){ // -> {url, method} or {why}
  const list = pcs().filter(p => p.on!==false && (S.where==='auto' || S.where===p.url)); // Render first: it's listed first, and Main is also the gaming PC
  let fallback = null;
  for(const p of list){ const m = methodsOf(p.url); if(!m.length) continue;
    if(S.method==='auto') return {url:p.url, method:m[0]};
    if(m.includes(S.method)) return {url:p.url, method:S.method};
    fallback = fallback || {url:p.url, method:m[0]}; }
  if(fallback) return fallback;
  if(!list.some(p => pcOf(p.url).online)) return {why:"Can't reach " + (list.length===1 ? list[0].name : 'Render or Main') + '. Is ComfyUI open there, and Tailscale on on the phone?'};
  return {why:'No voice splitter on ' + list.filter(p => pcOf(p.url).online).map(p => p.name).join(' or ') + ' yet: see ⚙ to set one up.'};
}
const METHOD = {mel:'Mel-Band RoFormer', tiger:'TIGER'};
const pcName = url => (pcs().find(p => p.url===url) || {}).name || 'PC';

// ---------- the voice split (on a PC) ----------
async function upload(url, blob, name){
  const fd = new FormData(); fd.append('image', blob, name); fd.append('overwrite', 'true'); fd.append('type', 'input'); fd.append('subfolder', 'refdeck');
  const r = await fetch(url + '/upload/image', {method:'POST', body:fd}); if(!r.ok) throw new Error('upload to ' + pcName(url) + ' failed (' + r.status + ')');
  const j = await r.json(); return (j.subfolder ? j.subfolder + '/' : '') + j.name;
}
function sepGraph(method, audioName, model, tag, merge){
  const g = {}; let n = 0; const add = (c, i) => { const id = String(++n); g[id] = {class_type:c, inputs:i}; return id; };
  const la = add('LoadAudio', {audio:audioName}), out = {}, sv = (k, src) => { out[k] = add('SaveAudio', {audio:src, filename_prefix:'RefDeck/' + tag + '_' + k}); };
  if(method==='mel'){ const ld = add('MelBandRoFormerModelLoader', {model_name:model}), sp = add('MelBandRoFormerSampler', {model:[ld, 0], audio:[la, 0]}); sv('voice', [sp, 0]); sv('background', [sp, 1]); }
  else{ const sp = add('MusicSeparation', {audio:[la, 0]}); sv('voice', [sp, 0]);
    if(merge){ const mg = add('MergeAudioMW', {audio_1:[sp, 1], audio_2:[sp, 2]}); sv('background', [mg, 0]); }
    sv('effects', [sp, 1]); sv('music', [sp, 2]); }
  return {g, out};
}
async function separate(){
  if(!SRC.file || busy) return; if(SRC.audio===false){ toast('This video has no sound'); return; }
  const plan = sepPlan(); if(plan.why){ toast(plan.why, 5000); return; }
  const L = SRC.b - SRC.a; if(L > SEP_MAX){ toast('Pick a clip of ' + Math.round(SEP_MAX / 60) + ' minutes or less first (Start here / End here)', 5000); return; }
  const url = plan.url, who = pcName(url), q = pcOf(url), tag = 'split_' + Date.now().toString(36), t0 = Date.now();
  startBusy('Getting the sound ready');
  try{
    const a = await convert('a', false); const wav = await toWav(a.blob); setBusy(0.05);
    $('#sepNote').textContent = 'Sending it to ' + who + '…';
    const name = await upload(url, wav, tag + '.wav'); setBusy(0.12);
    const G = sepGraph(plan.method, name, q.mel && q.mel.models[0], tag, !!(q.tiger && q.tiger.merge));
    const r = await fetch(url + '/prompt', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:G.g, client_id:'refdeck'})});
    let j = {}; try{ j = await r.json(); }catch(e){}
    if(!r.ok || j.error){ const ne = j.node_errors && Object.values(j.node_errors)[0], er = ne && ne.errors && ne.errors[0];
      throw new Error(er ? ne.class_type + ': ' + (er.details || er.message) : (j.error && (j.error.message || j.error)) || ('ComfyUI said ' + r.status)); }
    const id = j.prompt_id; let h = null;
    while(true){
      await new Promise(ok => setTimeout(ok, 1500));
      const sec = Math.round((Date.now() - t0) / 1000);
      $('#sepNote').textContent = METHOD[plan.method] + ' is splitting it on ' + who + '… ' + sec + ' s'; setBusy(Math.min(0.9, 0.12 + sec / 90));
      try{ const hj = await getJ(url + '/history/' + id, 8000); h = hj[id]; }catch(e){ continue; }
      if(h && h.status && (h.status.completed || h.status.status_str==='error')) break;
      if(Date.now() - t0 > 15 * 60000) throw new Error(who + ' is still busy after 15 minutes: try again later');
    }
    if(h.status.status_str==='error'){ const m = (h.status.messages || []).find(x => x[0]==='execution_error'), d = m && m[1];
      const msg = d ? (d.node_type + ': ' + String(d.exception_message || '').split('\n')[0]) : 'the split failed';
      if(plan.method==='tiger') throw new Error(msg + ' (is the TIGER-DnR model on ' + who + '? See ⚙)');
      throw new Error(msg); }
    const NAMES = {voice:'🎤 Voice', background:'🎵 Background', effects:'💥 Effects', music:'🎼 Music'};
    let got = 0;
    for(const k of Object.keys(G.out)){ const o = h.outputs[G.out[k]], f = o && o.audio && o.audio[0]; if(!f) continue;
      const v = await fetch(url + '/view?' + new URLSearchParams({filename:f.filename, subfolder:f.subfolder || '', type:f.type || 'output'}));
      if(!v.ok) continue; let b = await v.blob(), ext = (f.filename.split('.').pop() || 'flac').toLowerCase();
      try{ b = await toWav(b); ext = 'wav'; }catch(e){}
      await addItem({kind:'aud', blob:b, ext, dur:L, label:NAMES[k], sub:fmt(SRC.a) + '–' + fmt(SRC.b) + ' · ' + who, pick:k==='voice' || k==='background'}, true); got++; }
    if(!got) throw new Error(who + ' finished but sent nothing back');
    setBusy(1); toast('🎤 Voice and background are in the tray');
  }catch(e){ toast(e.message || String(e), 6500); $('#sepNote').textContent = ''; }
  finally{ endBusy(); drawTray(); }
}

  const view = i.kind==='img' ? `<img src="${u}" alt="">` : i.kind==='vid' ? `<video src="${u}" controls playsinline></video>` : `<audio src="${u}" controls></audio>`;
  openSheet(`<h3>${esc(i.label)} <button class="btn" data-close>✕</button></h3>${view}
    <div class="note">${esc(i.sub)}${i.dur ? ' · ' + fmtS(i.dur) : ''}${i.w ? ' · ' + i.w + '×' + i.h : ''} · ${(i.size / 1048576).toFixed(1)} MB · from ${esc(i.src)}</div>
    <div class="row"><button class="btn big" data-save="${id}">⬇ Save</button><button class="btn big ${i.on ? '' : 'pri'}" data-ck="${id}">${i.on ? '✓ Picked for H3 Deck' : 'Pick for H3 Deck'}</button><button class="btn warn" data-drop="${id}">✕ Remove</button></div>`);
}
function fileName(i){ const base = (i.src || 'clip').replace(/\.[^.]+$/, '').replace(/[^\w.-]+/g, '_').slice(0, 40); return base + '_' + i.label.replace(/[^\w]+/g, '_').replace(/^_|_$/g, '').toLowerCase() + '_' + i.id.slice(-4) + '.' + i.ext; }
async function saveItems(list){
  const files = []; for(const i of list){ const b = await blobOf(i.id); if(b) files.push(new File([b], fileName(i), {type:b.type || i.type})); }
  if(!files.length) return;
  try{ if(navigator.canShare && navigator.canShare({files})){ await navigator.share({files}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
  for(const f of files){ const a = document.createElement('a'); a.href = URL.createObjectURL(f); a.download = f.name; document.body.appendChild(a); a.click(); a.remove(); await new Promise(ok => setTimeout(ok, 300)); }
}
// hand the picked pieces to H3 Deck: blobs into its media store, a note of each in its inbox; H3 Deck slots them in when it opens
async function sendToH3(){
  const on = S.items.filter(i => i.on); if(!on.length) return; const g = $('#goBtn'); g.disabled = true; g.textContent = 'Sending…';
  try{
    const ib = inbox();
    for(const i of on){ const b = await blobOf(i.id); if(!b) continue;
      const mid = uid('m'), name = fileName(i), file = new File([b], name, {type:b.type || i.type});
      await HDB.put(mid, file);
      ib.push({id:mid, kind:i.kind, name, type:file.type, size:file.size, w:i.w, h:i.h, thumb:i.thumb, dur:i.dur, sound:i.sound}); }
    localStorage.setItem(INBOX, JSON.stringify(ib));
    S.items.forEach(i => { if(i.on){ i.on = false; i.sent = true; } }); clearTimeout(saveT); try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){}
    location.href = '../#refs';
  }catch(e){ toast("Couldn't hand them over: " + e.message, 5000); drawTray(); }
}

// ---------- sheets ----------
function openSheet(html){ closeSheet(); const d = document.createElement('div'); d.className = 'sheet'; d.id = 'sheet'; d.innerHTML = `<div class="card" id="sheetCard">${html}</div>`;
  d.onclick = e => { if(e.target===d || e.target.closest('[data-close]')) closeSheet(); }; document.body.appendChild(d); }
function closeSheet(){ const s = $('#sheet'); if(s){ s.querySelectorAll('video,audio').forEach(m => m.pause()); s.remove(); } }
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-ck],[data-save],[data-drop],.item,[data-method],[data-where],[data-getmel],[data-copy]'); if(!t) return;
  if(t.dataset.ck){ e.stopPropagation(); const i = S.items.find(x => x.id===t.dataset.ck); if(i){ i.on = !i.on; save(); drawTray(); if($('#sheet')) openItem(i.id); } return; }
  if(t.dataset.save){ const i = S.items.find(x => x.id===t.dataset.save); if(i) saveItems([i]); return; }
  if(t.dataset.drop){ closeSheet(); dropItem(t.dataset.drop); return; }
  if(t.dataset.method){ S.method = t.dataset.method; save(); drawCut(); return; }
  if(t.dataset.where){ S.where = t.dataset.where; save(); drawCut(); settings(); return; }
  if(t.dataset.copy){ try{ await navigator.clipboard.writeText(TIGER_PS); toast('Copied'); }catch(er){ toast('Press and hold the line to copy it'); } return; }
  if(t.dataset.getmel){ getMel(t.dataset.getmel); return; }
  if(t.classList.contains('item') && t.dataset.id) openItem(t.dataset.id);
});
async function getMel(url){
  try{ const r = await fetch(url + '/renderdeck/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:MEL_URL, kind:'diffusion_models'})});
    const j = await r.json(); if(!r.ok || j.error) throw new Error(j.error || r.status);
    toast('Downloading Mel-Band RoFormer (456 MB) on ' + pcName(url) + '. It shows up here when it\'s done.', 5000); pcOf(url).checked = 0;
  }catch(e){ toast("Couldn't start the download: " + e.message, 5000); }
}
function settings(){
  const rows = pcs().filter(p => p.on!==false).map(p => { const q = pcOf(p.url);
    if(!q.online) return `<div class="pcrow"><div class="nm"><i class="dot"></i>${esc(p.name)}</div><div class="why">Not reachable right now (${esc(p.url)}).</div></div>`;
    const mel = q.mel || {}, tg = q.tiger || {};
    return `<div class="pcrow"><div class="nm"><i class="dot on"></i>${esc(p.name)}</div>
      <div class="why"><b>Mel-Band RoFormer</b> (voice / instruments, the best for songs and speech): ${mel.node ? (mel.models.length ? '✓ ready (' + esc(mel.models[0]) + ')' : 'node ✓, model missing') : 'not installed'}.
      ${!mel.node ? ' Install <b>ComfyUI-MelBandRoFormer</b> (by kijai) from the Manager in ComfyUI on ' + esc(p.name) + ', then restart it.' : ''}</div>
      ${mel.node && !mel.models.length ? (q.helper ? `<button class="btn" data-getmel="${esc(p.url)}">⬇ Get the model on ${esc(p.name)} (456 MB)</button>` : `<div class="why">Put MelBandRoformer_fp16.safetensors in models/diffusion_models.</div>`) : ''}
      <div class="why"><b>TIGER</b> (dialog / effects / music): ${tg.node ? 'node ✓. Its model (17 MB) isn\'t something ComfyUI lists, so if a split says it\'s missing, paste this in PowerShell on ' + esc(p.name) + ' once:' : 'not installed (MW Audio Tools).'}</div>
      ${tg.node ? `<div class="code">${esc(TIGER_PS)}</div><button class="btn" data-copy="1">Copy the line</button>` : ''}</div>`; }).join('');
  const where = [['auto', 'Render first']].concat(pcs().filter(p => p.on!==false).map(p => [p.url, 'Only ' + p.name]));
  openSheet(`<h3>⚙ Voice split <button class="btn" data-close>✕</button></h3>
    <div class="chips">${where.map(w => `<button class="chip ${S.where===w[0] ? 'on' : ''}" data-where="${esc(w[0])}">${esc(w[1])}</button>`).join('')}</div>
    ${rows}
    <div class="row" style="flex-wrap:nowrap"><span class="note" style="flex:1">Frames for “📸 across the clip”</span><input type="number" id="grabNIn" value="${S.grabN}" min="2" max="30" inputmode="numeric" style="width:80px"></div>
    <div class="note">The PCs and their addresses come from H3 Deck's ⚙. Cutting and frame grabs never leave the phone.</div>`);
  $('#grabNIn').onchange = e => { S.grabN = Math.max(2, Math.min(30, +e.target.value || 9)); save(); drawCut(); };
}

// ---------- wiring ----------
$$('.block>h3').forEach(h => h.onclick = () => { const b = h.parentElement; b.classList.toggle('shut'); S.open[b.id] = !b.classList.contains('shut'); save(); });
$('#pickBtn').onclick = $('#changeBtn').onclick = () => { $('#filePick').value = ''; $('#filePick').click(); };
$('#filePick').onchange = async e => { const f = e.target.files[0]; if(!f) return; await openVideo(f); keepSource(f); };
V.addEventListener('timeupdate', drawTime); V.addEventListener('seeked', drawTime); V.addEventListener('play', drawTime); V.addEventListener('pause', drawTime);
V.addEventListener('timeupdate', () => { if(!V.paused && !whole() && V.currentTime >= SRC.b){ V.pause(); seek(SRC.a); } });
$('.ctl').onclick = e => { const b = e.target.closest('[data-step]'); if(!b || !SRC.file) return; const s = b.dataset.step, f = frameOf(V.currentTime);
  if(s==='play'){ if(V.paused){ if(!whole() && (V.currentTime >= SRC.b - 0.05 || V.currentTime < SRC.a)) V.currentTime = SRC.a; V.play().catch(() => {}); } else V.pause(); return; }
  V.pause(); if(s==='-1f') toFrame(f - 1); else if(s==='+1f') toFrame(f + 1); else if(s==='-1s') toFrame(f - Math.round(SRC.fps)); else toFrame(f + Math.round(SRC.fps)); };
(() => { const el = $('#scrub'); let drag = false, last = 0;
  const at = e => { const r = el.getBoundingClientRect(); return Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * SRC.dur; };
  const go = (e, fine) => { if(!SRC.dur) return; const t = at(e); V.pause(); if(!fine && V.fastSeek && Date.now() - last < 120) return; last = Date.now();
    if(!fine && V.fastSeek) V.fastSeek(t); else toFrame(frameOf(t)); $('#head').style.left = (t / SRC.dur * 100) + '%'; };
  el.addEventListener('pointerdown', e => { e.preventDefault(); drag = true; el.setPointerCapture(e.pointerId); go(e); });
  el.addEventListener('pointermove', e => { if(drag) go(e); });
  el.addEventListener('pointerup', e => { if(drag){ drag = false; go(e, true); } });
  el.addEventListener('pointercancel', () => { drag = false; });
})();
$('#inBtn').onclick = () => { SRC.a = Math.min(V.currentTime, SRC.dur); if(SRC.b <= SRC.a + 0.05) SRC.b = Math.min(SRC.dur, SRC.a + 5); saveSel(); drawSel(); };
$('#outBtn').onclick = () => { SRC.b = Math.max(V.currentTime, 0.05); if(SRC.a >= SRC.b - 0.05) SRC.a = Math.max(0, SRC.b - 5); saveSel(); drawSel(); };
$('#allBtn').onclick = () => { SRC.a = 0; SRC.b = SRC.dur; saveSel(); drawSel(); };
$('#grabBtn').onclick = () => grabOne().catch(e => toast(e.message));
$('#grab9Btn').onclick = grabSpread;
$('#cutAV').onclick = () => cut('av'); $('#cutV').onclick = () => cut('v'); $('#cutA').onclick = () => cut('a');
$('#sepBtn').onclick = separate;
$('#saveSel').onclick = () => saveItems(S.items.filter(i => i.on));
$('#pickNone').onclick = () => { S.items.forEach(i => i.on = false); save(); drawTray(); };
$('#clearTray').onclick = async () => { if(!confirm('Clear everything in the tray? Anything already sent to H3 Deck stays there.')) return; for(const i of S.items.slice()) await dropItem(i.id); };
$('#goBtn').onclick = sendToH3;
$('#setBtn').onclick = () => { settings(); pingAll().then(() => { if($('#sheet') && $('#grabNIn')) settings(); }); };
window.addEventListener('storage', e => { if(e.key===H3KEY || e.key===INBOX) drawTray(); });
document.addEventListener('visibilitychange', () => { if(!document.hidden){ drawTray(); pingAll(); } });

// ---------- start ----------
Object.keys(S.open).forEach(id => { const b = document.getElementById(id); if(b) b.classList.toggle('shut', !S.open[id]); });
drawVideo(); drawCut(); drawTray(); drawDots();
(async () => { try{ const f = await RDB.get('source'); if(f && !SRC.file) await openVideo(f, true); }catch(e){} })();
pingAll(); setInterval(() => { if(!document.hidden) pingAll(); }, 15000);
window.RD = {S, SRC, PC, sepGraph, sepPlan, toWav, convert, pingAll, methodsOf};
</script>
