<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mail Finder</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Mail Finder">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#962B42"><meta name="color-scheme" content="light only">
<style>
:root{--bg:#f1e1c6;--ink:#2a0f17;--muted:#7a5e57;--line:#e2cfb3;--card:#fffaf0;--accent:#962B42;--orange:#C05133;--paper:#ffffff;--bgdeep:#ead6b8;--good:#1a7f37;--warn:#C05133}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,system-ui,sans-serif;padding:16px 16px calc(24px + env(safe-area-inset-bottom))}
h1{font:700 22px/1 Georgia,"Times New Roman",serif;letter-spacing:.18em;color:var(--accent);margin:4px 0 14px;display:flex;align-items:center;gap:10px}h1 img{width:34px;height:34px;border-radius:8px}
.search{position:sticky;top:0;background:var(--bg);padding-bottom:10px;z-index:1;display:flex;gap:8px}.search input{flex:1;min-width:0}.clear{font-size:18px;padding:0 16px;border:1px solid var(--accent);border-radius:12px;background:var(--paper);color:var(--accent);font-weight:600}.clear[hidden]{display:none}input[type=search]::-webkit-search-cancel-button{-webkit-appearance:none;display:none}
input[type=search]{width:100%;font-size:20px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
.stamp{margin:8px 0 18px;padding:12px;background:radial-gradient(circle at 7px 7px,var(--bg) 5px,var(--paper) 5.5px) -7px -7px/14px 14px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.15))}
.top{padding:20px 18px;background:var(--accent);color:#f6ead4;outline:2px solid #f6ead4;outline-offset:-8px}
.top.reading .name{animation:pulse 1s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.45}to{opacity:1}}
.stamp.land{animation:land .2s ease-out}
@keyframes land{from{opacity:.55}to{opacity:1}}
#hero{position:fixed;left:16px;right:16px;top:calc(50% - 64px);bottom:calc(16px + env(safe-area-inset-bottom));z-index:4;
  display:flex;flex-direction:column;justify-content:flex-start;overflow:auto;background:var(--bg)}
#hero:empty,#hero.off{display:none}
#hero .stamp{margin:0 0 10px}
#viewer.morph video{height:100%;max-height:none;aspect-ratio:auto;border-radius:0}
#viewer.morph #iris,#viewer.morph::before{border-radius:0}
#hero .stamp.pending{opacity:0}
.top .name{font:700 30px/1.15 Georgia,"Times New Roman",serif}
.top .room{font-size:34px;font-weight:800;margin-top:6px;color:#ffd9c7}
.top .why{font-size:14px;margin-top:8px;color:#f6ead4;opacity:.85}
.top .room.staff{color:#f6ead4!important;opacity:.8}
.row{display:flex;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.row .n{font-weight:600}.staff{color:var(--muted)!important}.row .r{color:var(--accent);font-weight:700;text-align:right;white-space:nowrap}
.label{font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:14px 4px 4px}
.read{font-size:13px;color:var(--muted);margin:14px 4px;word-break:break-word}
.none{padding:18px;border-radius:14px;background:var(--card);font-size:20px;font-weight:600}
.setup{padding:18px;border-radius:14px;background:var(--card)}
button,.btn{font:inherit;font-size:17px;padding:12px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;display:inline-block}
.small{font-size:13px;color:var(--muted);margin-top:16px}
.link{background:none;color:var(--muted);padding:0;font-size:13px;text-decoration:underline}
#live{margin:0 0 12px}
video{width:100%;border-radius:16px;background:#000;display:block;aspect-ratio:4/3;object-fit:cover}
.livebar{display:flex;gap:12px;align-items:center;margin:4px 0 12px}
.status{font-size:13px;color:var(--muted)}
.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.fab{background:var(--orange);position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom));z-index:5;padding:18px 26px;font-size:20px;font-weight:700;border-radius:999px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
body{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
.fab{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:none}
#viewer{position:fixed;left:0;right:0;top:0;bottom:0;z-index:6;visibility:hidden;pointer-events:none;
  opacity:0;transform:scale(.96);transition:opacity .15s ease-in,transform .15s ease-in,visibility 0s linear .15s}
#viewer.on{visibility:visible;opacity:1;transform:none;transition:opacity .12s ease-out,transform .12s ease-out,visibility 0s}
#viewer::before{content:"";position:absolute;inset:0;border-radius:0;pointer-events:none;border:4px solid var(--paper);outline:3px solid var(--accent);outline-offset:-1px;z-index:2}
#iris{position:absolute;inset:0;width:100%;height:100%;z-index:1}
#viewer video{width:100%;height:100%;max-height:none;aspect-ratio:auto;border-radius:0;object-fit:cover}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
#viewer video{width:100%;height:100%;object-fit:cover;background:#000;display:block}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
</head>
<body>
<h1><img src="icon-180.png" alt="">MAIL FINDER</h1>
<div id="app"></div>
<script>
"use strict";
const KEY="mailfinder-list-v1";
const IGN_KEY="mailfinder-ignore-v1";
const READER_KEY="mailfinder-reader-v1";
let readerMode="sharp"; try{ readerMode=localStorage.getItem(READER_KEY)||"sharp"; }catch(e){}
const BASE_IGNORE="HOUSEHOLD FAMILY RESIDENT CURRENT OR THE AND MR MRS MS DR JR SR APT UNIT DRIVE CIRCLE";
let IGNORE=/^$/;
function setIgnore(extra){
  const phrases=(BASE_IGNORE.split(" ").concat(String(extra||"").split(","))).map(x=>norm(x)).filter(Boolean)
    .sort((a,b)=>b.length-a.length).map(x=>x.replace(/ /g," +"));
  IGNORE=new RegExp("\\b("+phrases.join("|")+")\\b","g");
}
let people=[]; // {first,last,room}
const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm=s=>String(s||"").toUpperCase().replace(/['’.]/g,"").replace(/[^A-Z]+/g," ").trim();
const toks=s=>String(s||"").toUpperCase().replace(/['’.]/g,"").replace(/[^A-Z0-9]+/g," ").trim().split(" ").filter(Boolean);
const roomNums=room=>(String(room).match(/\d+[A-Z]?/gi)||[]).map(x=>x.toUpperCase()).filter(x=>/\d{2}/.test(x));
const title=s=>s.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());

function loadPeople(json){
  const seen=new Map();
  for(const [key,val] of Object.entries(json)){
    if(key.startsWith("_")) continue;
    for(const line of String(val).split("\n")){
      const i=line.indexOf("|"); if(i<0) continue;
      const first=line.slice(0,i).trim(), room=line.slice(i+1).trim(), id=first+"|"+room;
      const cur=seen.get(id);
      if(!cur) seen.set(id,{first,room,lasts:new Set([key])}); else cur.lasts.add(key);
    }
  }
  people=[];
  for(const p of seen.values()){
    const lasts=[...p.lasts].sort((a,b)=>b.length-a.length);
    // the longest key is the full last name; shorter ones are parts of a double name
    const parts=lasts.length>1?lasts.slice(1):[];
    people.push({first:p.first,room:p.room,last:lasts[0],parts,nums:roomNums(p.room)});
  }
}
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  let prev=Array.from({length:b.length+1},(_,i)=>i);
  for(let i=1;i<=a.length;i++){
    const cur=[i]; let best=i;
    for(let j=1;j<=b.length;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best) best=cur[j];
    }
    if(best>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
// how well one name matches one word: 1 exact, 0.8 one letter off, 0.6 two off (long names), 0
function wordScore(name,word,loose){
  if(!name||!word) return 0;
  if(name===word) return 1;
  if(name.length<4||word.length<3) return 0;
  const d=lev(name,word,loose?3:2);
  if(d===1) return .8;
  if(d===2&&name.length>=7) return .6;
  if(!loose) return 0;
  // looser, only used for the scroll-through list when nothing clearly matches
  if(d===2&&name.length>=5) return .5;
  if(d===3&&name.length>=8) return .4;
  if(word.length>=4&&(name.includes(word)||(name.length>=4&&word.includes(name)))) return .45;
  if(word.length>=4&&name.slice(0,4)===word.slice(0,4)) return .4;
  return 0;
}
function scoreText(words,nums,loose){
  nums=(nums||[]).filter(n=>!/^\d{5}$/.test(n)&&/\d{2}/.test(n)); // skip zip codes
  const numMatch=p=>p.nums.some(r=>nums.some(n=>n===r||n.replace(/\D/g,"")===r.replace(/\D/g,"")));
  const out=[];
  for(const p of people){
    let bestLast=0,lastAt=-1;
    const lastNames=[p.last,...p.parts];
    words.forEach((w,i)=>{ for(const L of lastNames){ const s=wordScore(L,w,loose)*(L===p.last?1:.85); if(s>bestLast){bestLast=s;lastAt=i;} } });
    // joined double name split by the reader, e.g. "NOT REAL" for NOTREAL
    for(let i=0;i+1<words.length;i++){ const s=wordScore(p.last,words[i]+words[i+1],loose); if(s>bestLast){bestLast=s;lastAt=i;} }
    const room=numMatch(p);
    if(bestLast===0&&!room) continue;
    let bestFirst=0,firstAt=-1;
    words.forEach((w,i)=>{ const s=wordScore(p.first,w,loose)||(w.length===1&&w===p.first[0]?.35:0); if(s>bestFirst){bestFirst=s;firstAt=i;} });
    let score=bestLast*3+bestFirst*(bestLast?2:1);
    if(bestLast&&firstAt>=0&&lastAt>=0&&Math.abs(firstAt-lastAt)<=3) score+=1; // near each other, like on an address label
    if(room) score+=bestLast?1.5:2;
    out.push({p,score,firstFound:bestFirst>=.8,lastFound:bestLast>0,room});
  }
  return out.sort((a,b)=>b.score-a.score||a.p.last.localeCompare(b.p.last));
}
function searchTyped(q){
  const words=toks(q); if(!words.length) return [];
  const out=[];
  for(const p of people){
    const hay=[p.first,p.last,...p.parts,toks(p.room).join(" ")];
    let total=0,ok=true;
    for(const w of words){
      let best=0;
      for(const h of hay){ for(const part of h.split(" ")){ if(part.startsWith(w)||(/\d/.test(w)&&part.replace(/\D/g,"")===w.replace(/\D/g,""))) best=Math.max(best,1.2); else if(!/\d/.test(w)) best=Math.max(best,wordScore(part,w)); } }
      if(!best){ok=false;break;} total+=best;
    }
    if(ok) out.push({p,score:total});
  }
  return out.sort((a,b)=>b.score-a.score||a.p.last.localeCompare(b.p.last)).slice(0,30);
}
const nameOf=p=>title(p.first)+" "+title(p.last);
const isStaff=p=>/^staff\b/i.test(p.room);
function rows(list){ return list.map(r=>`<div class="row"><span class="n">${esc(nameOf(r.p))}</span><span class="r${isStaff(r.p)?" staff":""}">${esc(r.p.room)}</span></div>`).join(""); }
function topCard(t){ return `<div class="stamp"><div class="top"${isStaff(t.p)?' style="background:#6b5a55"':""}><div class="name">${esc(nameOf(t.p))}</div><div class="room${isStaff(t.p)?" staff":""}">${esc(t.p.room)}</div>${t.firstFound&&t.lastFound?"":`<div class="why">${t.lastFound?"Last name match only. Check the first name.":"Room number match only. Check the name."}</div>`}</div></div>`; }

function scoreRead(read,loose){
  const all=toks(" "+read.toUpperCase().replace(/['’.]/g,"").replace(/[^A-Z0-9]+/g," ")+" ").join(" ").replace(IGNORE," ").split(" ").filter(Boolean);
  return scoreText(all.filter(w=>/^[A-Z]+$/.test(w)),all.filter(w=>/\d/.test(w)),loose);
}
function render(readText){
  if(!people.length){
    app.innerHTML=`<div class="setup"><p><b>Load your list first.</b></p><p>Pick <b>Mail List.json</b> (On My iPhone → Mail). It stays on this phone only.</p>
      <label class="btn">Choose Mail List.json<input id="f" type="file" accept=".json,application/json" hidden></label></div>`;
    document.getElementById("f").onchange=onFile; return;
  }
  const read=readText==null?"":readText;
  const res=read?scoreRead(read):[];
  const strong=res.filter(r=>r.score>=3.4);
  let html=`<div class="status" id="st" style="margin:0 4px 8px">Press and hold anywhere to aim, let go to read.</div><div class="search"><input id="q" type="search" placeholder="Search a name or room" autocomplete="off" autocorrect="off" spellcheck="false"><button class="clear" id="clr" hidden>Clear</button></div><div id="out"></div><div id="hero">`;
  if(read){
    if(strong.length){
      const t=strong[0];
      html+=topCard(t);
      const more=res.slice(1,6).filter(r=>r.score>=2.4);
      if(more.length) html+=`<div class="label">Also close</div>`+rows(more);
    } else {
      // nothing clear: a longer, looser list is quicker to scroll than typing
      const loose=scoreRead(read,true), seen=new Set(), list=[];
      for(const r of res.concat(loose)){ const k=r.p.first+"|"+r.p.room; if(!seen.has(k)){ seen.add(k); list.push(r); } }
      list.sort((a,b)=>b.score-a.score);
      html+=list.length?`<div class="label">Possible matches</div>`+rows(list.slice(0,25)):`<div class="none">No one found. Try searching above.</div>`;
    }
    html+=`<div class="read">It read: ${esc(read.replace(/\s+/g," ").slice(0,300))}</div>`;
  }
  html+=`</div><p class="small">${people.filter(p=>!isStaff(p)).length} residents${people.some(isStaff)?` and ${people.filter(isStaff).length} staff`:""} loaded on this phone. <button class="link" id="reload">Load a new list</button> · <button class="link" id="ign">Address words to skip</button> · <button class="link" id="rdr">Reader: ${readerMode==="sharp"?"Sharper":"Standard"}</button></p>`;
  app.innerHTML=html;
  const q=document.getElementById("q"), out=document.getElementById("out"), hero=document.getElementById("hero");
  hero.innerHTML=hero.innerHTML.trim();
  q.oninput=()=>{ const on=!!q.value.trim();
    // a whole address pasted or scanned in (iPhone "Scan Text"): match it like a photo instead of a typed name
    const r=toks(q.value).length>=3?scoreRead(q.value,true).filter(x=>x.score>=2).slice(0,15):searchTyped(q.value); out.innerHTML=on?(r.length?rows(r):`<div class="none">No one by that name.</div>`):""; hero.classList.toggle("off",on); };
  document.getElementById("rdr").onclick=()=>{ readerMode=readerMode==="sharp"?"standard":"sharp"; try{localStorage.setItem(READER_KEY,readerMode);}catch(e){} sharpFailed=false; render(readFromHash()); };
  const clr=document.getElementById("clr");
  q.addEventListener("input",()=>{ clr.hidden=!q.value; });
  clr.onclick=()=>{ q.value=""; clr.hidden=true; out.innerHTML=""; hero.classList.remove("off"); q.blur(); };

  document.getElementById("ign").onclick=()=>{ let cur=""; try{cur=localStorage.getItem(IGN_KEY)||"";}catch(e){}
    const v=prompt("Words on every envelope that aren't names (street, town), separated by commas:",cur);
    if(v!==null){ try{localStorage.setItem(IGN_KEY,v);}catch(e){} setIgnore(v); render(readFromHash()); } };
  document.getElementById("reload").onclick=()=>{ people=[]; try{localStorage.removeItem(KEY);}catch(e){} render(); };
}
function onFile(e){
  const f=e.target.files[0]; if(!f) return;
  f.text().then(t=>{ const j=JSON.parse(t); loadPeople(j); try{localStorage.setItem(KEY,t);}catch(err){} render(readFromHash()); })
   .catch(()=>alert("That file didn't open. Pick Mail List.json from Helper."));
}
function readFromHash(){
  const h=location.hash.slice(1); if(!h) return null;
  const m=h.match(/(?:^|&)t=([^&]*)/); if(!m) return null;
  try{ return decodeURIComponent(m[1].replace(/\+/g," ")); }catch(e){ return m[1]; }
}

let worker=null, busy=false;
async function getWorker(){
  if(worker) return worker;
  setStatus("Loading the text reader (first time needs internet)…");
  worker=await Tesseract.createWorker("eng",1);
  await worker.setParameters({tessedit_pageseg_mode:"11"});
  return worker;
}
// "Sharper" = PaddleOCR models (paddle.js); falls back to the standard reader if it can't load
let sharpFailed=false;
async function getReader(){
  if(readerMode==="sharp"&&!sharpFailed){
    try{
      if(!window.PaddleReader){ await new Promise((res,rej)=>{ const s=document.createElement("script"); s.src="paddle.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
      if(!PaddleReader.ready()){ const was=document.getElementById("st")?.textContent; setStatus("Loading the sharper reader (first time downloads about 10 MB)…"); await PaddleReader.load("models/"); setStatus(was||""); }
      return cv=>PaddleReader.read(cv);
    }catch(e){ sharpFailed=true; setStatus("The sharper reader didn't load, using the standard one."); }
  }
  const w=await getWorker();
  return async cv=>(await w.recognize(cv)).data.text||"";
}
function setStatus(t){ const e=document.getElementById("st"); if(e) e.textContent=t; }
let camOn=false, stream=null, starting=null, holding=false, idleT=null, liveAt=0;
const video=document.createElement("video"); video.setAttribute("playsinline",""); video.muted=true; video.autoplay=true;
const viewer=document.createElement("div"); viewer.id="viewer"; viewer.appendChild(video); document.body.appendChild(viewer);
// camera-lens iris: 8 blades pivot on an outer ring; closed they meet in the middle
const BLADES=8, PIV=150, OPEN=-62;
viewer.insertAdjacentHTML("beforeend",`<svg id="iris" viewBox="-100 -100 200 200" preserveAspectRatio="xMidYMid slice">${
  Array.from({length:BLADES},(_,i)=>`<g transform="rotate(${i*360/BLADES})"><g class="blade" transform="translate(${PIV} 0)"><path d="M30 0H${-PIV-120}V260H30Z" fill="${i%2?"#962B42":"#7f2338"}" stroke="#f1e1c6" stroke-width="1.6"/></g></g>`).join("")
}</svg>`);
const blades=[...viewer.querySelectorAll(".blade")], irisSvg=viewer.querySelector("#iris");
let irisAnim=0, irisAt=0; // 0 closed, 1 open
function setIris(t){ irisAt=t; const a=OPEN*t; blades.forEach(g=>g.setAttribute("transform",`translate(${PIV} 0) rotate(${a})`)); irisSvg.style.visibility=t>=1?"hidden":"visible"; }
function iris(to,ms){
  cancelAnimationFrame(irisAnim);
  if(matchMedia("(prefers-reduced-motion: reduce)").matches) ms=1;
  const from=irisAt, t0=performance.now();
  return new Promise(res=>{ const step=now=>{ const k=Math.min(1,(now-t0)/ms), e=to>from?1-Math.pow(1-k,3):k*k*k;
    setIris(from+(to-from)*e); if(k<1) irisAnim=requestAnimationFrame(step); else res(); }; irisAnim=requestAnimationFrame(step); });
}
setIris(0);
function startCam(){
  if(camOn) return Promise.resolve(true);
  if(starting) return starting;
  starting=navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:3840},height:{ideal:2160}},audio:false})
    .then(async st=>{ stream=st; video.srcObject=st; camOn=true; await video.play().catch(()=>{}); liveAt=Date.now(); getReader().catch(()=>{}); return true; })
    .catch(()=>{ alert("The camera didn't start. Allow camera access for this page."); return false; })
    .finally(()=>{ starting=null; });
  return starting;
}
function stopCam(){ if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; } camOn=false; video.srcObject=null; hideViewer(); }
function hideViewer(){ viewer.classList.remove("on"); }
// camera stays warm (hidden) for a bit so the next press is quick
function idleStop(){ clearTimeout(idleT); idleT=setTimeout(stopCam,120000); }
document.addEventListener("visibilitychange",()=>{ if(document.hidden) stopCam(); });
const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function press(e){
  if(e) e.preventDefault(); if(busy||holding) return;
  holding=true; clearTimeout(idleT);
  const btn=document.getElementById("cam"); if(btn) btn.textContent="Let go to read";
  const wasOn=camOn;
  setIris(0); viewer.classList.add("on"); iris(1,340);
  startSampling();
  if(wasOn){ video.play().catch(()=>{}); liveAt=Date.now(); return; }
  const ok=await startCam();
  if(!ok){ holding=false; hideViewer(); if(btn) btn.textContent="Read envelope"; return; }
  if(!holding){ // let go while the camera was starting (or asking permission): don't snap blind
    hideViewer(); idleStop(); setStatus("Camera ready. Hold Read envelope to aim, let go to read.");
  }
}
function cancelHold(){ if(!holding) return; holding=false; stopSampling(); iris(0,160).then(hideViewer); idleStop(); const b=document.getElementById("cam"); if(b) b.textContent="Read envelope"; }
async function release(e){
  if(!holding) return; holding=false;
  if(!camOn){ return; } // still starting; press() handles it
  const t0=Date.now();
  while(!video.videoWidth&&Date.now()-t0<3000) await wait(50);
  const settle=600-(Date.now()-liveAt); if(settle>0) await wait(settle); // give it a moment to focus
  if(!video.videoWidth){ hideViewer(); idleStop(); return; }
  stopSampling(); frames.push(grab());
  const shots=frames.filter(Boolean).sort((x,y)=>y.sharp-x.sharp); frames=[];
  busy=true; const btn=document.getElementById("cam"); if(btn) btn.textContent="Reading…"; setStatus("Reading…");
  await closeIntoStamp(); idleStop();
  try{
    const rd=await getReader();
    let text=await rd(shots[0].cv);
    // no clear match: read the next sharpest frame too and use both readings
    if(shots[1]&&!scoreRead(text).some(r=>r.score>=3.4)){ setStatus("Taking a second look…"); text+="\n"+(await rd(shots[1].cv)); }
    busy=false;
    history.replaceState(null,"","#t="+encodeURIComponent(text.slice(0,1500)));
    render(text||" "); const st=document.querySelector("#hero .stamp"); if(st) st.classList.add("land");
  }catch(err){ busy=false; render(readFromHash()); setStatus("That didn't work. The first time needs internet, then try again."); }
}
// lens closes while shrinking and fading into a blank stamp that waits for the name
// press and hold anywhere (not the search box or links) opens the camera; the button opens it right away
const HOLD_MS=180;
let holdT=null, downAt=null;
function holdTarget(t){ return !(t.closest("input,label,a,.link,.clear,.setup")) && people.length>0; }
document.addEventListener("pointerdown",e=>{
  if(!e.isPrimary||busy||holding) return;
  if(e.target.closest("#cam")){ press(e); return; }
  if(!holdTarget(e.target)) return;
  downAt={x:e.clientX,y:e.clientY};
  clearTimeout(holdT); holdT=setTimeout(()=>{ holdT=null; const a=document.activeElement; if(a&&a.blur) a.blur(); press(null); },HOLD_MS);
},{passive:false});
document.addEventListener("pointermove",e=>{ if(holdT&&downAt&&Math.hypot(e.clientX-downAt.x,e.clientY-downAt.y)>12){ clearTimeout(holdT); holdT=null; } });
document.addEventListener("pointerup",e=>{ if(holdT){ clearTimeout(holdT); holdT=null; return; } if(holding) release(e); });
document.addEventListener("pointercancel",()=>{ if(holdT){ clearTimeout(holdT); holdT=null; } if(holding) cancelHold(); });
document.addEventListener("touchmove",e=>{ if(holding) e.preventDefault(); },{passive:false}); // no scrolling while aiming
document.addEventListener("contextmenu",e=>{ if(!e.target.closest("input")) e.preventDefault(); });
// lens shuts down into the exact shape of the stamp, then the stamp fades in where it landed
async function closeIntoStamp(){
  const q=document.getElementById("q"); if(q){ q.value=""; const c=document.getElementById("clr"); if(c) c.hidden=true; }
  const out=document.getElementById("out"); if(out) out.innerHTML="";
  const hero=document.getElementById("hero");
  if(hero){ hero.classList.remove("off"); hero.innerHTML=`<div class="stamp pending"><div class="top reading"><div class="name">Reading…</div><div class="room">&nbsp;</div></div></div>`; }
  const stamp=hero&&hero.querySelector(".stamp"), box=stamp&&stamp.querySelector(".top");
  const vr=viewer.getBoundingClientRect(), r=box?box.getBoundingClientRect():{left:vr.left+vr.width*.2,top:vr.top+vr.height*.4,width:vr.width*.6,height:vr.height*.2};
  const px=v=>v+"px";
  viewer.classList.add("morph");
  Object.assign(viewer.style,{left:px(vr.left),top:px(vr.top),width:px(vr.width),height:px(vr.height),right:"auto",bottom:"auto"});
  const shut=viewer.animate([
    {left:px(vr.left),top:px(vr.top),width:px(vr.width),height:px(vr.height)},
    {left:px(r.left),top:px(r.top),width:px(r.width),height:px(r.height)}
  ],{duration:280,easing:"cubic-bezier(.5,0,.2,1)",fill:"forwards"});
  await Promise.all([iris(0,240),shut.finished.catch(()=>{})]);
  // hand off: stamp fades in over the closed lens
  if(stamp){ stamp.style.transition="opacity .18s ease-out"; stamp.style.position="relative"; stamp.style.zIndex="7"; }
  if(hero){ hero.style.zIndex="7"; hero.style.background="transparent"; }
  requestAnimationFrame(()=>{ if(stamp) stamp.classList.remove("pending"); });
  await wait(200);
  viewer.classList.remove("on"); viewer.style.transition="none";
  await new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r))); // let the screen paint before reading starts
  shut.cancel(); viewer.classList.remove("morph");
  ["left","top","width","height","right","bottom","transition"].forEach(k=>viewer.style[k]="");
  if(hero){ hero.style.zIndex=""; hero.style.background=""; }
}
// while the button is held, keep the last few frames; on release the sharpest one is read
let frames=[], sampler=null;
function startSampling(){ stopSampling(); frames=[]; sampler=setInterval(()=>{ if(!camOn||Date.now()-liveAt<450) return; const f=grab(); if(f){ frames.push(f); if(frames.length>3) frames.shift(); } },150); }
function stopSampling(){ clearInterval(sampler); sampler=null; }
function grab(){
  if(!video.videoWidth) return null;
  const sc=Math.min(1,2000/Math.max(video.videoWidth,video.videoHeight)), cv=document.createElement("canvas");
  cv.width=Math.round(video.videoWidth*sc); cv.height=Math.round(video.videoHeight*sc);
  const cx=cv.getContext("2d"); cx.filter="grayscale(1) contrast(1.3)"; cx.drawImage(video,0,0,cv.width,cv.height);
  return {cv,sharp:sharpness(cv)};
}
const sharpCv=document.createElement("canvas");
function sharpness(cv){ // edge strength in the middle of the frame: blurry frames score low
  const W=240,H=Math.round(W*cv.height/cv.width*.6); sharpCv.width=W; sharpCv.height=H;
  const c=sharpCv.getContext("2d",{willReadFrequently:true}); c.drawImage(cv,cv.width*.2,cv.height*.2,cv.width*.6,cv.height*.6,0,0,W,H);
  const d=c.getImageData(0,0,W,H).data; let sum=0;
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const i=(y*W+x)*4, l=4*d[i]-d[i-4]-d[i+4]-d[i-W*4]-d[i+W*4]; sum+=l*l; }
  return sum/(W*H);
}
(function(){ let extra=""; try{ extra=localStorage.getItem(IGN_KEY)||""; }catch(e){}
  const m=location.hash.match(/(?:^|&)ig=([^&]*)/);
  if(m){ try{ extra=decodeURIComponent(m[1]); localStorage.setItem(IGN_KEY,extra); }catch(e){} history.replaceState(null,"",location.pathname); }
  setIgnore(extra); })();
try{ const s=localStorage.getItem(KEY); if(s) loadPeople(JSON.parse(s)); }catch(e){}
render(readFromHash());
window.addEventListener("hashchange",()=>render(readFromHash()));
</script>
