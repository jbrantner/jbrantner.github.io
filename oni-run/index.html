<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: one phone-width column; each screen (home, map, fight, reward, save) swaps into the same frame. Single dark lantern-night look by choice. */
:root{
  --night:#1b1830; --night2:#25213f; --mist:#3a3560; --paper:#efe6d6; --dim:#b3aacb; --ink:#241f38;
  --red:#e8644a; --blue:#5aa7e0; --green:#7cc47a; --gold:#e9b949; --purple:#b583e8; --teal:#4fd1c5; --rage:#d24a6b; --heart:#ff9fb0; --fat:#f0a35e;
  --display:"Shippori Mincho B1","Hiragino Mincho ProN",Georgia,serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
body{background:var(--night);color:var(--paper);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:640px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
h1{font-size:30px}h2{font-size:20px}h3{font-size:16px}
p{margin:0}
.muted{color:var(--dim)}
.small{font-size:13px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.panel{background:var(--night2);border:1px solid var(--mist);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{height:10px;border-radius:5px;background:var(--mist);overflow:hidden}
.bar>i{display:block;height:100%;transition:width .3s}
.num{font-variant-numeric:tabular-nums}
.btn{background:var(--gold);color:var(--ink);border:none;border-radius:999px;padding:9px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--paper);border:1px solid var(--mist)}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.char{background:none;color:var(--paper);font:inherit;text-align:left;border:1px solid var(--mist);border-left:5px solid var(--c);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:1px;cursor:pointer}
.char[aria-pressed="true"]{background:#34305c;border-color:var(--gold);border-left-color:var(--c)}
.char.locked{opacity:.35;cursor:default}
.stars{color:var(--gold);font-size:12px;letter-spacing:1px}
.hand{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:8px}
.card{text-align:left;background:var(--paper);color:var(--ink);border:none;border-radius:10px;padding:7px 9px 9px;font:inherit;cursor:pointer;display:flex;flex-direction:column;gap:3px;border-top:6px solid var(--c);transition:transform .15s;min-height:96px}
.card:hover:not(:disabled){transform:translateY(-3px)}
.card:disabled{opacity:.4;cursor:not-allowed}
.card.sel{outline:3px solid var(--gold)}
.card .t{display:flex;justify-content:space-between;gap:6px;font-weight:700;font-size:14px;line-height:1.2}
.cost.tw{background:#b5791b}
.cost{background:var(--ink);color:var(--paper);border-radius:999px;font-size:12px;padding:0 7px;flex:none;align-self:flex-start}
.card .o{font-size:11px;color:#6b6385;text-transform:uppercase;letter-spacing:.06em}
.card .d{font-size:12.5px;line-height:1.3}
.ic{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:19px;font-weight:700;line-height:1.2;font-variant-numeric:tabular-nums}
.ic .tw{color:#b5791b;text-decoration:underline;text-decoration-thickness:2px}
.card.hint{box-shadow:0 0 0 3px var(--gold),0 0 16px rgba(233,185,73,.6)}
.twb{position:absolute;top:-8px;right:-6px;background:var(--gold);color:var(--ink);border-radius:999px;font-size:11px;font-weight:700;padding:0 6px}
.card{position:relative}
.bf{position:relative;aspect-ratio:16/11;max-width:100%;border-radius:14px;overflow:hidden;background:radial-gradient(120% 90% at 70% 30%,#3a2350 0%,#1b1830 60%),#1b1830;border:1px solid var(--mist)}
.bf::after{content:"";position:absolute;left:0;right:0;bottom:0;height:26%;background:linear-gradient(#2a2340,#15122a);border-top:1px solid #4a3f72}
.bftop{position:absolute;top:8px;left:10px;right:10px;display:flex;justify-content:space-between;align-items:center;z-index:2}
.btn.tiny{padding:3px 10px;font-size:12px}
.allies{position:absolute;inset:0;z-index:1}
.ally{position:absolute;left:calc(6% + var(--i)*13%);bottom:calc(10% + (2 - var(--i))*9%);width:19%;display:flex;flex-direction:column;align-items:center;gap:2px}
.ally canvas{width:100%;image-rendering:pixelated;filter:drop-shadow(0 3px 0 rgba(0,0,0,.4))}
.ally.passing canvas{filter:drop-shadow(0 0 6px var(--c)) drop-shadow(0 0 2px var(--c))}
.ally.ex canvas{filter:grayscale(.7) brightness(.8)}
.atag{white-space:nowrap;font-size:10.5px;font-weight:700;color:var(--c);text-shadow:0 1px 0 #000}
.extag{font-size:10px;color:var(--fat);font-weight:700}
.sbar{height:5px;width:90%}.sbar>i{background:var(--purple)}
.hpbar{height:12px}.hpbar>i{background:linear-gradient(90deg,#ff7d93,#ff9fb0)}
.enemy{position:absolute;right:5%;top:12%;width:40%;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.ecv{width:78%;image-rendering:pixelated;filter:drop-shadow(0 4px 0 rgba(0,0,0,.4))}
.intentb{display:flex;align-items:center;gap:5px;background:#3b1f33;border:1px solid var(--rage);border-radius:999px;padding:1px 9px;font-size:15px;color:#ffd2dc}
.wdot{width:11px;height:11px;border-radius:50%;border:1px solid #fff8}
.ename{font-family:var(--display);font-weight:700;font-size:14px;text-align:center;line-height:1.1}
.ehp{width:100%;height:9px}.ehp>i{background:var(--rage)}
.enum{font-size:11px;color:var(--dim)}
.brk i{width:9px;height:9px}
.marks{font-size:12px;font-weight:700;color:var(--purple);background:#2a1f40;border:1px solid var(--purple);border-radius:999px;padding:0 8px}
.teamhp{display:flex;align-items:center;gap:8px}
.shield{background:#2f2a52;border:1px solid var(--mist);border-radius:999px;padding:1px 9px;font-weight:700;font-size:14px}
.passline{margin:0;color:var(--dim)}
.dock{background:var(--night2);border:1px solid var(--mist);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:10px}
.hand.fan{display:flex;gap:0;overflow-x:auto;padding:14px 8px 6px;scroll-snap-type:x proximity}
.hand.fan .zc{flex:none;margin-right:8px;scroll-snap-align:start}
.hand.fan .zc:hover:not(:disabled){transform:translateY(-10px);z-index:3}
.dockrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.aporb{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9b949 45%,#a8761a);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;box-shadow:0 0 14px rgba(233,185,73,.4)}
.aporb b{font-size:22px}.aporb span{font-size:10px;font-weight:700}
.endt{width:62px;height:62px;border-radius:50%;border:none;background:radial-gradient(circle at 35% 30%,#9fd2ff,#3d86d6 60%,#245a9a);color:#fff;font-size:24px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.endt span{font-size:9px;font-weight:700;margin-top:2px}
.zc{width:108px;min-height:158px;padding:0;gap:0;border:2px solid var(--c);border-top-width:2px;border-radius:9px;background:#f4ecdc;overflow:visible;box-shadow:0 4px 10px rgba(0,0,0,.35)}
.zc.atk{background:linear-gradient(#f6dcd3,#f4ecdc 45%)}.zc.skl{background:linear-gradient(#d7e7f6,#f4ecdc 45%)}.zc.status{background:linear-gradient(#f3e0c8,#f4ecdc 45%)}
.zc.big{width:140px;min-height:200px}
.zcost{position:absolute;top:-6px;left:-4px;width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,#e9b949 50%,#a8761a);color:var(--ink);font-weight:800;display:flex;align-items:center;justify-content:center;font-size:15px;z-index:2;box-shadow:0 1px 3px #0008}
.zcost.tw{background:radial-gradient(circle at 35% 30%,#d9fff0,#4fd1c5 55%,#1f7f77)}
.zart{display:flex;justify-content:center;align-items:flex-end;height:62px;background:var(--c);border-radius:7px 7px 0 0;overflow:hidden}
.zc.big .zart{height:84px}
.zart canvas{height:100%;image-rendering:pixelated}
.zname{font-weight:800;font-size:13.5px;padding:4px 7px 0;line-height:1.15}
.ztype{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#6b6385;padding:0 7px}
.zc.atk .ztype{color:#b2432c}.zc.skl .ztype{color:#2a6fb0}
.ztext{font-size:12.5px;line-height:1.3;padding:3px 7px 7px}
.ztext.boosted{color:#8a5a00;font-weight:700}
.zweak{font-size:11px;font-weight:800;color:#fff;background:#2a6fb0;margin:0 7px 7px;border-radius:4px;padding:0 5px;align-self:flex-start}
.twb.q{background:var(--paper);border:1px solid var(--gold)}
.twb{z-index:2}
.mapscroll{max-height:62vh;overflow:auto}
.mnode{cursor:pointer}.mnode:focus{outline:none}.mnode:focus circle{stroke-width:5}
.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25}}
.allystrip .team .mem{display:flex;flex-direction:row;gap:6px;align-items:center}
.mem canvas.pt{width:34px;image-rendering:pixelated;flex:none}
.bigrow{display:flex;flex-wrap:wrap;gap:14px 12px;justify-content:center;padding-top:8px}
.arrow{align-self:center;font-size:22px;color:var(--gold)}
.hand:not(.fan):not(.bigrow){grid-template-columns:repeat(auto-fill,minmax(108px,1fr));justify-items:center;padding-top:8px;row-gap:14px}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--dim)}
.card.tired{background:#e9dccb;border-top-color:var(--fat)}
.weakhit{color:#2a6fb0;font-weight:700}
.foe{display:grid;grid-template-columns:88px 1fr;gap:12px;align-items:center}
canvas.art{width:88px;height:88px;image-rendering:pixelated;background:#211d38;border-radius:10px}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 10px;font-size:13px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.intent{color:#ffc4d1;background:#3b1f33}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips i{width:10px;height:10px;border-radius:2px;border:1px solid currentColor;display:inline-block}
.pips i.on{background:currentColor}
.team{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mem{border:1px solid var(--mist);border-top:4px solid var(--c);border-radius:10px;padding:6px 8px;font-size:13px;display:flex;flex-direction:column;gap:3px;min-width:0}
.mem.ex{border-color:var(--fat)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.node{background:#2f2a52;color:var(--paper);border:1px solid var(--mist);border-radius:12px;padding:14px;font:inherit;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px}
.node b{font-family:var(--display);font-size:18px}
.node:hover{border-color:var(--gold)}
.trail{display:flex;gap:4px}
.trail i{flex:1;height:6px;border-radius:3px;background:var(--mist)}
.trail i.on{background:var(--gold)}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--dim);max-height:160px;overflow:auto}
.overlay{position:fixed;inset:0;background:rgba(15,12,30,.85);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:20;overflow:auto}
.overlay .panel{max-width:520px;width:100%}
.pulls{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px}
.pullc{border:1px solid var(--mist);border-top:4px solid var(--c);border-radius:10px;padding:6px 8px;font-size:13px;animation:pop .35s both}
.pullc.s5{box-shadow:0 0 0 2px var(--gold),0 0 18px rgba(233,185,73,.5)}
@keyframes pop{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
label.chk{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid var(--mist)}
input[type=range]{width:100%;accent-color:var(--gold)}
input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px;margin-top:2px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>// Oni Run engine (working title). Chaos Zero Nightmare-style roguelike deck builder, our own cards.
// Team of 3 shares one deck and one heart. Map of choices to a boss. Epiphany = a card mutates into a variant you pick.
// Fatigue ("stress" in code) fills when you get hit; at 10 a member is Exhausted and their cards become Catch Breath until they recover. Nothing is ever lost.
// Save Data: at run end, keep up to your cap of new cards/epiphanies per character. Pulls cost Wishing Stones, never money.
(function(root){
const T={heatMax:6,markBonus:4,foeHp:1.4,foeHit:1.2,team:2,ap:3,hand:5,steps:7,stressMax:10,calmAt:5,baseCap:2,dupeMax:5,pity5:30,pity4:10,rate5:0.04,rate4:0.2,
  winStones:5,loseStones:2,eliteStones:1,saveStones:3,dayStones:1};

const FOES={
  wisp:{n:'Kodama Wisp',hp:22,weak:'purple',brk:2,moves:[{t:'Bump',hit:5},{t:'Flutter',hit:3,times:2}]},
  kappa:{n:'Kappa',hp:30,weak:'red',brk:3,moves:[{t:'Splash',hit:7},{t:'Double slap',hit:4,times:2},{t:'Shell up',roar:2}]},
  imp:{n:'Ember Imp',hp:26,weak:'gold',brk:2,moves:[{t:'Spark',hit:8},{t:'Cinders',hit:3,times:3}]},

  ember:{n:'Ember Oni',hp:170,weak:'purple',brk:5,boss:1,moves:[{t:'Swipe',hit:12},{t:'Flurry',hit:6,times:3},{t:'Roar',roar:3},{t:'Ember slam',hit:22}]}
};

  shrine:{n:'Quiet Shrine',d:'One card of your choice has an Epiphany.'},
  stone:{n:'Glinting Stone',d:'You find a Wishing Stone.'},
  spring:{n:'Hot Spring',d:'Everyone heals 10 and loses 4 fatigue.'}
};
function rng(S){let s=S.seed>>>0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;S.seed=s>>>0;return((t^t>>>14)>>>0)/4294967296}
function pickR(S,a){return a[Math.floor(rng(S)*a.length)]}
function shuffle(S,a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(rng(S)*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
let UID=1;
function inst(k,o,m){return {u:UID++,k,o,m:m||null,ep:!!m,nw:false}}
// card stats with epiphany mods
function stat(ci){const b=CARDS[ci.k],r=Object.assign({},b);if(ci.m)for(const x in ci.m){if(x==='e')r.e=Math.max(0,b.e+ci.m.e);else r[x]=(r[x]||0)+ci.m[x]}r.n=b.n+(ci.m?' ✦':'');return r}
function color(ci){return CHARS[ci.o]?CHARS[ci.o].c:null}
function desc(r){const s=[];
  if(r.heat)s.push('Gain '+r.heat+' Heat');
  if(r.vent)s.push('Spend all Heat: deal '+r.vent+' per Heat'+(r.dmg!=null&&r.live?' ('+r.dmg+')':''));
  else if(r.plusHeat)s.push('Deal 3 + Heat'+(r.live?' ('+r.dmg+')':''));
  else if(r.slam)s.push('Deal damage equal to your guard'+(r.live?' ('+r.dmg+')':''));
  else if(r.dmg)s.push('Deal '+r.dmg+(r.hits>1?' ×'+r.hits:''));
  if(r.guardHeat)s.push('Guard 2× Heat'+(r.live?' ('+r.guard+')':''));
  if(r.healGuard)s.push('Heal half your guard'+(r.live?' ('+r.heal+')':''));
  if(r.mark)s.push('Mark '+r.mark);if(r.snare)s.push('Enemy\'s next attack −'+r.snare);if(r.delay)s.push('Enemy skips its next move');
  if(r.thorns)s.push('Hit back '+r.thorns+' each time you\'re struck this turn');
  if(r.guard&&!r.guardHeat)s.push('Guard '+r.guard);if(r.heal&&!r.healGuard)s.push('Heal '+r.heal);
  if(r.calm)s.push('Team −'+r.calm+' fatigue');if(r.selfCalm)s.push('This member −'+r.selfCalm+' fatigue');
  if(r.draw)s.push('Draw '+r.draw);if(r.ap)s.push('+'+r.ap+' AP');return s.join('. ')+'.';}
// ---------- account (persists between runs) ----------
function newAccount(seed){const A={seed:seed||(Date.now()%1e6),stones:10,pulls:0,since5:0,since4:0,roster:{},day:1,keptToday:false,runs:0,wins:0};
  ['ember','weaver','bastion'].forEach(k=>A.roster[k]=newChar(k));return A;}
function newChar(k){return {dupes:0,deck:CHARS[k].start.map(c=>inst(c,k))}}
function cap(A,k){return T.baseCap+A.roster[k].dupes}
function maxHp(A,k){return CHARS[k].hp+3*A.roster[k].dupes}
function pull(A){if(A.stones<1)return null;A.stones--;A.pulls++;A.since5++;A.since4++;
  const r=rng(A);let star=3;
  if(A.since5>=T.pity5||r<T.rate5)star=5;else if(A.since4>=T.pity4||r<T.rate5+T.rate4)star=4;
  if(star===5)A.since5=0;if(star>=4)A.since4=0;
  const k=pickR(A,Object.keys(CHARS).filter(c=>CHARS[c].star===star));let res;
  if(!A.roster[k]){A.roster[k]=newChar(k);res={k,star,isNew:true}}
  else if(A.roster[k].dupes<T.dupeMax){A.roster[k].dupes++;res={k,star,dupe:A.roster[k].dupes}}
  else{if(star===5)A.stones+=2;res={k,star,refund:star===5}}
  return res;}
function saveCurve(k){k=Math.max(0,Math.min(1,k||0));return 1-Math.pow(1-k,4)}
// one day of real life: playing gives a stone; saving gives up to 3 more on a capped curve (% of your own budget)
function logDay(A,kept){const add=T.dayStones+Math.round(T.saveStones*saveCurve(kept));A.stones+=add;A.day++;return add}
// ---------- run ----------
function newRun(A,team){const R={seed:(A.seed+A.runs*7919)>>>0,team:team.slice(),step:0,stones:0,log:[],phase:'map',done:false,won:false,choices:[],
  stress:{},broke:{},hp:0,max:0,deck:[],removed:[]};
  team.forEach(k=>{R.stress[k]=0;R.broke[k]=false;R.max+=maxHp(A,k);R.deck.push(...A.roster[k].deck.map(ci=>Object.assign({},ci,{u:UID++,nw:false,saved:true})))});
  R.hp=R.max;R.choices=mapChoices(R);return R;}
function mapChoices(R){R.step++;if(R.step>T.steps)return [{type:'boss'}];
  const pool=['fight','fight','fight','fight','event','event'];if(R.step>=2)pool.push('rest','rest');if(R.step>=3)pool.push('elite','elite');
  const n=R.step===1?2:3,out=[];let guard=0;
  while(out.length<n&&guard++<50){const t=pickR(R,pool);if(R.step===1&&t!=='fight'&&out.length===0){out.push({type:'fight'});continue}
    if(out.filter(o=>o.type===t).length<(t==='fight'?2:1))out.push({type:t})}
  return out;}
function enterNode(R,node){R.node=node;
  if(node.type==='fight'||node.type==='elite'||node.type==='boss'){
    const key=node.type==='boss'?'ember':node.type==='elite'?pickR(R,['nue','gasha']):pickR(R,['wisp','kappa','imp','tengu']);
    startFight(R,key);R.phase='fight';}
  else if(node.type==='rest'){R.phase='rest'}
  else if(node.type==='event'){R.event=pickR(R,Object.keys(EVENTS));R.phase='event'}}
function startFight(R,key){const f=FOES[key],sc=f.boss?1:1+0.15*(R.step-1);
  R.foe={key,n:f.n,hp:Math.round(f.hp*sc*T.foeHp),max:Math.round(f.hp*sc*T.foeHp),weak:f.weak,brk:f.brk,brkMax:f.brk,moves:f.moves,mi:0,str:f.boss?0:Math.floor((R.step-1)/2),stun:false,elite:!!f.elite,boss:!!f.boss};
  R.pile=shuffle(R,R.deck);R.disc=[];R.hand=[];R.guard=0;R.keep=0;R.heat=0;R.turn=0;startTurn(R);}
function drawN(R,n){for(let i=0;i<n;i++){if(!R.pile.length){if(!R.disc.length)return;R.pile=shuffle(R,R.disc);R.disc=[]}R.hand.push(R.pile.pop())}}
function startTurn(R){R.turn++;R.last=null;R.played=0;R.charged=false;R.ap=T.ap+(R.bonusAp||0);R.bonusAp=0;R.guard=R.team.includes('bastion')?Math.floor((R.keep||0)/2):R.team.includes('kin')?Math.floor((R.keep||0)/3):0;R.keep=0;R.thorns=0;drawN(R,T.hand)}
function intent(f){const m=f.moves[f.mi%f.moves.length];if(f.stun)return {t:'Stunned',stun:true,total:0,txt:'Stunned, skips its move'};
  if(f.delay)return {t:'Delayed',delayed:true,total:0,txt:'Delayed, skips its move'};
  if(m.roar)return {t:m.t,roar:m.roar,total:0,txt:m.t+': hits +'+m.roar};const h=Math.round(m.hit*T.foeHit)+f.str,x=m.times||1,sn=f.snare||0,tot=Math.max(0,h*x-sn);return {t:m.t,hit:h,times:x,snare:sn,total:tot,txt:m.t+' '+h+(x>1?' ×'+x:'')+(sn?' −'+sn:'')}}
// what a card in hand does right now (a broken member's cards become Breathe)
// Passing: each character's card hands a bonus to the next card, if that card belongs to a different teammate.
// Quirks: one small passive per character (see CHARS[k].quirk).
function teamUp(R,ci){return !!(R.last&&R.last!==ci.o&&!R.broke[ci.o])}
function live(R,ci){if(R.broke[ci.o])return Object.assign({},CARDS.breathe);const r=stat(ci),got=[],q=[];
  if(teamUp(R,ci)){const ps=CHARS[R.last].pass;
    if(ps.dmg&&r.dmg){r.dmg+=ps.dmg;got.push('dmg')}if(ps.weak&&r.dmg){r.hexed=true;got.push('hex')}
    if(ps.draw){r.draw=(r.draw||0)+ps.draw;got.push('draw')}if(ps.heal){r.heal=(r.heal||0)+ps.heal;got.push('heal')}
    if(ps.guard){r.guard=(r.guard||0)+ps.guard;got.push('guard')}if(ps.mark){r.mark=(r.mark||0)+ps.mark;got.push('mark')}if(ps.e&&r.e>0&&!R.charged){r.e+=ps.e;got.push('e')}
    if(got.length){r.pass=ps.n;r.from=R.last}}
  if(ci.o==='akane'&&r.dmg&&R.played){r.dmg+=R.played;q.push('dmg')}
  if(ci.o==='mizu'&&!R.played&&r.e>0){r.e=0;q.push('e')}
  if(ci.o==='raiden'&&R.played>=2&&r.e>0){r.e-=1;q.push('e')}
  if(r.plusHeat){r.dmg=(r.dmg||3)+(R.heat||0)}
  if(r.vent){r.dmg=r.vent*(R.heat||0)}
  if(r.slam){r.dmg=(R.guard||0)}
  if(r.guardHeat){r.guard=(r.guard||0)+r.guardHeat*(R.heat||0)}
  if(r.healGuard){r.heal=Math.floor((R.guard||0)/2)}
  r.live=true;
  if(r.dmg&&R.foe&&R.foe.marks&&ci.o!=='weaver'){r.marked=Math.min(R.foe.marks,r.hits||1)}
  if(r.dmg&&R.foe&&R.foe.curse){r.dmg+=R.foe.curse}
  if(q.length)r.quirk=CHARS[ci.o].quirk.n;r.got=got.concat(q);
  return r}
function play(R,h){const ci=R.hand[h];if(!ci||R.phase!=='fight')return false;const r=live(R,ci);if(r.e>R.ap)return false;
  R.ap-=r.e;R.hand.splice(h,1);R.disc.push(ci);R.last=ci.o;R.played=(R.played||0)+1;if(r.got&&r.got.includes('e')&&r.pass==='Charged')R.charged=true;const out={dmg:0,broke:false,pass:r.pass||null};
  if(r.guard)R.guard+=r.guard;if(r.heal){const over=R.hp+r.heal-R.max;R.hp=Math.min(R.max,R.hp+r.heal);if(over>0&&R.team.includes('hana'))R.guard+=over}
  if(r.calm)R.team.forEach(k=>calm(R,k,r.calm));if(r.selfCalm)calm(R,ci.o,r.selfCalm);
  if(r.ap)R.ap+=r.ap;if(r.draw)drawN(R,r.draw);
  if(r.mark)R.foe.marks=(R.foe.marks||0)+r.mark;if(r.snare)R.foe.snare=(R.foe.snare||0)+r.snare;if(r.delay)R.foe.delay=true;
  if(r.thorns)R.thorns=(R.thorns||0)+r.thorns;
  if(r.vent)R.heat=0;
  if(r.heat){R.heat=(R.heat||0)+r.heat;if(R.heat>T.heatMax){const over=R.heat-T.heatMax;R.heat=T.heatMax;if(R.team.includes('ember')){R.stress.ember=Math.min(T.stressMax,R.stress.ember+2*over);if(R.stress.ember>=T.stressMax&&!R.broke.ember){R.broke.ember=true;R.log.unshift('Ember overheated and is exhausted.')}}}}
  if(r.dmg&&!R.broke[ci.o]){const f=R.foe;for(let i=0;i<(r.hits||1);i++){let d=r.dmg;if(f.marks>0&&ci.o!=='weaver'){d+=T.markBonus;f.marks--}f.hp-=d;out.dmg+=d;
      if((color(ci)===f.weak||r.hexed)&&!f.stun){f.brk--;if(f.brk<=0){f.stun=true;f.brk=f.brkMax;R.ap+=1;out.broke=true}}}}
  if(r.dmg&&ci.o==='kuro'&&!R.broke[ci.o])R.foe.curse=(R.foe.curse||0)+1;
  if(R.foe.hp<=0)winFight(R);return out;}
function calm(R,k,n){R.stress[k]=Math.max(0,R.stress[k]-n);if(R.broke[k]&&R.stress[k]<=T.calmAt){R.broke[k]=false;R.log.unshift(CHARS[k].n+' has caught their breath.')}}
function endTurn(R){if(R.phase!=='fight')return null;const f=R.foe,it=intent(f);let res={hit:0,through:0,who:null,stress:0};
  R.disc.push(...R.hand);R.hand=[];
  if(it.delayed){f.delay=false;R.keep=R.guard}
  else if(it.stun){f.stun=false;f.mi++;R.keep=R.guard}
  else if(it.roar){f.str+=it.roar;f.mi++;R.keep=R.guard}
  else{f.snare=0;if(R.thorns){f.hp-=R.thorns*it.times;res.thorns=R.thorns*it.times}res.hit=it.total;res.through=Math.max(0,it.total-R.guard);R.keep=Math.max(0,R.guard-it.total);R.hp=Math.max(0,R.hp-res.through);f.mi++;
    if(res.through>0){const k=pickR(R,R.team);const s=Math.ceil(res.through/3);R.stress[k]=Math.min(T.stressMax,R.stress[k]+s);res.who=k;res.stress=s;
      if(R.stress[k]>=T.stressMax&&!R.broke[k]){R.broke[k]=true;res.breakdown=true;R.log.unshift(CHARS[k].n+' is exhausted. Their cards become Catch Breath until they recover.')}}}
  if(f.hp<=0&&R.hp>0){winFight(R);return res}
  if(R.hp<=0){R.phase='end';R.done=true;R.won=false;R.stones+=T.loseStones;return res}
  startTurn(R);return res;}
function winFight(R){const f=R.foe;R.disc.push(...R.hand);R.hand=[];
  if(f.boss){R.phase='end';R.done=true;R.won=true;R.stones+=T.winStones;return}
  if(f.elite)R.stones+=T.eliteStones;
  R.reward={cards:cardOffer(R),ep:(f.elite||rng(R)<0.5)?epiphanyOffer(R):null};R.phase='reward';}
function cardOffer(R){const all=[];R.team.forEach(k=>CHARS[k].pool.concat(CHARS[k].start).forEach(c=>all.push({k:c,o:k})));
  const out=[];let g=0;while(out.length<3&&g++<40){const c=pickR(R,all);if(!out.some(x=>x.k===c.k))out.push(c)}return out;}
const MUTS=[{m:{dmg:3},need:'dmg',t:'Sharper'},{m:{dmg:4},t:'Fierce'},{m:{guard:4},t:'Sturdier'},{m:{e:-1},need:'e',t:'Lighter'},{m:{draw:1},t:'Insightful'},{m:{calm:2},t:'Soothing'},{m:{heal:4},t:'Mending'},{m:{hits:1},need:'hits',t:'Echoing'}];
function epiphanyOffer(R,uid){const cands=R.deck.filter(ci=>!ci.ep);if(!cands.length)return null;const ci=uid?R.deck.find(c=>c.u===uid):pickR(R,cands);if(!ci)return null;
  const b=CARDS[ci.k],kinds=['dmg','guard','heal','calm','draw','ap'].filter(x=>b[x]).length;
  const ok=MUTS.filter(x=>{const key=Object.keys(x.m)[0];if(x.need)return x.need==='e'?b.e>0:!!b[x.need];return b[key]||kinds<2});return {u:ci.u,opts:shuffle(R,ok).slice(0,3)};}
function takeCard(R,c){if(c){const ci=inst(c.k,c.o);ci.nw=true;R.deck.push(ci)}}
function takeEpiphany(R,u,mut){const ci=R.deck.find(c=>c.u===u);if(ci&&mut&&!ci.ep){ci.m=Object.assign({},mut.m);ci.ep=true;ci.epNew=true}}
function finishReward(R){R.reward=null;nextStep(R)}
function rest(R,choice){if(choice==='heal')R.hp=Math.min(R.max,R.hp+Math.round(R.max*0.35));else R.team.forEach(k=>{R.stress[k]=0;R.broke[k]=false});nextStep(R)}
function doEvent(R,arg){const e=R.event;
  if(e==='merchant'&&arg){const i=R.deck.findIndex(c=>c.u===arg);if(i>=0)R.removed.push(R.deck.splice(i,1)[0])}
  if(e==='shrine'&&arg&&arg.u)takeEpiphany(R,arg.u,arg.mut);
  if(e==='stone')R.stones+=1;
  if(e==='spring'){R.hp=Math.min(R.max,R.hp+10);R.team.forEach(k=>calm(R,k,4))}
  nextStep(R)}
function nextStep(R){R.choices=mapChoices(R);R.phase='map'}
// ---------- save data ----------
// changes = new cards and new epiphanies, grouped by character, up to cap(k) each
function changes(R){return R.deck.filter(ci=>ci.nw||ci.epNew).map(ci=>({u:ci.u,o:ci.o,ci}))}
function saveData(A,R,uids){const byChar={};
  R.team.forEach(k=>byChar[k]=0);
  uids.forEach(u=>{const ci=R.deck.find(c=>c.u===u);if(!ci||byChar[ci.o]>=cap(A,ci.o))return;byChar[ci.o]++;
    const d=A.roster[ci.o].deck;
    if(ci.nw)d.push({u:UID++,k:ci.k,o:ci.o,m:ci.m,ep:ci.ep,nw:false});
    else{const j=d.findIndex(x=>x.k===ci.k&&!x.ep);if(j>=0)d[j]=Object.assign({},d[j],{m:ci.m,ep:true})}});
  A.stones+=R.stones;A.runs++;if(R.won)A.wins++;return byChar;}
// a decent card to play right now (used for the Hint button and the sim)
function suggest(R){const f=R.foe;if(!f)return -1;const inc=intent(f).total;let best=-1,bs=-1;
  R.hand.forEach((ci,h)=>{const r=live(R,ci);if(r.e>R.ap)return;let s=0;
    if(r.selfCalm)s+=20;if(r.ap)s+=15;if(r.draw)s+=6*r.draw;if(r.pass)s+=4;
    if(r.heat)s+=(R.heat+r.heat<=T.heatMax?4*r.heat:-5);if(r.mark)s+=3*r.mark;if(r.snare)s+=Math.min(r.snare,inc)*1.2;if(r.delay)s+=inc*0.8;if(r.thorns&&inc)s+=r.thorns*intent(f).times;
    if(r.marked)s+=4*r.marked;if((r.vent||r.slam)&&r.dmg<8)s-=10;
    if(r.dmg)s+=r.dmg*(r.hits||1)*((color(ci)===f.weak||r.hexed)?1.3:1)/Math.max(r.e,0.5);
    if(r.guard)s+=(inc>R.guard?r.guard*1.2:1)/Math.max(r.e,0.5);
    if(r.heal)s+=(R.hp<R.max*0.6?r.heal:1);if(r.calm)s+=r.calm*(Math.max(...R.team.map(k=>R.stress[k]))>5?3:0.5);
    if(s>bs){bs=s;best=h}});return best}
const API={suggest,T,CHARS,CARDS,FOES,EVENTS,MUTS,newAccount,cap,maxHp,pull,logDay,saveCurve,newRun,enterNode,play,endTurn,intent,live,teamUp,stat,color,desc,
  takeCard,takeEpiphany,finishReward,rest,doEvent,changes,saveData,epiphanyOffer,setUid:n=>{UID=Math.max(UID,n)}};
if(typeof module!=='undefined')module.exports=API;else root.RunEngine=API;
})(this);

function map(){app.innerHTML='';
  app.appendChild(h('<header class="row"><div><h1>Chaos trail</h1><p class="muted small">Pick a lit node to move on. The Ember Oni waits at the top.</p></div><span class="pill" style="color:var(--gold)">◆ +'+R.stones+'</span></header>'));
  app.appendChild(allyStrip());
  const W=340,rows=E.T.steps+1,GAP=70,H=rows*GAP+70;
  const pos=(i,j,n)=>({x:W*(j+1)/(n+1),y:H-35-i*GAP});
  let svg='<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="max-width:420px;display:block;margin:0 auto" role="group" aria-label="Trail map">';
  const hist=R.hist||[],rowsN=[];

    const from=prevKind==='past'?prev:prev;

    prev=row.kind==='past'?[pts[row.pick]]:pts;prevKind=row.kind});
  svg+='<circle cx="'+W/2+'" cy="'+(H-35)+'" r="10" fill="#e9b949"/><text x="'+W/2+'" y="'+(H-12)+'" text-anchor="middle" fill="#b3aacb" font-size="11">Start</text>';

      (now?'<circle cx="'+p.x+'" cy="'+p.y+'" r="'+(r+6)+'" fill="none" stroke="#e9b949" stroke-width="2" class="pulse"/>':'')+
      '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" style="fill:#1b1830;stroke:'+nd.c+'" stroke-width="3"/>'+
      '<text x="'+p.x+'" y="'+(p.y+6)+'" text-anchor="middle" font-size="'+(boss?22:18)+'" style="fill:'+nd.c+'" font-weight="700">'+nd.g+'</text>'+
      (now||boss?'<text x="'+p.x+'" y="'+(p.y+r+15)+'" text-anchor="middle" font-size="11" fill="#efe6d6">'+nd.n+'</text>':'')+'</g>'})});

  $('cont').onclick=()=>{if(rw.card){E.takeCard(R,rw.card);R.log.unshift(E.CARDS[rw.card.k].n+' joins the deck.')}if(rw.ep&&rw.mut){E.takeEpiphany(R,rw.ep.u,rw.mut);R.log.unshift('Epiphany: '+rw.mut.t+' '+E.CARDS[R.deck.find(x=>x.u===rw.ep.u).k].n+'.')}E.finishReward(R);render()}}
function restScreen(){app.innerHTML='';app.appendChild(h('<header><h1>Camp</h1><p class="muted">Choose one.</p></header>'));app.appendChild(teamPanel());
  const c=h('<div class="choices"><button class="node" id="rh"><b>Rest</b><span class="small muted">Heal '+Math.round(R.max*0.35)+'.</span></button><button class="node" id="rc"><b>Tea by the fire</b><span class="small muted">Everyone\'s fatigue goes to 0.</span></button></div>');app.appendChild(c);
  $('rh').onclick=()=>{E.rest(R,'heal');render()};$('rc').onclick=()=>{E.rest(R,'calm');render()}}
function eventScreen(){app.innerHTML='';const ev=E.EVENTS[R.event];app.appendChild(h('<header><h1>'+ev.n+'</h1><p class="muted">'+ev.d+'</p></header>'));
  if(R.event==='merchant'){const p=h('<section class="panel"><p class="muted small">Tap a card to remove it.</p><div class="hand" id="dk"></div><div class="row"><span></span><button class="btn ghost" id="lv">Keep everything</button></div></section>');app.appendChild(p);
    R.deck.forEach(ci=>$('dk').appendChild(cardEl(E.stat(ci),ci.o,{onClick:()=>{E.doEvent(R,ci.u);R.log.unshift(E.CARDS[ci.k].n+' was removed.');render()}})));$('lv').onclick=()=>{E.doEvent(R,null);render()}}
  else if(R.event==='shrine'){const p=h('<section class="panel"><p class="muted small" id="sh"></p><div class="hand" id="dk"></div><div class="row"><span></span><button class="btn ghost" id="lv">Leave</button></div></section>');app.appendChild(p);
    if(!epSel){$('sh').textContent='Pick a card to have an Epiphany.';R.deck.filter(ci=>!ci.ep).forEach(ci=>$('dk').appendChild(cardEl(E.stat(ci),ci.o,{onClick:()=>{epSel=E.epiphanyOffer(R,ci.u);render()}})))}
    else{const ci=R.deck.find(x=>x.u===epSel.u);$('sh').textContent='Pick a version of '+E.CARDS[ci.k].n+'.';epSel.opts.forEach(mu=>{const r=E.stat({k:ci.k,m:mu.m});r.n=mu.t+' '+E.CARDS[ci.k].n;$('dk').appendChild(cardEl(r,ci.o,{onClick:()=>{E.doEvent(R,{u:ci.u,mut:mu});R.log.unshift('Epiphany: '+r.n+'.');epSel=null;render()}}))})}
    $('lv').onclick=()=>{epSel=null;E.doEvent(R,null);render()}}
  else{const b=h('<div class="row"><span></span><button class="btn" id="ok">Continue</button></div>');app.appendChild(b);$('ok').onclick=()=>{E.doEvent(R,null);render()}}}
// ---------- end + save data ----------
function endScreen(){app.innerHTML='';const ch=E.changes(R);
  app.appendChild(h('<header><h1>'+(R.won?'The Ember Oni is calm!':'The team heads home')+'</h1><p class="muted">'+(R.won?'You cleared the trail.':'Nothing is lost.')+' You earned ◆ '+R.stones+' Wishing Stones this run.</p></header>'));
  const p=h('<section class="panel"><h2>Save Data</h2><p class="muted small">Pick what your characters remember from this run. It joins their starting deck for good. Each character can save up to their limit, and every copy you wish for raises it by 1.</p><div id="sv"></div></section>');app.appendChild(p);
  const sel=new Set();
  function draw(){const sv=$('sv');sv.innerHTML='';if(!ch.length){sv.appendChild(h('<p class="muted small">No new cards or Epiphanies this run.</p>'));return}
    R.team.forEach(k=>{const mine=ch.filter(c=>c.o===k);if(!mine.length)return;const used=mine.filter(c=>sel.has(c.u)).length,capk=E.cap(A,k);
      sv.appendChild(h('<h3 style="margin-top:6px;color:'+COL[E.CHARS[k].c]+'">'+E.CHARS[k].n+' <span class="muted small num">'+used+' / '+capk+' saved</span></h3>'));
      mine.forEach(c=>{const r=E.stat(c.ci);const l=h('<label class="chk"><input type="checkbox"'+(sel.has(c.u)?' checked':'')+((!sel.has(c.u)&&used>=capk)?' disabled':'')+'><span><b>'+r.n+'</b> <span class="muted small">'+(c.ci.nw?'new card':'Epiphany')+' · '+E.desc(r)+'</span></span></label>');
        l.querySelector('input').onchange=e=>{if(e.target.checked)sel.add(c.u);else sel.delete(c.u);draw()};sv.appendChild(l)})})}
  draw();
  const b=h('<div class="row"><span></span><button class="btn" id="sv2">Save and head home</button></div>');app.appendChild(b);
  $('sv2').onclick=()=>{E.saveData(A,R,[...sel]);R=null;render();toast('Saved. Your team remembers.')}}
function render(){if(!R)home();else if(R.phase==='map')map();else if(R.phase==='fight')fight();else if(R.phase==='reward')reward();else if(R.phase==='rest')restScreen();else if(R.phase==='event')eventScreen();else endScreen();save()}
function start(d){const s=(d&&d.A)?d:load();if(s&&s.A){A=s.A;R=s.R||null;team=(s.team||[]).filter(k=>A.roster[k])}else{A=E.newAccount();team=['ember','weaver','bastion']}maxUid();render()}
window.claude?.hot?.snapshot?.(()=>({A,R,team}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
})();
</script>

<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script>
</body>
