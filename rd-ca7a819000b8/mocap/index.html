<!doctype html>

<style>

button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none;min-height:30px;width:100%;margin:0}
#stage{position:fixed;inset:0;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#30333b,#1b1c21)}

.row>*{flex:1;min-width:0}

.clip button.sm{min-height:34px;padding:4px 9px}

      ${over ? `<p class="note">That's more than ${MAXF} frames: only the first ${MAXF} are read. Trim it or pick fewer frames per second.</p>` : ''}
      <p id="msg">${esc(MSG)}</p>
      <div class="row"><button class="sm" id="pickb">🎬 Other video</button><button class="go" id="gob" ${BUSY ? 'disabled' : ''}>🦴 Copy the motion</button></div>
      <p class="note">One person, whole body in view works best. The PC reads every frame (Render, SAM 3D Body).</p>`; }
  else h = `<button class="go" id="pickb">🎬 Choose a video</button><p class="note">Trim it to the part you want, then the PC copies the body's movement frame by frame onto a 3D mannequin.</p><p id="msg">${esc(MSG)}</p>`;
  B.innerHTML = h; const nv = $('#prev'); if(nv && at) nv.currentTime = at; wire(); if(M.job) showProg(); scrubShow(); }
function wire(){ const on = (s, ev, f) => { const el = $(s); if(el) el[ev] = f; };
  on('#pickb', 'onclick', () => $('#file').click()); on('#newb', 'onclick', () => $('#file').click());
  const pv = $('#prev'); if(pv){ pv.onloadedmetadata = () => metaIn(pv); if(pv.readyState >= 1 && !M.dur) metaIn(pv); pv.ontimeupdate = () => { const ph = $('#playhead'); if(ph && M.dur) ph.style.left = (100 * pv.currentTime / M.dur) + '%'; }; }
  on('#startb', 'onclick', () => { M.start = Math.min(pv.currentTime, (M.end || M.dur) - 0.2); keep(); draw(); });
  on('#endb', 'onclick', () => { M.end = Math.max(pv.currentTime, (M.start || 0) + 0.2); keep(); draw(); });
  on('#fps', 'onclick', e => { const b = e.target.closest('button'); if(b){ M.fps = +b.dataset.v; keep(); draw(); } });
  on('#smooth', 'onclick', e => { const b = e.target.closest('button'); if(b){ M.smooth = b.dataset.k; keep(); draw(); } });
  on('#handsb', 'onclick', () => { M.hands = !M.hands; keep(); draw(); });
  on('#more', 'ontoggle', e => { MORE = e.target.open; });
  on('#gob', 'onclick', () => copyMotion(false)); on('#rebuildb', 'onclick', () => copyMotion(true));
  on('#playb', 'onclick', () => play(!PLAY)); on('#prevf', 'onclick', () => { play(false); setT(T - 1 / A.fps); }); on('#nextf', 'onclick', () => { play(false); setT(T + 1 / A.fps); });
  on('#scrub', 'oninput', e => { if(PLAY) play(false); setT(+e.target.value / A.fps); });
  on('#speed', 'onclick', e => { const b = e.target.closest('button[data-v]'); if(!b) return; M.speed = +b.dataset.v; keep(); if(pipOn()) pip.playbackRate = M.speed; draw(); });
  on('#pipb', 'onclick', () => { if(pip.hidden){ if(!pipSrc()) return; pip.hidden = false; if(PLAY) play(true); else pip.addEventListener('loadeddata', () => setT(T), {once:true}); } else { pip.pause(); pip.hidden = true; } draw(); });
  on('#followb', 'onclick', () => { FOLLOW = !FOLLOW; if(FOLLOW) pose(); draw(); }); on('#sceneb', 'onclick', () => { M.scene = M.scene===false; keep(); pose(); draw(); }); on('#frontb', 'onclick', viewFront); on('#sideb', 'onclick', viewSide);
  document.querySelectorAll('[data-walk]').forEach(b => b.onclick = () => { M.walk = b.dataset.walk==='1'; keep(); pose(); draw(); });
  document.querySelectorAll('[data-feet]').forEach(b => b.onclick = () => { M.feet = b.dataset.feet; keep(); pose(); draw(); });
  on('#head', 'oninput', e => { M.head = +e.target.value; keep(); pose(); const l = e.target.previousElementSibling; if(l) l.lastChild.textContent = M.head.toFixed(2) + '×'; }); }
// (so the progress line can name the node: the graph sent)
window.LASTG = M.job && M.job.cls || {};
// ---- start: pick up a job that was running, or the last result
window.MOCAP = {get A(){ return A; }, get M(){ return M; }, get SCN(){ return SCN; }, world, lift, camera, controls, setT, pose};
(async () => { draw();
  if(M.job){ BUSY = true; draw(); try{ await runJob(); await openResult(); saveClip(); MSG = 'Done. Drag to turn round her, scrub to step through.'; }catch(e){ M.job = null; keep(); MSG = e.message; } BUSY = false; draw(); }
  else if(M.res){ try{ await openResult(); MSG = ''; }catch(e){ MSG = e.message + ' (Is ' + pcName(M.res.pc) + ' on?)'; } draw(); } })();
</script>
