<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mocap</title>
<meta name="theme-color" content="#17181c"><link rel="apple-touch-icon" href="../icon-tape-180.png"><link rel="icon" href="../icon-tape-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
<style>

button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}

button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800}
input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:40px;width:100%}
input[type=range]{accent-color:var(--accent);padding:0;border:0;background:none;min-height:30px;width:100%;margin:0}
#stage{position:fixed;inset:0;touch-action:none;background:radial-gradient(ellipse at 50% 40%,#30333b,#1b1c21)}
#stage canvas{display:block;width:100%;height:100%}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;display:flex;gap:8px;align-items:center;z-index:3;background:linear-gradient(rgba(23,24,28,.85),rgba(23,24,28,0))}
#top h1{margin:0;font:600 18px var(--display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#top button{background:rgba(32,34,40,.9);min-height:36px;padding:5px 11px;font-weight:700}

#hint[hidden]{display:none}

#pip.big{width:min(62vw,380px);max-width:none}
#pip[hidden]{display:none}
#sheet{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(32,34,40,.96);border:1px solid var(--line);border-radius:14px;max-width:560px;margin:0 auto;display:flex;flex-direction:column;max-height:62vh}

.row>*{flex:1;min-width:0}
.row>.sm{flex:0 0 auto}
.note{color:var(--soft);font-size:13px;margin:0}

#propw{flex:1;min-width:0;min-height:36px;width:auto}
.chips button.sm{flex:0 0 auto;min-width:40px}

h2{margin:0;font:600 15px var(--display)}
#prev{width:100%;max-height:26vh;border-radius:10px;background:#000;display:block}

.clip button.sm{min-height:34px;padding:4px 9px}

      <div class="lbl"><span>People in the video</span></div><div class="chips" id="people">${[[1, '👤 One'], [2, '👥 2'], [3, '3'], [4, '4']].map(([v, t]) => `<button data-v="${v}" aria-pressed="${(M.people || 1)===v}">${t}</button>`).join('')}</div>
      ${(M.people || 1) > 1 ? `<p class="note">Fights, hugs, dances: SAM 3.1 follows each person through the video so everyone keeps their own mannequin. Slower than one person.</p>` : ''}
      ${(M.people || 1) > 1 ? needBtn() : ''}
      ${over ? `<p class="note">That's more than ${MAXF} frames: only the first ${MAXF} are read. Trim it or pick fewer frames per second.</p>` : ''}
      <p id="msg">${esc(MSG)}</p>
      <div class="row"><button class="sm" id="pickb">🎬 Other video</button><button class="go" id="gob" ${BUSY ? 'disabled' : ''}>🦴 Copy the motion</button></div>
      <p class="note">${(M.people || 1) > 1 ? 'Whole bodies in view work best.' : 'One person, whole body in view works best.'} The PC reads every frame (Render, SAM 3D Body).</p>`; }
  else h = `<button class="go" id="pickb">🎬 Choose a video</button><p class="note">Trim it to the part you want, then the PC copies the body's movement frame by frame onto a 3D mannequin.</p><p id="msg">${esc(MSG)}</p>`;
  B.innerHTML = h; const nv = $('#prev'); if(nv && at) nv.currentTime = at; wire(); if(M.job) showProg(); scrubShow(); }
function wire(){ const on = (s, ev, f) => { const el = $(s); if(el) el[ev] = f; };
  on('#pickb', 'onclick', () => $('#file').click()); on('#newb', 'onclick', () => $('#file').click());
  const pv = $('#prev'); if(pv){ pv.onloadedmetadata = () => metaIn(pv); if(pv.readyState >= 1 && !M.dur) metaIn(pv); pv.ontimeupdate = () => { const ph = $('#playhead'); if(ph && M.dur) ph.style.left = (100 * pv.currentTime / M.dur) + '%'; }; }
  on('#startb', 'onclick', () => { M.start = Math.min(pv.currentTime, (M.end || M.dur) - 0.2); keep(); draw(); });
  on('#endb', 'onclick', () => { M.end = Math.max(pv.currentTime, (M.start || 0) + 0.2); keep(); draw(); });
  on('#fps', 'onclick', e => { const b = e.target.closest('button'); if(b){ M.fps = +b.dataset.v; keep(); draw(); } });
  on('#smooth', 'onclick', e => { const b = e.target.closest('button'); if(b){ M.smooth = b.dataset.k; keep(); draw(); } });
  on('#handsb', 'onclick', () => { M.hands = !M.hands; keep(); draw(); });
  on('#expo', 'ontoggle', e => { EXPO = e.target.open; }); on('#exprops', 'onclick', () => { EXP.props = !EXP.props; draw(); }); on('#explace', 'onclick', () => { EXP.place = !EXP.place; draw(); });
  on('#expb', 'onclick', makeClips); on('#exsend', 'onclick', sendClips);
  on('#lineb', 'onclick', () => { LINE = !LINE; if(A && SEL >= A.P.length) SEL = 0; markSel(); draw(); });
  on('#yaw', 'oninput', e => { setAdj(SEL, {yaw:+e.target.value}); LASTMID = null; pose(); const l = $('#yawv'); if(l) l.textContent = Math.round(+e.target.value) + '°'; }); on('#yaw', 'onchange', () => { keep(); saveClip(); });
  on('#lifty', 'oninput', e => { setAdj(SEL, {y:+e.target.value}); LASTMID = null; pose(); const l = $('#liftv'); if(l) l.textContent = (+e.target.value).toFixed(2) + ' m'; }); on('#lifty', 'onchange', () => { keep(); saveClip(); });
  on('#adjx', 'onclick', () => { setAdj(SEL, {x:0, y:0, z:0, yaw:0}); LASTMID = null; pose(); keep(); saveClip(); draw(); });
  on('#propw', 'oninput', e => { PROPW = e.target.value; }); on('#propw', 'onkeydown', e => { if(e.key==='Enter') addProp(); }); on('#propb', 'onclick', addProp); on('#placeb', 'onclick', buildPlace);
  on('#props', 'onclick', e => { const b = e.target.closest('button'); if(!b) return; if(b.dataset.prop){ const pr = M.props.find(x => x.id===b.dataset.prop); if(pr){ pr.hide = !pr.hide; keep(); saveClip(); pose(); draw(); } }
    if(b.dataset.pdel){ const pr = M.props.find(x => x.id===b.dataset.pdel); if(pr && confirm('Take the ' + pr.word + ' out? (Its 3D file stays on the PC.)')){ M.props = M.props.filter(x => x!==pr); const P = PROPS.find(x => x.id===pr.id); if(P && P.obj && P.obj.parent) P.obj.parent.remove(P.obj); PROPS = PROPS.filter(x => x!==P); keep(); saveClip(); draw(); } } });
  on('#people', 'onclick', e => { const b = e.target.closest('button'); if(b){ M.people = +b.dataset.v; keep(); draw(); } }); on('#needb', 'onclick', getModels);
  on('#who', 'onclick', e => { const b = e.target.closest('button[data-p]'); if(!b) return; const i = +b.dataset.p; M.hide[i] = !M.hide[i]; keep(); pose(); draw(); });
  on('#more', 'ontoggle', e => { MORE = e.target.open; });
  on('#gob', 'onclick', () => copyMotion(false)); on('#rebuildb', 'onclick', () => copyMotion(true));
  on('#playb', 'onclick', () => play(!PLAY)); on('#prevf', 'onclick', () => { play(false); setT(T - 1 / A.fps); }); on('#nextf', 'onclick', () => { play(false); setT(T + 1 / A.fps); });
  on('#scrub', 'oninput', e => { if(PLAY) play(false); setT(+e.target.value / A.fps); });
  on('#speed', 'onclick', e => { const b = e.target.closest('button[data-v]'); if(!b) return; M.speed = +b.dataset.v; keep(); if(pipOn()) pip.playbackRate = M.speed; draw(); });
  on('#pipb', 'onclick', () => { if(pip.hidden){ if(!pipSrc()) return; pip.hidden = false; if(PLAY) play(true); else pip.addEventListener('loadeddata', () => setT(T), {once:true}); } else { pip.pause(); pip.hidden = true; } draw(); });
  on('#followb', 'onclick', () => { FOLLOW = !FOLLOW; if(FOLLOW){ const d = middle().sub(controls.target); controls.target.add(d); camera.position.add(d); LASTMID = null; pose(); } draw(); }); on('#sceneb', 'onclick', () => { M.scene = M.scene!==true; keep(); pose(); draw(); }); on('#frontb', 'onclick', viewFront); on('#sideb', 'onclick', viewSide);
  document.querySelectorAll('[data-walk]').forEach(b => b.onclick = () => { M.walk = b.dataset.walk==='1'; keep(); pose(); draw(); });
  document.querySelectorAll('[data-feet]').forEach(b => b.onclick = () => { M.feet = b.dataset.feet; keep(); pose(); draw(); });
  on('#head', 'oninput', e => { M.head = +e.target.value; keep(); pose(); const l = e.target.previousElementSibling; if(l) l.lastChild.textContent = M.head.toFixed(2) + '×'; }); }
// (so the progress line can name the node: the graph sent)
window.LASTG = M.job && M.job.cls || {};
// ---- start: pick up a job that was running, or the last result
window.MOCAP = {get A(){ return A; }, get M(){ return M; }, get SCN(){ return SCN; }, get PROPS(){ return PROPS; }, world, align, lift, camera, controls, setT, pose, reopen:openResult, get EXP(){ return EXP; }};
(async () => { draw();
  if(M.job){ BUSY = true; draw(); try{ await runJob(); await openResult(); saveClip(); MSG = 'Done. Drag to turn round ' + (A && A.P.length > 1 ? 'them' : 'her') + ', scrub to step through.'; }catch(e){ M.job = null; keep(); MSG = e.message; } BUSY = false; draw(); }
  else if(M.res){ try{ await openResult(); MSG = ''; }catch(e){ MSG = e.message + ' (Is ' + pcName(M.res.pc) + ' on?)'; } draw(); } })();
</script>
