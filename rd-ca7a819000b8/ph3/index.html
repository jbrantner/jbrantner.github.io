<style>
:root{--bg:#17181c;--panel:#202228;--panel2:#2a2d35;--line:#363a44;--text:#e8e9ee;--soft:#9aa0ad;--accent:#ff5ca8;--sel:#ffd166;--ok:#5fd39a;--display:'Pixelify Sans',system-ui,sans-serif}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Nunito,system-ui,sans-serif}
*{box-sizing:border-box}
button,select,input,textarea{font:inherit;color:inherit}
button{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer}
button:disabled{opacity:.4}
button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:800;min-height:48px;font-size:16px}
textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:96px;resize:vertical}
main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 28px);display:flex;flex-direction:column;gap:12px}
header{display:flex;gap:8px;align-items:center}
header h1{margin:0;font:600 20px var(--display);flex:1;min-width:0}
header a,header button{min-height:36px;padding:5px 11px;font-weight:700;font-size:14px}
a.btn{display:inline-flex;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;color:var(--text);text-decoration:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:9px}
h2{margin:0;font:600 15px var(--display)}
.note{color:var(--soft);font-size:13px;margin:0}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips button{flex:1 0 auto;min-height:36px;padding:4px 8px;font-size:13px;color:var(--soft)}.chips button[aria-pressed=true]{border-color:var(--accent);color:var(--text)}
.lbl{font-size:12px;color:var(--soft)}
.pics{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.pic{position:relative;aspect-ratio:1;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--bg);padding:0;min-height:0}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic b{position:absolute;left:4px;top:3px;font:600 11px var(--display);background:rgba(0,0,0,.6);border-radius:5px;padding:1px 4px}
.pic.one{border-color:var(--accent)}
.pic .x{position:absolute;right:2px;top:2px;min-height:0;width:24px;height:24px;padding:0;border-radius:50%;font-size:12px;background:rgba(0,0,0,.65)}
.pic.add{display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--soft)}
.tog{display:flex;align-items:center;gap:10px;justify-content:space-between}
.tog span{flex:1}.tog small{display:block;color:var(--soft);font-size:12px}
.sw{width:50px;height:30px;border-radius:15px;padding:0;min-height:0;position:relative;flex:0 0 auto}
.sw::after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--soft);transition:left .15s}
.sw[aria-pressed=true]{background:var(--accent);border-color:var(--accent)}.sw[aria-pressed=true]::after{left:23px;background:#fff}
#msg{font-size:13px;color:var(--sel);margin:0}#msg:empty{display:none}
#msg.bad{color:#ff8a8a}
.bar{height:8px;border-radius:5px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.bar.run i{width:35%!important;animation:slide 1.3s ease-in-out infinite alternate}@keyframes slide{from{margin-left:0}to{margin-left:65%}}
.res{position:relative;border-radius:12px;overflow:hidden;background:#000;touch-action:pan-y}
.res img{display:block;width:100%;height:auto}
.row{display:flex;gap:6px}.row>*{flex:1;min-width:0}
details{font-size:13px;color:var(--soft)}details pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;color:var(--text);background:var(--bg);border-radius:8px;padding:8px;margin:6px 0 0;max-height:40vh;overflow:auto}
.lib{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.lib button{padding:0;aspect-ratio:1;overflow:hidden;border-radius:10px;min-height:0}.lib img{width:100%;height:100%;object-fit:cover;display:block}
.need{border:1px solid var(--sel);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
</style></head>
<body>
<main>
  <header><a class="btn" id="back" href="../">← Deck</a><h1>✨ P-H3 Image</h1></header>
  <div id="app"></div>
</main>
<input type="file" id="file" accept="image/*" hidden>
<script>
// ✨ P-H3 Image (Jordan 2026-11-09: "let's try the better one… make a quick app UI for me to use the workflow").
// Pruna's P-H3-Image (MiniMax H3 fine-tuned for still pictures) in one ComfyUI job, built like Comfy-Org's own templates
// image_p_h3_t2i / image_p_h3_image_edit (ComfyUI 0.44.0+, all core nodes):
//   UNETLoader minimax_h3_fl2va_pruned_int8_convrot → LoraLoaderModelOnly p-h3-image_lora_bf16 1.0 (or a standalone p-h3-image_* diffusion model, no LoRA)
//   → MiniMaxH3SigmaShift 1.0/1.0 → BasicGuider ← PH3ImageConditioning (p-h3-image text encoder + VAE, Picture 1 = the one being edited, 2-9 = references)
//   prompt: "Aspect ratio: X\nRequest: …" → TextGenerateV2 (the p-h3-image prompt upsampler, greedy, thinking on, 1536 tokens) when Auto prompt is on
//   RandomNoise + KSamplerSelect er_sde + ManualSigmas (Pruna's 8-step grid) → SamplerCustomAdvanced → VAEDecode → SaveImage (RenderDeck/ph3, Hidden/ph3 in 🙈)
// The PC list is Render Deck's own (same site); Render first. Missing files download through Render Deck's helper (Hugging Face).
const QS = new URLSearchParams(location.search), HID = QS.get('h')==='1', $ = s => document.querySelector(s);
const esc = s => String(s==null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const get = (k, d) => { try{ const v = JSON.parse(localStorage.getItem(k)); return v==null ? d : v; }catch(e){ return d; } }, put = (k, v) => { try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} };
const PRE = (HID ? 'Hidden' : 'RenderDeck') + '/ph3/ph3', KEY = 'rd-ph3' + (HID ? '-h' : '');
const CID = get('rd-ph3-cid', '') || (() => { const c = 'rd-ph3-' + Math.random().toString(36).slice(2, 10); put('rd-ph3-cid', c); return c; })();
if(HID) $('#back').href = '../?h=1';
// ---- the PCs (Render Deck's list; an iPhone home-screen app has its own storage, so Jordan's two PCs are the fallback)
const DEFAULT_PCS = [{name:'Render', url:'https://jordo-desktop.tailadee9a.ts.net'}, {name:'Main', url:'https://jordo-main.tailadee9a.ts.net'}];
function deckServers(){ let l = []; try{ const d = JSON.parse(localStorage.getItem('render-deck-v1')) || {}; l = (d.servers || []).filter(x => x.url && x.url!=='test'); }catch(e){}
  if(!l.length) l = DEFAULT_PCS; return l.map(s => ({name:s.name, url:s.url.replace(/\/+$/, '')})).sort((a, b) => (b.name==='Render') - (a.name==='Render')); }
const pcName = url => (deckServers().find(s => s.url===url) || {}).name || url.replace(/^https?:\/\//, '').split('.')[0];
const viewOf = p => p.pc + '/view?filename=' + encodeURIComponent(p.file) + '&subfolder=' + encodeURIComponent(p.sub || '') + '&type=' + (p.type || 'output');
// ---- the files P-H3 needs (Pruna's ComfyUI repo; the diffusion model is the official MiniMax H3 FL2VA one plus Pruna's LoRA)
const PR = 'https://huggingface.co/PrunaAI/p-h3-image-comfy/resolve/main/';
const FILES = {
  unet:{label:'MiniMax H3 FL2VA (official)', gb:19.5, kind:'diffusion_models', url:'https://huggingface.co/Comfy-Org/MiniMax-H3/resolve/main/diffusion_models/minimax_h3_fl2va_pruned_int8_convrot.safetensors'},
  lora:{label:'P-H3 LoRA', gb:2.0, kind:'loras', url:PR + 'loras/p-h3-image_lora_bf16.safetensors'},
  te:{label:'P-H3 text encoder', gb:5.1, kind:'text_encoders', url:PR + 'text_encoders/p-h3-image_text_encoder_int8_convrot.safetensors'},
  up:{label:'P-H3 prompt writer', gb:6.7, kind:'text_encoders', url:PR + 'text_encoders/p-h3-image_prompt_upsampler_w4a8.safetensors'},
  vae:{label:'P-H3 VAE', gb:3.1, kind:'vae', url:PR + 'vae/p-h3-image_vae_int8_convrot.safetensors'}};
const SIGMAS = '1.0, 0.984753, 0.967905, 0.951688, 0.925372, 0.881923, 0.810083, 0.528718, 0.0';
const RATIOS = [['1:1', 1], ['4:3', 4/3], ['3:4', 3/4], ['3:2', 3/2], ['2:3', 2/3], ['16:9', 16/9], ['9:16', 9/16]];
// a canvas of about mp megapixels (ComfyUI's: 1024², as its Resolution Selector) at that ratio, sides multiples of 32 (8 MP 4:3 = 3360x2496 as Pruna's table)
function canvasOf(ratio, mp){ const r = (RATIOS.find(x => x[0]===ratio) || RATIOS[0])[1], a = mp * 1048576; return [Math.round(Math.sqrt(a * r) / 32) * 32, Math.round(Math.sqrt(a / r) / 32) * 32]; }
const nearRatio = (w, h) => RATIOS.reduce((b, x) => Math.abs(Math.log(x[1] / (w / h))) < Math.abs(Math.log(b[1] / (w / h))) ? x : b)[0];
// ---- what's on screen (kept on this phone)
const S = Object.assign({mode:'edit', prompt:'', auto:true, ratio:'3:4', mp:4, pics:[], seed:0, keepSeed:false, pc:'', count:1, jobs:[], cur:null, lib:[]}, get(KEY, {}));
if(S.job){ S.jobs = (S.jobs || []).concat([Object.assign({n:1, i:0}, S.job)]); delete S.job; } // (a job from before batches)
let MSG = '', BAD = false, BUSY = false, KIT = {}, NEED = null, GETTING = false;
const keep = () => put(KEY, S);
// ---- what each PC has
const optsOf = spec => !spec ? [] : Array.isArray(spec[0]) ? spec[0] : spec[0]==='COMBO' ? (spec[1] && spec[1].options) || [] : [];
const comboIn = (def, f) => { const i = def && def.input || {}; return optsOf((i.required || {})[f] || (i.optional || {})[f]); };
async function nodeDefs(url, list){ const r = await fetch(url + '/object_info', {cache:'no-store'}); if(!r.ok) throw new Error(r.status); const j = await r.json(); return Object.fromEntries(list.map(c => [c, j[c] || null])); }
async function kitOf(url){ const d = await nodeDefs(url, ['PH3ImageConditioning', 'TextGenerateV2', 'MiniMaxH3SigmaShift', 'ManualSigmas', 'UNETLoader', 'LoraLoaderModelOnly', 'CLIPLoader', 'VAELoader', 'ImageScaleToTotalPixels']);
  const unets = comboIn(d.UNETLoader, 'unet_name'), loras = comboIn(d.LoraLoaderModelOnly, 'lora_name'), clips = comboIn(d.CLIPLoader, 'clip_name'), vaes = comboIn(d.VAELoader, 'vae_name');
  const pick = (l, re, pref) => { const m = l.filter(n => re.test(n.replace(/\\/g, '/'))); for(const p of pref || []){ const f = m.find(n => p.test(n)); if(f) return f; } return m[0] || ''; };
  const own = pick(unets, /p-h3-image_[^/]*\.safetensors$/i, [/int8/i, /w4a8/i]);
  return {url, ok:!!(d.PH3ImageConditioning && d.TextGenerateV2 && d.MiniMaxH3SigmaShift && d.ManualSigmas), up2:!!d.TextGenerateV2, scale:!!d.ImageScaleToTotalPixels,
    unet:own || pick(unets, /fl2va.*(pruned.*int8|int8.*pruned)|minimaxH3INT8INT4_fl2va/i, [/convrot/i]), own:!!own,
    lora:pick(loras, /p-h3-image_lora/i), te:pick(clips, /p-h3-image_text_encoder/i, [/int8/i, /w4a8/i]), up:pick(clips, /p-h3-image_prompt_upsampler/i, [/w4a8/i, /int8/i]), vae:pick(vaes, /p-h3-image_vae/i, [/int8/i])}; }
const missingOf = k => ['unet', 'lora', 'te', 'up', 'vae'].filter(x => x==='lora' ? !k.own && !k.lora : !k[x]).filter(x => x!=='up' || S.auto);
async function scan(){ const out = {}; await Promise.all(deckServers().map(async s => { try{ out[s.url] = await kitOf(s.url); }catch(e){ out[s.url] = {url:s.url, off:true}; } })); KIT = out; return out; }
// the PCs a batch can use: every one that's on with P-H3 and all its files (Render first), or just the one picked
function readyPcs(){ const l = deckServers().map(s => KIT[s.url]).filter(k => k && !k.off && k.ok && !missingOf(k).length); return S.pc ? l.filter(k => k.url===S.pc) : l; }
function bestPc(){ const l = deckServers().map(s => KIT[s.url]).filter(k => k && !k.off);
  if(S.pc && KIT[S.pc] && !KIT[S.pc].off) return KIT[S.pc];
  return l.find(k => k.ok && !missingOf(k).length) || l.find(k => k.ok) || l[0] || null; }
// ---- pictures: shrunk on the phone to at most 8.4 MP (P-H3 scales anything above that down anyway) and kept as JPEG
function shrink(file){ return new Promise((ok, no) => { const u = URL.createObjectURL(file), im = new Image();
  im.onload = () => { const k = Math.min(1, Math.sqrt(8388608 / (im.naturalWidth * im.naturalHeight))), w = Math.round(im.naturalWidth * k), h = Math.round(im.naturalHeight * k);
    const c = document.createElement('canvas'); c.width = w; c.height = h; c.getContext('2d').drawImage(im, 0, 0, w, h); URL.revokeObjectURL(u);
    c.toBlob(b => b ? ok({blob:b, w, h, thumb:thumbOf(c)}) : no(new Error("Couldn't read that picture.")), 'image/jpeg', 0.95); };
  im.onerror = () => { URL.revokeObjectURL(u); no(new Error("Couldn't open that picture.")); }; im.src = u; }); }
function thumbOf(src){ const c = document.createElement('canvas'), w = src.width || src.naturalWidth, h = src.height || src.naturalHeight, k = 240 / Math.max(w, h); c.width = Math.round(w * k); c.height = Math.round(h * k); c.getContext('2d').drawImage(src, 0, 0, c.width, c.height); return c.toDataURL('image/jpeg', 0.8); }
const BLOBS = {}; // (picture blobs this visit, by id; a picture already on a PC is sent again from there)
async function upload(url, p){ if(p.up && p.up[url]) return p.up[url];
  let blob = BLOBS[p.id]; if(!blob && p.src){ const r = await fetch(viewOf(p.src)); if(!r.ok) throw new Error('Picture ' + p.n + ' is no longer on ' + pcName(p.src.pc) + '. Pick it again.'); blob = await r.blob(); }
  if(!blob) throw new Error('This phone forgot Picture ' + p.n + '. Pick it again.');
  const fd = new FormData(); fd.append('image', blob, 'ph3_' + p.id + '.jpg'); fd.append('overwrite', 'true');
  const r = await fetch(url + '/upload/image', {method:'POST', body:fd}); if(!r.ok) throw new Error('Sending Picture ' + p.n + ' failed (' + r.status + ').');
  const j = await r.json(); (p.up = p.up || {})[url] = (j.subfolder ? j.subfolder + '/' : '') + j.name; keep(); return p.up[url]; }
const numbered = () => S.pics.forEach((p, i) => p.n = i + 1);
// ---- the ComfyUI job
function graph(k, o){ const g = {}; let n = 0; const add = (cls, inputs) => { const id = String(++n); g[id] = {class_type:cls, inputs}; return id; };
  let model = [add('UNETLoader', {unet_name:k.unet, weight_dtype:'default'}), 0];
  if(!k.own) model = [add('LoraLoaderModelOnly', {model, lora_name:k.lora, strength_model:1}), 0];
  model = [add('MiniMaxH3SigmaShift', {model, shift_video:1, shift_audio:1}), 0];
  const clip = [add('CLIPLoader', {clip_name:k.te, type:'minimax', device:'default'}), 0], vae = [add('VAELoader', {vae_name:k.vae}), 0];
  const imgs = o.pics.map((f, i) => { let im = [add('LoadImage', {image:f}), 0];
    // (Picture 1 is drawn at the size picked, and the canvas is set to that same size, so references are read no bigger than it)
    if(i===0 && k.scale) im = [add('ImageScaleToTotalPixels', {image:im, upscale_method:'lanczos', megapixels:o.mp, resolution_steps:32}), 0];
    return im; });
  let prompt = o.text, up = null;
  if(o.auto){ const ti = {clip:[add('CLIPLoader', {clip_name:k.up, type:'minimax', device:'default'}), 0], prompt:'Aspect ratio: ' + o.ratio + '\nRequest: ' + o.text,
      max_length:1536, sampling_mode:'off', thinking:!imgs.length, use_default_template:true, mtp:'auto'};
    // (thinking off for edits: Render 2026-11-10, with it on the writer picks its H3 video-brief format for whole-picture edits and the picture comes back rotated, 4 of 4)
    imgs.forEach((im, i) => ti['images.image' + (i + 1)] = im);
    up = add('TextGenerateV2', ti); prompt = [up, 0]; }
  const ci = {clip, vae, prompt, width:o.w || 0, height:o.h || 0}; imgs.forEach((im, i) => ci['images.image_' + (i + 1)] = im);
  const cond = add('PH3ImageConditioning', ci);
  const s = add('SamplerCustomAdvanced', {noise:[add('RandomNoise', {noise_seed:o.seed}), 0], guider:[add('BasicGuider', {model, conditioning:[cond, 0]}), 0],
    sampler:[add('KSamplerSelect', {sampler_name:'er_sde'}), 0], sigmas:[add('ManualSigmas', {sigmas:SIGMAS}), 0], latent_image:[cond, 1]});
  const sv = add('SaveImage', {images:[add('VAEDecode', {samples:[s, 0], vae}), 0], filename_prefix:PRE});
  const pv = up ? add('PreviewAny', {source:[up, 0]}) : null;
  return {g, sv, pv, up}; }
async function send(url, g){ const r = await fetch(url + '/prompt', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({prompt:g, client_id:CID})}), j = await r.json().catch(() => ({}));
  if(!r.ok || !j.prompt_id) throw new Error(pcName(url) + ' turned it down: ' + JSON.stringify(j.node_errors && Object.keys(j.node_errors).length ? j.node_errors : j.error || j).slice(0, 400)); return j.prompt_id; }
// live progress (each PC's websocket): which node, step N of 8, per job
const WSS = {}, PROGS = {};
function listen(url){ const w0 = WSS[url]; if(w0 && w0.readyState < 2) return; try{ const ws = WSS[url] = new WebSocket(url.replace(/^http/, 'ws') + '/ws?clientId=' + CID);
  ws.onmessage = e => { if(typeof e.data!=='string') return; let m; try{ m = JSON.parse(e.data); }catch(x){ return; } const d = m.data || {}, J = S.jobs.find(j => j.pid===d.prompt_id); if(!J) return;
    if(m.type==='executing' && d.node){ PROGS[J.pid] = {node:d.node, v:0, max:0}; showProg(); } if(m.type==='progress'){ PROGS[J.pid] = {node:d.node || (PROGS[J.pid] || {}).node, v:d.value, max:d.max}; showProg(); } }; }catch(e){} }
const stepName = (J, id) => { const c = J && J.cls && J.cls[id]; return c==='TextGenerateV2' ? 'writing the prompt' : c==='SamplerCustomAdvanced' ? 'drawing' : c==='VAEDecode' ? 'finishing' : /Loader/.test(c || '') ? 'loading the model' : c==='PH3ImageConditioning' ? 'reading the pictures' : 'working'; };
async function poll(J){ const t0 = Date.now(), url = J.pc;
  for(;;){ await new Promise(r => setTimeout(r, window.PH3_POLL || 2000)); let it = null;
    try{ const h = await (await fetch(url + '/history/' + J.pid, {cache:'no-store'})).json(); it = h[J.pid]; }catch(e){ J.note = 'lost touch, still trying'; continue; }
    if(it && it.status && it.status.status_str==='error'){ const m = (it.status.messages || []).find(x => x[0]==='execution_error'), e = m && m[1] || {};
      throw new Error('It failed on ' + pcName(url) + (e.node_type ? ' (' + e.node_type + ': ' + String(e.exception_message || '').trim().slice(0, 240) + ')' : '.')); }
    if(it && it.outputs && it.outputs[J.sv]) return it.outputs;
    if(it && it.status && it.status.completed) throw new Error(pcName(url) + ' finished but sent no picture back.');
    if(!it){ try{ const q = await (await fetch(url + '/queue', {cache:'no-store'})).json(), pend = (q.queue_pending || []).map(x => x[1]), run = (q.queue_running || []).map(x => x[1]);
      if(pend.includes(J.pid)){ J.note = 'waiting'; delete PROGS[J.pid]; }
      else if(!run.includes(J.pid) && Date.now() - t0 > 60000) throw new Error(pcName(url) + " doesn't know this job any more (was ComfyUI restarted?)."); else J.note = ''; }catch(e){ if(/know this job/.test(e.message)) throw e; } }
    else J.note = '';
    if(Date.now() - t0 > 90 * 60000) throw new Error('No answer after 90 minutes.'); } }
// ✨ Make it: N pictures (Jordan 2026-11-13: "a batch number so it knows how many to generate"), each its own job with its own seed,
// dealt round the PCs that have P-H3 (Render, Main…); each PC's ComfyUI queue takes its share one after another
async function make(){ if(BUSY) return; const text = S.prompt.trim(); BAD = false;
  if(!text){ say('Say what you want first.', true); return; } if(S.mode==='edit' && !S.pics.length){ say('Add Picture 1, the one to change.', true); return; }
  BUSY = true; say('Looking for PCs with P-H3…');
  try{ await scan(); const pcs = readyPcs();
    if(!pcs.length){ const k = bestPc(); if(!k || k.off) throw new Error('No PC answered. Is ComfyUI running on Render, and Tailscale on on this phone?');
      if(!k.ok) throw new Error(pcName(k.url) + "'s ComfyUI is too old for P-H3 (it needs 0.44.0 or newer). Update ComfyUI there.");
      const miss = missingOf(k); NEED = {pc:k.url, keys:miss}; throw new Error(pcName(k.url) + ' is missing ' + miss.map(x => FILES[x].label).join(', ') + '. Get them below (once).'); }
    numbered(); const n = Math.max(1, Math.min(8, S.count || 1)), use = pcs.slice(0, n), pics = {};
    if(S.mode==='edit') for(const k of use){ pics[k.url] = []; for(const p of S.pics){ say('Sending Picture ' + p.n + ' to ' + pcName(k.url) + '…'); pics[k.url].push(await upload(k.url, p)); } }
    const seed0 = S.keepSeed && S.seed ? S.seed : Math.floor(Math.random() * 2 ** 48);
    let w = 0, h = 0, ratio = S.ratio; if(S.mode==='make') [w, h] = canvasOf(S.ratio, S.mp); else { const p = S.pics[0], f = Math.sqrt(S.mp * 1048576 / (p.w * p.h)); ratio = nearRatio(p.w, p.h); w = Math.max(32, Math.round(p.w * f / 32) * 32); h = Math.max(32, Math.round(p.h * f / 32) * 32); }
    const recPics = S.mode==='edit' ? S.pics.map(p => ({id:p.id, n:p.n, w:p.w, h:p.h, thumb:p.thumb, up:p.up, src:p.src})) : [], t0 = Date.now(), batch = 'b' + t0.toString(36);
    for(let i = 0; i < n; i++){ const k = use[i % use.length], seed = (seed0 + i) % 2 ** 48, {g, sv, pv} = graph(k, {text, auto:S.auto, ratio, mp:S.mp, w, h, pics:pics[k.url] || [], seed});
      window.LASTG = g; say('Starting ' + (i + 1) + ' of ' + n + ' on ' + pcName(k.url) + '…'); listen(k.url);
      S.jobs.push({pc:k.url, pid:await send(k.url, g), sv, pv, t0, i, n, batch, cls:Object.fromEntries(Object.entries(g).map(([j, x]) => [j, x.class_type])),
        rec:{mode:S.mode, prompt:text, auto:S.auto, ratio, mp:S.mp, seed, pics:recPics}}); keep(); }
    S.seed = seed0; MSG = ''; keep(); draw(); await finishAll(); }
  catch(e){ say(e.message || String(e), true); }
  BUSY = false; draw(); }
// waits for every job still out (also ones left running when the page closed); each picture joins the list as it lands
let WAITING = null;
function finishAll(){ if(WAITING) return WAITING; if(!S.jobs.length) return Promise.resolve(); BUSY = true; draw(); const errs = [];
  WAITING = Promise.all(S.jobs.slice().map(async J => { listen(J.pc);
    try{ const out = await poll(J), im = ((out[J.sv] || {}).images || [])[0]; if(!im) throw new Error('No picture came back from ' + pcName(J.pc) + '.');
      const txt = J.pv && out[J.pv] && (out[J.pv].text || out[J.pv].string);
      const r = Object.assign({id:'p' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5), pc:J.pc, file:im.filename, sub:im.subfolder || '', made:Date.now(), secs:Math.round((Date.now() - J.t0) / 1000), batch:J.batch, up:Array.isArray(txt) ? txt.join('\n') : txt || ''}, J.rec);
      S.lib.unshift(r); S.lib = S.lib.slice(0, 300); { const c = curRec(); if(!c || c.batch!==J.batch) S.cur = r.id; } // (the first of a batch to land shows; the rest go in its strip) J.done = true; }
    catch(e){ errs.push(e.message || String(e)); J.done = true; }
    S.jobs = S.jobs.filter(x => x!==J); delete PROGS[J.pid]; keep(); draw(); }))
    .then(() => { WAITING = null; BUSY = false;
      if(errs.length) say(errs[0] + (errs.length > 1 ? ' (' + errs.length + ' failed)' : ''), true); else say('Done.'); draw(); });
  return WAITING; }
// ---- downloads through Render Deck's helper (one after another; it shows the % while it goes)
async function getFiles(){ const N = NEED; if(!N || GETTING) return; GETTING = true; draw(); const u = N.pc;
  try{ for(const key of N.keys){ const f = FILES[key], name = f.url.split('/').pop(); say('Asking ' + pcName(u) + ' to download ' + f.label + '…');
      const r = await fetch(u + '/renderdeck/download', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({url:f.url, kind:f.kind})}), j = await r.json().catch(() => ({}));
      if((!r.ok || j.error) && !/exist|already/i.test(j.error || '')) throw new Error(r.status===404 ? pcName(u) + " hasn't got Render Deck's helper." : 'The ' + f.label + ' download was turned down: ' + (j.error || r.status));
      if(!r.ok) continue;
      for(let i = 0; i < 7200; i++){ await new Promise(r => setTimeout(r, window.PH3_POLL || 3000));
        let js = null; try{ js = await (await fetch(u + '/renderdeck/jobs', {cache:'no-store'})).json(); }catch(e){ continue; }
        const jb = (js.jobs || []).find(x => (x.name || '')===name) || (js.jobs || []).find(x => (x.name || '').includes(name.replace(/\.safetensors$/, ''))); if(!jb) continue;
        if(/error|fail/i.test(jb.status || '')) throw new Error('The ' + f.label + ' download failed on ' + pcName(u) + ' (' + (jb.error || jb.status) + ').');
        if(/done|finish|complete/i.test(jb.status || '')) break;
        say('Downloading ' + f.label + ' on ' + pcName(u) + (jb.total ? '… ' + Math.round(100 * (jb.done || 0) / jb.total) + '%' : '…')); } }
    NEED = null; say('Got everything on ' + pcName(u) + '. Press Make it again.'); }
  catch(e){ say(e.message, true); } GETTING = false; draw(); }
// ---- screen
function say(m, bad){ MSG = m || ''; BAD = !!bad; const el = $('#msg'); if(el){ el.textContent = MSG; el.className = BAD ? 'bad' : ''; } }
// one line per PC: how many it has left and what the one it's on is doing
function showProg(){ const m = $('#msg'), b = $('#bar'), J = S.jobs;
  if(J.length && !MSG){ const secs = Math.round((Date.now() - Math.min(...J.map(j => j.t0))) / 1000), by = {};
    for(const j of J) (by[j.pc] = by[j.pc] || []).push(j);
    const lines = Object.entries(by).map(([pc, l]) => { const run = l.find(j => PROGS[j.pid]), p = run && PROGS[run.pid];
      return pcName(pc) + ': ' + l.length + ' left' + (p ? ', ' + stepName(run, p.node) + (p.max > 1 ? ' ' + p.v + '/' + p.max : '') : l.some(j => j.note==='waiting') ? ', waiting its turn' : ''); });
    if(m){ m.className = ''; m.textContent = lines.join(' · ') + ' · ' + secs + ' s'; } }
  else if(m){ m.textContent = MSG; m.className = BAD ? 'bad' : ''; }
  if(b){ b.hidden = !BUSY && !J.length; const i = b.querySelector('i'), tot = J.length ? Math.max(...J.map(j => j.n || 1)) : 0, run = J.map(j => PROGS[j.pid]).find(p => p && p.max > 1);
    const det = !!(tot && run); b.classList.toggle('run', !det); if(i) i.style.width = det ? Math.round(100 * ((tot - J.length) + run.v / run.max) / tot) + '%' : ''; } }
setInterval(() => { if(S.jobs.length) showProg(); }, 1000);
const curRec = () => S.lib.find(r => r.id===S.cur);
// (no before/after slider: Jordan 2026-11-13 "we don't need the before/after slider")
function resultHtml(r){ const src = viewOf(r), sib = r.batch ? S.lib.filter(x => x.batch===r.batch) : [];
  return `<div class="card"><h2>Result${sib.length > 1 ? ' ' + (sib.length - sib.indexOf(r)) + ' of ' + sib.length : ''}</h2>
    <div class="res" id="res"><img src="${esc(src)}" alt="The result" id="resimg"></div>
    ${sib.length > 1 ? `<div class="lib" style="grid-template-columns:repeat(4,1fr)">${sib.slice().reverse().map(x => `<button data-open="${x.id}" aria-label="Open"${x===r ? ' style="border-color:var(--accent)"' : ''}><img loading="lazy" src="${esc(viewOf(x))}" alt=""></button>`).join('')}</div>` : ''}
    <p class="note">${esc(r.mode==='edit' ? 'Edit' : 'New picture')} · ${r.secs || '?'} s on ${esc(pcName(r.pc))} · seed ${r.seed}${r.auto ? ' · auto prompt' : ''}</p>
    ${r.up ? `<details><summary>The prompt it wrote</summary><pre>${esc(r.up)}</pre></details>` : ''}
    <div class="row"><button id="useit">✏ Edit this</button><button id="again">↻ Again</button><a class="btn" style="justify-content:center" href="${esc(src)}" target="_blank" rel="noopener">⬇ Open</a></div></div>`; }
function draw(){ const el = $('#app'); numbered(); const r = curRec(), J = S.jobs.length;
  let h = `<div class="card"><div class="chips" role="group" aria-label="What to do"><button data-mode="edit" aria-pressed="${S.mode==='edit'}">✏ Edit a picture</button><button data-mode="make" aria-pressed="${S.mode==='make'}">🎨 New picture</button></div>`;
  if(S.mode==='edit'){ h += `<div class="lbl">Picture 1 is the one that changes. Pictures 2–9 are references; name them in the request ("the jacket from Picture 2").</div><div class="pics">`
      + S.pics.map((p, i) => `<div class="pic${i ? '' : ' one'}"><img src="${esc(p.thumb)}" alt="Picture ${p.n}"><b>${p.n}</b><button class="x" data-del="${i}" aria-label="Remove Picture ${p.n}">✕</button></div>`).join('')
      + (S.pics.length < 9 ? `<button class="pic add" id="addpic" aria-label="Add a picture">＋</button>` : '') + `</div>`; }
  else h += `<div class="lbl">Shape</div><div class="chips" role="group">${RATIOS.map(([k]) => `<button data-ratio="${k}" aria-pressed="${S.ratio===k}">${k}</button>`).join('')}</div>`;
  h += `<textarea id="prompt" placeholder="${S.mode==='edit' ? 'What to change, e.g. make it night time, keep everything else the same' : 'What to draw: start with what the picture is, then the details'}">${esc(S.prompt)}</textarea>
    <div class="lbl">Size ${S.mode==='make' ? '(' + canvasOf(S.ratio, S.mp).join('×') + ')' : '(Picture 1 is drawn at this size)'}</div>
    <div class="chips" role="group">${[2, 4, 8].map(m => `<button data-mp="${m}" aria-pressed="${S.mp===m}">${m} MP${m===4 ? ' · default' : m===8 ? ' · best, slow' : ' · quick'}</button>`).join('')}</div>
    <div class="tog"><span>Auto prompt<small>Pruna's prompt writer expands your request first. Turn it off to send your words as they are.</small></span><button class="sw" id="auto" aria-pressed="${S.auto}" aria-label="Auto prompt"></button></div>
    <div class="tog"><span>Keep the seed<small>${S.seed ? 'Last seed ' + S.seed : 'A new seed each time'}</small></span><button class="sw" id="kseed" aria-pressed="${S.keepSeed}" aria-label="Keep the seed"></button></div>
    <div class="lbl">How many${readyPcs().length > 1 && !S.pc ? ' (shared between ' + readyPcs().map(k => pcName(k.url)).join(' and ') + ')' : ''}</div>
    <div class="chips" role="group">${[1, 2, 3, 4, 6, 8].map(c => `<button data-count="${c}" aria-pressed="${(S.count || 1)===c}">${c}</button>`).join('')}</div>
    <div class="lbl">PC</div><div class="chips" role="group"><button data-pc="" aria-pressed="${!S.pc}">Auto</button>${deckServers().map(s => `<button data-pc="${esc(s.url)}" aria-pressed="${S.pc===s.url}">${esc(s.name || pcName(s.url))}</button>`).join('')}</div>
    <button class="go" id="make" ${BUSY ? 'disabled' : ''}>${J ? 'Making ' + J + '…' : '✨ Make ' + ((S.count || 1) > 1 ? S.count + ' pictures' : 'it')}</button>
    <div class="bar" id="bar" hidden><i></i></div><p id="msg"></p>
    ${NEED ? `<div class="need"><span>${esc(pcName(NEED.pc))} needs ${esc(NEED.keys.map(x => FILES[x].label + ' (' + FILES[x].gb + ' GB)').join(', '))}.</span><button id="getb" ${GETTING ? 'disabled' : ''}>⬇ Get them on ${esc(pcName(NEED.pc))}</button></div>` : ''}</div>`;
  if(r) h += resultHtml(r);
  if(S.lib.length) h += `<div class="card"><h2>📚 Made here (${S.lib.length})</h2><div class="lib">${S.lib.map(x => `<button data-open="${x.id}" aria-label="Open"><img loading="lazy" src="${esc(viewOf(x))}" alt=""></button>`).join('')}</div>
    ${r ? '<button id="forget">🗑 Take this one off the list</button>' : ''}</div>`;
  el.innerHTML = h; showProg(); wire(); }
function wire(){ const on = (s, f, ev) => { const e = $(s); if(e) e[ev || 'onclick'] = f; };
  $('#app').onclick = e => { const b = e.target.closest('button'); if(!b) return; const d = b.dataset;
    if(d.mode){ S.mode = d.mode; keep(); draw(); } else if(d.ratio){ S.ratio = d.ratio; keep(); draw(); } else if(d.mp){ S.mp = +d.mp; keep(); draw(); } else if(d.count){ S.count = +d.count; keep(); draw(); }
    else if(d.pc!==undefined){ S.pc = d.pc; NEED = null; keep(); draw(); } else if(d.del!==undefined){ S.pics.splice(+d.del, 1); keep(); draw(); }
    else if(d.open){ S.cur = d.open; keep(); draw(); scrollTo({top:$('#res') ? $('#res').closest('.card').offsetTop - 8 : 0, behavior:'smooth'}); } };
  on('#addpic', () => $('#file').click()); on('#make', make); on('#getb', getFiles);
  on('#auto', () => { S.auto = !S.auto; keep(); draw(); }); on('#kseed', () => { S.keepSeed = !S.keepSeed; keep(); draw(); });
  on('#prompt', e => { S.prompt = e.target.value; keep(); }, 'oninput');
  on('#useit', useIt); on('#again', again); on('#forget', () => { S.lib = S.lib.filter(x => x.id!==S.cur); S.cur = null; keep(); draw(); });
}
// ✏ Edit this: the result becomes Picture 1 (it's already on that PC); the references stay
function useIt(){ const r = curRec(); if(!r) return; const img = $('#resimg');
  const p = {id:'r' + Date.now().toString(36), w:img && img.naturalWidth || 1024, h:img && img.naturalHeight || 1024, thumb:img && img.complete && img.naturalWidth ? (() => { try{ return thumbOf(img); }catch(e){ return viewOf(r); } })() : viewOf(r), src:{pc:r.pc, file:r.file, sub:r.sub, type:'output'}};
  S.pics = [p].concat(S.pics.slice(1)); S.mode = 'edit'; S.prompt = ''; keep(); draw(); scrollTo({top:0, behavior:'smooth'}); }
function again(){ const r = curRec(); if(!r) return; S.mode = r.mode; S.prompt = r.prompt; S.auto = r.auto; S.mp = r.mp || S.mp; if(r.mode==='make') S.ratio = r.ratio;
  else if(r.pics && r.pics.length) S.pics = r.pics.map(p => Object.assign({}, p)); keep(); draw(); make(); }
$('#file').onchange = async e => { const f = e.target.files[0]; e.target.value = ''; if(!f) return;
  try{ const s = await shrink(f), id = Math.random().toString(36).slice(2, 10); BLOBS[id] = s.blob; S.pics.push({id, w:s.w, h:s.h, thumb:s.thumb}); keep(); draw(); }catch(x){ say(x.message, true); } };
draw();
// a job that was running when the page closed carries on
if(S.jobs.length) finishAll();
scan().then(() => { draw(); const k = bestPc(); if(k && !BUSY && !S.jobs.length){ if(k.off) say("Can't reach the PCs. Is ComfyUI running on Render, and Tailscale on on this phone?", true); else if(!k.ok) say(pcName(k.url) + "'s ComfyUI is too old for P-H3 (it needs 0.44.0 or newer).", true); else { const m = missingOf(k); if(m.length){ NEED = {pc:k.url, keys:m}; draw(); } } } }).catch(() => {});
</script>
</body></html>
