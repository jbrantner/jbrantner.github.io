<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17181c;--panel:#202228;--panel2:#2a2d35;--line:#363a44;--text:#e8e9ee;--soft:#9aa0ad;--accent:#ff5ca8;--sel:#ffd166;--display:'Pixelify Sans',system-ui,sans-serif}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Nunito,system-ui,sans-serif}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
button:disabled{opacity:.45}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-height:38px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px}
.bar select{flex:1;min-width:120px}
.saved{font-size:12px;color:var(--soft);min-width:52px;text-align:right}
.views{display:flex;gap:4px;padding:0 12px 8px}
.views button{flex:1 1 auto;min-width:0;padding:6px 5px;font:700 12px var(--display);white-space:nowrap}
#stage{position:relative;height:58vh;min-height:300px;margin:0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;background:#2b2e35}
#stage canvas{display:block;width:100%;height:100%}
#camctl{position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:2}#camctl[hidden]{display:none}#camctl button{min-height:30px;padding:3px 9px;font:700 12px Nunito,sans-serif;background:rgba(23,24,28,.8)}
.vlab{position:absolute;font:700 11px var(--display);color:#c9ccd4;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:5px;pointer-events:none}
#msg{position:absolute;left:0;right:0;top:44%;text-align:center;color:var(--soft);pointer-events:none;padding:0 20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:10px 12px 40px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.box h2{margin:0 0 8px;font:600 15px var(--display);display:flex;align-items:center;gap:8px}
.box h2 button:first-of-type{margin-left:auto}.box h2 button{min-height:32px;padding:4px 10px;font:700 13px Nunito,sans-serif}
.list{display:grid;gap:4px}
.row{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg)}
.row[aria-selected="true"]{border-color:var(--sel)}
.row .nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{min-width:36px;min-height:32px;padding:2px 6px;border:0;background:none}
.row .ic[aria-pressed="false"]{opacity:.35}
.row small{color:var(--soft)}
.note{color:var(--soft);font-size:13px;margin:6px 0}
.warn{color:#ffb4a8;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid3 label,.lbl{display:block;font-size:12px;color:var(--soft);margin:6px 0 2px}
.grid3 input{width:100%}
.line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tries{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.tries button{padding:0;min-height:0;background:repeating-conic-gradient(#3a3e48 0 25%,#262930 0 50%) 0 0/14px 14px;border:2px solid var(--line);border-radius:8px;overflow:hidden}.tries button[aria-pressed=true]{border-color:var(--sel)}.tries img{width:100%;display:block;aspect-ratio:3/4;object-fit:contain}
.line input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
#pick,.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#pick[hidden],.modal[hidden]{display:none}
.modal .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(560px,100%);max-height:80vh;overflow:auto;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px}
.modal .sheet .box{background:var(--bg)}
.hud{position:relative;z-index:3}
.ptitle{display:none;font:700 14px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:60vw}body.panel .ptitle{display:block}body.panel #scenes,body.panel #new,body.panel #del{display:none}
#ortho{position:absolute;top:100%;left:12px;right:12px;display:flex;gap:4px;padding:6px;background:var(--panel);border:1px solid var(--line);border-radius:10px;z-index:4}#ortho[hidden]{display:none}
#ortho button{flex:1;font:700 12px var(--display)}
#viewvid{position:absolute;left:8px;top:8px;width:36%;max-height:46%;object-fit:contain;background:#fff;border:1px solid var(--line, #3a3f4b);border-radius:8px;z-index:2;pointer-events:none}
#viewimg{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:transparent;z-index:1}
body.sc #stage:has(#viewimg:not([hidden])){background:#111216}#viewimg[hidden]{display:none}
.rthumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.rthumbs button{padding:0;overflow:hidden;text-align:left;min-height:0}.rthumbs button[aria-pressed="true"]{border-color:var(--accent)}
.rthumbs img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;background:#111216}.rthumbs span{display:block;padding:3px 6px;font-size:12px;color:var(--soft)}
.mini{gap:4px;flex-wrap:wrap}.mini button{min-height:32px;padding:4px 6px;font-size:13px;white-space:nowrap;flex:0 1 auto}
#allmsg:empty,#sdtags:empty{display:none}#sdtags{margin:3px 2px;font-size:12px}
/* 🎬 Scene (Jordan 2026-10-29): one full-screen viewer; the scene's name and ☰ on top, Camera / Free / 📐 / 🖼 under it; a small layer list at the bottom */
body.sc .hud{position:fixed;left:0;right:0;top:0;padding-top:env(safe-area-inset-top,0px);background:linear-gradient(rgba(23,24,28,.9) 70%,rgba(23,24,28,0))}
body.sc #camctl{top:calc(env(safe-area-inset-top,0px) + 106px)}
body.sc #stage{position:fixed;inset:0;height:auto;min-height:0;margin:0;border:0;border-radius:0}
body.sc .cols{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));z-index:3;max-height:48vh;overflow:auto;padding:0;display:block;border-radius:10px}
body.sc #objbox{background:rgba(32,34,40,.94);padding:6px}
body.sc #objbox .line{margin-top:0}body.sc #allmsg{margin:4px 2px}body.sc #objs{margin-top:6px}
body.sc .row{padding:0 4px;flex-wrap:wrap}body.sc .row .nm{padding:5px 4px;font-size:14px}body.sc .row .ic{min-height:30px}
body.sc #selbox{border:0;border-top:1px solid var(--line);border-radius:0;background:none;padding:6px 2px;flex-basis:100%}
background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(560px,100%);max-height:75vh;overflow:auto;padding:12px}
#pick .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
#pick .chars button{padding:0;overflow:hidden;text-align:left}
#pick .chars img{display:block;width:100%;height:150px;object-fit:contain;background:#fff}
#pick .chars span{display:block;padding:4px 6px;font-weight:700;font-size:13px}
/* 🤸 Pose Creator (Jordan 2026-10-29): the rig full screen; her settings tucked behind ⚙ Panel */
#pzbar{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));display:flex;gap:6px;z-index:3}#pzbar[hidden]{display:none}#pzbar button{background:rgba(23,24,28,.85);font-weight:700}#pzmsg{position:absolute;left:8px;right:8px;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:3;background:rgba(23,24,28,.92);border:1px solid #33343c;border-radius:8px;padding:7px 10px;font-size:13px;line-height:1.35}#pzmsg[hidden]{display:none}#pzmsg i{display:block;height:3px;background:#ff5ca8;margin-top:6px;border-radius:2px;transition:width .8s linear}#pzmsg i[hidden]{display:none}
body.pz.pzc .cols{display:none}body.pz .cols{bottom:calc(58px + env(safe-area-inset-bottom,0px))}
</style></head>
<body>
<div class="hud"><div class="bar"><select id="scenes" aria-label="Scene"></select><b id="ptitle" class="ptitle"></b><span class="saved" id="saved"></span><button id="menub" aria-label="Menu">☰</button></div>
<div class="views" role="tablist"><button data-v="cam">📷 Camera</button><button data-v="persp">🕹 Free</button><button id="orthob" aria-label="Flat views">📐</button><button id="rlibb">🖼 Renders</button></div>
<div id="ortho" hidden><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="quad">⊞ All 4</button></div></div>
<div id="stage"><img id="viewimg" hidden alt="A render"><video id="viewvid" hidden muted playsinline preload="auto" crossorigin="anonymous"></video><div id="msg"></div><div id="pzmsg" hidden><span></span><i hidden></i></div><div id="pzbar" hidden><button id="pzundo" disabled>↶ Undo</button><button id="pzpanel" aria-pressed="false">⚙ Panel</button></div><div id="camctl" hidden><button id="camlock"></button><button id="camcopy">⤓ Free view’s angle</button></div></div>
<div class="cols">
  <div class="box" id="envbox"></div>
  <div class="box" id="lightbox"></div>
  <div class="box" id="objbox"><div class="line mini"><button id="d3" aria-pressed="false" title="Everyone as their 3D mannequin or model, to move and pose">🧍3D</button><button id="d2" aria-pressed="true" title="Everyone as their rendered picture">📸2D</button><button id="rall">▶ Render all</button><button id="rscene" title="Render Scene: all of it painted as one picture">🎬 Render Scene</button><button id="rblend" aria-pressed="true" title="After the characters' own passes, a light pass over everything (0.25) so it blends together">🎞 Blend</button><button id="rbg" disabled title="Paint the background of the last 🎬 Render Scene again, leaving everyone as they are">🖌 Background</button><button id="rup" disabled title="The last 🎬 Render Scene 2× bigger, redrawn in tiles">⤴ Upscale</button><button id="add" title="Add a character">＋🧍</button><button id="addo" title="Add an object">＋🪑</button></div><input id="sdesc" placeholder="📝 Describe the scene, e.g. 2 girls having a conversation" style="width:100%;margin-top:6px"><p class="note" id="sdtags"></p><p class="note" id="allmsg"></p><div class="list" id="objs"></div></div>
  <div class="box" id="selbox"></div>
</div>
<div id="menu" class="modal" hidden><div class="sheet"><div class="bar" style="padding:0"><b style="font-family:var(--display)" id="menuh">☰ Scene</b><button id="menux" style="margin-left:auto">✕</button></div>
  <div class="line" style="margin:0"><button id="new">＋ New</button><button id="ren">✎ Rename</button><button id="del">🗑 Delete</button><button id="snap" aria-pressed="false">🧲 Snap to 25 cm</button></div><div id="menubody"></div><div id="bgnew"></div></div></div>
<div id="rlib" class="modal" hidden><div class="sheet"><div class="bar" style="padding:0"><b style="font-family:var(--display)">🖼 Renders</b><button id="rlibx" style="margin-left:auto">✕</button></div><div id="final"></div></div></div>
<div id="pick" hidden><div class="sheet"><div class="bar" style="padding:0"><b style="font-family:var(--display)" id="pickh">📚 Character Library</b><button id="pickx" style="margin-left:auto">✕</button></div><div class="chars" id="chars"></div></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
// 🎬 Scene (Jordan 2026-10-27): a 3D space saved as a scene, with Character Library characters placed in it as references.
// 🪑 Objects from the Object Library go in the same way (kind 'obj'), stood at their real height.
// A scene keeps only where each one stands (and its turn and size) and which library folder it is; her pictures, LoRA and
// size come from the library each time, so re-saving her there changes her in every scene (as Maya's references do).
// Layers-style object list: only the selected one moves. Views: 3D (orbit), and flat Front, Side and Top for exact placing,
// one at a time or all four. Scenes are kept on the phone and, with the helper, in Scenes/ of the shared output folder.
import * as THREE from 'three';
import {paintLook} from './look.js';
import {solveOrbit} from './orbit.js';
import {bvhPose, MHR_OP} from './bvh.js';
import {TOON, loadBody as fetchBody, bodyMesh as shapedBody, POSES, APOSE, poseBody, bonesOf, bodyJoints, DEPTH_MAT, drawPose, comboOf, hasNode, upload, faceFix, NEG} from './body.js';
const QS = new URLSearchParams(location.search), HID = QS.get('h')==='1', D2R = Math.PI / 180, $ = s => document.querySelector(s);
// 🌄 the same page as the Environment tab (?env=1, Jordan 2026-10-28): an environment is a ground (tiling textures, painted in patches),
// 3D objects and the words for the place; a scene loads one as its background, locked, and adds the characters
// 🤸 the Pose Creator tab is the same page too (?pose=1, Jordan 2026-10-29): load her rig, describe the action, drag her joints, paint it,
// pick one and her skeleton is matched to that picture

const LKEY = (ENV ? 'rd-envs' : POSE ? 'rd-poses' : 'rd-scenes') + (HID ? '-h' : ''), VKEY = ENV ? 'rd-env-ui' : POSE ? 'rd-pose-ui' : 'rd-scene-ui', EKEY = 'rd-envs' + (HID ? '-h' : '');
const WORD = ENV ? 'Environment' : POSE ? 'Pose' : 'Scene';
const esc = s => String(s==null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;'})[c]);
const uid = p => p + Math.random().toString(36).slice(2, 9);
// ---- where things are kept: Render Deck's PC list (Render first) and the library on it
function deckServers(){ try{ const d = JSON.parse(localStorage.getItem('render-deck-v1')) || {}; return (d.servers || []).filter(x => x.url && x.url!=='test').sort((a, b) => (b.name==='Render') - (a.name==='Render')); }catch(e){ return []; } }
// 🪑 3D models that come with the app (Jordan 2026-10-28: "a chair modeled with geometry"), always in the Object Library list
const ICON_CHAIR = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 100"><g fill="#b5773f" stroke="#24160c" stroke-width="2"><rect x="14" y="8" width="6" height="84"/><rect x="44" y="8" width="6" height="84"/><rect x="14" y="12" width="36" height="8"/><rect x="14" y="30" width="36" height="6"/><rect x="8" y="56" width="48" height="7" fill="#c98a52"/><rect x="10" y="63" width="5" height="30"/><rect x="49" y="63" width="5" height="30"/></g></svg>');
const ICON_MAN = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 100"><g fill="#c9ccd4" stroke="#1d2028" stroke-width="2"><circle cx="32" cy="10" r="7"/><rect x="22" y="19" width="20" height="30" rx="8"/><rect x="13" y="20" width="6" height="34" rx="3"/><rect x="45" y="20" width="6" height="34" rx="3"/><rect x="23" y="48" width="8" height="46" rx="4"/><rect x="33" y="48" width="8" height="46" rx="4"/></g></svg>');
const BUILTIN = [{name:'Wooden chair (3D)', subfolder:'3D/Wooden chair', kind:'obj', mesh:'chair', height:0.9, views:[], icon:ICON_CHAIR},
  {name:'Mannequin (3D)', subfolder:'3D/Mannequin', kind:'char', mesh:'mannequin', height:1.7, views:[], icon:ICON_MAN}];
const PC = {url:'', lib:BUILTIN.slice(), ok:false};
async function findPc(){ for(const s of (window.SCENE_SERVERS || deckServers())){ try{ const r = await fetch(s.url + '/renderdeck/library' + (HID ? '?hidden=1' : ''), {cache:'no-store'}); if(!r.ok) continue; const j = await r.json(); if(!j.library) continue;
      let objs = []; if(j.kinds) try{ objs = ((await (await fetch(s.url + '/renderdeck/library?kind=obj' + (HID ? '&hidden=1' : ''), {cache:'no-store'})).json()).objects || []).map(e => Object.assign(e, {kind:'obj'})); }catch(e){}
      PC.url = s.url; PC.lib = (j.characters || []).concat(objs, BUILTIN); PC.ok = true; return true; }catch(e){} } return false; }
const viewUrl = (e, file) => e.icon ? e.icon : PC.url + '/view?filename=' + encodeURIComponent(file) + '&subfolder=' + encodeURIComponent(e.subfolder) + '&type=output&v=' + Math.round(e.saved || 0);
const libOf = ref => PC.lib.find(e => e.subfolder===ref);
// ---- scenes: on the phone always, on the PC when its helper has /renderdeck/scenes; the newer copy wins
const local = () => { try{ return JSON.parse(localStorage.getItem(LKEY)) || []; }catch(e){ return []; } };
const keepLocal = L => { try{ localStorage.setItem(LKEY, JSON.stringify(L)); }catch(e){} };
let SC = null, ENVS = [], scenesAll = [], ui = (() => { try{ return JSON.parse(localStorage.getItem(VKEY)) || {}; }catch(e){ return {}; } })();
// 🌄 every saved environment (for a scene's background): on the PC with the scenes, and on this phone
function envsFrom(remote){ const by = new Map(); let L = []; try{ L = JSON.parse(localStorage.getItem(EKEY)) || []; }catch(e){}
  for(const s of L.concat(remote.filter(x => x.kind==='env'))){ const o = by.get(s.id); if(!o || (s.saved || 0) > (o.saved || 0)) by.set(s.id, s); }
  ENVS = [...by.values()].filter(s => !s.gone).sort((a, b) => (a.name || '').localeCompare(b.name || '')); }
const envOf = id => id && ENVS.find(x => x.id===id);
async function loadScenes(){ let remote = []; if(PC.url){ try{ const r = await fetch(PC.url + '/renderdeck/scenes' + (HID ? '?hidden=1' : ''), {cache:'no-store'}); if(r.ok) remote = (await r.json()).scenes || []; }catch(e){} }
  envsFrom(remote); remote = remote.filter(KIND);
  if(!PC.url) envsFrom([]);
  const by = new Map(); for(const s of local().concat(remote)){ const o = by.get(s.id); if(!o || (s.saved || 0) > (o.saved || 0)) by.set(s.id, s); }
  scenesAll = [...by.values()].filter(s => !s.gone).sort((a, b) => (b.saved || 0) - (a.saved || 0)); keepLocal([...by.values()]);
  // made or changed on this phone while the PC was off: onto the PC now
  if(PC.url) for(const s of by.values()){ const r = remote.find(x => x.id===s.id); if(!s.gone && (!r || (r.saved || 0) < (s.saved || 0))) fetch(PC.url + '/renderdeck/scenes/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({hidden:HID, scene:s})}).catch(() => {}); } }
let saveT = 0;
function changed(){ if(!SC) return; SC.saved = Date.now(); drawRbg(); const R = rec(); const L = local().filter(s => s.id!==R.id); L.push(R); keepLocal(L); if(ENV){ ENVS = ENVS.filter(x => x.id!==SC.id).concat([SC]); } $('#saved').textContent = 'Saving…'; clearTimeout(saveT); saveT = setTimeout(pushScene, 700); dirty = true; }
async function pushScene(){ if(!SC) return; if(!PC.url){ $('#saved').textContent = 'On this phone'; return; }
  try{ const r = await fetch(PC.url + '/renderdeck/scenes/save', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({hidden:HID, scene:rec()})}); $('#saved').textContent = r.ok ? 'Saved ✓' : 'On this phone'; }
  catch(e){ $('#saved').textContent = 'On this phone'; } }
function newScene(name){ const s = Object.assign({id:uid(ENV ? 'env' : POSE ? 'ps' : 'sc'), name:name || WORD + ' ' + (scenesAll.length + 1), v:1, objs:[], saved:Date.now()}, ENV ? {kind:'env', words:'', ground:{base:0, cells:{}, tileM:2, on:true}} : POSE ? {kind:'pose'} : {}); scenesAll.unshift(s); openScene(s); changed(); }
function openScene(s){ SC = s; if(SCN) s.d3 = true; drawBlend(); drawRbg(); if(SCN && s.rsJob) setTimeout(rsResume, 0); VIMG = ''; loadCam(); ui.scene = s.id; ui.sel = ''; saveUi(); buildObjs(); drawScenes(); drawList(); drawSel(); applyGround(); drawEnvBox(); drawLightBox(); drawFinal(); showImg(''); drawDesc(); dirty = true; }
// ---- 📖 a comic panel (Jordan 2026-10-29: "each panel of the comic would basically be its own camera"): the comic's Scene is shared
// (environment, light, who is in it, where they stand); a panel keeps its own camera, renders and words, and whatever it changes about
// someone (moved, posed, hidden or shown) for itself only. SC is then a merged copy; rec() splits it back into the scene record.
const PANEL_KEYS = ['cam', 'camLock', 'scene', 'rsJob', 'renders', 'desc', 'blend'], OV_KEYS = ['x', 'y', 'z', 'rot', 's', 'hide', 'pose', 'bq', 'words'];
let PANEL = null; // {pid, base (the scene record in scenesAll), label}
const cl = x => x===undefined ? undefined : JSON.parse(JSON.stringify(x)), ovNorm = (k, x) => JSON.stringify(k==='hide' ? !!x : x===undefined ? null : x);
function panelView(base, pid){ const P = (base.panels || {})[pid] || {}, v = cl(base); delete v.panels;
  for(const k of PANEL_KEYS){ if(P[k]!==undefined) v[k] = cl(P[k]); else delete v[k]; }
  if(!v.cam && base.cam) v.cam = cl(base.cam);
  v.objs = (v.objs || []).map(o => { const d = (P.ov || {})[o.id] || {}; for(const k of Object.keys(d)){ if(d[k]===null) delete o[k]; else o[k] = cl(d[k]); } return o; }); return v; }
function rec(){ if(!PANEL || !SC) return SC; const base = PANEL.base, v = SC, P = Object.assign({}, (base.panels || {})[PANEL.pid]), ov = {}, objs = [];

// 🖌 painting the ground (Environment tab): a tap or drag sets the 1 m squares under the finger to the chosen texture
function paintAt(e){ const gd = GD(); if(!gd) return; const b = stage.getBoundingClientRect(), px = e.clientX - b.left, py = e.clientY - b.top, at = viewAt(px, py); if(!at) return;

  const ci = Math.floor(p.x + GN / 2), cj = Math.floor(p.z + GN / 2), o = Math.floor((brush - 1) / 2); let ch = false; gd.cells = gd.cells || {};
  for(let i = ci - o; i < ci - o + brush; i++) for(let j = cj - o; j < cj - o + brush; j++){ if(i < 0 || j < 0 || i >= GN || j >= GN) continue; const k = i + ',' + j;
    if(paintMat < 0 || paintMat===(gd.base || 0)){ if(k in gd.cells){ delete gd.cells[k]; ch = true; } } else if(gd.cells[k]!==paintMat){ gd.cells[k] = paintMat; ch = true; } }

(async function start(){ $('#msg').textContent = 'Opening your ' + WORD.toLowerCase() + 's…'; drawViews(); await findPc(); loadBody(); await loadScenes(); $('#msg').textContent = PC.ok ? '' : 'Your PCs are off, so the scene opens from this phone and the characters show as boxes.';
