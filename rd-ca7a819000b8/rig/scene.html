<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scene</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&family=Pixelify+Sans:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#17181c;--panel:#202228;--panel2:#2a2d35;--line:#363a44;--text:#e8e9ee;--soft:#9aa0ad;--accent:#ff5ca8;--sel:#ffd166;--display:'Pixelify Sans',system-ui,sans-serif}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 Nunito,system-ui,sans-serif}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;min-height:38px;cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);background:var(--panel2)}
button:disabled{opacity:.45}
select,input{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-height:38px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;padding:8px 12px}
.bar select{flex:1;min-width:120px}
.saved{font-size:12px;color:var(--soft);min-width:52px;text-align:right}
.views{display:flex;gap:4px;padding:0 12px 8px}
.views button{flex:1 1 auto;min-width:0;padding:6px 5px;font:700 12px var(--display);white-space:nowrap}
#stage{position:relative;height:58vh;min-height:300px;margin:0 12px;border:1px solid var(--line);border-radius:10px;overflow:hidden;touch-action:none;background:#2b2e35}
#stage canvas{display:block;width:100%;height:100%}
#camctl{position:absolute;right:6px;top:6px;display:flex;gap:4px;z-index:2}#camctl[hidden]{display:none}#camctl button{min-height:30px;padding:3px 9px;font:700 12px Nunito,sans-serif;background:rgba(23,24,28,.8)}
.vlab{position:absolute;font:700 11px var(--display);color:#c9ccd4;background:rgba(0,0,0,.35);padding:2px 6px;border-radius:5px;pointer-events:none}
#msg{position:absolute;left:0;right:0;top:44%;text-align:center;color:var(--soft);pointer-events:none;padding:0 20px}
.cols{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;padding:10px 12px 40px}
@media (min-width:760px){.cols{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.box h2{margin:0 0 8px;font:600 15px var(--display);display:flex;align-items:center;gap:8px}
.box h2 button:first-of-type{margin-left:auto}.box h2 button{min-height:32px;padding:4px 10px;font:700 13px Nunito,sans-serif}
.list{display:grid;gap:4px}
.row{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--bg)}
.row[aria-selected="true"]{border-color:var(--sel)}
.row .nm{flex:1;min-width:0;text-align:left;border:0;background:none;padding:6px 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .ic{min-width:36px;min-height:32px;padding:2px 6px;border:0;background:none}
.row .ic[aria-pressed="false"]{opacity:.35}
.row small{color:var(--soft)}
.note{color:var(--soft);font-size:13px;margin:6px 0}
.warn{color:#ffb4a8;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.grid3 label,.lbl{display:block;font-size:12px;color:var(--soft);margin:6px 0 2px}
.grid3 input{width:100%}
.line{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px}
.tries{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:6px}.tries button{padding:0;min-height:0;background:repeating-conic-gradient(#3a3e48 0 25%,#262930 0 50%) 0 0/14px 14px;border:2px solid var(--line);border-radius:8px;overflow:hidden}.tries button[aria-pressed=true]{border-color:var(--sel)}.tries img{width:100%;display:block;aspect-ratio:3/4;object-fit:contain}
.line input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
#pick{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
#pick[hidden]{display:none}
#pick .sheet{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:min(560px,100%);max-height:75vh;overflow:auto;padding:12px}
#pick .chars{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;margin-top:8px}
#pick .chars button{padding:0;overflow:hidden;text-align:left}
#pick .chars img{display:block;width:100%;height:150px;object-fit:contain;background:#fff}
#pick .chars span{display:block;padding:4px 6px;font-weight:700;font-size:13px}
</style></head>

<div class="bar"><select id="scenes" aria-label="Scene"></select><button id="new">＋ New</button><button id="ren">✎ Rename</button><button id="del">🗑</button><span class="saved" id="saved"></span></div>
<div class="views" role="tablist"><button data-v="cam">📷 Camera</button><button data-v="persp">🕹 Free</button><button data-v="front">Front</button><button data-v="side">Side</button><button data-v="top">Top</button><button data-v="quad">⊞ 4</button></div>
<div id="stage"><div id="msg"></div><div id="camctl" hidden><button id="camlock"></button><button id="camcopy">⤓ Free view’s angle</button></div></div>
<div class="cols">
  <div class="box"><h2>Objects<button id="add">＋ Character</button><button id="addo">＋ Object</button></h2><div class="list" id="objs"></div>
    <p class="note">Tap a name to select it; only the selected one moves. Drag it in any view: Front and Side move it sideways and up, Top, Camera and Free slide it over the floor.</p></div>
  <div class="box" id="selbox"></div>
</div>
<div id="pick" hidden><div class="sheet"><div class="bar" style="padding:0"><b style="font-family:var(--display)" id="pickh">📚 Character Library</b><button id="pickx" style="margin-left:auto">✕</button></div><div class="chars" id="chars"></div></div></div>
