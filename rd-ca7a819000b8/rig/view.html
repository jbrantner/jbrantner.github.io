<title>Pose viewer</title>
<style>

<body><div id="msg"></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">

// the card of the angle nearest the camera (a second, fading card was tried and taken out, Jordan 2026-10-23). Each card: stand (turns to the camera about her feet) › pivot (tilts) › the picture.
const layers = [], mkLayer = top => { const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), new THREE.MeshBasicMaterial({transparent:true, alphaTest:0.4, side:THREE.DoubleSide, depthWrite:!top}));

const HERC = () => new THREE.Vector3(0, sp.geo.aim[1], 0);
const RING_EL = [-25, 5, 35]; // the heights the angles were made from (the rig's low / eye / high rings)
// which picture: the camera's direction round her and its height, as the rig's set does; 16 round when the turn gave them

// 🌄 a 360° background (Jordan 2026-10-23): one long looping panorama on the inside of a ring round the scene, drawn first by

// planted feet (Jordan 2026-10-23: "have the feet look planted in place"): the card turns to the camera about the point on the
// floor where she stands, and each picture is moved and sized so her feet sit on that point and she is as tall as in the front
