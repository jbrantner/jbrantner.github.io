<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<meta name="robots" content="noindex">

<title>Reel</title>
<link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --bg:#111217; --panel:#1b1d23; --panel2:#24262e; --line:#30333c;
  --text:#e8eaee; --soft:#a3aab6; --dim:#7d8592;
  --accent:#ff5ca8; --accent-ink:#1b0b14; --cyan:#33c2c9; --good:#5cffb0; --bad:#f2777f; --warn:#ffb35c;
  --display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);overflow-x:hidden}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
input,select,textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical;min-height:84px}
input[type=range]{padding:0;border:0;background:none;accent-color:var(--accent)}
input[type=checkbox]{width:auto;accent-color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
h1{font:700 22px/1 var(--display);margin:0;letter-spacing:.5px}
h1 i{font-style:normal;color:var(--accent)}
.reelname{flex:1;min-width:0;display:flex;align-items:center;gap:6px;padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-weight:800;font-size:14px;color:var(--soft)}
.reelname span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.icon{width:38px;height:38px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;font-size:17px;color:var(--soft);flex:none}
.dots{display:flex;gap:4px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}
.dot.on{background:var(--good)} .dot.busy{background:var(--warn)}
/* viewport */
.view{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#000;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.view .msg{position:relative;z-index:2;text-align:center;padding:16px;color:var(--soft);font-size:14px}
.view .msg b{display:block;font:700 18px/1.2 var(--display);color:var(--text);margin-bottom:6px}
.view .over{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;gap:6px;align-items:center;pointer-events:none}
.view .over > *{pointer-events:auto}
.chip{font-size:12.5px;font-weight:800;padding:5px 9px;border-radius:99px;background:rgba(17,18,23,.78);border:1px solid rgba(255,255,255,.12);color:var(--text)}
.view .over .sp{flex:1}
.view .prog{position:absolute;left:0;bottom:0;height:3px;background:var(--accent);z-index:4;width:0}
.startbtns{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* wheel */
.wheel{position:relative;height:calc(min(44vw, 230px) * 0.5625 + 20px);margin:12px -16px 4px;perspective:700px;touch-action:pan-y;user-select:none;-webkit-user-select:none;overflow:hidden}
.wi{position:absolute;left:50%;top:50%;width:44%;max-width:230px;aspect-ratio:16/9;border-radius:11px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);will-change:transform}
.wi img,.wi video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.wi.cur{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wi .n{position:absolute;left:5px;top:4px;font-size:11px;font-weight:800;padding:1px 6px;border-radius:99px;background:rgba(17,18,23,.8)}
.wi .ph{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;color:var(--soft);text-align:center;padding:6px}
.wi .bar,.opt .bar{position:absolute;left:0;bottom:0;height:3px;background:var(--accent)}
.wlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);font-weight:700;padding:0 2px}
/* options */
.sec{display:flex;align-items:baseline;gap:8px;margin:14px 0 8px}
.sec h2{font:700 15px/1 var(--display);margin:0;color:var(--soft);letter-spacing:.3px}
.sec .note{flex:1;text-align:right}
.note{font-size:13px;color:var(--dim)}
.warn{font-size:13px;color:var(--warn);margin:6px 0 0}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.opt{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.opt img,.opt video{width:100%;height:100%;object-fit:cover;display:block}
.opt.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.opt .play{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;color:rgba(255,255,255,.85);text-shadow:0 1px 4px #000}
.opt .st{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:11.5px;font-weight:700;color:var(--soft);text-align:center;padding:4px;gap:2px}
.opt .st b{font-size:15px;color:var(--text)}
.opt .x{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:rgba(17,18,23,.8);font-size:12px;display:grid;place-items:center;color:var(--soft)}
.opt .x.sure{background:var(--bad);color:#200}
.opt.bad .st{color:var(--bad)}
.empty{font-size:14px;color:var(--dim);padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.tabs{display:flex;gap:6px;margin:0 0 12px}
.tabs button{flex:1;min-height:44px;display:flex;align-items:center;justify-content:center;gap:6px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font:700 14px/1.1 var(--display);color:var(--soft)}
.tabs button.on{background:var(--panel2);border-color:var(--accent);color:var(--text)}
.chars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.ch{display:flex;flex-direction:column;align-items:center;gap:5px;min-width:0;font-weight:800;font-size:13px;color:var(--soft)}
.ch .pic{width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;position:relative}
.ch .pic img{width:100%;height:100%;object-fit:cover;display:block}
.ch span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch.on .pic{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)} .ch.on{color:var(--text)}
.ch .pic b{position:absolute;right:4px;bottom:4px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-size:12px;display:grid;place-items:center}
.ch.add .pic{border-style:dashed;color:var(--dim)}
.castrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;align-items:center}
.castrow button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:99px;border:1px solid var(--accent);background:var(--panel);font-weight:800;font-size:13.5px}
.castrow button img,.castrow button i{width:28px;height:28px;border-radius:50%;object-fit:cover;background:var(--panel2);display:block}
.castrow button.add{border:1px dashed var(--line);color:var(--soft);padding:9px 13px}
.pics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:6px}
.pics div{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.pics img{width:100%;height:100%;object-fit:cover;display:block}
.pics button{position:absolute;right:3px;top:3px;width:24px;height:24px;border-radius:50%;background:rgba(17,18,23,.85);font-size:12px}
body.lib .bar3{display:none}
.words{font-size:13.5px;color:var(--soft);margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);white-space:pre-wrap;max-height:5.5em;overflow:hidden}
/* bottom bar */
.bar3{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,18,23,.94);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar3 .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.big{padding:14px 8px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:15px}
.big.pri,.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn{padding:10px 14px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:14px}
.btn.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent);color:var(--text)}
/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.card{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 18px/1.2 var(--display)}
.card h3 span{flex:1}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;color:var(--soft);margin:12px 0 5px}
.lab b{color:var(--text)}
.row{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.seg button{flex:1;padding:9px 6px;border-radius:9px;font-weight:800;font-size:14px;color:var(--soft)}
.seg button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.who{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.who button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:99px;border:1px solid var(--line);background:var(--bg);font-weight:800;font-size:13.5px;color:var(--soft)}
.who button img,.who button i{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--panel2);display:block}
.who button.on{border-color:var(--accent);color:var(--text)}
.prev{width:100%;aspect-ratio:16/9;max-height:28vh;object-fit:contain;background:#000;border-radius:10px;display:block}
.trim{position:relative;height:38px;margin:10px 0 2px;border-radius:9px;background:var(--bg);border:1px solid var(--line);touch-action:none}
.trim .keep{position:absolute;top:0;bottom:0;background:rgba(255,92,168,.18);border-left:3px solid var(--accent);border-right:3px solid var(--accent)}
.trim .blend{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,rgba(51,194,201,.35) 0 6px,rgba(51,194,201,.12) 6px 12px)}
.trim .hd{position:absolute;top:-4px;bottom:-4px;width:22px;margin-left:-11px;display:grid;place-items:center}
.trim .hd i{width:6px;height:26px;border-radius:3px;background:var(--accent)}
.trim .ph{position:absolute;top:0;bottom:0;width:2px;background:#fff;opacity:.7}
.list .it{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.list .it:first-child{border-top:0}
.list .it .t{flex:1;min-width:0}
.list .it .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;max-width:min(92vw,520px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#eng{position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;opacity:0;pointer-events:none}
</style>
</head><body>
<div class="wrap">
  <header>
    <h1>🎞<i>Reel</i></h1>
    <button class="reelname" id="reelBtn"><span id="reelName">…</span>▾</button>
    <div class="dots" id="dots" aria-label="PCs"></div>
    <button class="icon" id="setBtn" aria-label="Settings">⚙</button>
  </header>
  <div class="tabs" id="tabs"><button data-tab="reel" class="on">🎞 Reel</button><button data-tab="lib">📚 Library</button></div>
  <div id="reelTab">
  <div class="view" id="view">
    <video id="vA" playsinline muted preload="auto"></video>
    <video id="vB" playsinline muted preload="auto" hidden></video>
    <div class="msg" id="vmsg"></div>
    <div class="over" id="vover" hidden><span class="chip" id="vInfo"></span><span class="sp"></span><button class="chip" id="allBtn">▶ Play all</button><button class="chip" id="sndBtn" aria-label="Sound">🔇</button></div>
    <div class="prog" id="vprog"></div>
  </div>
  <div class="wheel" id="wheel"></div>
  <div class="wlab" id="wlab"></div>
  <div id="warnBox"></div>
  <div class="sec"><h2>Options</h2><span class="note" id="optNote"></span></div>
  <div class="opts" id="opts"></div>
  <div class="words" id="words" hidden></div>
  <div class="sec"><h2>👥 In this reel</h2><span class="note"></span></div>
  <div class="castrow" id="castRow"></div>
  </div>
  <div id="libTab" hidden>
    <div class="note">Characters from H3 Deck's 📚 Library and the ones you make here. Tap one to put her in this reel: she's then picked in 👥 Who's in it for every new clip, and her pictures go with her.</div>
    <div class="sec"><h2>In this reel</h2></div><div class="chars" id="libIn"></div>
    <div class="sec"><h2>All characters</h2></div><div class="chars" id="libAll"></div>
  </div>
</div>
<div class="bar3"><div class="in">
  <button class="big" id="redoBtn">↻ Redo</button>
  <button class="big" id="editBtn">✂ Edit</button>
  <button class="big pri" id="nextBtn">➕ Next</button>
</div></div>
<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<iframe id="eng" title="engine" aria-hidden="true" tabindex="-1"></iframe>
<script>
'use strict';
// 🎞 Reel (Jordan 2026-11-20): a very simple clip maker on H3 Deck's engine. One reel = clips in order; each clip has its options
// (takes) and the one picked plays. ➕ Next carries on from the clip; with a clip after it, ⇿ Insert makes new seconds between the two.
// ↻ Redo makes more options that line up with the clips around it. ✂ Edit trims a clip (blending its end into the next one) or changes
// a stretch of it. H3 Deck runs hidden in a frame (../h3-a875336252cb/?engine=1) and does all the rendering; its 📚 Library,
// PCs and look are shared, its own takes and films are left alone.
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = s => (Math.round((+s || 0) * 10) / 10).toFixed(1).replace(/\.0$/, '') + ' s';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const KEY = 'h3reel', THK = 'h3reel_th', ENGINE_URL = window.REEL_ENGINE || '../h3-a875336252cb/?engine=1';
function toast(t, ms){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3200); }
window.ReelToast = (t, ms) => { if(/settings are back in the form|Its settings/i.test(t)) return; toast(t, Math.min(ms || 3200, 6000)); };

// ---------- state ----------
function load(){ let s = {}; try{ s = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; }catch(e){}
  s.reels = s.reels || []; if(!s.reels.length) s.reels.push(newReel('Reel 1')); if(!s.reels.find(r => r.id===s.open)) s.open = s.reels[0].id;
  s.n = s.n || 2; return s; }
function newReel(name){ return {id:uid('r'), name, clips:[], cur:0, t:Date.now()}; }
let S = load(), TH = {}; try{ TH = JSON.parse(localStorage.getItem(THK) || '{}') || {}; }catch(e){}
let saveT = 0; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast("Couldn't save: the phone's space for this app is full"); } }, 120); };
const saveTh = () => { const ks = Object.keys(TH); if(ks.length > 500) ks.slice(0, ks.length - 500).forEach(k => delete TH[k]); try{ localStorage.setItem(THK, JSON.stringify(TH)); }catch(e){} };
const R = () => S.reels.find(r => r.id===S.open);
const clips = () => R().clips;
const curI = () => clamp(R().cur || 0, 0, Math.max(0, clips().length - 1));
const cur = () => clips()[curI()] || null;

// ---------- engine (H3 Deck, hidden) ----------
let E = null, INFO = {}, READY = false;
const eng = $('#eng'); eng.src = ENGINE_URL;
function engOk(){ try{ const w = eng.contentWindow; if(w && w.H3Engine){ E = w.H3Engine; return true; } }catch(e){} return false; }
const info = id => INFO[id] || (E && id ? (INFO[id] = E.info(id)) : {state:'gone'});
const doneOf = id => info(id).state==='done';
const lenOf = c => { if(!c || !c.pick) return 0; const I = info(c.pick), d = I.secs || 0; return Math.max(0, (c.out != null ? Math.min(c.out, d || c.out) : d) - (c.in || 0)); };
const endOf = c => { const d = info(c.pick).secs || 0; return c.out != null ? Math.min(c.out, d || c.out) : d; };

// a clip's picked option: the one you tapped; until then the first to finish
function autoPick(c){ if(c.pick && c.takes.includes(c.pick) && !/failed|gone/.test(info(c.pick).state)) return false;
  const d = c.takes.find(doneOf) || c.takes.find(id => info(id).state==='working') || c.takes[0] || null;
  if(d!==c.pick){ c.pick = d; return true; } return false; }

// ---------- thumbnails (a frame of each option, kept small on the phone) ----------
const GRAB = [], GRABBING = {};
function thumbOf(id, at){ const k = id + '@' + (Math.round((at || 0) * 10) / 10); if(TH[k]) return TH[k];
  if(!GRABBING[k] && doneOf(id)){ GRABBING[k] = 1; GRAB.push({k, id, at}); grabNext(); } return ''; }
let grabBusy = false;
async function grabNext(){ if(grabBusy) return; const j = GRAB.shift(); if(!j) return; grabBusy = true;
  try{ TH[j.k] = await frameAt(info(j.id).url, j.at); saveTh(); draw(); }catch(e){ TH[j.k] = 'v'; } grabBusy = false; grabNext(); }
function frameAt(url, at){ return new Promise((ok, no) => { const v = document.createElement('video'); v.muted = true; v.playsInline = true; v.preload = 'auto'; v.crossOrigin = 'anonymous';
  const tm = setTimeout(() => { v.removeAttribute('src'); v.load(); no(new Error('slow')); }, 20000);
  v.onloadeddata = () => { try{ v.currentTime = clamp(at || 0.05, 0.05, Math.max(0.05, (v.duration || 1) - 0.05)); }catch(e){ no(e); } };
  v.onseeked = () => { try{ const c = document.createElement('canvas'), s = 320 / Math.max(v.videoWidth, v.videoHeight); c.width = Math.round(v.videoWidth * s); c.height = Math.round(v.videoHeight * s);
    c.getContext('2d').drawImage(v, 0, 0, c.width, c.height); const u = c.toDataURL('image/jpeg', 0.72); clearTimeout(tm); v.removeAttribute('src'); v.load(); ok(u); }catch(e){ clearTimeout(tm); no(e); } };
  v.onerror = () => { clearTimeout(tm); no(new Error('no video')); }; v.src = url; }); }
function picHtml(id, at){ const t = thumbOf(id, at); if(t && t!=='v') return `<img src="${t}" alt="">`;
  if(t==='v'){ const u = info(id).url; return u ? `<video muted playsinline preload="metadata" src="${esc(u)}#t=${(at || 0.05).toFixed(2)}"></video>` : ''; } return ''; }

// ---------- drawing ----------
let WP = 0, WANIM = 0; // the wheel's position (clip index, fractional while dragging)
function draw(){ drawTop(); drawWheel(); drawOpts(); drawButtons(); drawView(); drawCast(); if(TAB==='lib') drawLib(); }
// ---------- 📚 Library tab: characters (H3 Deck's 📚 Library plus the ones made here); the ones in this reel go into every new clip ----------
let TAB = 'reel';
function setTab(t){ TAB = t; $$('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab===t)); $('#reelTab').hidden = t!=='reel'; $('#libTab').hidden = t!=='lib';
  document.body.classList.toggle('lib', t==='lib'); if(t==='lib'){ $('#libIn').dataset.sig = ''; drawLib(); } else { VSIG = ''; draw(); } window.scrollTo(0, 0); }
$('#tabs').onclick = e => { const b = e.target.closest('[data-tab]'); if(b) setTab(b.dataset.tab); };
const PICS = {}; // media id -> picture link (from the phone's copy)
function picSrc(id, thumb){ if(PICS[id]) return PICS[id]; if(/^data:/.test(thumb || '')) return thumb; // (the small preview H3 Deck kept is enough here)

// ---------- the wheel: drag it round, it snaps a clip into the middle ----------
(() => { const box = $('#wheel'); let x0 = 0, p0 = 0, drag = false, moved = false, lastX = 0, lastT = 0, vel = 0;
  box.addEventListener('pointerdown', e => { if(!clips().length) return; drag = true; moved = false; x0 = lastX = e.clientX; lastT = performance.now(); p0 = WP; vel = 0; cancelAnimationFrame(WANIM); box.setPointerCapture(e.pointerId); });
  box.addEventListener('pointermove', e => { if(!drag) return; const dx = e.clientX - x0; if(Math.abs(dx) > 6) moved = true; const STEP = (box.clientWidth || 360) * 0.36;
    const now = performance.now(); vel = (e.clientX - lastX) / Math.max(1, now - lastT); lastX = e.clientX; lastT = now;
    WP = clamp(p0 - dx / STEP, -0.45, clips().length - 0.55); placeWheel(); });
  const end = e => { if(!drag) return; drag = false; const STEP = (box.clientWidth || 360) * 0.36;
    if(!moved){ const hit = document.elementFromPoint(e.clientX, e.clientY), el = hit && hit.closest && hit.closest('.wi'); if(el){ go(+el.dataset.i); } else animWheel(curI()); return; }

    if(flick && Math.round(d)===0) t = Math.round(p0) + flick; go(clamp(t, 0, clips().length - 1)); };

const nRow = n => `<div class="lab"><span>Options to make</span></div><div class="seg" id="nSeg">${[1, 2, 3, 4].map(k => `<button data-n="${k}" class="${k===n ? 'on' : ''}">${k}</button>`).join('')}</div>`;
function nWire(o){ $$('#nSeg button').forEach(b => b.onclick = () => { o.n = S.n = +b.dataset.n; save(); $$('#nSeg button').forEach(x => x.classList.toggle('on', x===b)); }); }
const lenRow = (id, v, lo, hi, lab) => `<div class="lab"><span>${lab || 'Length'}</span><b id="${id}V">${fmt(v)}</b></div><input type="range" id="${id}" min="${lo}" max="${hi}" step="0.1" value="${v}">`;
function lenWire(id, o, k){ const el = $('#' + id); el.oninput = () => { o[k] = +el.value; $('#' + id + 'V').textContent = fmt(o[k]); }; }
async function send(btn, fn, okMsg){ btn.disabled = true; const was = btn.textContent; btn.textContent = 'Sending…'; let r = null; try{ r = await fn(); }catch(e){ r = {err:e.message}; }
  if(!r || r.err || !(r.ids || []).length){ btn.disabled = false; btn.textContent = was; toast((r && r.err) || 'Not sent', 6000); return null; }
  closeSheet(); if(okMsg) toast(okMsg); return r.ids; }
function words0(c){ return untime(c && c.words || ''); }
function setSubNames(){ try{ const w = eng.contentWindow, H = w.H3; SUBN = {}; (H.S.cast || []).forEach(c => SUBN[c.n] = H.castName(c)); }catch(e){} }

// ✍ the first clip (or a fresh one after the current)
function makeSheet(){ const o = {words:'', who:castOf().slice(), secs:5, n:S.n || 2};
  sheet(`<h3><span>✍ New clip</span><button class="btn" data-close>✕</button></h3>
    <div class="lab"><span>What happens</span></div><textarea id="mkW" rows="4" placeholder="Mia walks into the kitchen and pours a coffee, then looks out of the window."></textarea>
    ${whoHtml(o.who)}${lenRow('mkL', o.secs, 1, 5)}${nRow(o.n)}
    <button class="big pri" id="mkGo" style="width:100%;margin-top:14px">Render</button>`);
  whoWire(o.who, $('#mkW')); lenWire('mkL', o, 'secs'); nWire(o);
  $('#mkGo').onclick = async () => { o.words = $('#mkW').value.trim(); if(!o.words){ toast('Write what happens first'); return; }
    const ids = await send($('#mkGo'), () => E.make(o)); if(!ids) return; addClip(clips().length, {kind:'new', words:o.words, who:o.who, takes:ids}); }; }
function addClip(at, c){ const nc = Object.assign({id:uid('c'), takes:[], pick:null, in:0, out:null, words:'', who:[], meta:{}}, c); clips().splice(at, 0, nc); R().cur = at; WP = at; autoPick(nc); save(); refresh(); return nc; }
function addTakes(c, ids, meta){ c.takes = c.takes.concat(ids); c.meta = c.meta || {}; ids.forEach(id => c.meta[id] = meta || {}); autoPick(c); save(); refresh(); }

// 📤 a clip from the phone
function uploadPick(){ const inp = document.createElement('input'); inp.type = 'file'; inp.accept = 'video/*';
  inp.onchange = async () => { const f = inp.files && inp.files[0]; if(!f) return; const r = await E.upload({file:f}); if(!r || r.err){ toast((r && r.err) || 'Not uploaded', 6000); return; }
    addClip(clips().length, {kind:'upload', words:'', takes:r.ids}); toast('📤 Getting your clip ready on the PC (a few seconds)'); }; inp.click(); }

// ➕ Next / ⇿ Insert
function nextSheet(){ const i = curI(), c = cur(), N = clips()[i + 1]; if(!c) return;
  const o = {words:'', who:[...new Set([].concat(castOf(), c.who || []))], secs:N ? 2 : 5, n:S.n || 2};
  sheet(`<h3><span>${N ? '⇿ Insert between clip ' + (i + 1) + ' and ' + (i + 2) : '➕ Next clip'}</span><button class="btn" data-close>✕</button></h3>
    <div class="note">${N ? 'New seconds between the two: it starts on the last frames of this clip and lands on the first frames of the next one, so the action slots in between.' : 'Carries on from the end of this clip (' + fmt(endOf(c)) + '), with its last second as context.'}</div>
    <div class="lab"><span>What happens ${N ? 'in between' : 'next'}</span></div><textarea id="nxW" rows="4" placeholder="${N ? 'She sets the cup down and turns toward the door.' : 'She turns and smiles at the camera.'}"></textarea>
    ${whoHtml(o.who)}${lenRow('nxL', o.secs, N ? 0.5 : 1, 5, N ? 'Seconds to add' : 'Length')}${nRow(o.n)}
    <button class="big pri" id="nxGo" style="width:100%;margin-top:14px">${N ? '⇿ Insert' : '➕ Render next'}</button>`);
  whoWire(o.who, $('#nxW')); lenWire('nxL', o, 'secs'); nWire(o);
  $('#nxGo').onclick = async () => { o.words = $('#nxW').value.trim(); if(!o.words && !N){ toast('Write what happens next first'); return; }
    if(N){ const ids = await send($('#nxGo'), () => E.fill({takeA:c.pick, outA:endOf(c), takeB:N.pick, inB:N.in || 0, secs:o.secs, words:o.words, who:o.who, n:o.n}), '⇿ Sent: it goes between the two clips');
      if(ids){ const nc = addClip(i + 1, {kind:'insert', words:o.words, who:o.who}); addTakes(nc, ids, {after:c.pick, before:N.pick}); } return; }
    const ids = await send($('#nxGo'), () => E.carry({take:c.pick, at:endOf(c), words:o.words, who:o.who, secs:o.secs, n:o.n}), '➕ Sent');
    if(ids){ const nc = addClip(i + 1, {kind:'next', words:o.words, who:o.who}); addTakes(nc, ids, {after:c.pick}); } }; }

// ↻ Redo: more options for this clip that line up with the clips around it
function redoPlan(i){ const cs = clips(), c = cs[i], P = cs[i - 1], N = cs[i + 1], L = clamp(lenOf(c) || (c.secs || 5), 0.5, 5);
  if(P && !doneOf(P.pick)) return {err:'The clip before is still rendering'}; if(N && !doneOf(N.pick)) return {err:'The clip after is still rendering'};
  if(P && N) return {how:'⇿ Lands between the clip before and the clip after, so it lines up with both.', secs:L, lo:0.5, run:o => E.fill({takeA:P.pick, outA:endOf(P), takeB:N.pick, inB:N.in || 0, secs:o.secs, words:o.words, who:o.who, n:o.n}), meta:{after:P.pick, before:N.pick}};
  if(P) return {how:'➕ Carries on from the end of the clip before, like the first time.', secs:L, lo:1, run:o => E.carry({take:P.pick, at:endOf(P), words:o.words, who:o.who, secs:o.secs, n:o.n}), meta:{after:P.pick}};
  if(N) return {how:'⏪ Leads into the clip after, so it lands on its first frame.', secs:L, lo:1, run:o => E.lead({take:N.pick, at:N.in || 0, secs:o.secs, words:o.words, who:o.who, n:o.n}), meta:{before:N.pick}};
  if(c.kind==='upload') return {err:'An uploaded clip can\'t be made again: try ✂ Edit › 🎨 Change it'};
  const base = c.takes.find(doneOf) || c.pick; if(!base) return {err:'Wait for an option to finish first'};
  return {how:'The same settings again, with your words.', secs:L, lo:1, run:o => E.again({take:base, words:o.words, who:o.who, secs:o.secs, n:o.n}), meta:{}}; }
function redoSheet(){ const i = curI(), c = cur(); if(!c) return; const P = redoPlan(i); if(P.err){ toast(P.err, 5000); return; }
  const o = {words:words0(c), who:[...new Set([].concat(castOf(), c.who || [], (clips()[i - 1] || {}).who || [], (clips()[i + 1] || {}).who || []))], secs:Math.round(P.secs * 10) / 10, n:S.n || 2};
  sheet(`<h3><span>↻ More options for clip ${i + 1}</span><button class="btn" data-close>✕</button></h3>
    <div class="note">${P.how}</div>
    <div class="lab"><span>What happens</span></div><textarea id="rdW" rows="4">${esc(o.words)}</textarea>
    ${whoHtml(o.who)}${lenRow('rdL', o.secs, P.lo, 5)}${nRow(o.n)}
    <button class="big pri" id="rdGo" style="width:100%;margin-top:14px">↻ Make ${o.n > 1 ? 'more options' : 'another option'}</button>`);
  whoWire(o.who, $('#rdW')); lenWire('rdL', o, 'secs'); nWire(o);
  $('#rdGo').onclick = async () => { o.words = $('#rdW').value.trim(); if(!o.words){ toast('Write what happens'); return; }
    const ids = await send($('#rdGo'), () => P.run(o), '↻ Sent: the new options show up under this clip'); if(ids){ c.words = o.words || c.words; addTakes(c, ids, P.meta); } }; }

// ✂ Edit: trim the clip (its end can blend into the next clip) or 🎨 change a stretch of it
function editSheet(m0){ const i = curI(), c = cur(); if(!c || !doneOf(c.pick)) return; const I = info(c.pick), D = I.secs || 5, N = clips()[i + 1];
  const o = {mode:m0 || 'trim', a:c.in || 0, b:endOf(c), blend:N ? 1 : 0, ca:c.in || 0, cb:endOf(c), words:words0(c), str:0.6, n:S.n || 2};
  sheet(`<h3><span>✂ Edit clip ${i + 1}</span><button class="btn" data-close>✕</button></h3>
    <div class="seg" id="edM"><button data-m="trim">✂ Length</button><button data-m="change">🎨 Change it</button></div>
    <video class="prev" id="edV" muted playsinline preload="auto" src="${esc(I.url)}" style="margin-top:10px"></video>
    <div class="trim" id="edT"><div class="keep" id="edK"></div><div class="blend" id="edB"></div><div class="ph" id="edP"></div><div class="hd" data-h="a"><i></i></div><div class="hd" data-h="b"><i></i></div></div>
    <div class="lab" style="margin-top:4px"><span id="edAV"></span><span id="edLen"></span><span id="edBV"></span></div>
    <div id="edTrim">
      ${N ? `<label class="row" style="align-items:center;gap:8px;margin-top:8px"><input type="checkbox" id="edBl" checked><span>🪄 Blend the end into the next clip</span></label>
      <div id="edBlW">${lenRow('edBlL', o.blend, 0.5, 2, 'Blend over the last')}<div class="note">The striped part at the end is made again so it flows into clip ${i + 2}: the clip up to there is kept as context, and it lands exactly on clip ${i + 2}'s first frame. It shows up as a small 🪄 clip between them, with its own options.</div></div>` : ''}
      <button class="big pri" id="edGo" style="width:100%;margin-top:14px">✓ Save length</button>
    </div>
    <div id="edCh" hidden>
      <div class="lab"><span>What it should be now</span></div><textarea id="edW" rows="3">${esc(o.words)}</textarea>
      <div class="lab"><span>How much it changes</span><b id="edSV"></b></div><input type="range" id="edS" min="0.3" max="1" step="0.05" value="${o.str}">
      <div class="note" id="edSN"></div>${nRow(o.n)}
      <button class="big pri" id="edCGo" style="width:100%;margin-top:14px">🎨 Change it</button>
    </div>
    <button class="btn" id="edDel" style="width:100%;margin-top:16px;color:var(--bad)">🗑 Remove this clip</button>`);
  const v = $('#edV'), T = $('#edT');
  const lim = () => o.mode==='trim' ? [o, 'a', 'b'] : [o, 'ca', 'cb'];
  const show = (which) => { const [, ka, kb] = lim(); const A = o[ka], B = o[kb], bl = o.mode==='trim' && N && $('#edBl') && $('#edBl').checked ? Math.min(o.blend, Math.max(0, B - A - 0.5)) : 0;
    $('#edK').style.left = (A / D * 100) + '%'; $('#edK').style.width = ((B - A) / D * 100) + '%';
    $('#edB').style.left = ((B - bl) / D * 100) + '%'; $('#edB').style.width = (bl / D * 100) + '%';
    T.querySelector('[data-h="a"]').style.left = (A / D * 100) + '%'; T.querySelector('[data-h="b"]').style.left = (B / D * 100) + '%';
    $('#edAV').textContent = o.mode==='trim' ? 'Starts ' + fmt(A) : 'From ' + fmt(A); $('#edBV').textContent = o.mode==='trim' ? 'Ends ' + fmt(B) : 'to ' + fmt(B); $('#edLen').textContent = fmt(B - A);
    if(which){ try{ v.currentTime = which==='a' ? A : Math.max(0, B - 0.04); }catch(e){} } };
  const mode = () => { $$('#edM button').forEach(b => b.classList.toggle('on', b.dataset.m===o.mode)); $('#edTrim').hidden = o.mode!=='trim'; $('#edCh').hidden = o.mode!=='change'; show();
    const s = o.str; $('#edSV').textContent = s >= 0.99 ? 'all new' : Math.round(s * 100) + '%';
    $('#edSN').textContent = (s >= 0.9 ? 'Made nearly from scratch between the frames around it.' : s >= 0.6 ? 'Big changes, but the same layout and timing.' : s >= 0.45 ? 'Keeps the movement and layout, changes the details and look.' : 'A light touch: small fixes.') + ' Pick the stretch above; the frames just outside it are pinned, so it still lines up with what comes before and after.'; };
  $$('#edM button').forEach(b => b.onclick = () => { o.mode = b.dataset.m; mode(); });
  // drag the handles on the strip (or tap near one)
  let H = null; const posAt = x => { const r = T.getBoundingClientRect(); return clamp((x - r.left) / r.width, 0, 1) * D; };
  T.addEventListener('pointerdown', e => { const [, ka, kb] = lim(), t = posAt(e.clientX); H = Math.abs(t - o[ka]) < Math.abs(t - o[kb]) ? 'a' : 'b'; T.setPointerCapture(e.pointerId); mv(e); });
  const mv = e => { if(!H) return; const [, ka, kb] = lim(), t = Math.round(posAt(e.clientX) * 24) / 24, min = o.mode==='trim' ? 0.5 : 0.3;
    if(H==='a') o[ka] = clamp(t, 0, o[kb] - min); else o[kb] = clamp(t, o[ka] + min, D); show(H); };
  T.addEventListener('pointermove', mv); T.addEventListener('pointerup', () => { H = null; }); T.addEventListener('pointercancel', () => { H = null; });
  v.addEventListener('timeupdate', () => { $('#edP').style.left = (v.currentTime / D * 100) + '%'; });
  v.addEventListener('click', () => { if(v.paused){ const [, ka, kb] = lim(); if(v.currentTime >= o[kb] - 0.05 || v.currentTime < o[ka]) v.currentTime = o[ka]; v.play().catch(() => {}); } else v.pause(); });
  v.addEventListener('timeupdate', () => { const [, ka, kb] = lim(); if(!v.paused && v.currentTime >= o[kb]) v.pause(); });
  if($('#edBl')){ $('#edBl').onchange = () => { $('#edBlW').hidden = !$('#edBl').checked; show(); }; $('#edBlL').oninput = e => { o.blend = +e.target.value; $('#edBlLV').textContent = fmt(o.blend); show(); }; }
  $('#edS').oninput = e => { o.str = +e.target.value; mode(); }; nWire(o); mode();
  $('#edGo').onclick = async () => { const blend = N && $('#edBl') && $('#edBl').checked && o.b < D - 0.05 ? Math.min(o.blend, Math.max(0, o.b - o.a - 0.5)) : 0;
    c.in = o.a; c.out = o.b >= D - 0.02 ? null : o.b;
    if(blend >= 0.3){ const ids = await send($('#edGo'), () => E.fill({takeA:c.pick, outA:o.b - blend, takeB:N.pick, inB:N.in || 0, secs:blend, words:words0(c) || words0(N), n:o.n || 1}), '🪄 Blending the end into the next clip');
      if(!ids){ save(); draw(); return; } c.out = o.b - blend; const nc = addClip(i + 1, {kind:'blend', words:words0(c) || words0(N)}); addTakes(nc, ids, {after:c.pick, before:N.pick}); R().cur = i; WP = i; save(); refresh(); return; }
    closeSheet(); VSIG = ''; save(); draw(); toast('✂ ' + fmt(lenOf(c))); };
  $('#edCGo').onclick = async () => { const w = $('#edW').value.trim(); if(!w){ toast('Write what it should be now'); return; }
    let b = o.cb; if(N && b > D - 0.5) b = D - 0.5; // (the last half second stays pinned, so it still lands on the next clip)
    const ids = await send($('#edCGo'), () => E.redo({take:c.pick, a:Math.max(0.2, o.ca), b: b >= D - 0.05 ? D + 1 : b, words:w, str:o.str, n:o.n}), '🎨 Sent: the changed versions show up as new options of this clip');
    if(ids) addTakes(c, ids, (c.meta || {})[c.pick] || {}); };
  $('#edDel').onclick = () => { const b = $('#edDel'); if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = '🗑 Tap again to remove clip ' + (i + 1); return; }
    const gone = clips().splice(i, 1)[0]; if(E) E.forget(gone.takes.filter(id => info(id).state!=='working')); R().cur = Math.max(0, i - 1); WP = R().cur; closeSheet(); save(); refresh();
    if(clips()[i] && i > 0) toast('Removed. If the clips around it now jump, ⇿ Insert can bridge them', 5000); }; }

// ⚙ settings and reels
function setSheet(){ const L = E ? E.look() : {}, M = E ? E.models() : [], pcs = E ? E.pcs() : [];
  sheet(`<h3><span>⚙ Settings</span><button class="btn" data-close>✕</button></h3>
    <div class="note">Reel uses H3 Deck's engine: its 📚 Library (characters, LoRAs), your PCs and its models. Edit characters in H3 Deck; they show up here the next time Reel opens.</div>
    <div class="lab"><span>Model for new clips</span></div><select id="stM">${M.map(x => `<option value="${esc(x.key)}" ${x.key===L.model ? 'selected' : ''}>${esc(x.label)}</option>`).join('') || '<option>No PCs reached yet</option>'}</select>
    <div class="lab"><span>Shape for new clips</span></div><div class="seg" id="stA">${[['16:9', 'Wide'], ['9:16', 'Tall'], ['1:1', 'Square']].map(([k, n]) => `<button data-a="${k}" class="${L.aspect===k ? 'on' : ''}">${n}</button>`).join('')}</div>
    <div class="lab"><span>PCs</span></div><div class="list">${pcs.map(p => `<div class="it"><span class="dot ${p.online ? (p.busy ? 'busy' : 'on') : ''}"></span><div class="t"><b>${esc(p.name)}</b><span class="note">${p.on ? (p.online ? (p.busy ? 'rendering' : 'ready') : "can't reach it (Tailscale on? ComfyUI open?)") : 'off in H3 Deck'}</span></div></div>`).join('')}</div>
    <a class="btn" href="../h3-a875336252cb/" style="display:block;text-align:center;margin-top:14px;text-decoration:none">Open H3 Deck</a>`);
  const m = $('#stM'); if(m) m.onchange = () => E.setLook({model:m.value});
  $$('#stA button').forEach(b => b.onclick = () => { E.setLook({aspect:b.dataset.a}); $$('#stA button').forEach(x => x.classList.toggle('on', x===b)); }); }
function reelSheet(){ sheet(`<h3><span>🎞 Reels</span><button class="btn" data-close>✕</button></h3>
    <div class="list">${S.reels.map(r => `<div class="it"><div class="t"><b>${esc(r.name)}${r.id===S.open ? ' ·  open' : ''}</b><span class="note">${r.clips.length} ${r.clips.length===1 ? 'clip' : 'clips'}</span></div><button class="btn" data-open="${r.id}">Open</button><button class="btn" data-ren="${r.id}" aria-label="Rename">✏</button>${S.reels.length > 1 ? `<button class="btn" data-del="${r.id}" aria-label="Delete">🗑</button>` : ''}</div>`).join('')}</div>
    <button class="big pri" id="rlNew" style="width:100%;margin-top:12px">＋ New reel</button>`);
  $('#card').onclick = e => { const b = e.target.closest('button'); if(!b) return;
    if(b.dataset.open){ if(ALL) stopAll(); S.open = b.dataset.open; WP = curI(); VSIG = ''; save(); closeSheet(); refresh(); }
    else if(b.dataset.ren){ const r = S.reels.find(x => x.id===b.dataset.ren), n = prompt('Name', r.name); if(n && n.trim()){ r.name = n.trim(); save(); reelSheet(); draw(); } }
    else if(b.dataset.del){ if(!b.dataset.sure){ b.dataset.sure = 1; b.textContent = 'Sure?'; return; } const k = S.reels.findIndex(x => x.id===b.dataset.del), r = S.reels.splice(k, 1)[0];
      if(E) E.forget(r.clips.flatMap(c => c.takes)); if(S.open===r.id) S.open = S.reels[0].id; WP = curI(); VSIG = ''; save(); reelSheet(); refresh(); }
    else if(b.id==='rlNew'){ const r = newReel('Reel ' + (S.reels.length + 1)); S.reels.unshift(r); S.open = r.id; WP = 0; VSIG = ''; save(); closeSheet(); refresh(); } }; }

// ---------- buttons ----------
$('#nextBtn').onclick = () => nextSheet();
$('#redoBtn').onclick = () => redoSheet();
$('#editBtn').onclick = () => editSheet();
$('#setBtn').onclick = () => setSheet();
$('#reelBtn').onclick = () => reelSheet();
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if(!b) return; if(!READY){ toast('Still starting…'); return; }
  if(b.dataset.act==='make') makeSheet(); else if(b.dataset.act==='upload') uploadPick(); });

// ---------- following the renders ----------
function refresh(){ INFO = {}; if(E){ setSubNames(); for(const c of clips()) autoPick(c); } draw(); }
async function boot(){ for(let i = 0; i < 600 && !engOk(); i++) await new Promise(r => setTimeout(r, 100));
  if(!E){ $('#vmsg').innerHTML = "<b>Couldn't start</b>H3 Deck's engine didn't load. Pull down to reload."; return; }
  for(let i = 0; i < 150 && !E.ready(); i++){ drawTop(); await new Promise(r => setTimeout(r, 200)); }
  READY = true; if(!E.ready()) toast("Can't reach the PCs yet. Is Tailscale on?", 6000); WP = curI(); refresh();
  setInterval(() => { if(document.hidden) return; refresh(); }, 1500); }
document.addEventListener('visibilitychange', () => { if(!document.hidden && E){ E.refresh(); refresh(); } });
window.addEventListener('resize', () => placeWheel());
draw(); boot();
window.REEL = {setTab, S:() => S, R, cur, clips, go, info:id => info(id), redoPlan, addClip, refresh, E:() => E, TH:() => TH};
</script>
</body></html>
