<style>
:root{
  --bg:#111217; --panel:#1b1d23; --panel2:#24262e; --line:#30333c;
  --text:#e8eaee; --soft:#a3aab6; --dim:#7d8592;
  --accent:#ff5ca8; --accent-ink:#1b0b14; --cyan:#33c2c9; --good:#5cffb0; --bad:#f2777f; --warn:#ffb35c; --key:#ffd166;
  --display:"Pixelify Sans","Courier New",ui-monospace,monospace;
  --body:"Nunito",ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 var(--body);overflow-x:hidden}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:disabled{opacity:.4;cursor:default}
textarea{font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent)}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;gap:10px;padding:12px 0 10px}
h1{font:700 20px/1 var(--display);margin:0;letter-spacing:.5px;white-space:nowrap}
h1 i{font-style:normal;color:var(--key)}
.back{padding:8px 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);font-weight:800;font-size:14px;color:var(--soft);text-decoration:none;white-space:nowrap}
.rname{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:14px;color:var(--soft)}
.dots{display:flex;gap:4px}.dot{width:8px;height:8px;border-radius:50%;background:var(--dim)}.dot.on{background:var(--good)}.dot.busy{background:var(--warn)}
.view{position:relative;border:1px solid var(--line);border-radius:var(--r);background:#000;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center}
.view video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.view .msg{position:relative;z-index:2;text-align:center;padding:16px;color:var(--soft);font-size:14px}
.view .msg b{display:block;font:700 18px/1.2 var(--display);color:var(--text);margin-bottom:6px}
.over{position:absolute;left:8px;right:8px;bottom:8px;z-index:3;display:flex;gap:6px;align-items:center}
.over .sp{flex:1}
.chip{font-size:12.5px;font-weight:800;padding:5px 9px;border-radius:99px;background:rgba(17,18,23,.78);border:1px solid rgba(255,255,255,.12);color:var(--text)}
/* the one-video scrubber with keyframe dots */
.scrub{position:relative;height:74px;margin:12px -16px 2px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none;overflow:hidden}
.scrub .tk{position:absolute;top:0;width:1px;height:8px;background:var(--line)}.scrub .tk.b{height:14px;background:var(--dim)}
.scrub .tk b{position:absolute;top:13px;left:3px;font-size:10.5px;font-weight:700;color:var(--dim)}
.scrub .tr{position:absolute;top:44px;height:3px;border-radius:2px;background:var(--line)}
.scrub .ln{position:absolute;top:41px;height:9px;border-radius:5px;background:color-mix(in srgb,var(--accent) 70%,transparent)}
.scrub .lk{position:absolute;top:43px;height:5px;border-radius:3px;background:var(--accent);pointer-events:none;z-index:1}.scrub .lk.far{background:var(--bad)}
.scrub .seg{position:absolute;top:53px;height:6px;border-radius:3px;opacity:.75;pointer-events:none}
.scrub .seg.fast{background:repeating-linear-gradient(90deg,var(--cyan) 0 3px,transparent 3px 7px)}
.scrub .seg.slow{background:repeating-linear-gradient(90deg,var(--warn) 0 6px,transparent 6px 14px)}
.scrub .ph{position:absolute;top:0;bottom:0;left:50%;width:2px;margin-left:-1px;background:#fff;pointer-events:none;z-index:3;box-shadow:0 0 6px #000}
.scrub .kd{position:absolute;top:45px;width:34px;height:34px;margin:-17px 0 0 -17px;display:grid;place-items:center;z-index:2}
.scrub .kd i{width:16px;height:16px;border-radius:50%;border:3px solid var(--key);background:var(--bg);display:block;transition:transform .12s}
.scrub .kd.bd i{width:12px;height:12px;border-width:2px}
.scrub .kd.ed i{background:var(--key)}
.scrub .kd.on i{transform:scale(1.25);box-shadow:0 0 0 3px rgba(255,209,102,.35)}
.scrub .kd.pick i{background:var(--accent);border-color:var(--accent)}
.scrub .kd.hold i{transform:scale(1.6);background:var(--accent);border-color:var(--accent)}
.scrub .none{position:absolute;left:0;right:0;top:52px;text-align:center;font-size:12px;color:var(--dim);pointer-events:none}
.tlab{display:flex;justify-content:space-between;font-size:12.5px;color:var(--dim);font-weight:700;padding:0 2px}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.btn{padding:9px 12px;border-radius:11px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:14px}
.btn.on{background:var(--panel2);box-shadow:inset 0 0 0 1px var(--accent)}
.btn.pri,.big.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.big{padding:14px 8px;border-radius:13px;background:var(--panel);border:1px solid var(--line);font-weight:800;font-size:15px;width:100%}
/* the nearest keyframe, the next one sliding in */
.strip{position:relative;height:calc(min(62vw, 330px) * 0.5625 + 8px);margin:14px -16px 0;overflow:hidden}
.kc{position:absolute;left:50%;top:4px;width:62%;max-width:330px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);will-change:transform}
.kc img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.kc .n{position:absolute;left:6px;top:5px;font-size:11.5px;font-weight:800;padding:1px 7px;border-radius:99px;background:rgba(17,18,23,.82)}
.kc.near{border-color:var(--key);box-shadow:0 0 0 1px var(--key)}
.kc .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--dim);font-size:12px}
.sec{display:flex;align-items:baseline;gap:8px;margin:16px 0 8px}
.sec h2{font:700 15px/1 var(--display);margin:0;color:var(--soft)}
.sec .note{flex:1;text-align:right}
.note{font-size:13px;color:var(--dim)}
.warn{font-size:13px;color:var(--warn);margin:6px 0 0}
.lab{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;color:var(--soft);margin:12px 0 5px}
.lab b{color:var(--text)}
/* the img2img editor */
.stage{position:relative;border-radius:12px;overflow:hidden;background:#000;border:1px solid var(--line);touch-action:none}
.stage canvas{display:block;width:100%;height:auto}
.stage canvas.mk{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
.stage .busy{position:absolute;inset:0;display:grid;place-items:center;background:rgba(0,0,0,.45);color:#fff;font-weight:800;font-size:14px;text-align:center;padding:10px}
.segb{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
.segb button{flex:1;padding:8px 6px;border-radius:9px;font-weight:800;font-size:13.5px;color:var(--soft)}
.segb button.on{background:var(--panel2);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
.tog{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel);margin-top:10px}
.tog .t{flex:1}.tog .t b{display:block;font-size:14.5px}.tog .t span{font-size:12.5px;color:var(--dim)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none}
.sw::after{content:'';position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--accent)}.sw.on::after{left:21px}
.tries{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:8px}
.try{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:var(--panel2);border:1px solid var(--line)}
.try img{width:100%;height:100%;object-fit:cover;display:block}
.try.on{border-color:var(--key);box-shadow:0 0 0 2px var(--key)}
.try .st{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;color:var(--soft);text-align:center;padding:4px}
.try .x{position:absolute;right:3px;top:3px;width:22px;height:22px;border-radius:50%;background:rgba(17,18,23,.85);font-size:11px;display:grid;place-items:center;color:var(--soft)}
.try .lb{position:absolute;left:4px;bottom:3px;font-size:10.5px;font-weight:800;padding:0 5px;border-radius:99px;background:rgba(17,18,23,.82)}
.bar3{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(17,18,23,.94);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar3 .in{max-width:560px;margin:0 auto}
.sheet{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center}
.card{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;padding:14px 16px calc(18px + env(safe-area-inset-bottom))}
.card h3{display:flex;align-items:center;gap:8px;margin:0 0 8px;font:700 18px/1.2 var(--display)}
.card h3 span{flex:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;max-width:min(92vw,520px);background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
#eng{position:absolute;width:1px;height:1px;left:-9999px;top:0;border:0;opacity:0;pointer-events:none}
</style>

<div class="wrap">

    <a class="back" id="back" href="../">← Phase 1</a>

    <div class="over" id="vover" hidden><button class="chip" id="playBtn">▶</button><span class="chip" id="tInfo"></span><span class="sp"></span><button class="chip" id="sndBtn" aria-label="Sound">🔇</button></div>
  </div>
  <div class="scrub" id="scrub"><div id="ruler"></div><div class="tr" id="trk"></div><div id="segs"></div><div class="lk" id="lnk" hidden></div><div id="kds"></div><div class="ph" id="ph"></div></div>

  <div id="ed"></div>
</div>
<div class="bar3"><div class="in"><button class="big pri" id="finBtn">🎬 Redo the in-betweens</button></div></div>
<div class="sheet" id="sheet" hidden><div class="card" id="card"></div></div>
<iframe id="eng" title="engine" aria-hidden="true" tabindex="-1"></iframe>
<script>
'use strict';
// 🔑 Reel Phase 2 (Jordan 2026-11-24): after Phase 1 (clips, carry-ons, edits) the reel is ONE video you scroll through. Dots on the
// scrubber are keyframes you set; hold a dot and drag it to retime (the in-betweens play faster or slower to match). Below, the keyframe
// you're nearest to, the next one sliding in as you get closer. Each keyframe gets an img2img redraw (Render Deck's Illustrious recipe:
// BismuthIllMix v8 + afk_style_condensed_v2 LoRA, 28 steps, CFG 5.5, euler_ancestral normal, finishing pass, fix faces) with mask painting
// and 🎯 Character focus (BiRefNet cuts the characters out, so the background stays put); the mask's box is zoomed to fill the canvas
// for the most detail. 🎬 Redo the in-betweens then makes the video again between the keyframes, ≤5 s at a time, from the reel retimed,
// with every keyframe pinned (H3 Deck's engine: H3KeyPass), and the result opens as a new reel in Phase 1.
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'}[c]));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const fmt = s => (Math.round((+s || 0) * 10) / 10).toFixed(1).replace(/\.0$/, '') + ' s';
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const FPS = 24, MINGAP = 4 / FPS, MAXSEG = 5, RATE = [0.25, 4];
const RKEY = 'h3reel', KKEY = 'h3reel_keys', ENGINE_URL = window.REEL_ENGINE || '../../h3-a875336252cb/?engine=1&t=' + Math.floor(Date.now() / 60000);
// 🎨 the keyframe recipe, from Jordan's Render Deck screenshots (2026-11-24)
const RECIPE = {ckpt:/bismuth[\s_-]*il+[\s_-]*mix.*v8/i, lora:/afk_style_condensed_v2/i, loraStr:1, steps:28, cfg:5.5, sampler:'euler_ancestral', scheduler:'normal', area:1344 * 768, faceDen:0.35, faceFeather:32, den:0.6};
const STY = {pos:'masterpiece, best quality, amazing quality, newest, absurdres, highres, general',
  neg:'worst quality, low quality, bad quality, lowres, displeasing, very displeasing, old, early, nsfw, bad anatomy, bad hands, extra digits, fewer digits, jpeg artifacts, signature, username, watermark, logo, multiple views, comic, monochrome, greyscale'};
function style(){ try{ const t = ((JSON.parse(localStorage.getItem('render-deck-v1') || '{}') || {}).styleText || {}).illustrious || {}; return {pos:t.pos!=null ? t.pos : STY.pos, neg:t.neg!=null ? t.neg : STY.neg}; }catch(e){ return STY; } } // (what she set for Illustrious in Render Deck)
function toast(t, ms){ const d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(() => d.remove(), ms || 3200); }
window.ReelToast = (t, ms) => { if(/settings are back in the form|Its settings/i.test(t)) return; toast(t, Math.min(ms || 3200, 6000)); };

// ---------- state ----------
const RID = new URLSearchParams(location.search).get('reel');
const reels = () => { try{ return JSON.parse(localStorage.getItem(RKEY) || '{}') || {}; }catch(e){ return {}; } };
const RS = reels(), REEL = (RS.reels || []).find(r => r.id===(RID || RS.open)) || null;
let ALL = {}; try{ ALL = JSON.parse(localStorage.getItem(KKEY) || '{}') || {}; }catch(e){}
const P = REEL ? (ALL[REEL.id] = ALL[REEL.id] || {v:2, src:null, keys:[], links:[], den:0.6, n:2, kd:{den:RECIPE.den, n:2, focus:true}}) : null;
let saveT = 0; const save = () => { clearTimeout(saveT); saveT = setTimeout(() => { try{ const a = JSON.parse(localStorage.getItem(KKEY) || '{}') || {}; if(REEL) a[REEL.id] = P; localStorage.setItem(KKEY, JSON.stringify(a)); }catch(e){ toast("Couldn't save the keyframes: the phone's space is full", 5000); } }, 150); };
const K = () => P.keys; // sorted by s (where it is in the reel) and t (when it shows, after retiming)
let E = null, READY = false, DUR = 0, VW = 0, VH = 0;
const eng = $('#eng');
function engOk(){ try{ const w = eng.contentWindow; if(w && w.H3Engine){ E = w.H3Engine; return true; } }catch(e){} return false; }
const info = id => (E && id ? E.info(id) : {state:'gone'});
const clips = () => (REEL && REEL.clips) || [];
const endOf = c => { const d = info(c.pick).secs || 0; return c.out != null ? Math.min(c.out, d || c.out) : d; };
const wordsOf = (c, id) => { const W = (c && c.tw) || {}; return id && W[id]!=null ? W[id] : (c && c.words) || ''; };
const sigOf = () => JSON.stringify(clips().map(c => [c.pick, c.in || 0, c.out]));

// ---------- the time map: a keyframe is shown at t (seconds of the new timing) and is the reel's frame at s ----------
// (Jordan 2026-11-25) Phase 2 starts blank: no keyframes until you add them. Hold a keyframe and drag a line to connect keyframes into a
// chunk of ≤5 s: its ends are the stretch that's made again, the keyframes in between are its breakdowns. Outside the chunks the reel plays
// at its own speed: moving a chunk's end shifts everything after it, so the stretch after keeps its pace.
const LK = () => (P.links = P.links || []);
const kIdx = id => K().findIndex(k => k.id===id);
const SEND = () => Math.max(0, (Math.round(DUR * FPS) - 1) / FPS); // the joined reel's last frame
const offEnd = () => { const k = K(); return k.length ? k[k.length - 1].t - k[k.length - 1].s : 0; };
const endT = () => SEND() + offEnd();
function srcAt(t){ const k = K(); if(!k.length) return clamp(t, 0, SEND()); if(t <= k[0].t) return Math.max(0, t - (k[0].t - k[0].s));
  for(let i = 0; i < k.length - 1; i++){ const a = k[i], b = k[i + 1]; if(t <= b.t) return a.s + (t - a.t) * (b.s - a.s) / Math.max(1e-6, b.t - a.t); }
  const z = k[k.length - 1]; return Math.min(SEND(), z.s + (t - z.t)); }
function dispAt(s){ const k = K(); if(!k.length) return s; if(s <= k[0].s) return s + (k[0].t - k[0].s);
  for(let i = 0; i < k.length - 1; i++){ const a = k[i], b = k[i + 1]; if(s <= b.s) return a.t + (s - a.s) * (b.t - a.t) / Math.max(1e-6, b.s - a.s); }
  const z = k[k.length - 1]; return z.t + (s - z.s); }
const segAt = t => { const k = K(); for(let i = 0; i < k.length - 1; i++) if(t < k[i + 1].t) return i; return Math.max(0, k.length - 2); };
const rateAt = t => { const k = K(); if(k.length < 2 || t < k[0].t || t >= k[k.length - 1].t) return 1; const i = segAt(t), a = k[i], b = k[i + 1]; return (b.s - a.s) / Math.max(1e-6, b.t - a.t); };
const rateOf = i => { const a = K()[i], b = K()[i + 1]; return a && b ? (b.s - a.s) / Math.max(1e-6, b.t - a.t) : 1; };
const snap = t => Math.round(t * FPS) / FPS;
function newKey(s, t){ return {id:uid('k'), s:snap(s), t:snap(t != null ? t : dispAt(s)), pic:'', tries:[], th:'', op:'', words:'', den:P.kd.den, n:P.kd.n, focus:P.kd.focus!==false, paint:''}; }
// the chunks as keyframe indexes [from, to], in order
const chunks = () => LK().map(l => [kIdx(l.a), kIdx(l.b), l]).filter(c => c[0] >= 0 && c[1] > c[0]).sort((x, y) => x[0] - y[0]);
// what a keyframe is: a breakdown inside a chunk, a chunk's end (also maybe the next one's start), a chunk's start, or on its own
function roleOf(i){ const C = chunks(); if(C.some(c => i > c[0] && i < c[1])) return 'mid'; if(C.some(c => c[1]===i)) return 'end'; if(C.some(c => c[0]===i)) return 'start'; return 'free'; }
// retiming keyframe i to t: a breakdown moves between its neighbours (¼–4× speed); a chunk's end takes everything after it along
function retime(i, t){ const k = K(), me = k[i], role = roleOf(i), a = k[i - 1]; if(!a || (role!=='mid' && role!=='end')) return false;
  const C = chunks().find(c => role==='mid' ? (i > c[0] && i < c[1]) : c[1]===i), A = k[C[0]];
  let lo = a.t + Math.max(MINGAP, (me.s - a.s) / RATE[1]), hi = a.t + (me.s - a.s) / RATE[0];
  if(role==='mid'){ const b = k[i + 1]; lo = Math.max(lo, b.t - (b.s - me.s) / RATE[0]); hi = Math.min(hi, b.t - Math.max(MINGAP, (b.s - me.s) / RATE[1])); }
  else hi = Math.min(hi, A.t + MAXSEG);
  lo = Math.ceil(lo * FPS - 1e-6) / FPS; hi = Math.floor(hi * FPS + 1e-6) / FPS; if(lo > hi) return false; const nt = clamp(snap(t), lo, hi), d = nt - me.t;
  if(role==='mid') me.t = nt; else for(let j = i; j < k.length; j++) k[j].t = snap(k[j].t + d);
  return true; }
// outside the chunks the reel keeps its own pace: each keyframe not joined to the one before it has the same shift as that one
function normalize(){ const k = K(), C = chunks(); if(!k.length) return; const d0 = k[0].t - k[0].s; if(Math.abs(d0) > 1e-6) k.forEach(x => x.t = snap(x.t - d0));

  for(let i = 0; i < W; i++){ for(let y = 0; y < H; y++){ let m = 0; for(let j = Math.max(0, y - r); j <= Math.min(H - 1, y + r) && m < 255; j++) m = Math.max(m, h[j * W + i]); o[y * W + i] = m; } }
  for(let p = 0; p < W * H; p++){ s[p * 4] = s[p * 4 + 1] = s[p * 4 + 2] = o[p]; s[p * 4 + 3] = 255; } x.putImageData(d, 0, 0); }
// a finished redraw goes back where it came from: scaled into its box over the keyframe it started from, through the mask with a soft edge
async function stitch(k, y, url){ const base = y.base ? await picCanvas(y.base) : await grab(k.s), out = document.createElement('canvas'); out.width = y.fw; out.height = y.fh; const o = out.getContext('2d');
  o.drawImage(base, 0, 0, y.fw, y.fh); const im = await loadImg(url), [bx, by, bw, bh] = y.box;
  if(!y.mask){ o.drawImage(im, bx, by, bw, bh); return out; }
  const piece = document.createElement('canvas'); piece.width = bw; piece.height = bh; const p = piece.getContext('2d'); p.drawImage(im, 0, 0, bw, bh);
  const mi = await loadImg(y.mask), soft = document.createElement('canvas'), f = 24; soft.width = Math.max(2, Math.round(y.fw / f)); soft.height = Math.max(2, Math.round(y.fh / f)); // (drawn small and scaled up = a feathered edge)
  const sx = soft.getContext('2d'); sx.imageSmoothingQuality = 'high'; sx.drawImage(mi, 0, 0, soft.width, soft.height);
  const al = document.createElement('canvas'); al.width = bw; al.height = bh; const a = al.getContext('2d'); a.imageSmoothingQuality = 'high'; a.drawImage(soft, bx / f, by / f, bw / f, bh / f, 0, 0, bw, bh);
  const d = a.getImageData(0, 0, bw, bh), pd = p.getImageData(0, 0, bw, bh); for(let j = 0; j < d.data.length; j += 4) pd.data[j + 3] = Math.min(255, d.data[j] * 1.6); p.putImageData(pd, 0, 0);
  o.drawImage(piece, bx, by); return out; }
let FOLLOW = 0;
async function follow(){ clearTimeout(FOLLOW); let left = 0;
  for(const k of K()) for(const y of k.tries){ if(y.state!=='working') continue; left++;
    try{ const r = await result(y.pc, y.pid, String(y.node)); if(!r) continue;
      if(r.err){ y.state = 'failed'; y.err = r.err; save(); drawTries(); continue; }
      const c = await stitch(k, y, r.img), b = await toBlob(c, 'image/png'), a = await E.addPic(new File([b], 'key_' + k.id + '.png', {type:'image/png'}));
      if(!a || a.err) throw new Error((a && a.err) || "couldn't keep the picture"); y.pic = a.id; y.th = thumbOf(c); y.state = 'done'; delete y.mask; PICS[a.id] = Promise.resolve(c);
      if(!k.tries.some(x => x!==y && x.state==='done' && x.picked)){ k.pic = y.pic; y.picked = true; k.th = y.th; } save(); drawStrip(true); drawScrub(); drawTries(); if(EDK===k.id) drawStage(); }
    catch(e){ y.state = 'failed'; y.err = e.message; save(); drawTries(); } }
  if(left) FOLLOW = setTimeout(follow, 2000); }
function drawTries(){ const box = $('#tries'), k = keyOf(EDK); if(!box || !k) return;
  box.innerHTML = `<div class="try${!k.pic ? ' on' : ''}" data-y=""><img src="${k.op || ''}" alt="" ${k.op ? '' : 'hidden'}><span class="lb">reel's frame</span></div>` + k.tries.map(y => `<div class="try${y.pic && y.pic===k.pic ? ' on' : ''}" data-y="${y.id}">${y.th ? `<img src="${y.th}" alt="">` : ''}${y.state==='working' ? `<div class="st">Drawing…<br>${Math.round((Date.now() - y.t0) / 1000)} s</div>` : y.state==='failed' ? `<div class="st" style="color:var(--bad)">⚠ ${esc(y.err || 'failed')}</div>` : ''}<span class="lb">${(+y.den).toFixed(2)}</span><button class="x" data-yx="${y.id}">✕</button></div>`).join('');
  if(!k.op) grab(k.s).then(c => { k.op = thumbOf(c); save(); drawTries(); }).catch(() => {}); }
$('#ed').addEventListener('click', e => { const k = keyOf(EDK); if(!k) return; const x = e.target.closest('[data-yx]');
  if(x){ e.stopPropagation(); const y = k.tries.find(z => z.id===x.dataset.yx); if(!y) return; k.tries = k.tries.filter(z => z!==y); if(k.pic && k.pic===y.pic){ k.pic = ''; k.th = ''; } save(); drawAll(); return; }
  const t = e.target.closest('.try'); if(!t) return; const y = k.tries.find(z => z.id===t.dataset.y);
  if(!t.dataset.y){ k.pic = ''; k.th = ''; } else if(y && y.state==='done'){ k.pic = y.pic; k.th = y.th; k.tries.forEach(z => z.picked = z===y); } else return;
  save(); drawStrip(true); drawScrub(); drawTries(); drawStage(); });

// ---------- 🎬 Redo the in-betweens ----------
// (Jordan 2026-11-25) only the chunks she connected are made again (each ≤5 s, its breakdowns pinned); the reel between and around
// them stays as Phase 1 made it (its clips, trimmed)
function stretches(){ return chunks().map(c => [c[0], c[1]]); }
function drawFin(){ const b = $('#finBtn'); if(!READY){ b.disabled = true; return; } const n = stretches().length; b.disabled = !n;
  b.textContent = n ? '🎬 Redo the in-betweens (' + n + (n===1 ? ' chunk)' : ' chunks)') : '🎬 Connect keyframes to redo the in-betweens'; }
function finSheet(){ const st = stretches(), ed = K().filter(k => k.pic).length; if(!st.length) return;
  $('#card').innerHTML = `<h3><span>🎬 Redo the in-betweens</span><button class="btn" data-close>✕</button></h3>
    <div class="note">Each chunk you connected (${st.length}) is made again: it starts from the reel itself, played at your new timing, and every keyframe in it is pinned at its moment (${ed} of ${K().length} keyframes redrawn), its ends first and last, the breakdowns in between. The words, characters and settings are the clip's it's mostly in. The rest of the reel stays as it is. It opens as a new reel in Phase 1, so you can pick options, blend the seams and export.</div>
    <div class="lab" style="margin-top:12px"><span>How much it changes</span><b id="fdV"></b></div><input type="range" id="fd" min="0.3" max="1" step="0.05" value="${P.den}">
    <div class="note">Low keeps the reel's motion and just follows the keyframes, high lets MiniMax redraw the in-betweens more freely.</div>
    <div class="lab"><span>Options per chunk</span></div><div class="segb" id="fn">${[1, 2, 3].map(v => `<button data-v="${v}" class="${v===P.n ? 'on' : ''}">${v}</button>`).join('')}</div>
    <button class="big pri" id="fGo" style="margin-top:14px">🎬 Make ${st.length} chunk${st.length===1 ? '' : 's'}</button><div class="note" id="fSt" style="margin-top:6px"></div>`;
  $('#sheet').hidden = false;
  const dv = () => { $('#fdV').textContent = (+P.den).toFixed(2); }; dv(); $('#fd').oninput = e => { P.den = +e.target.value; dv(); save(); };
  $$('#fn button').forEach(b => b.onclick = () => { P.n = +b.dataset.v; $$('#fn button').forEach(x => x.classList.toggle('on', x===b)); save(); });
  $('#fGo').onclick = () => finGo(); }
$('#finBtn').onclick = () => { if(READY) finSheet(); };
$('#sheet').addEventListener('click', e => { if(e.target===$('#sheet') || e.target.closest('[data-close]')) $('#sheet').hidden = true; });
// a keyframe's picture as one of the engine's pictures (sent with the take): its redraw, or the reel's own frame kept once
async function keyMedia(k){ if(k.pic) return k.pic; if(k.opId && k.opS===k.s) return k.opId; const c = await grab(k.s), b = await toBlob(c, 'image/png'), a = await E.addPic(new File([b], 'frame_' + k.id + '.png', {type:'image/png'}));
  if(!a || a.err) throw new Error((a && a.err) || "couldn't keep a keyframe's frame"); k.opId = a.id; k.opS = k.s; save(); return a.id; }
// the clip a moment of the joined reel belongs to
const spanAt = s => { const sp = clipSpans(); return sp.find(x => s >= x.a && s < x.b) || sp[sp.length - 1]; };
function stretchPlan(i, j){ const k = K(), A = k[i], B = k[j], n = Math.round((B.t - A.t) * FPS) + 1, L = gridUp(n), last = Math.round(DUR * FPS) - 1, map = [];
  for(let f = 0; f < L; f++){ const t = A.t + f / FPS; map.push(clamp(Math.round((t <= B.t ? srcAt(t) : B.s + (t - B.t)) * FPS), 0, last)); }
  return {A, B, n, L, map, pins:k.slice(i, j + 1).map(x => [Math.round((x.t - A.t) * FPS), x])}; }
const gridUp = n => { n = Math.max(5, Math.round(n)); while(n % 17 !== 5) n++; return n; }; // (MiniMax H3's blocks: 5, 22, 39 … frames)
// the reel between chunks: its own clips, trimmed to [s0, s1) of the joined video
function gapClips(s0, s1){ const out = []; for(const x of clipSpans()){ const a = Math.max(s0, x.a), b = Math.min(s1, x.b); if(b - a < 0.5 / FPS) continue;
    const c = clips().find(y => y.id===x.id) || {}; out.push({id:uid('c'), takes:[x.take], pick:x.take, in:x.cin + (a - x.a), out:x.cin + (b - x.a), words:x.words, who:x.who, meta:{[x.take]:Object.assign({}, (c.meta || {})[x.take] || {})}, tw:{[x.take]:x.words}, kind:Math.abs(a - x.a) < 0.5 / FPS ? c.kind || '' : ''}); }
  return out; }
async function finGo(){ const btn = $('#fGo'), st = stretches(), note = t => { if($('#fSt')) $('#fSt').textContent = t; }; btn.disabled = true;
  const nr = {id:uid('r'), name:(REEL.name || 'Reel') + ' · keyframed', clips:[], cur:0, t:Date.now(), mt:Date.now(), keysOf:REEL.id}, cast = (REEL.cast || []).slice(); if(cast.length) nr.cast = cast;
  let sent = 0, at = 0, chunkBefore = false; const k = K();
  try{ for(let q = 0; q < st.length; q++){ const [i, j] = st[q], pl = stretchPlan(i, j);
      if(k[i].s - at > 0.5 / FPS){ nr.clips.push(...gapClips(at, k[i].s)); chunkBefore = false; }
      note('Chunk ' + (q + 1) + ' of ' + st.length + ': getting its keyframes ready…');
      const pins = []; for(const [f, x] of pl.pins) pins.push([f, await keyMedia(x)]);
      const sp = spanAt((pl.A.s + pl.B.s) / 2) || {}, take = sp.take;
      note('Chunk ' + (q + 1) + ' of ' + st.length + ': sending…');

      const ids = (r && r.ids) || []; if(!ids.length) toast('Chunk ' + (q + 1) + ': ' + ((r && r.err) || 'not sent'), 6000); else sent++;

      nr.clips.push({id:uid('c'), takes:ids, pick:ids[0] || null, in:chunkBefore ? 1 / FPS : 0, out:null, words:sp.words || '', who:sp.who || [], meta:Object.fromEntries(ids.map(id => [id, {keys:true}])), tw:Object.fromEntries(ids.map(id => [id, sp.words || ''])), kind:''});

  catch(e){ note('⚠ ' + e.message); btn.disabled = false; } }

// ---------- start ----------
function dots(){ pcList().then(ps => { $('#dots').innerHTML = ps.map(p => `<span class="dot${p.online ? (p.busy ? ' busy' : ' on') : ''}" title="${esc(p.name)}"></span>`).join(''); }); }
window.addEventListener('resize', () => { if(READY) drawScrub(); drawStrip(); });
async function boot(){ if(!REEL){ msg("<b>No reel</b>Open Phase 2 from a reel in Phase 1."); $('#finBtn').disabled = true; return; }
  $('#rname').textContent = REEL.name || 'Reel'; eng.src = ENGINE_URL;
  for(let i = 0; i < 600 && !engOk(); i++) await new Promise(r => setTimeout(r, 100)); if(!E){ msg("<b>Couldn't start</b>H3 Deck's engine didn't load."); return; }
  for(let i = 0; i < 100 && !(E.ready && E.ready()); i++) await new Promise(r => setTimeout(r, 150)); dots(); setInterval(dots, 15000);
  try{ if(!P.src || P.src.sig!==sigOf()){ if(P.src && P.keys.length){ msg('<b>The reel changed</b>Joining it again; your keyframes stay where they are.'); } await joinReel(); }
    await openSrc(); }
  catch(e){ msg('<b>Phase 2</b>' + esc(e.message) + '<br><br><button class="chip" id="retry">↻ Try again</button>'); $('#retry') && ($('#retry').onclick = () => { msg('<b>Phase 2</b>Trying again…'); boot(); }); drawFin(); return; }
  READY = true; NEAR = -1; setNow(0, true); drawAll(); loop(); follow(); }
window.KEYS = {P:() => P, K, chars, srcAt, dispAt, stretches, stretchPlan, setNow, retime, link, chunks, roleOf, xOf, endT, normalize, E:() => E, ready:() => READY, near:() => NEAR, stripPos, cropBox, canvasWH, follow};
drawFin(); boot();
</script>
