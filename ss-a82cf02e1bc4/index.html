<style>
/* Shape Studio: build 3D pixel-art pieces from snapping shapes and swiped paths. Plain maths (signed distance fields), no AI. */
:root{
  --ink:#0d0b24; --panel:#18143d; --panel2:#231d58; --line:#3b3488; --fg:#f1ecff; --dim:#aaa2dc;
  --hot:#ffd23f; --sel:#4ff3ff; --acc:#b08bff;
  --f-body:'Figtree',system-ui,-apple-system,sans-serif; --f-pix:'Silkscreen',ui-monospace,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0}
[hidden]{display:none!important}
/* iOS Safari can refuse typing in a field when its page turns off text selection */
input,textarea{-webkit-user-select:text;user-select:text}
body{background:var(--ink);color:var(--fg);font-family:var(--f-body);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#view{position:fixed;inset:0;overflow:hidden;background:#241a62;touch-action:none}
#gl{position:absolute;left:0;top:0;image-rendering:pixelated;display:block;touch-action:none}
#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
button{font:600 14px/1 var(--f-body);color:var(--fg);background:var(--panel2);border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button.on{background:var(--acc);color:#150f38;border-color:transparent}
button:disabled{opacity:.35}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2.5px solid var(--sel);outline-offset:2px;box-shadow:0 0 0 5px #0d0b24}
#gl:focus-visible{outline-offset:-5px;box-shadow:none}
.top{position:fixed;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) 8px calc(12px + env(safe-area-inset-left,0px));display:flex;gap:6px;align-items:center;pointer-events:none;z-index:5}
.top>*{pointer-events:auto}
.logo{font-family:var(--f-pix);font-size:15px;color:var(--hot);margin-right:auto;text-shadow:2px 2px 0 #3d1a7a;pointer-events:none}
.top button{min-width:42px;height:40px;font-size:18px;padding:0 10px}
.top #bMir{font-size:13px}
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;flex-direction:column;pointer-events:none}
#bottom>*{pointer-events:auto}
#hint{pointer-events:none!important;align-self:center;margin:0 12px 8px;font-size:14px;font-weight:600;color:#e9e4ff;background:#120c33cc;padding:7px 12px;border-radius:999px;text-align:center;max-width:calc(100% - 24px)}
#hint:empty{display:none}
#panel{background:var(--panel);border-top:2px solid var(--line);border-radius:16px 16px 0 0;padding:10px 14px 4px;max-height:44vh;overflow:auto;touch-action:pan-y}
#tray{background:var(--panel);display:flex;gap:8px;overflow-x:auto;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));touch-action:pan-x;scrollbar-width:none;border-top:2px solid var(--line)}
#panel:not([hidden])+#tray{border-top:1px solid var(--line)}
#tray::-webkit-scrollbar{display:none}
.tb{flex:none;width:62px;height:70px;padding:4px 0 0;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:14px;background:var(--panel2);touch-action:pan-x;position:relative}
.tb img{width:44px;height:44px;image-rendering:pixelated;pointer-events:none}
.tb span{font-size:12px;font-weight:700;color:var(--dim);pointer-events:none}
.tb.on{background:#3a2f8c;border-color:var(--hot);box-shadow:0 0 0 2px var(--hot)}
.tb.on span{color:var(--hot)}
.tb.mode{background:#2c2470;border-color:var(--hot)}
.tb.mode svg{width:30px;height:30px;margin:7px 0 4px;color:var(--hot)}
.tb.mode span{color:var(--hot)}
.tb.tt{border-color:var(--tc)}
.tb.tt span{color:var(--fg)}
.tb.tt.has{background:#3a2f8c;box-shadow:inset 0 -4px 0 var(--tc)}
.tb.tt.no{opacity:.38}
.tb.tt .glyph{width:34px;height:34px;border-radius:50%;margin:5px 0 5px;background:var(--tc);display:flex;align-items:center;justify-content:center;color:#150f38;font-weight:800;font-size:15px}
.tb img.bob{animation:tbob 1.1s ease-in-out infinite}
.tb img.ghost{opacity:.4;filter:drop-shadow(0 0 0 #fff)}
@keyframes tbob{0%,100%{transform:translateY(2px)}50%{transform:translateY(-4px)}}
.tagdrag{position:fixed;left:0;top:0;z-index:40;pointer-events:none;padding:9px 14px;border-radius:999px;background:var(--tc);color:#150f38;font:700 15px var(--f-body);box-shadow:0 6px 0 #0008,0 0 0 3px #fff;transform:translate(-50%,-50%) scale(1.12);transition:opacity .2s,transform .2s}
.tagdrag.hit{transform:translate(-50%,-50%) scale(.2);opacity:0}
.tagdrag.miss{opacity:0}
.tb .dot{width:30px;height:30px;border-radius:50%;margin:7px 0 4px;border:3px solid #0006}
.sep{flex:none;width:2px;background:var(--line);margin:8px 2px;border-radius:2px}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}
.row .lab{font-size:13px;font-weight:700;color:var(--dim);width:52px}
.sws{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.sws button{width:30px;height:30px;padding:0;border-radius:50%;border:2px solid #0007}
.sws button.on{outline:3px solid var(--sel);outline-offset:1px}
.sl{display:grid;grid-template-columns:1fr 1fr;gap:2px 14px}
.sl label{display:flex;flex-direction:column;font-size:13px;font-weight:700;color:var(--dim)}
.sl .lt{display:flex;justify-content:space-between;gap:6px}
.sl .v{font-weight:600;color:var(--fg);font-variant-numeric:tabular-nums}
.sl input{width:100%;accent-color:var(--acc);height:32px;margin:0}
.chip{padding:8px 10px;font-size:14px;min-height:38px}
.chip.warn{color:#ff9ea2}
#side{position:fixed;right:calc(10px + env(safe-area-inset-right,0px));top:calc(58px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:8px;z-index:4}

#side button.on{background:var(--acc)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tag{--tc:var(--acc);padding:8px 12px;font-size:14px;min-height:38px;border-radius:999px;border:1.5px dashed #6a62b8;background:transparent;color:var(--dim)}
.tag.on{background:var(--tc);color:#150f38;border:1.5px solid transparent;box-shadow:0 3px 0 #0007}
.tag.open{outline:2.5px solid #fff;outline-offset:2px}
.tag.pop{animation:tpop .38s cubic-bezier(.3,1.8,.5,1)}
@keyframes tpop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.tset{background:var(--panel2);border-radius:12px;border-left:5px solid var(--tc);padding:9px 11px 4px;margin-bottom:10px}
.tset p{margin:0 0 8px;font-size:13px;color:var(--dim)}
#panel .tags .tag{touch-action:none}
.tag.add{border-style:solid;border-color:var(--hot);color:var(--hot)}
.rules{display:flex;flex-direction:column;gap:4px;margin:-2px 0 10px}
.rules .rl{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--fg);background:var(--panel2);border-radius:10px;padding:4px 4px 4px 10px}
.rules .rl span{flex:1}.rules .rl b{color:#2ee6c9}
.rules .rl button{min-width:40px;min-height:40px;border-radius:8px;border:0;background:transparent;color:var(--dim);font-size:16px}
.sent{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0 4px}
.sent .slot{padding:9px 12px;border-radius:12px;border:1.5px dashed #6a62b8;background:transparent;color:var(--dim);font-size:14px}
.sent .slot.full{border:1.5px solid transparent;background:var(--tc,#2ee6c9);color:#150f38;font-weight:700}
.sent .slot.cur{outline:2.5px solid #fff;outline-offset:2px}
.blk small{opacity:.7;font-weight:400;margin-right:4px}
.tlib{display:flex;align-items:center;gap:4px}
.tlib .ed{min-width:40px;min-height:38px;padding:6px 8px;font-size:15px;border-radius:999px}
.card h4{margin:12px 0 6px;font-size:13px;color:var(--dim);text-transform:uppercase;letter-spacing:.06em}
.card input[type=text],.card input[type=search]{font:16px var(--f-body);color:var(--fg);background:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:9px 10px;width:100%;box-sizing:border-box}
.tgrp{background:var(--panel2);border-radius:12px;padding:8px 10px;margin-bottom:8px}
.tgrp>b{display:block;font-size:13px;margin-bottom:4px;color:var(--fg)}
.arow{display:flex;align-items:center;gap:8px;min-height:34px;flex-wrap:wrap}
.arow>label{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;min-width:96px;min-height:40px;cursor:pointer}
.arow input[type=checkbox]{width:24px;height:24px;accent-color:var(--acc);margin:0}
.arow input[type=range]{flex:1;min-width:120px;accent-color:var(--acc)}
.arow .val{font-size:12px;color:var(--dim);width:34px;text-align:right}
.mini{display:flex;gap:6px;flex-wrap:wrap}.mini button{width:32px;height:32px;padding:0;border-radius:50%;border:2px solid #0007}.mini button.on{outline:3px solid var(--sel);outline-offset:1px}
.lrow{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 3px;border-radius:12px;background:var(--panel2);margin-bottom:5px}
.lrow .lpick{flex:1;min-width:0;display:flex;align-items:center;gap:9px;min-height:40px;padding:4px 7px;background:none;border:0;border-radius:9px;color:inherit;text-align:left;font:inherit}
.lrow.ind{margin-left:20px}.lrow.grp{background:#2c2470}
.lrow.sel{outline:2px solid var(--sel)}
.lrow.hid .nm,.lrow.hid .dot,.lrow.hid .tg{opacity:.4}
.lrow .dot{flex:none;width:16px;height:16px;border-radius:50%;border:2px solid #0007}
.lrow .nm{font-weight:700;font-size:14px}
.lrow .tg{flex:1;font-size:12px;color:var(--dim);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.lrow .eye{flex:none;width:40px;height:34px;padding:0;display:flex;align-items:center;justify-content:center}
.lrow .eye svg{width:20px;height:20px}
#lyr{max-height:52vh;overflow:auto}
#toast{position:fixed;left:50%;top:calc(58px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--hot);color:#150f38;font-weight:700;font-size:14px;padding:9px 14px;border-radius:10px;z-index:20;pointer-events:none;transition:opacity .25s;opacity:0;max-width:calc(100% - 32px);text-align:center}
.modal{position:fixed;inset:0;background:#07061acc;z-index:30;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));box-sizing:border-box}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:16px;max-width:520px;width:100%;max-height:100%;overflow:auto;box-sizing:border-box}
.card:focus,.card:focus-visible{outline:none;box-shadow:none}
.card h3{font-family:var(--f-pix);font-weight:400;color:var(--hot);margin:0 0 10px;font-size:16px}
.card p,.card li{font-size:14px;line-height:1.5}
.card ul{padding-left:18px;margin:6px 0}
.card b{color:#2ee6c9}
.card .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.card img{width:100%;image-rendering:pixelated;border-radius:8px;background:#241a62}
.card .set{display:flex;flex-direction:column;gap:4px;margin:10px 0;font-size:13px;font-weight:700;color:var(--dim)}
.card .set input{accent-color:var(--acc)}
.card .set input[type=range],.arow input[type=range]{height:32px;margin:0}
.card .set small,.card h4 small{font-weight:400;color:var(--dim);font-size:13px;text-transform:none;letter-spacing:0}
.card .set .lt{display:flex;justify-content:space-between}.card .set .v{color:var(--fg)}
/* on/off switches show a tick when on, so the state never rests on colour alone */
.tgl[aria-pressed=true]::before{content:'✓ '}
@media (min-width:760px){#panel,#tray{margin:0 auto;width:min(720px,100%);box-sizing:border-box}#panel{border-left:2px solid var(--line);border-right:2px solid var(--line)}}
#toast.big{font:15px/1.35 var(--f-pix);padding:12px 18px;background:linear-gradient(#ffe36e,#ffb43d);box-shadow:0 4px 0 #a2560f;animation:tbig .45s cubic-bezier(.3,1.8,.5,1)}
@keyframes tbig{0%{transform:translateX(-50%) scale(.5)}100%{transform:translateX(-50%) scale(1)}}
.combo{font:12px var(--f-pix);color:var(--hot);margin:-2px 0 8px;letter-spacing:.03em}
.tag.cmb{--tc:#ffd23f}
@media (prefers-reduced-motion:reduce){.tb img.bob,.tag.pop,#toast.big{animation:none}#toast,.tagdrag{transition:none}}
/* a phone on its side: the panel and tray become a column on the right and the side buttons move to the left,
   so the piece keeps the middle of the screen and nothing covers anything */
@media (max-height:520px) and (min-width:560px){
  #bottom{left:auto;top:calc(56px + env(safe-area-inset-top,0px));width:min(400px,46vw);justify-content:flex-end}
  #panel,#tray{width:auto;margin:0;border-right:0}
  #panel{max-height:none;flex:0 1 auto;min-height:0;border-radius:16px 0 0 0;border-left:2px solid var(--line)}
  #tray{border-left:2px solid var(--line);padding-right:calc(12px + env(safe-area-inset-right,0px))}
  #panel:not([hidden])+#tray{border-left:2px solid var(--line)}
  #side{right:auto;left:calc(10px + env(safe-area-inset-left,0px))}
}
</style>

<script>
'use strict';
const $=s=>document.querySelector(s);
// the fonts load in the background, so a slow or blocked network never holds the app up (system fonts stand in until they arrive)
{const l=document.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Silkscreen&family=Figtree:wght@400;600;700&display=swap';document.head.appendChild(l)}
const PI=Math.PI,clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),lerp=(a,b,t)=>a+(b-a)*t;
const MAXS=64,MAXPT=64,PROW=512;

/* ---------- shapes ---------- */
// half-extents at Size 1. Every shape is built in a -1..1 box and stretched.
const TYPES=[
  {name:'Ball',s:[7,7,7]},{name:'Box',s:[6,6,6]},{name:'Pill',s:[6,9,6]},{name:'Cone',s:[6,8,6]},
  {name:'Donut',s:[8,8,8]},{name:'Drop',s:[6,8,6]},{name:'Gem',s:[6,8,6]},{name:'Star',s:[8,8,8]},
  {name:'Heart',s:[8,8,8]},{name:'Moon',s:[8,8,8]},{name:'Blob',s:[8,8,8]},{name:'Twist',s:[6,9,6]},{name:'Bowl',s:[8,8,8]},
];
const PATH=20;
const PAL=['#ff5a5f','#ff9a3d','#ffd23f','#7ee35a','#2ee6c9','#3d8bff','#9b6bff','#ff6fae','#f6efe4','#3b2a4a'];
const PALN=['Red','Orange','Yellow','Green','Teal','Blue','Purple','Pink','Cream','Plum'];
const TAPERS=['Even','Taper','Bulge','Flare'],STYLES=['Round','Flat','Beads','Ridges'];

/* ---------- quaternions ---------- */
const qmul=(a,b)=>[a[3]*b[0]+a[0]*b[3]+a[1]*b[2]-a[2]*b[1],a[3]*b[1]-a[0]*b[2]+a[1]*b[3]+a[2]*b[0],a[3]*b[2]+a[0]*b[1]-a[1]*b[0]+a[2]*b[3],a[3]*b[3]-a[0]*b[0]-a[1]*b[1]-a[2]*b[2]];
const qax=(v,a)=>{const s=Math.sin(a/2),l=Math.hypot(...v)||1;return [v[0]/l*s,v[1]/l*s,v[2]/l*s,Math.cos(a/2)]};
const qnorm=q=>{const l=Math.hypot(...q)||1;return q.map(x=>x/l)};
function qmat(q){const [x,y,z,w]=q;return [[1-2*(y*y+z*z),2*(x*y+z*w),2*(x*z-y*w)],[2*(x*y-z*w),1-2*(x*x+z*z),2*(y*z+x*w)],[2*(x*z+y*w),2*(y*z-x*w),1-2*(x*x+y*y)]]} // columns: rotated x,y,z axes
function qfromTo(u,v){const d=u[0]*v[0]+u[1]*v[1]+u[2]*v[2];if(d<-.9999){const a=Math.abs(u[0])<.9?[1,0,0]:[0,1,0];const c=cross(u,a);return qax(c,PI)}
  const c=cross(u,v);return qnorm([c[0],c[1],c[2],1+d])}
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const add=(a,b)=>[a[0]+b[0],a[1]+b[1],a[2]+b[2]],sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],mul=(a,s)=>[a[0]*s,a[1]*s,a[2]*s];
const nrmz=a=>{const l=Math.hypot(...a)||1;return mul(a,1/l)};

/* ---------- state ---------- */
const defMir=()=>({n:[1,0,0],d:0});
let S={shapes:[],nid:1,mir:defMir()};
const MIR=()=>S.mir||(S.mir=defMir());
const DEFM={n:[1,0,0],d:0},mpOf=g=>g.mp||DEFM;
const refl=(p,m=MIR())=>{const k=2*(dot(m.n,p)-m.d);return [p[0]-m.n[0]*k,p[1]-m.n[1]*k,p[2]-m.n[2]*k]};
const mirDist=p=>dot(MIR().n,p)-MIR().d;
let sel=null;         // selected shape object
let hov=null;         // shape a dragged tag is hovering over
let arm=null;         // armed tray tool: type index, or PATH
let curC=4;           // current colour
let mirrorOn=true;
const PD={taper:1,style:0,thick:5};  // next path settings
const OPT={res:150,outline:1,clines:1,snd:0,hideCut:0,fps:12,hap:1};
const byId=id=>S.shapes.find(g=>g.id===id);
// if anything ever goes wrong, say so once (gently) and carry on instead of freezing
let errAt=-1e9;
let booted=false; // true once the piece is open: nothing is saved before that, so an error screen can never overwrite a save
function reportErr(err){console.error(err);const t=performance.now();if(t-errAt>6000){errAt=t;toast('Something went wrong there. Undo should put it right.')}}
addEventListener('error',e=>{if(e.error)reportErr(e.error)});addEventListener('unhandledrejection',e=>reportErr(e.reason));

function newShape(t,o={}){
  const g={id:S.nid++,t,p:[0,10,0],q:[0,0,0,1],spin:0,sz:1,sw:1,st:1,sd:1,c:curC,cut:0,k:2,m:mirrorOn?1:0,n:[0,1,0],mp:JSON.parse(JSON.stringify(MIR()))};
  if(t===PATH)Object.assign(g,{curve:[],r0:3,th:1,taper:PD.taper,style:PD.style,fn:[0,0,1],k:1.5});
  return Object.assign(g,o);
