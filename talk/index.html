<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-512.png">
<meta name="apple-mobile-web-app-title" content="Talk">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#962B42"><meta name="color-scheme" content="light only">
<title>Talking Points</title>
<style>
/* Layout: fixed timer bar on top, full-height swipe cards below, dots at the bottom */
:root{
  --bg:#FFFFFF; --card:#FBF4F5; --ink:#2B1A1F; --soft:#6B5960; --line:#EADDE0;
  --maroon:#962B42; --orange:#C05133; --warn-bg:#FCE9E2; --over:#B3261E;
  --sans:"Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);margin:0;overflow:hidden;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column}
.bar{flex:none;padding:12px 16px 10px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--line);background:var(--bg)}
.clock{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;color:var(--maroon);min-width:4.2ch}
.clock.warn{color:var(--orange)} .clock.over{color:var(--over)}
.bar{flex-wrap:wrap;row-gap:8px}
.sub{font-size:15px;color:var(--soft);line-height:1.25;order:5;flex-basis:100%;min-width:0}
#go{margin-left:auto}
.sub b{color:var(--ink)}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:999px;padding:10px 16px;cursor:pointer}
.go{background:var(--maroon);color:#fff} .go.pause{background:var(--orange)}
.reset{background:var(--card);color:var(--maroon);border:1px solid var(--line)}
.btn:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.track{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.track::-webkit-scrollbar{display:none}
.card{flex:none;width:100%;scroll-snap-align:start;padding:20px 16px 12px;overflow-y:auto;box-sizing:border-box}
.inner{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange)}
.meta span:last-child{color:var(--soft);letter-spacing:0;text-transform:none;font-weight:600;font-variant-numeric:tabular-nums}
h2{margin:0;font-size:30px;line-height:1.1;color:var(--maroon);text-wrap:balance}
ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
li{background:var(--card);border-radius:14px;padding:12px 16px;font-size:24px;line-height:1.3;font-weight:600}
li b{color:var(--maroon)}
.close{font-size:22px;font-weight:700;color:var(--orange);padding:4px 2px}
body.editing h2,body.editing .close{outline:2px dashed var(--orange);outline-offset:2px;background:#fff}
.del,.add{display:none;font:inherit;cursor:pointer}
body.editing .del{display:inline-flex;align-items:center;justify-content:center;flex:none;width:36px;height:36px;border-radius:50%;border:0;background:var(--warn-bg);color:var(--over);font-size:18px;font-weight:700}
body.editing li{display:flex;align-items:center;gap:10px;outline:none}
body.editing li .txt{flex:1;min-width:1ch;outline:2px dashed var(--orange);outline-offset:4px;border-radius:4px}
body.editing .add{display:block;align-self:flex-start;border:2px dashed var(--maroon);background:#fff;color:var(--maroon);font-weight:700;font-size:18px;border-radius:14px;padding:10px 16px}
.edithint{display:none;font-size:14px;color:var(--soft)}
body.editing .edithint{display:block}
.edithint button{font:inherit;color:var(--maroon);background:none;border:0;text-decoration:underline;padding:0;cursor:pointer}
.dots{flex:none;display:flex;justify-content:center;gap:8px;padding:10px 16px 14px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line);border:0;padding:0}
.dot.on{background:var(--maroon);width:22px;border-radius:5px}
@media (prefers-reduced-motion:reduce){.track{scroll-behavior:auto}}
</style>

<div class="app">
  <div class="bar">
    <div class="clock" id="clock">5:00</div>
    <div class="sub" id="sub">Tap <b>Start</b> when you begin. About 33 seconds per slide.</div>
    <button class="btn go" id="go">Start</button>
    <button class="btn reset" id="reset" aria-label="Reset timer">↺</button>
    <button class="btn reset" id="edit" aria-pressed="false">Edit</button>
  </div>
  <div class="track" id="track"></div>
  <div class="dots" id="dots"></div>
</div>

<script>
const S=[
[
"Title",
"Power Automate Workflow",
[
"Building on what we already have."
]
],
[
"The problem",
"Current System",
[
"Form is filled out",
"Scheduler:",
"Checks for updates",
"Hand copies and pastes into the calendar",
"Cross references drivers and vehicles",
"Texts or emails drivers",
"Updates the calendar and excel spreadsheet with updates"
]
],
[
"The cost",
"Time per request",
[
"About 15-30 minutes per request"
]
],
[
"What we built",
"Power Automate Filter",
[
"A script without AI that filters drivers and vehicles automatically"
]
],
[
"Rule 1",
"Vehicles",
[
"Smallest free vehicle that fits"
]
],
[
"Rule 2",
"Drivers",
[
"Asks in list order of priority",
"CDL drivers are last for smaller trips but first for CDL trips",
"Skips drivers who already said no",
"Skips drivers who are already assigned a trip for that block"
]
],
[
"The result",
"Trip Posting",
[
"I get an email with info and driver suggestions",
"Auto posts to the calendar",
"Writes a pre-made email or text with the trip information"
]
],
[
"Also built in",
"Extras",
[
"Remembers declines",
"Runs by itself"
]
],
[
"Wrap up",
"Built on tools we already pay for",
[
"Microsoft tools",
"No AI so we save on token costs"
]
]
];
try{const saved=JSON.parse(localStorage.getItem('talk-points-v1')||'null');if(Array.isArray(saved)&&saved.length===S.length)saved.forEach((v,i)=>S[i]=v)}catch(e){}
const TOTAL=300, PER=TOTAL/S.length;
const fmt=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
const track=document.getElementById("track"),dots=document.getElementById("dots");
S.forEach((s,i)=>{
  const c=document.createElement("section");c.className="card";c.setAttribute("aria-label",`Slide ${i+1}`);
  c.innerHTML=`<div class="inner"><div class="meta"><span>Slide ${i+1} of ${S.length} · ${s[0]}</span><span>Done by ${fmt((i+1)*PER)}</span></div>
  <h2>${s[1]}</h2><ul>${s[2].map(p=>`<li><span class="txt">${p}</span><button class="del" aria-label="Remove this point">✕</button></li>`).join("")}</ul><button class="add">+ Add a point</button>${s[3]?`<div class="close">${s[3]}</div>`:""}<div class="edithint">Tap a line to change it, ✕ to remove it, or + to add one. Changes save on this phone.<br><button class="copy">Copy all my notes</button></div></div>`;
  track.appendChild(c);
  const d=document.createElement("button");d.className="dot";d.setAttribute("aria-label",`Go to slide ${i+1}`);
  d.onclick=()=>go(i);dots.appendChild(d);
});
let cur=0;
const go=i=>{i=Math.max(0,Math.min(S.length-1,i));track.scrollTo({left:i*track.clientWidth,behavior:"smooth"})};
const mark=()=>{cur=Math.round(track.scrollLeft/track.clientWidth);[...dots.children].forEach((d,i)=>d.classList.toggle("on",i===cur));tick()};
track.addEventListener("scroll",()=>requestAnimationFrame(mark),{passive:true});
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1)});

// Timer: counts down from 5:00, keeps counting past zero as overtime
const clock=document.getElementById("clock"),sub=document.getElementById("sub"),btn=document.getElementById("go");
let startAt=null,used=0,lock=null;
const elapsed=()=>used+(startAt?(Date.now()-startAt)/1000:0);
function tick(){
  const e=elapsed(),left=TOTAL-e;
  clock.textContent=(left<0?"+":"")+fmt(Math.abs(left));
  clock.classList.toggle("warn",left<=60&&left>=0);clock.classList.toggle("over",left<0);
  if(!startAt&&used===0){sub.innerHTML="Tap <b>Start</b> when you begin. About 33 seconds per slide.";return}
  if(left<0){sub.innerHTML="<b>Over time.</b> Wrap it up.";return}
  const target=(cur+1)*PER, diff=Math.round(target-e);
  sub.innerHTML=diff>=0?`On pace. <b>${fmt(diff)}</b> left for this slide.`:`<b>${fmt(-diff)} behind.</b> Move to the next slide.`;
}
async function wake(on){try{if(on&&"wakeLock"in navigator){lock=await navigator.wakeLock.request("screen")}else if(lock){await lock.release();lock=null}}catch(e){}}
btn.onclick=()=>{
  if(startAt){used=elapsed();startAt=null;btn.textContent="Resume";btn.classList.remove("pause");wake(false)}
  else{startAt=Date.now();btn.textContent="Pause";btn.classList.add("pause");wake(true)}
  tick();
};
document.getElementById("reset").onclick=()=>{startAt=null;used=0;btn.textContent="Start";btn.classList.remove("pause");wake(false);go(0);tick()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&startAt)wake(true)});
setInterval(()=>{if(startAt)tick()},250);
// Edit mode: change points right on the phone, saved in this browser
const eb=document.getElementById('edit');
const editable=()=>document.querySelectorAll('.card h2,.card li .txt,.card .close');
function save(){const cards=[...document.querySelectorAll('.card')];cards.forEach((c,i)=>{S[i][1]=c.querySelector('h2').innerHTML;S[i][2]=[...c.querySelectorAll('li .txt')].map(l=>l.innerHTML);const cl=c.querySelector('.close');if(cl)S[i][3]=cl.innerHTML});try{localStorage.setItem('talk-points-v1',JSON.stringify(S))}catch(e){}}
eb.onclick=()=>{const on=!document.body.classList.contains('editing');document.body.classList.toggle('editing',on);eb.textContent=on?'Done':'Edit';eb.setAttribute('aria-pressed',on);editable().forEach(el=>el.contentEditable=on?'true':'false');if(!on)save()};
document.addEventListener('input',e=>{if(e.target.isContentEditable)save()});
document.addEventListener('click',e=>{
  if(e.target.classList.contains('del')){e.target.closest('li').remove();save()}
  if(e.target.classList.contains('add')){const ul=e.target.previousElementSibling;const li=document.createElement('li');li.innerHTML='<span class="txt" contenteditable="true"></span><button class="del" aria-label="Remove this point">✕</button>';ul.appendChild(li);li.querySelector('.txt').focus();save()}
});
const notesText=()=>S.map((s,i)=>`Slide ${i+1}: ${strip(s[1])}\n`+s[2].map(p=>`- ${strip(p)}`).join("\n")+(s[3]?`\n> ${strip(s[3])}`:"")).join("\n\n");
function strip(h){const d=document.createElement('div');d.innerHTML=h;return d.textContent.trim()}
document.addEventListener('click',e=>{if(!e.target.classList.contains('copy'))return;save();const txt=notesText();const b=e.target;
 const done=()=>{b.textContent='Copied. Paste it to Claude to keep it.';setTimeout(()=>b.textContent='Copy all my notes',3000)};
 const fallback=()=>{let ta=document.getElementById('notes-out');if(!ta){ta=document.createElement('textarea');ta.id='notes-out';ta.style.cssText='width:100%;height:220px;font:inherit;font-size:14px;margin-top:8px';b.after(ta)}ta.value=txt;ta.focus();ta.select();b.textContent='Select all, then copy'};
 try{navigator.clipboard.writeText(txt).then(done,fallback)}catch(err){fallback()}});
mark();
</script>
